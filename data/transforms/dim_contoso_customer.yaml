      change: >
        AGE. Registered the stale derived attribute as DQ-CUSTOMER-01 and cross-linked it, so
        `exclude-stale-derived-age` stops being one of the gate's `impurity-unregistered` warnings.
        Added the rule `derive-age-band-as-of`: a 5-year age band derived from `Birthday` as of
