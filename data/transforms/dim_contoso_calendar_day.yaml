# data/transforms/dim_contoso_calendar_day.yaml — the calendar's transform descriptor.
#
# A DECLARED PASSTHROUGH WITH NO RULE, and it is declared anyway. A 1:1 passthrough that is not
# described is the seam at which the next upstream schema change becomes fatal instead of visible:
# nothing would say which 17 columns the ontology expects, or that not one of them is cleansed.
#
# Every number was measured read-only over contoso.duckdb by scratchpad/ingest/p4_transforms.py and is
# written out with its query and answer in queries/p4_transformation_authoring.sql.

metadata:
  pipeline: dim_contoso_calendar_day
  source: contoso
  layer: data-transformation
  schema_version: '0.1.14'
  status: draft
  confidence: I
  observed: '2026-09-18'
  generated_by: scratchpad/ingest/p4_transforms.py wrote the .sql; this descriptor is hand-authored
  notes: >
    AUTHORED, NOT DEPLOYED (connection.yaml declares read_only: true): the SELECT body was executed
    read-only — 17 columns in the order and types the dataset descriptor declares (T1e), 4 018 rows /
    4 018 distinct Date / 0 duplicates (T2e). NO RULE IS APPLIED: `transforms` is empty, and the three
    things measurably odd about this relation are carried as open items below.
    ONE CAST SINCE 2026-09-19 and `transforms` is still empty because a type cast repairs no defect
    in the data: Date is served as DATE, cast from the landing's TIMESTAMP on the operator's ruling.
    Every Date was a timestamp at midnight (P1 V10), re-measured as 0 non-midnight over 4 018 of
    4 018 rows immediately before the cast, so the cast is lossless. That midnight is what made the
    fact's OrderDate/DeliveryDate join to this column exactly (0 dates off the calendar, P3 S15), so
    BOTH SIDES were cast in the same change rather than this one alone — re-measured after: 3 450 of
    4 018 ordered days, 3 498 of 4 018 delivered days, inclusion 1.0 over 223 974 rows, 0 orphans.

produces:
  relation: contoso_served.dim_contoso_calendar_day
  sql_file: data/transforms/dim_contoso_calendar_day.sql
  grain: "one row per Date — one calendar day"

inputs:
  - relation: main.date
    kind: raw_source
    role: calendar
    descriptor: data/sources/date.yaml
    note: >
      All 17 columns are carried unchanged and none is consumed by a rule, so the projector reads all
      17 as passthrough edges from the descriptor. ONE conformed calendar, joined by the fact in two
      roles (OrderDate, DeliveryDate) rather than served twice — the framework's role_playing_dimension
      pattern; the two foreign keys are declared on the dataset descriptor, not here.

transforms: []   # no rule: nothing in this relation is repaired, renamed, cast or filtered.

open_transforms:
  - id: varchar-datekey
    impurity_class: type_mismatch
    raw_defect: >
      DateKey is a varchar holding YYYYMMDD ('20160101' … '20261231') on all 4 018 rows (T11f; P1 #12),
      bijective with Date (P2 G8). A varchar key cannot be ordered or ranged as a date, and the census
      gives it no min/max for the same reason.
    proposed_rule: >
      Cast it to integer or drop it in favour of Date — NEITHER applied here. The dataset descriptor
      declares this column varchar, so retyping it in the transform would make the served relation
      contradict the seam the ontology binds to; changing a served type is a promotion decision. And
      WHICH column the calendar keys on is itself open.
    needs_ruling: "Does the calendar key on Date (DATE since 2026-09-19) or DateKey (varchar YYYYMMDD)? (RUN.md Q11)"
    status: PROPOSED

  - id: boolean-as-integer
    impurity_class: type_mismatch
    raw_defect: >
      WorkingDay is declared integer and used as a boolean: exactly 2 distinct values, min 0 and max 1,
      over 4 018 rows (T11f; P1 #12).
    proposed_rule: >
      `d."WorkingDay" <> 0 AS WorkingDay` would serve it as a boolean — NOT applied, for the same reason
      as varchar-datekey: the dataset descriptor declares it integer, and a served type change belongs
      to the promotion step, not to this transform.
    needs_ruling: "Should a served column's type be corrected when the landing's type is wrong? (kit/framework gap, RUN.md Q19-adjacent) — ANSWERED 2026-09-19 FOR THE TEMPORAL CASE ONLY (timestamp -> date, the 8 served date columns). This flag is NOT covered by that ruling and stays integer."
    status: PROPOSED

  - id: calendar-covers-more-than-the-facts
    impurity_class: over_coverage
    raw_defect: >
      The calendar runs 2016-01-01 to 2026-12-31: 359 of its 4 018 days fall after the last fact date,
      and 568 days carry no order at all (T11f; P1 O10, P3 S14). 'The latest day in the calendar' is
      not 'the latest day of data', and this estate has been bitten by exactly that confusion.
    proposed_rule: >
      NONE — DO NOT TRIM. A calendar exists to carry days on which nothing happened; trimming it to the
      fact's span would make every 'no sales that day' question unanswerable and would silently change
      the served row count on every reload. This is a DISCLOSURE carried where the transform is read,
      not an impurity: what must be decided is what 'latest month' means, and that is a concept-level
      rule (P7/P9), not a line of SQL.
    needs_ruling: "Does a period question mean the calendar's latest month or the fact's? (RUN.md Q20)"
    status: PROPOSED

governance:
  owner: >
    UNNAMED — no owner is declared for any relation of this source (RUN.md Q5). Machine-authored and
    unratified.
  last_reviewed: 2026-09-18
  change_log:
    - date: 2026-09-18
      change: >
        Created the calendar transform as a declared 0-rule passthrough, with the two type mismatches
        and the calendar's over-coverage carried as open items.
      change_type: CREATION
      by: P4 transformation-authoring (machine-authored, unratified)
    - date: 2026-09-19
      change: >
        Date is served as DATE, cast in the .sql from the landing's TIMESTAMP. OPERATOR RULING
        2026-09-19: "change the dates from sources to datasets ... all time fields are anyway
        00000". LOSSLESS, MEASURED NOT ASSUMED: 0 non-midnight values over 4 018 of 4 018 rows on
        this column, and 0 over all 19 date/timestamp columns of the warehouse (1 816 902 non-null
        values). main.date is UNTOUCHED and keeps TIMESTAMP. Both sides of the fact-to-calendar
        equality were cast together; re-measured identical after: 3 450 of 4 018 ordered days,
        3 498 of 4 018 delivered days, inclusion 1.0 over 223 974 rows, 0 orphans. The two
        NON-temporal type mismatches (varchar DateKey, integer WorkingDay) are NOT swept in.
      change_type: CORRECTION
      by: operator ruling 2026-09-19, applied by the transform (unratified)
