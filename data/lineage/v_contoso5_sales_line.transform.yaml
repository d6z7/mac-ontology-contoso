# Inputs of transform v_contoso5_sales_line, carried from its 0.4.0 `inputs` by mac_migrate_v3 (data/lineage is tools only; v3 derives inputs from the .sql through the source map).
transform: v_contoso5_sales_line
inputs:
  - relation: main.customer
    kind: raw_source
    descriptor: data/sources/customer.yaml
  - relation: main.sales
    kind: raw_source
    descriptor: data/sources/sales.yaml
  - relation: main.store
    kind: raw_source
    descriptor: data/sources/store.yaml
