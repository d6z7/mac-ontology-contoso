- id: DQ-DUP-ORDERROWS-SALES
  about:
    - source:orderrows
  says: '`sales` re-delivers every line of `orderrows` — one fact, twice'
  evidence:
    - '223,974 rows each. `sales` carries all but 1 column of `orderrows` (RowNumber is spelled differently there), plus
      7: CurrencyCode, CustomerKey, DeliveryDate, ExchangeRate, LineNumber, OrderDate, StoreKey. So `sales` answers at this
      grain with NO join, and `orderrows` cannot answer at all without a header relation. Only one is served, so the ambiguity
      is latent rather than live.'
  disposition: open
  needs: 'Which is the FACT OF RECORD?  ANSWER ONE OF: orderrows | sales | both_are_distinct_facts | neither_serve_a_transform.  RECOMMENDED:
    serve exactly ONE — see the ruling.'
  severity: medium
  remedies:
    - 'orderrows: the normalised detail is the record, and every question at this grain must JOIN a header relation to reach
      the attributes `sales` already carries. `sales` must STOP being served, or the ambiguity remains whatever is declared.'
    - 'sales: the pre-joined relation is the record and answers with no join, including the 7 attributes the normalised
      route reaches only through a header. `orderrows` must stop being served.'
    - 'both_are_distinct_facts: each is declared a fact in its own right, which requires a reason the measurement contradicts
      — they agree row for row — and every total over them becomes a sum a reader must know not to take twice.'
    - 'neither_serve_a_transform: a curated relation is authored over one of them and BOTH landings stop being served —
      the route a curated bundle took, which is available here and is what the passthrough cannot do for you.'
  recommended: serve exactly ONE of them
  said:
    - by: mac_dq_findings.py/1
