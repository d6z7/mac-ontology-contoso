- id: DQ-UNCLAIMED-CONTOSO5_COUNTRY_CODE
  about:
    - dataset:contoso5_country_code
  says: served relation `contoso5_country_code` is claimed by no concept
  evidence:
    - 22 relation(s) are served and 8 are claimed by at least one of 11 concept(s); `contoso5_country_code` is claimed by
      none. A served relation is one a question can read, so an unclaimed one is either a notion nobody modelled or a relation
      that should not be served — and the delivered artifacts do not say which.
  disposition: accepted
  needs: 'Which is it?  ANSWER ONE OF: model_a_concept | stop_serving_it | backs_no_notion.  A decline is a legitimate answer
    and the reason is the deliverable — `backs_no_notion` with no reason leaves the next reader exactly where this finding
    found them.'
  severity: medium
  remedies:
    - 'model_a_concept: a concept grounds on it and the relation becomes answerable'
    - 'stop_serving_it: it leaves the served plane — which on a 1:1 passthrough means authoring a transform, because a passthrough
      serves everything by construction'
    - 'backs_no_notion: it stays served and is recorded as deliberately unmodelled, so the next reader finds the decision
      instead of the gap'
  said:
    - by: mac_dq_findings.py/1
    - by: ontology-developer
      words: 'RULED BY ROLE ontology-developer UNDER EXPLICIT TASK DIRECTION (2026-10-16 register->relation fold completion),
        NOT A STANDING OPERATOR SIGN-OFF ON THIS BUNDLE''S MODEL — flagged here for operator review/override. MEASURED,
        not the three stock answers: `Country` already serves this exact value (`dim_country.country_code`, in `Country`''s
        own grounding), so this is neither an unmodelled notion (`model_a_concept`) nor a notion with none (`backs_no_notion`)
        — it is ALREADY modelled, one relation over. The register is the FK domain `dim_country.country_code` draws from
        (and, where shared, what other relations'' own `country_code`-shaped columns draw from too), not a second ground
        for `Country`. Declining to bind it as a second `grounding.bindings[]` entry: `check_delivery_consistency._effective_source`
        reads only a concept''s FIRST binding, so a second entry would not even register as ''claimed'' by this gate, and
        restructuring `Country`''s primary binding onto this narrower, differently-named register would drop columns and
        rules bound to the richer relation''s own column names for no gain. Referenced by FOUR relations (`dim_country`,
        `dim_store`, `dim_customer`, `dim_location`) — genuinely the shared domain `Country` is the concept FOR, not a column-local
        artefact of one dimension.'
