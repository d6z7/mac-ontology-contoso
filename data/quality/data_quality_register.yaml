- id: DQ-AMBIGREF-CURRENCYCODE
  title: '`CurrencyCode` includes perfectly into 2 different keys — which is THE reference?'
  severity: high
  status: open
  ruled_by: null
  reason: null
  finding: 'measured on 4 reference(s) across 2 relation(s) (orders, sales): inclusion is 1.0 into every
    one of currencyexchange.FromCurrency, currencyexchange.ToCurrency, at the same key role and over the
    same rows. Value inclusion CANNOT separate them, so neither was drawn as the sole reference.'
  needs: 'Which of currencyexchange.FromCurrency, currencyexchange.ToCurrency is THE reference for CurrencyCode?  ANSWER
    ONE OF: currencyexchange.FromCurrency | currencyexchange.ToCurrency | both_are_real | neither.  No
    recommendation is offered from the data because the data cannot carry one.'
  ruling:
    question: CurrencyCode includes perfectly into all of currencyexchange.FromCurrency, currencyexchange.ToCurrency.
      Which is THE reference?
    answers:
    - currencyexchange.FromCurrency
    - currencyexchange.ToCurrency
    - both_are_real
    - neither
    established: inclusion 1.0 into each candidate, same key role, 4 instance(s) over 2 relation(s). The
      candidates are equally supported by every measurement this platform can make.
    for_the_human: 'Nothing in the values distinguishes these. A pair of endpoints that both hold the
      same domain — the two sides of a conversion, a ship-to and a bill-to, a parent and a predecessor
      — are identical to a measurement and opposite in meaning. Only the business''s intent separates
      them.


      AND THE SYMMETRY IS WHY THIS IS DANGEROUS RATHER THAN MERELY UNDECIDED. Measured on a currency pair
      of this shape: every identity row carries rate 1.0, and rate(A->B) x rate(B->A) = 1 for all 80,360
      reciprocal rows to within 1.2e-5. The table therefore serves BOTH directions equally correctly —
      so the wrong choice raises no error, produces no orphan, and fails no referential case. It returns
      the RECIPROCAL: a EUR amount multiplied by ~1.1 where ~0.9 was meant, a ~20 % error that still looks
      like money.'
    consequences:
      one of the named targets: that reference is drawn, the others are recorded as rejected-by-ruling,
        and questions traverse the chosen direction. IF THE CHOICE IS WRONG THE NUMBERS DO NOT ERROR —
        they come back transformed the wrong way and still look plausible, which is the hardest defect
        to find later.
      both_are_real: two references are drawn and every traversal must say which it used; a question that
        does not name a direction becomes ambiguous rather than wrong.
      neither: CurrencyCode stays an attribute, no line is drawn, and no question can traverse from it
        — the join must be written by hand each time, where it is visible.
    recommendation: the endpoint the child is DENOMINATED IN — for an amount and an FX rate table, the
      child column is the `from` side
    because: 'NOT FROM THE VALUES, WHICH DO NOT LEAN — this is domain convention, and it is labelled as
      such so it costs one word to overrule. An amount is denominated in a currency and a conversion runs
      FROM that currency to a reporting one, so the column carrying an order''s currency is the `from`
      endpoint. Where the pair is not a currency conversion, read the same shape: the child names what
      the row IS, and the reference points at the side that describes it.'
  raised_by: mac_dq_findings.py/1
