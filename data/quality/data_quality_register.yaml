- id: DQ-DANGLINGKEY-CATEGORYKEY
  title: '`CategoryKey` is key-shaped and no relation in scope carries it as a key'
  severity: medium
  status: open
  ruled_by: null
  reason: null
  finding: reported on 1 plane-relation(s) (product 8 distinct); 8 distinct value(s) on product. It follows
    this bundle's own key-naming convention and points at nothing.
  needs: 'Is the parent MISSING from the extract, already INLINE on the row, or is CategoryKey just an
    attribute?  ANSWER ONE OF: inline_dimension | attribute_only | missing_extract.  RECOMMENDED: inline_dimension
    — product.CategoryName carries the SAME 8 distinct value(s) as CategoryKey, dense over 1..8 — the
    label already travels with the key, so a concept grounds on product and no parent relation is needed
    at all'
  ruling:
    question: CategoryKey is key-shaped with no parent in scope. Which absence is it?
    answers:
    - inline_dimension
    - attribute_only
    - missing_extract
    established: '8 distinct value(s) on product; no relation in scope declares CategoryKey as a key;
      sibling column(s) at the same cardinality: CategoryName.'
    for_the_human: A measurement sees an absence; it cannot see whether the absence is a gap in the extract
      or a modelling choice already made. Only someone who knows what was meant to be delivered can say.
    consequences:
      inline_dimension: a concept is grounded on the carrying relation, using the key for identity and
        its twin for the label; no parent relation is ever needed and no line is drawn
      attribute_only: CategoryKey is an opaque identifier and nothing groups by it — questions use the
        denormalised attributes beside it instead
      missing_extract: the extract is incomplete and it is recorded as such; until the dimension arrives,
