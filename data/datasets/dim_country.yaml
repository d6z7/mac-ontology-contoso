dataset: dim_country
key:
  - country_code
members: {}
columns:
  country_code:
    is: dimension
    means: 'the country''s code. The value `--` is a placeholder and not a country: it is where the source put the online
      store''s country, and counting it would add a country Contoso does not sell in (rule Country.rows).'
  country_name:
    is: name
    means: the country's name as a reader would see it. 'Online' is the name the sentinel carries and is not a place.
    names: country_code
    as: long
  is_placeholder:
    is: identifier
    means: 'true on the placeholder row whose code is `--` (no real country, such as the online store''s), false on every
      real country, never empty. Made by the transform so that rule Country.rows reads its `real` and `sentinel` rows from
      a true/false column instead of a stored value; it selects exactly the rows the code test selected. Offered to no question
      on its own: a question reaches it through the rule.'
