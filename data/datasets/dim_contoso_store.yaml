table:
  name: dim_contoso_store
  schema: contoso_served
  type: view
  description: 'One row per store version (StoreKey; 74 rows / 74 distinct / 0 duplicates, P2). This is
    an SCD-2 delivery: 67 store codes over 74 rows, 6 codes carrying more than one version and one carrying
    three, with non-overlapping OpenDate/CloseDate windows (P2 G6/G6b). The fact carries StoreKey, so
    a line joins the version it was placed against. WHAT ''A STORE'' IS — 74 versions or 67 codes — is
    an open ruling (RUN.md Q9); this descriptor serves the finer grain and leaves the collapse to the
    ontology. Geography stops at country here: the relation has no continent column (S10), so a store
    -> continent roll-up is NOT servable from this relation.'
  confidence: I
