# CONTOSO (demo) — physical: the `product` dimension. Grounding target for Product + Brand.

metadata:
  table: product
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: verified
  owner: demo-team
  confidence: C

table:
  name: product
  schema: main
  type: table
  description: "One row per product. Carries the Brand column and the Category -> SubCategory hierarchy."

columns:
  - { name: ProductKey,      type: integer, role: primary_key }
  - { name: ProductCode,     type: string,  role: value }
  - { name: ProductName,     type: string,  role: value }
  - { name: Manufacturer,    type: string,  role: value }
  - { name: Brand,           type: string,  role: discriminator }
  - { name: Color,           type: string,  role: value }
  - { name: Weight,          type: decimal, role: value }
  - { name: Cost,            type: decimal, role: value }
  - { name: Price,           type: decimal, role: value }
  - { name: CategoryKey,     type: integer, role: value }
  - { name: CategoryName,    type: string,  role: discriminator }
  - { name: SubCategoryKey,  type: integer, role: value }
  - { name: SubCategoryName, type: string,  role: discriminator }

grounded_by_concepts:
  - { concept: Product, role: primary_table }
  - { concept: Brand,   role: discriminator_column }

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
