dataset: dim_location
key:
  - location_code
columns:
  location_code:
    is: identifier
    means: 'THE SITE ITSELF — one row per site, which is what makes this relation the place a question about sites should
      be answered from. The value -1 is the online placeholder and not a place (rule Location.channel). SURFACES WIDENED
      2026-10-24 BY THE OPERATOR, verbatim: "dont call it site code ... just site, location, city" (rule Location.site).
      `city` WAS ASKED FOR AND WITHDRAWN THE SAME DAY: this bundle has NO STORE CITY — the source store table carries a
      state or region and no city or town, and `GeoAreaKey` is another site identifier rather than a link to a geography.
      City exists only on the CUSTOMER (`dim_customer.city`), where it is declared personally identifying (`offers.suppressed:
      DQ-IDENTIFYING-DIM_CUSTOMER-CITY`) and says where a customer lives, not where a shop stands. Surfacing `city` here
      would bind "which cities" to an INTEGER site code and present codes as city names; unbound, the question fails to
      bind and the walk says so, which is the correct outcome for a fact this bundle does not hold.'
  country_code:
    is: dimension
    means: the country the site sits in.
  country_name:
    is: name
    means: the name of the country the site sits in, carried here as well as on dim_country.
    names: country_code
    as: long
  state:
    is: dimension
    means: the state, province or region the site sits in.
    parent: country_code
  units_ever_here:
    is: measure
    means: how many store rows have ever stood at this site. A site re-tenanted has several store rows over time; each is
      one premises (rule Store.premises_not_place).
    quantity: precomputed
    unit: units
  is_online:
    is: identifier
    means: 'true on the online placeholder (site code -1, which is not a place), false on every physical site, never empty.
      Made by the transform so that rule Location.channel reads `physical` as false and `online` as true instead of a stored
      value; it selects exactly the rows the code test selected. Offered to no question on its own: a question reaches it
      through the rule.'
