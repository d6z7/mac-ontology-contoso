dataset: dim_product
key:
  - product_key
columns:
  product_key:
    is: identifier
    means: 'the row key: one row per product.'
  product_code:
    is: name
    means: the product's code in the source system, unique across all rows.
    match: pattern
    names: product_key
    as: code
  product_name:
    is: name
    means: the product's name as a reader would see it.
    match: pattern
    names: product_key
    as: common
  manufacturer:
    is: name
    means: who made the product.
    names: brand
    as: legal
  brand:
    is: dimension
    means: the brand the product is sold under. Far fewer brands than products, so a question about brands wants the brands
      and not the products.
  color:
    is: dimension
    means: the product's colour.
  category_name:
    is: dimension
    means: the product's top-level category.
  sub_category_name:
    is: dimension
    means: the product's sub-category, one level below `category_name`. Which of the two a question means is a declared
      ambiguity (product_category.ambiguity.which_level).
    parent: category_name
  weight:
    is: hidden
    means: 'the product''s weight as the source gives it, in the unit named by `weight_unit` on the same row. NOT OFFERED
      TO A QUESTION: the column holds weights in several units and is empty for some products, so a sum, an average or a
      comparison across products would add one unit to another. Bringing every weight to one unit is a transform''s job
      that has not been done (ontology/MODELLING-LOG.md), so no concept serves it.'
  weight_unit:
    is: hidden
    means: 'the unit the same row''s `weight` is in, as the source spells it, blank where the source gives none. NOT OFFERED
      TO A QUESTION: it exists only to read `weight`, which is not offered until a transform brings every weight to one
      unit.'
