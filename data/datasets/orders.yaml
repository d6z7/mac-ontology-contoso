# CONTOSO (demo) — physical: the `orders` header table. Grounding target for Order.

metadata:
  table: orders
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: verified
  owner: demo-team
  confidence: C

table:
  name: orders
  schema: main
  type: table
  description: "One row per order header. With `orderrows` it is the normalized form of `sales`."

columns:
  - { name: OrderKey,     type: bigint,    role: primary_key }
  - { name: CustomerKey,  type: integer,   role: foreign_key }
  - { name: StoreKey,     type: integer,   role: foreign_key }
  - { name: DT,           type: timestamp, role: value, x-subrole: temporal }
  - { name: DeliveryDate, type: timestamp, role: value, x-subrole: temporal }
  - { name: CurrencyCode, type: string,    role: discriminator }

foreign_keys:
  - { name: fk_customer, from_column: CustomerKey, to_table: customer, to_column: CustomerKey }
  - { name: fk_store,    from_column: StoreKey,    to_table: store,    to_column: StoreKey }

grounded_by_concepts:
  - { concept: Order, role: primary_table }

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
