dataset: contoso5_country_code
key:
  - code
stored_as: file
columns:
  code:
    is: identifier
    means: 'THE MEMBER: a country code, ''--'' included, which is the online sentinel and not a country. This relation IS
      the declared value set for that column, so a value absent here is a value the warehouse does not hold.'
  label:
    is: name
    means: the reader-facing name of the country code beside it. Its word ('country name') lives on the owning column, dim_country.country_name,
      which this column copies.
    names: code
    as: long
