# CONTOSO (demo) — physical: the `store` dimension. Grounding target for Store.
# NOTE: CountryName includes 'Online' (a channel, not a country) — see concepts/geography/store.yaml.

metadata:
  table: store
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: verified
  owner: demo-team
  confidence: C

table:
  name: store
  schema: main
  type: table
  description: "One row per store (point of sale), located in a CountryName."

columns:
  - { name: StoreKey,     type: integer,   role: primary_key }
  - { name: StoreCode,    type: integer,   role: value }
  - { name: GeoAreaKey,   type: integer,   role: value }
  - { name: CountryCode,  type: string,    role: discriminator }
  - { name: CountryName,  type: string,    role: discriminator }
  - { name: State,        type: string,    role: value }
  - { name: OpenDate,     type: timestamp, role: value }
  - { name: CloseDate,    type: timestamp, role: value }
  - { name: SquareMeters, type: integer,   role: value }
  - { name: Status,       type: string,    role: discriminator }

grounded_by_concepts:
  - { concept: Store, role: primary_table }

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
