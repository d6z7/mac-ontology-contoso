table:
  name: dim_contoso_customer
  schema: contoso_served
  type: view
  description: 'One row per customer (CustomerKey; 104 990 rows / 104 990 distinct / 0 duplicates, P2).
    Served for the geography the question scope groups by: this is the ONLY relation in the delivery that
    carries a continent (3 values), and its country -> continent map is a function over 8 countries (0
    countries with two continents, S11). 52 189 of the 104 990 customers appear on an order (S13) — the
    dimension over-covers the fact by half, which is normal for a dimension and is disclosed rather than
    filtered. A COLUMN PROJECTION PLUS ONE DERIVATION: 12 of the landing''s 24 columns are served
    (register NS-CUSTOMER-01) and `age_band_5y` is derived from the unserved `Birthday` as of
    2025-12-31 (DQ-CUSTOMER-01), which is why an age is groupable here while neither a date of birth
    nor the delivery''s five-years-stale `Age` reaches the served row.'
  confidence: I
