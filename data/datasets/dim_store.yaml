dataset: dim_store
key:
  - store_key
columns:
  store_key:
    is: dimension
    means: |-
      THE PREMISES — one row per shop per trading period, and the grain every sale is recorded against: `v_contoso5_sales_line.store_key` points here, never at the site. A shop has its own name, floor area, opening date and closing date, because those are properties of premises and not of a place. `999999` is the online outlet.
      A PLACE MAY HOLD A SUCCESSION OF PREMISES, which is why this is finer than `location_code` and why the two must never be used interchangeably: summing floor area over premises counts a re-let site once per tenancy, and counting premises answers a different question from counting sites. The `finer_than` ruling below is what says so to a reader.
    parent: store_code
  store_code:
    is: identifier
    means: 'THE SITE code: several store rows can share it over time. The value -1 is the ONLINE PLACEHOLDER and not a place.
      The transform turns it into `is_online`, which is what rule Store.channel reads (`physical` is false, `online` is
      true).'
  store_name:
    is: name
    means: the store's name as a reader would see it. 'Online store' is the single non-physical outlet. A reading that finds
      the online channel by MATCHING THIS NAME is right by luck; the channel is `is_online` (rule Store.channel).
    names: store_code
    as: common
  country_code:
    is: dimension
    means: the country the store trades in. The online store carries '--', the sentinel dim_country names 'Online' and Country.rows
      excludes — so this column cannot attribute an internet sale to a real country.
  state:
    is: dimension
    means: the state, province or region the store sits in, within its country.
  open_date:
    is: date
    means: the day the store opened for trade.
  close_date:
    is: date
    means: 'the day the store closed, or null if it is still trading. THE TRADING-STATE COLUMN: `active` is this being null
      (Store.trading).'
  status_annotation:
    is: dimension
    means: 'why a store stopped trading, where the source said: blank for a trading store, ''Closed'' or ''Restructured''
      for an ended one, null on the online placeholder. Prose from the source, not a closed vocabulary of this bundle''s
      own (rule Store.trading).'
  square_metres:
    is: measure
    means: the store's floor area in square metres.
    quantity: stock
    unit: m2
  is_online:
    is: identifier
    means: true on the online outlet (its site code is -1), false on every physical shop, never empty. Rule Store.channel
      reads `physical` as false and `online` as true.
  is_shut:
    is: identifier
    means: true where the store closed for good (`status_annotation` is Closed), false otherwise, never empty. Rule Store.trading
      reads its `shut` option from it.
  is_restructured:
    is: identifier
    means: true where the store closed and was replaced (`status_annotation` is Restructured), false otherwise, never empty.
      Rule Store.trading reads its `restructured` option from it.
