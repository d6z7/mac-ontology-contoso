dataset: dim_customer
key:
  - customer_key
valid:
  start: valid_from
  end: valid_end
columns:
  customer_key:
    is: identifier
    means: 'the row key: one row per customer. The register is not the buyer list — many customers have never ordered (rule
      Customer.register_not_buyers).'
  customer_name:
    is: name
    means: the customer's name as registered.
    match: pattern
    names: customer_key
    as: common
  continent:
    is: dimension
    means: the continent the customer lives on.
  country_code:
    is: dimension
    means: the country the CUSTOMER lives in. No customer carries the `--` online placeholder. This is the only column that
      can place an internet sale in a real country.
    parent: continent
  state:
    is: dimension
    means: the state, province or region the customer lives in.
    within: country_code
  city:
    is: dimension
    means: the city the customer lives in.
    match: pattern
  gender:
    is: dimension
    means: the customer's recorded gender.
  birth_date:
    is: date
    means: the customer's date of birth.
  valid_from:
    is: identifier
    means: the day this customer record became valid — the start of the validity window that says whether a customer is
      active on a reference date. The register is kept as a history, so a sale could in principle be attributed to where
      the customer lived ON THE ORDER DATE — nothing in this bundle declares that it should be.
  valid_to:
    is: identifier
    means: the day this customer record stopped being valid — the last day of the validity window, as the source states
      it. Paired with `valid_from`.
  valid_end:
    is: identifier
    means: 'the day after `valid_to`: the half-open end of the validity window, made by the transform. A record is valid
      on a day when `valid_from` is on or before it and `valid_end` is after it, which selects exactly the records `valid_to`
      on or after that day selects. It is what rule Customer.active_on_the_reference_date reads; offered to no question
      on its own.'
