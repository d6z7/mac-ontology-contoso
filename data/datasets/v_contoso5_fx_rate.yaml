dataset: v_contoso5_fx_rate
key:
  - date_day
  - from_currency
  - to_currency
columns:
  date_day:
    is: date
    means: the day the rate held.
  from_currency:
    is: dimension
    means: the currency being converted FROM. Every currency appears as a source, so the view is a full matrix of currency
      pairs and not a USD-only lookup.
  to_currency:
    is: dimension
    means: the currency being converted TO.
    within: from_currency
  rate:
    is: measure
    means: what one unit of `from_currency` was worth in `to_currency` on `date_day`. Same-currency pairs are present and
      are exactly 1. THE AMOUNTS ON A SALES LINE ARE ALREADY USD, so converting them with this is how a figure silently
      becomes the wrong currency.
    quantity: rate
    unit: to-currency per from-currency
    over_time: average
