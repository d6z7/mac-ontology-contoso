dataset: v_contoso5_fx_rate
key:
  - date_day
  - from_currency
  - to_currency
columns:
  date_day:
    is: date
    means: the day the rate held.
  from_currency:
    is: dimension
    means: the currency being converted FROM. Every currency appears as a source, so the view is a full matrix of currency
      pairs and not a USD-only lookup.
  to_currency:
    is: dimension
    means: the currency being converted TO.
    within: from_currency
  rate:
    is: measure
    means: what one unit of `from_currency` was worth in `to_currency` on `date_day`. Same-currency pairs are present and
      are exactly 1. THE AMOUNTS ON A SALES LINE ARE ALREADY USD, so converting them with this is how a figure silently
      becomes the wrong currency. ITS AVERAGE IS THE PLAIN MEAN OF THE DAILY RATES, disclosed — one rate per day and ordered
      pair, the European Central Bank euro reference rate crossed through EUR, a day without a quote carrying the last quoted
      day's rate, and no traded volume behind any rate to weight it by (evidence in ontology/concepts/ExchangeRate.md, "How
      the rate averages"). An amount is still converted at its own day's rate, never at an averaged one (rule ExchangeRate.convert_per_day).
    quantity: rate
    unit: to-currency per from-currency
    over_time: average
    plain_mean: true
