table:
  name: dim_contoso_calendar_day
  schema: contoso_served
  type: view
  description: 'One row per calendar day (Date; 4 018 rows / 4 018 distinct / 0 duplicates, P2). ONE conformed
    calendar, joined by the fact in two roles — OrderDate and DeliveryDate — rather than two served relations
    (role_playing_dimension). No gaps: 4 018 rows over a 4 018-day span, 2016-01-01 to 2026-12-31 (P1
    V8). IT COVERS MORE THAN THE FACTS DO: 359 of its days fall after the last fact date (2026-01-06),
    and 568 days carry no sale at all (S14, P1 O10) — the latest day in this relation is not the latest
    day of data.'
  confidence: I
columns:
- name: Date
  type: date
  role: primary_key
  confidence: I
  notes: 'DATE since 2026-09-19, cast in the transform from the landing''s TIMESTAMP on the operator''s
    ruling. Lossless and measured, not assumed: every value was a timestamp at midnight (P1 V10), re-measured
    as 0 non-midnight over 4 018 of 4 018 rows immediately before the cast. main.date keeps TIMESTAMP;
    the served type is decided at the sources->datasets seam. The fact''s OrderDate/DeliveryDate join
    this column by exact equality and were cast in the same change, so both sides are DATE — re-measured
    after: 3 450 of 4 018 ordered days, 3 498 of 4 018 delivered days, inclusion 1.0 over 223 974 rows,
    0 orphans. DateKey is the same identity as varchar YYYYMMDD; which one the calendar keys on is still
    an open ruling (RUN.md Q11) — this descriptor keys on Date because the facts carry the day.'
