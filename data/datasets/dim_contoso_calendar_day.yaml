table:
  name: dim_contoso_calendar_day
  schema: contoso_served
  type: view
  description: 'One row per calendar day (Date; 4 018 rows / 4 018 distinct / 0 duplicates, P2). ONE conformed
    calendar, joined by the fact in two roles — OrderDate and DeliveryDate — rather than two served relations
    (role_playing_dimension). No gaps: 4 018 rows over a 4 018-day span, 2016-01-01 to 2026-12-31 (P1
    V8). IT COVERS MORE THAN THE FACTS DO: 359 of its days fall after the last fact date (2026-01-06),
    and 568 days carry no sale at all (S14, P1 O10) — the latest day in this relation is not the latest
    day of data.'
  confidence: I
