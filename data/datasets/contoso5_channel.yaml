# A RELATION WHOSE ROWS LIVE IN A FILE — formerly a 'value register'.
#
# Operator, 2026-10-15: "lookups are just like any other data source except that it is
# a file" and "if we have it as source ... then we dont have register". Nothing here is
# special except `table.medium`, which says where the rows are. The columns block and
# the measured row count are what any relation declares, and a column that draws its
# values from this one declares an ordinary foreign key with `references:`.
#
# WRITTEN BY HAND 2026-10-23, AND THE REASON IS A PRODUCER DEFECT WORTH RECORDING.
# `tools/mac_lookups.py` cut this register's CSV correctly and then wrote its descriptor
# in the RETIRED shape — a `register:` block at `data/lookups/contoso5_channel.lookup.yaml`
# carrying `register.members` and `register.grain`, both classified `retire` in
# guardrails/declaration_triage.yaml since 2026-10-15. The bundle then DID NOT COMPILE
# (MAC003 fact-restated), and `check_delivery_consistency#FK-QUALIFIED` reported this
# relation as described by no descriptor. The producer is eight days behind the ruling it
# is supposed to implement; the twelve descriptors beside this one all carry the successor
# shape, so this file follows them rather than its generator.
# WHERE THESE ROWS CAME FROM — the one fact a set of consumers cannot answer, because a
# set is unordered. It was `register.cut_from` on the retired register descriptor; on a
# relation its home is `derived_from`, which is what every other view declares.
metadata:
  schema_version: 0.3.1-develop
  status: measured
  kind: served_dataset
  observed: '2026-10-23'
  generated_by: mac_lookups.py/1
table:
  name: contoso5_channel
  type: file
  medium:
    format: csv
    path: data/lookups/contoso5_channel.lookup.csv
