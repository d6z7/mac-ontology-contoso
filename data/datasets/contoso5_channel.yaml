dataset: contoso5_channel
key:
  - code
stored_as: file
columns:
  code:
    is: identifier
    means: 'THE MEMBER: which channel a sale was made through — `physical` for a shop a customer can walk into, `online`
      for the web shop. This relation IS the declared value set for `v_contoso5_sales_line.channel`, so a value absent here
      is a value the warehouse does not hold. The names are the ones `store.resolution.the_channel_is_the_location_sentinel`
      already declares for its two populations, so the axis has one vocabulary across the fact, the dimension and this domain.'
