# CONTOSO (demo) — physical: the `sales` table (denormalized order lines). Grounding target for Sales + Currency.
# SQLBI Contoso V2 (MIT), loaded into local DuckDB by ../setup.sh.

metadata:
  table: sales
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: verified
  owner: demo-team
  confidence: C

table:
  name: sales
  schema: main
  type: table
  description: "One row per order line (orders joined to orderrows). The measure surface for Sales."

columns:
  - { name: OrderKey,     type: bigint,    role: foreign_key }
  - { name: LineNumber,   type: integer,   role: value }
  - { name: OrderDate,    type: timestamp, role: value, x-subrole: temporal }
  - { name: DeliveryDate, type: timestamp, role: value, x-subrole: temporal }
  - { name: CustomerKey,  type: integer,   role: foreign_key }
  - { name: StoreKey,     type: integer,   role: foreign_key }
  - { name: ProductKey,   type: integer,   role: foreign_key }
  - { name: Quantity,     type: integer,   role: value, x-subrole: measure }
  - { name: UnitPrice,    type: decimal,   role: value, x-subrole: measure }
  - { name: NetPrice,     type: decimal,   role: value, x-subrole: measure }
  - { name: UnitCost,     type: decimal,   role: value, x-subrole: measure }
  - { name: CurrencyCode, type: string,    role: discriminator }
  - { name: ExchangeRate, type: decimal,   role: value }

foreign_keys:
  - { name: fk_product,  from_column: ProductKey,  to_table: product,  to_column: ProductKey }
  - { name: fk_store,    from_column: StoreKey,    to_table: store,    to_column: StoreKey }
  - { name: fk_customer, from_column: CustomerKey, to_table: customer, to_column: CustomerKey }
  - { name: fk_order,    from_column: OrderKey,    to_table: orders,   to_column: OrderKey }

grounded_by_concepts:
  - { concept: Sales,    role: primary_table }
  - { concept: Currency, role: discriminator_column }

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
