  DQ-DUP-ORDERROWS-SALES:
    ruling.question: '`orderrows` and `sales` deliver the same 223,974 rows. Which is the fact of record?'
    ruling.because: 'WHICH one is a convention; serving BOTH is the defect. On the evidence `sales` is the cheaper record
      — it answers at this grain with no join, and carries ExchangeRate, LineNumber, OrderDate, which NO other landing has,
      so the normalised route cannot reach it at all. Against it: `orderrows` is the normalised detail, and a bundle that
      prefers it keeps one spelling of each attribute instead of two. Either is defensible. Both is not.'
    ruling.established: 'equal row counts; `sales`''s column set CONTAINS `orderrows`''s apart from RowNumber; the 7 extra
      column(s) on `sales` are header attributes (CurrencyCode, CustomerKey, DeliveryDate, ExchangeRate, LineNumber, OrderDate,
      StoreKey). Served: neither'
    ruling.for_the_human: A measurement sees two relations delivering one fact. It cannot see which one the business considers
      authoritative, and that is the whole of the question — both are internally consistent, so no test distinguishes them.
