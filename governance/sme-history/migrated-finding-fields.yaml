findings:
  DQ-AMBIGREF-CURRENCYCODE:
    ruling.question: CurrencyCode includes perfectly into all of currencyexchange.FromCurrency, currencyexchange.ToCurrency.
      Which is THE reference?
    ruling.because: 'NOT FROM THE VALUES, WHICH DO NOT LEAN — this is domain convention, and it is labelled as such so it
      costs one word to overrule. An amount is denominated in a currency and a conversion runs FROM that currency to a reporting
      one, so the column carrying an order''s currency is the `from` endpoint. Where the pair is not a currency conversion,
      read the same shape: the child names what the row IS, and the reference points at the side that describes it.'
    ruling.established: inclusion 1.0 into each candidate, same key role, 4 instance(s) over 2 relation(s). The candidates
      are equally supported by every measurement this platform can make.
    ruling.for_the_human: |-
      Nothing in the values distinguishes these. A pair of endpoints that both hold the same domain — the two sides of a conversion, a ship-to and a bill-to, a parent and a predecessor — are identical to a measurement and opposite in meaning. Only the business's intent separates them.

      AND THE SYMMETRY IS WHY THIS IS DANGEROUS RATHER THAN MERELY UNDECIDED. Measured on a currency pair of this shape: every identity row carries rate 1.0, and rate(A->B) x rate(B->A) = 1 for all 80,360 reciprocal rows to within 1.2e-5. The table therefore serves BOTH directions equally correctly — so the wrong choice raises no error, produces no orphan, and fails no referential case. It returns the RECIPROCAL: a EUR amount multiplied by ~1.1 where ~0.9 was meant, a ~20 % error that still looks like money.
  DQ-DANGLINGKEY-CATEGORYKEY:
    ruling.question: CategoryKey is key-shaped with no parent in scope. Which absence is it?
    ruling.because: product.CategoryName carries the SAME 8 distinct value(s) as CategoryKey, dense over 1..8 — the label
      already travels with the key, so a concept grounds on product and no parent relation is needed at all
    ruling.established: '8 distinct value(s) on product; no relation in scope declares CategoryKey as a key; sibling column(s)
      at the same cardinality: CategoryName.'
    ruling.for_the_human: A measurement sees an absence; it cannot see whether the absence is a gap in the extract or a
      modelling choice already made. Only someone who knows what was meant to be delivered can say.
  DQ-DANGLINGKEY-GEOAREAKEY:
    ruling.question: GeoAreaKey is key-shaped with no parent in scope. Which absence is it?
    ruling.because: 'no column of customer shares GeoAreaKey''s 608 distinct value(s), so it is NOT an inline dimension.
      Between the remaining two answers the measurement does not lean: whether the absent parent''s information is already
      denormalised beside this key is a question about meaning, not cardinality. What would settle it is a look at customer''s
      other columns — if they already describe what GeoAreaKey points at, it is attribute_only; if nothing does, the extract
      is incomplete'
    ruling.established: '608 distinct value(s) on customer; no relation in scope declares GeoAreaKey as a key; sibling column(s)
      at the same cardinality: none.'
    ruling.for_the_human: A measurement sees an absence; it cannot see whether the absence is a gap in the extract or a
