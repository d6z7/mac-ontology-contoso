      Order already reads. Folded into Order as a served column (one fact node per grain);
      its price ratio (`net_revenue.default.a_price_is_revenue_per_article`) is on Order with `denominator: quantity`; its 2026-09-30 price reading is on `net_amount`'s description.
    migration_hint: >-
      read the figure from `v_contoso5_sales_line.net_amount` through Order: its meaning is the
      column's description, its names are the column's surfaces, its additivity is the
      column's `offers.aggregate`. Edges to dimensions start at Order (`order__*`).
