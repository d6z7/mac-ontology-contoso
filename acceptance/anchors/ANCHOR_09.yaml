question: What is the net revenue in Germany? (AGG-05)
family: revenue
derivation:
  sql: 'select round(sum(f.Quantity*f.NetPrice),5) from contoso_served.v_contoso_order_line f join contoso_served.dim_contoso_customer
    c on c.CustomerKey = f.CustomerKey where c.Country = ''DE''

    '
  raw_value: 24638830.1795
