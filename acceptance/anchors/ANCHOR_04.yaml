id: ANCHOR_04
question: How many stores do we have? (RC05)
family: counting
derivation:
  sql: 'select count(distinct StoreCode) from contoso_served.dim_contoso_store

    '
  raw_value: 67
  cross_check_sql: 'select count(distinct StoreCode) from main.store

    '
  cross_check_value: 67
  agree: true
  routes: Route 1 is the SERVED plane the ontology binds to. Route 2 is main.sales — the FLAT delivery
    this bundle deliberately does not read (register NS-ORDERS-01, "one figure, one home"). It repeats
    the same 223 974 lines by a different path, so it is a genuine second derivation and not a retype
    of the first.
expected:
  shape: scalar
  value: 67
  tolerance: 0
  pinned:
    key: StoreCode — the BUSINESS code, not StoreKey
assumptions: 'THE VALUE IS 67 AND THE ENGINE RETURNS 74. This is not a judgement call: the Store concept''s
  rule `store.versions.entity_count_is_the_code` says it in as many words — subject "Counting stores counts
  codes, not rows - 67, never 74", then "count DISTINCT StoreCode, which is 67", never "DISTINCT StoreKey,
  which is 74". The relation is served at VERSION grain: 74 versions over 67 codes, 6 codes with two versions
  and one with three. `identity.canonical_key: StoreKey` is CORRECT and deliberate — StoreCode is not
  unique so it cannot be the canonical key, and the fact joins the version it was placed against. Both
  declarations are right; the count route reads the key and does not read the rule. The rule predicted
  exactly this symptom: "the two numbers differ by 7 and nothing in a result set says which you got".'
authority: derived
authority_note: 'DERIVED FROM THE DATA BY TWO ROUTES, neither of them the engine. Route 1 reads the served
  plane; route 2 reads main.sales or the raw landing — a delivery the ontology never touches. Both were
  executed read-only against the warehouse on 2026-09-24 and the two numbers are recorded separately above,
  with `agree` stating whether they met.

  WHAT THIS CAN AND CANNOT SAY. It can say the ENGINE''s number is right or wrong against the data. It
  CANNOT say the ontology''s MEANING is right: where a reading is mistaken, both routes agree and both
  are wrong. That remains an SME question and no number of cross-checks changes it.'
