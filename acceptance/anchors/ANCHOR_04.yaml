id: ANCHOR_04
question: How many stores do we have? (RC05)
family: counting
derivation:
  sql: SELECT count(DISTINCT location_code) FROM contoso_served.dim_store WHERE close_date IS NULL AND
    location_code <> -1
  raw_value: 57
  cross_check_sql: SELECT count(DISTINCT s."StoreCode") FROM main.store s WHERE s."CloseDate" IS NULL
    AND s."CountryCode" <> '--'
  cross_check_value: 57
  agree: true
  routes: Route 1 is the SERVED plane the ontology binds to. Route 2 is main.sales — the FLAT delivery
    this bundle deliberately does not read (register NS-ORDERS-01, "one figure, one home"). It repeats
    the same 223 974 lines by a different path, so it is a genuine second derivation and not a retype
    of the first.
  comparison: numeric, tolerance 0.01 — the two routes read different relations (served, then the raw
    landing)
expected:
  shape: scalar
  value: 57
  tolerance: 0
  pinned:
    key: StoreCode — the BUSINESS code, not StoreKey
assumptions: '57, NOT 67. OPERATOR RULING, 2026-09-30: "stores that are closed, restructured have close
  date and are not active anymore; other stores without status do not have close date are ONLY stores
  currently active and this is the scope of our interest in most questions." The population is now DECLARED,
  not described: store.yaml#grounding.value_filter is `close_date IS NULL AND location_code <> -1`, read
  by the planner and disclosed on every answer. The two clauses are the two things a store is not -- a
  row with a close date is a store that ENDED, and location_code -1 is the online channel written as a
  store.


  WHAT 67 WAS: every distinct location code in the relation, which includes the nine locations whose shop
  has shut and the online sentinel. It was approved on 2026-09-30 earlier the same day, before the ruling
  above; the ruling supersedes it. 67 = 57 active + 9 ended + 1 online.'
authority: ruled
authority_note: RULED, then DERIVED. The population is an operator ruling of 2026-09-30 (above); the figure
  is computed from it by two routes, the served plane and the raw landing, which share no view definition.
  An anchor can say the engine's number disagrees with the data; only a person can say which population
  the question means, and here one did.
