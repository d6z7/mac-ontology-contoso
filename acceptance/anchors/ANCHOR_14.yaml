id: ANCHOR_14
question: When was the first store closed? (STORE-04)
family: store_versioning
derivation:
  sql: SELECT min(CloseDate) FROM contoso_served.dim_contoso_store WHERE CloseDate IS NOT NULL
  raw_value: '2013-12-05'
  cross_check_sql: SELECT min(CloseDate) FROM main.store WHERE CloseDate IS NOT NULL
  cross_check_value: '2013-12-05'
  agree: true
  comparison: values normalised to date/float before comparison, so a relation type difference is not read as a disagreement
expected:
  shape: scalar
  value: '2013-12-05'
  tolerance: 0
  pinned:
    scope: every version ever recorded - NOT collapsed
assumptions: >-
  2013-12-05. NO COLLAPSE HERE, DELIBERATELY: the question asks when a closure HAPPENED, which is
  an event on a version, not a property of the current store. Collapsing first would hide every
  closure that has since been superseded. Same concept, opposite treatment to STORE-01 through
  STORE-03 - which is why it is here. The two routes return the same instant in different Python
  types (date from the served view, datetime from the landing); both are normalised to a date
  before comparison, which is a type artifact of the relation and not a disagreement.
authority: derived
authority_note: >-
  DERIVED FROM THE DATA BY TWO ROUTES, neither of them the engine, both executed read-only on
  2026-09-24. Route 1 is the SERVED view contoso_served.dim_contoso_store; route 2 is the raw
  landing main.store the view projects from. Different relation, same 74 rows. An anchor can say
  the ENGINE's number is right or wrong against the data; it CANNOT say the ontology's MEANING is
  right - where a reading is mistaken both routes agree and both are wrong. STORE-01/02/07 are
  exactly that hazard and each names its rival reading.
