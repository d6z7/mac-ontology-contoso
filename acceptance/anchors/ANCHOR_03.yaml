  raw_value: 104990
  cross_check_sql: 'select count(distinct CustomerKey) from main.customer

    '
  cross_check_value: 104990
  agree: true
  routes: Route 1 is the SERVED plane the ontology binds to. Route 2 is main.sales — the FLAT delivery
    this bundle deliberately does not read (register NS-ORDERS-01, "one figure, one home"). It repeats
    the same 223 974 lines by a different path, so it is a genuine second derivation and not a retype
    of the first.
expected:
  shape: scalar
  value: 104990
  tolerance: 0
  pinned:
    key: CustomerKey (the concept's declared canonical_key)
assumptions: The dimension is NOT versioned — 104 990 rows, 104 990 distinct keys — so the count needs
