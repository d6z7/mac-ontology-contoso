id: ANCHOR_18
question: What is the average store size in square meters? (MQ-06)
family: gated_by_confidence
derivation:
  sql: SELECT round(avg(square_metres),2) FROM contoso_served.dim_store WHERE close_date IS NULL AND location_code
    <> -1
  raw_value: 1511.75
  cross_check_sql: SELECT round(avg(s."SquareMeters"),2) FROM main.store s WHERE s."CloseDate" IS NULL
    AND s."CountryCode" <> '--'
  cross_check_value: 1511.75
  agree: true
  comparison: numeric, tolerance 0.01 — the two routes read different relations (served, then the raw
    landing)
expected:
  shape: scalar
  value: 1511.75
  tolerance: 0
  pinned:
    grain: one row per StoreCode - the CURRENT version
    measure: SquareMeters
assumptions: '1 511,75, NOT 1 504,55. OPERATOR RULING, 2026-09-30: "stores that are closed, restructured
  have close date and are not active anymore; other stores without status do not have close date are ONLY
  stores currently active and this is the scope of our interest in most questions." The population is
  now DECLARED, not described: store.yaml#grounding.value_filter is `close_date IS NULL AND location_code
  <> -1`, read by the planner and disclosed on every answer. The two clauses are the two things a store
  is not -- a row with a close date is a store that ENDED, and location_code -1 is the online channel
  written as a store.


  THIS ANCHOR ARGUED AGAINST THE WRONG RIVAL. Its own note said "1 504,55, NOT 1 494,79 -- averaging the
  74 version rows instead of the 67 current ones gives 1 494,79, a 0,65 % difference that no reader could
  spot", and it was right about that pair and never considered a third: 67 ''current'' rows include the
  nine locations whose shop has SHUT, each represented by its closed row. Over the 57 shops that exist
  the average is 1 511,75. All three readings sit within 1,2 % of each other, which is what makes this
  question worth an anchor at all.'
authority: ruled
authority_note: RULED, then DERIVED. The population is an operator ruling of 2026-09-30 (above); the figure
  is computed from it by two routes, the served plane and the raw landing, which share no view definition.
  An anchor can say the engine's number disagrees with the data; only a person can say which population
  the question means, and here one did.
