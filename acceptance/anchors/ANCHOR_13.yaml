id: ANCHOR_13
question: How many stores have been restructured? (STORE-03)
family: store_versioning
derivation:
  sql: SELECT count(*) FROM (SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY StoreCode ORDER BY OpenDate DESC) r FROM contoso_served.dim_contoso_store) t WHERE r = 1) WHERE Status = 'Restructured'
  raw_value: 0
  cross_check_sql: SELECT count(*) FROM (SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY StoreCode ORDER BY OpenDate DESC) r FROM main.store) t WHERE r = 1) WHERE Status = 'Restructured'
  cross_check_value: 0
  agree: true
  comparison: values normalised to date/float before comparison, so a relation type difference is not read as a disagreement
expected:
  shape: scalar
  value: 0
  tolerance: 0
  pinned:
    grain: one row per StoreCode - the CURRENT version
    status: Restructured
assumptions: >-
  ZERO, AND SEVEN VERSIONS CARRY IT. Every restructured version has since been superseded by a
  later one, so no store is restructured TODAY. This is the collapse in its most visible form: at
  version grain the answer is 7, at entity grain 0, and nothing in a result set says which grain
  produced it.
authority: derived
authority_note: >-
  DERIVED FROM THE DATA BY TWO ROUTES, neither of them the engine, both executed read-only on
  2026-09-24. Route 1 is the SERVED view contoso_served.dim_contoso_store; route 2 is the raw
  landing main.store the view projects from. Different relation, same 74 rows. An anchor can say
  the ENGINE's number is right or wrong against the data; it CANNOT say the ontology's MEANING is
  right - where a reading is mistaken both routes agree and both are wrong. STORE-01/02/07 are
  exactly that hazard and each names its rival reading.
