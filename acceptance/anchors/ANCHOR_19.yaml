id: ANCHOR_19
question: Which products were NOT sold in 2024? (MQ-08)
family: gated_by_confidence
derivation:
  sql: SELECT count(*) FROM contoso_served.dim_contoso_product p WHERE NOT EXISTS (SELECT 1 FROM contoso_served.v_contoso_order_line f WHERE f.ProductKey=p.ProductKey AND f.OrderDate>=DATE '2024-01-01' AND f.OrderDate<DATE '2025-01-01')
  raw_value: 56
  cross_check_sql: SELECT count(*) FROM main.product p WHERE NOT EXISTS (SELECT 1 FROM (select o.OrderKey, o.CustomerKey, o.StoreKey, o.DT as OrderDate, o.CurrencyCode, r.ProductKey, r.Quantity, r.UnitPrice, r.NetPrice from main.orders o join main.orderrows r on o.OrderKey=r.OrderKey) f WHERE f.ProductKey=p.ProductKey AND f.OrderDate>=DATE '2024-01-01' AND f.OrderDate<DATE '2025-01-01')
  cross_check_value: 56
  agree: true
  comparison: numeric, tolerance 0.01 — the two routes read different relations
expected:
  shape: scalar
  value: 56
  tolerance: 0
  pinned:
    shape: a COUNT of the absent set
    period: '[2024-01-01, 2025-01-01)'
assumptions: >-
  56 of the catalogue went unsold in 2024. An anti-join question: the answer is about rows that
  are NOT there, so an inner join cannot reach it and an empty result is the wrong shape rather
  than a small number.
authority: derived
authority_note: >-
  DERIVED FROM THE DATA BY TWO ROUTES, neither of them the engine, both executed read-only on
  2026-09-24. Route 1 is the SERVED plane; route 2 rebuilds the same figure from the RAW landing
  (main.orders JOIN main.orderrows, main.product, main.customer, main.store), which shares no view
  definition with route 1. An anchor can say the ENGINE's number is wrong against the data; it
  cannot say the ontology's READING is right. Each note names its rival reading where one exists.
  WRITTEN FOR A QUESTION THE CONFIDENCE GATE BLOCKS: the corpus had 16 anchors and every one sat
  on a question the interpreter was already sure about, so calibration could not be measured at
  all.
