    contrast: RC05 asks the same shape at entity grain and is 67
assumptions: >-
  74 VERSIONS OVER 67 STORES, and this question exists to be the one that must NOT collapse. It is
  the counter-question to RC05 (67): if an engine answers 67 here it has applied the collapse
  where the question asked for the version grain, and if it answers 74 to RC05 it has skipped it.
  One number cannot serve both.
authority: derived
authority_note: >-
  DERIVED FROM THE DATA BY TWO ROUTES, neither of them the engine, both executed read-only on
  2026-09-24. Route 1 is the SERVED view contoso_served.dim_contoso_store; route 2 is the raw
  landing main.store the view projects from. Different relation, same 74 rows. An anchor can say
  the ENGINE's number is right or wrong against the data; it CANNOT say the ontology's MEANING is
  right - where a reading is mistaken both routes agree and both are wrong. STORE-01/02/07 are
  exactly that hazard and each names its rival reading.
