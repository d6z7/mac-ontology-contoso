id: ANCHOR_07
question: How many distinct products were sold in 2023? (RC11)
family: counting
derivation:
  sql: 'select count(distinct ProductKey) from contoso_served.v_contoso_order_line where OrderDate >=
    DATE ''2023-01-01'' and OrderDate < DATE ''2024-01-01''

    '
  raw_value: 2485
  cross_check_sql: 'select count(distinct ProductKey) from main.sales where OrderDate >= timestamp ''2023-01-01''
    and OrderDate < timestamp ''2024-01-01''

    '
  cross_check_value: 2485
  agree: true
  routes: Route 1 is the SERVED plane the ontology binds to. Route 2 is main.sales — the FLAT delivery
    this bundle deliberately does not read (register NS-ORDERS-01, "one figure, one home"). It repeats
    the same 223 974 lines by a different path, so it is a genuine second derivation and not a retype
    of the first.
expected:
  shape: scalar
  value: 2485
  tolerance: 0
  pinned:
    period: '[2023-01-01, 2024-01-01) half-open, on OrderDate'
    population: products that appear on a LINE in the period, not the catalogue
assumptions: 2 485 of the catalogue's 2 517 — 32 products were not sold at all in 2023. The gap is the
  whole difference between this question and RC06.
authority: derived
authority_note: 'DERIVED FROM THE DATA BY TWO ROUTES, neither of them the engine. Route 1 reads the served
  plane; route 2 reads main.sales or the raw landing — a delivery the ontology never touches. Both were
  executed read-only against the warehouse on 2026-09-24 and the two numbers are recorded separately above,
  with `agree` stating whether they met.

  WHAT THIS CAN AND CANNOT SAY. It can say the ENGINE''s number is right or wrong against the data. It
  CANNOT say the ontology''s MEANING is right: where a reading is mistaken, both routes agree and both
  are wrong. That remains an SME question and no number of cross-checks changes it.'
