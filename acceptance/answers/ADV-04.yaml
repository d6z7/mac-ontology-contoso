sql:
- 'SELECT dim_contoso_calendar_day.YearMonth, SUM(f."Quantity" * f."NetPrice")     AS
  net_sales_amount

  FROM contoso_served.v_contoso_order_line f

  JOIN contoso_served.dim_contoso_calendar_day ON f.OrderDate = dim_contoso_calendar_day.Date

  JOIN contoso_served.dim_contoso_customer ON f.CustomerKey = dim_contoso_customer.CustomerKey

  WHERE f.OrderDate >= :period_start AND f.OrderDate < :period_end AND dim_contoso_customer.Country
  = :country

  GROUP BY dim_contoso_calendar_day.YearMonth'
