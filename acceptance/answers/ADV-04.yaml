    its store country, so no internet line can qualify. (b) All sales lines whose customer''s country
    of residence is Germany, same window: 4,717 lines, spanning both channels. Both columns: net of discount,
    in USD, grouped to month on order_date, no channel predicate, and no store trading-state predicate
    — so shops that have since closed are included in the months they actually traded. The third declared
    route, site country via dim_location, was measured and returns byte-identical rows to (a) (14,190
    lines, 14,382,768.44 all-time), so it is not a separate reading in this bundle. Excluded from both:
    every other country, every other year, and the ''shipped to Germany'' reading, which no column here
    can express.'
