  what_it_calculated: 'Twelve rows, one per month of calendar 2024 in order, each carrying the same quantity
    measured two ways: the money Contoso actually charged after discount, in USD, on orders placed in
    that month that count as German. `revenue_german_stores` is what premises located in Germany rang
    up — 1,812 order lines, 1,540,736.67 across the year, containing no internet sales whatsoever, because
    the web shop''s store country is the ''--'' sentinel the declarations state is not a place. `revenue_german_customers`
    is what people resident in Germany spent wherever they bought — 4,717 order lines, 3,969,307.19 across
    the year, of which 2,428,570.52 is the web shop. The two columns must not be added: they overlap on
    the 1,812 lines that are German both ways, and measurement showed that in 2024 no German shop sold
    to a foreigner and no German customer bought at a foreign shop, so the web shop is the whole of the
    disagreement. Every one of the 12 monthly pairs matches the independently-read series from the aggregation
    step, so the figures are confirmed and not sampled. What I did NOT include in either column: gross
    revenue before discount, any currency conversion (these are USD, not EUR, whatever currency each sale
    was transacted in), any other country, any other year, orders dated by delivery rather than by order,
    and any month-over-month or 2023 comparison.'
