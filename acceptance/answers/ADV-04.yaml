      shown as a zero the data did not supply; January is the strongest month and April the weakest under
      both; and the figures are net of discount in USD, dated by order date, on calendar 2024 — dating
      by delivery instead moves (b) by 1,385.10 and (a) by nothing at all.


      Your third possible reading, orders SHIPPED to Germany, I cannot give you: this bundle records a
