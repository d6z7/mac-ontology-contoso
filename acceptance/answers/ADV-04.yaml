        \ AS l\nJOIN contoso_served.dim_customer AS cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
        \ AS c\n  ON cu.country_code = c.country_code\nWHERE\n  c.country_name = 'Germany'\n  AND l.order_date\
        \ >= CAST('2024-01-01' AS DATE)\n  AND l.order_date < CAST('2025-01-01' AS DATE)\n\n-- step 4\n\
        WITH german AS (\n  SELECT\n    'store' AS reading,\n    l.order_date,\n    l.net_amount\n  FROM\
        \ contoso_served.v_contoso5_sales_line AS l\n  JOIN contoso_served.dim_store AS s\n    ON l.store_key\
        \ = s.store_key\n  JOIN contoso_served.dim_country AS c\n    ON s.country_code = c.country_code\n\
        \  WHERE\n    c.country_name = 'Germany'\n    AND l.order_date >= CAST('2024-01-01' AS DATE)\n\
        \    AND l.order_date < CAST('2025-01-01' AS DATE)\n  UNION ALL\n  SELECT\n    'customer',\n \
        \   l.order_date,\n    l.net_amount\n  FROM contoso_served.v_contoso5_sales_line AS l\n  JOIN\
        \ contoso_served.dim_customer AS cu\n    ON l.customer_key = cu.customer_key\n  JOIN contoso_served.dim_country\
        \ AS c\n    ON cu.country_code = c.country_code\n  WHERE\n    c.country_name = 'Germany'\n   \
