sql:
- "WITH german AS (\n  SELECT\n    'store' AS reading,\n    l.order_date,\n    l.net_amount\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS l\n  JOIN contoso_served.dim_store AS s\n    ON l.store_key = s.store_key\n  JOIN contoso_served.dim_country\
  \ AS c\n    ON s.country_code = c.country_code\n  WHERE\n    c.country_name = 'Germany'\n    AND l.order_date\
  \ >= CAST('2024-01-01' AS DATE)\n    AND l.order_date < CAST('2025-01-01' AS DATE)\n  UNION ALL\n  SELECT\n\
  \    'customer',\n    l.order_date,\n    l.net_amount\n  FROM contoso_served.v_contoso5_sales_line AS\
  \ l\n  JOIN contoso_served.dim_customer AS cu\n    ON l.customer_key = cu.customer_key\n  JOIN contoso_served.dim_country\
  \ AS c\n    ON cu.country_code = c.country_code\n  WHERE\n    c.country_name = 'Germany'\n    AND l.order_date\
  \ >= CAST('2024-01-01' AS DATE)\n    AND l.order_date < CAST('2025-01-01' AS DATE)\n)\nSELECT\n  STRFTIME(DATE_TRUNC('MONTH',\
  \ order_date), '%Y-%m') AS month,\n  ROUND(SUM(net_amount) FILTER(WHERE\n    reading = 'store'), 2)\
  \ AS revenue_german_stores,\n  ROUND(SUM(net_amount) FILTER(WHERE\n    reading = 'customer'), 2) AS\
  \ revenue_german_customers\nFROM german\nGROUP BY\n  1\nORDER BY\n  month ASC"
