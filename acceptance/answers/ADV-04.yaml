        \ = c.country_code\nWHERE\n  c.country_name = 'Germany'\n  AND l.order_date >= CAST('2024-01-01'\
        \ AS DATE)\n  AND l.order_date < CAST('2025-01-01' AS DATE)\nUNION ALL\nSELECT\n  'customer country',\n\
