    \ billed, where it was shipped, or the country of the store or entity that made the sale?\n      could\
    \ mean: the customer's own country\n      could mean: the billing country on the order\n      could\
    \ mean: the shipping/delivery destination country\n      could mean: the country of the selling store\
    \ or legal entity\n      took: the country associated with the sale as the business normally reports\
    \ it (customer/billing country)\n  AMBIGUOUS 'net revenue' — ASKS: What counts as net revenue here\
    \ — gross sales less returns, less discounts, less taxes, or some combination of those?\n      could\
