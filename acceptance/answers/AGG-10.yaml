sql:
- "WITH agg AS (\n  SELECT\n    'customer' AS reading,\n    dc.country_name AS country,\n    SUM(l.net_amount)\
  \ AS net_revenue\n  FROM contoso_served.v_contoso5_sales_line AS l\n  JOIN contoso_served.dim_customer\
  \ AS cu\n    ON l.customer_key = cu.customer_key\n  JOIN contoso_served.dim_country AS dc\n    ON cu.country_code\
  \ = dc.country_code\n  WHERE\n    dc.country_code <> '--'\n  GROUP BY\n    1,\n    2\n  UNION ALL\n\
  \  SELECT\n    'store',\n    dc.country_name,\n    SUM(l.net_amount)\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS l\n  JOIN contoso_served.dim_store AS s\n    ON l.store_key = s.store_key\n  JOIN contoso_served.dim_country\
  \ AS dc\n    ON s.country_code = dc.country_code\n  WHERE\n    dc.country_code <> '--'\n  GROUP BY\n\
  \    1,\n    2\n), ranked AS (\n  SELECT\n    reading,\n    country,\n    net_revenue,\n    ROW_NUMBER()\
  \ OVER (PARTITION BY reading ORDER BY net_revenue DESC) AS rnk\n  FROM agg\n)\nSELECT\n  reading,\n\
  \  country,\n  net_revenue\nFROM ranked\nWHERE\n  rnk <= 5\nORDER BY\n  reading,\n  net_revenue DESC"
