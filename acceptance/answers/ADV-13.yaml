  \    ON sl.store_key = s.store_key\n  WHERE\n    s.is_online = FALSE AND s.close_date IS NULL\n  GROUP\
  \ BY\n    s.store_key,\n    s.store_name\n  HAVING\n    SUM(sl.net_amount) > (\n      SELECT\n     \
  \   AVG(store_total)\n      FROM (\n        SELECT\n          SUM(sl2.net_amount) AS store_total\n \
  \       FROM contoso_served.v_contoso5_sales_line AS sl2\n        JOIN contoso_served.dim_store AS s2\n\
  \          ON sl2.store_key = s2.store_key\n        WHERE\n          s2.is_online = FALSE AND s2.close_date\
  \ IS NULL\n        GROUP BY\n          s2.store_key\n      ) AS t\n    )\n) AS filtered\nORDER BY\n\
  \  sales DESC\nLIMIT 5"
