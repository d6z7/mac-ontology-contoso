sql:
- 'SELECT dim_contoso_store.StoreCode, SUM(f."Quantity" * f."NetPrice")     AS net_sales_amount

  FROM contoso_served.v_contoso_order_line f

  JOIN contoso_served.dim_contoso_store ON f.StoreKey = dim_contoso_store.StoreKey

  WHERE f.Quantity gt f.

  GROUP BY dim_contoso_store.StoreCode'
