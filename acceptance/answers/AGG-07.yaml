sql:
- "SELECT\n  ROUND(\n    SUM(\n      CASE\n        WHEN order_date >= CAST('2024-01-01' AS DATE)\n   \
  \     AND order_date < CAST('2024-04-01' AS DATE)\n        THEN net_amount\n        ELSE 0\n      END\n\
  \    ),\n    2\n  ) AS net_revenue_q1_2024,\n  COUNT(\n    CASE\n      WHEN order_date >= CAST('2024-01-01'\
