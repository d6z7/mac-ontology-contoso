sql:
- "SELECT\n  COUNT(DISTINCT order_key) AS orders_placed\nFROM contoso_served.v_contoso5_sales_line\nWHERE\n\
  \  order_date >= CAST('2024-01-01' AS DATE)\n  AND order_date < CAST('2025-01-01' AS DATE)"
- "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  MIN(order_date) AS first_order_date,\n\
  \  MAX(order_date) AS last_order_date\nFROM contoso_served.v_contoso5_sales_line"
- "SELECT\n  COUNT(\n    DISTINCT CASE\n      WHEN order_date >= CAST('2024-01-01' AS DATE)\n      AND\
  \ order_date < CAST('2025-01-01' AS DATE)\n      THEN order_key\n    END\n  ) AS orders_placed_in_2024,\n\
  \  COUNT(\n    DISTINCT CASE\n      WHEN delivery_date >= CAST('2024-01-01' AS DATE)\n      AND delivery_date\
  \ < CAST('2025-01-01' AS DATE)\n      THEN order_key\n    END\n  ) AS orders_delivered_in_2024,\n  COUNT(\n\
  \    CASE\n      WHEN order_date >= CAST('2024-01-01' AS DATE)\n      AND order_date < CAST('2025-01-01'\
  \ AS DATE)\n      THEN 1\n    END\n  ) AS lines_placed_in_2024,\n  MIN(\n    CASE\n      WHEN order_date\
  \ >= CAST('2024-01-01' AS DATE)\n      AND order_date < CAST('2025-01-01' AS DATE)\n      THEN order_date\n\
  \    END\n  ) AS first_order_date_in_window,\n  MAX(\n    CASE\n      WHEN order_date >= CAST('2024-01-01'\
  \ AS DATE)\n      AND order_date < CAST('2025-01-01' AS DATE)\n      THEN order_date\n    END\n  ) AS\
  \ last_order_date_in_window\nFROM contoso_served.v_contoso5_sales_line"
answer_sql: "SELECT\n  COUNT(DISTINCT order_key) AS orders_placed\nFROM contoso_served.v_contoso5_sales_line\n\
  WHERE\n  order_date >= CAST('2024-01-01' AS DATE)\n  AND order_date < CAST('2025-01-01' AS DATE)"
