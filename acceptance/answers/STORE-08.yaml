sql:
- "SELECT\n  SUM(l.net_amount) AS revenue_net_usd,\n  MIN(l.order_date) AS first_order,\n  MAX(l.order_date)\
  \ AS last_order\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store AS s\n\
  \  ON l.store_key = s.store_key\nWHERE\n  s.store_name = $store_name"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date\n\
  FROM contoso_served.dim_store\nWHERE\n  location_code <> -1 AND close_date IS NULL\nORDER BY\n  store_name"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date\n\
  FROM contoso_served.dim_store\nWHERE\n  location_code <> -1 AND close_date IS NULL AND store_name =\
  \ $store_name"
- "SELECT\n  l.order_key,\n  l.line_number,\n  l.order_date,\n  l.quantity,\n  l.net_amount,\n  l.gross_amount,\n\
  \  l.discount_amount\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store\
  \ AS s\n  ON l.store_key = s.store_key\nWHERE\n  s.store_name = $store_name\nORDER BY\n  l.order_date,\n\
  \  l.order_key,\n  l.line_number"
answer_sql: "SELECT\n  SUM(l.net_amount) AS revenue_net_usd,\n  MIN(l.order_date) AS first_order,\n  MAX(l.order_date)\
  \ AS last_order\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store AS s\n\
  \  ON l.store_key = s.store_key\nWHERE\n  s.store_name = $store_name"
