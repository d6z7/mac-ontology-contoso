- id: what_it_calculated
  title: What it says its rows are
  subtitle: ''
  status: ok
  body:
    kind: prose
    value: 'Two rows, read straight off the result. The 10,797 customers whose first ever order fell on
      or after 1 January 2024 have brought in 25,771,089.77 USD; the 41,392 customers who had already
      ordered before 2024 have brought in 193,043,381.89 USD. Both are NET revenue — after discount —
      and each covers that group''s ENTIRE order history, across shops and the web shop together, on orders
      placed between 2016-05-18 and 2025-12-31, the full extent the bundle holds. The two sum to 218,814,471.66,
      which is every sale in the warehouse, so nothing is lost or counted twice. WHAT I DID NOT INCLUDE,
      and what a reader should know before comparing the two numbers: the groups are not measured over
      a common window — the new group has only two years of history to its name while the older group''s
      figure carries nine extra years of buying, so most of the 7.5x gap is elapsed time, not spending
      behaviour. Over the same two years (orders placed from 2024 onwards) the same two groups give 25,771,089.77
      against 35,146,090.74. Also excluded: the 52,801 people on the register who have never ordered,
      who have no first order date and so fall in neither group; and anything before discount — gross
      would be 27,378,654.15 and 205,222,888.51.'
