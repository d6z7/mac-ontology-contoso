sql:
- "WITH first_order AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n  FROM\
  \ contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n), labelled AS (\n  SELECT\n \
  \   customer_key,\n    first_order_date >= CAST('2024-01-01' AS DATE) AS is_new,\n    CASE\n      WHEN\
  \ first_order_date >= CAST('2024-01-01' AS DATE)\n      THEN 'new customers with first order from 2024\
  \ onwards'\n      ELSE 'customers older then 2024'\n    END AS customer_group\n  FROM first_order\n\
  )\nSELECT\n  l.customer_group,\n  ROUND(SUM(s.net_amount), 2) AS revenue\nFROM labelled AS l\nJOIN contoso_served.v_contoso5_sales_line\
  \ AS s\n  ON s.customer_key = l.customer_key\nGROUP BY\n  l.customer_group,\n  l.is_new\nORDER BY\n\
  \  l.is_new DESC"
- "SELECT\n  customer_key\nFROM contoso_served.dim_customer"
- "SELECT\n  customer_key,\n  MIN(order_date) AS first_order_date\nFROM contoso_served.v_contoso5_sales_line\n\
  GROUP BY\n  customer_key"
- "WITH first_order AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n  FROM\
  \ contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n)\nSELECT\n  customer_key,\n \
  \ first_order_date,\n  CASE\n    WHEN first_order_date >= CAST('2024-01-01' AS DATE)\n    THEN 'new\
  \ customers with first order from 2024 onwards'\n    ELSE 'customers older then 2024'\n  END AS customer_group\n\
  FROM first_order"
- "WITH first_order AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n  FROM\
  \ contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n), labelled AS (\n  SELECT\n \
  \   customer_key,\n    CASE\n      WHEN first_order_date >= CAST('2024-01-01' AS DATE)\n      THEN 'new\
  \ customers with first order from 2024 onwards'\n      ELSE 'customers older then 2024'\n    END AS\
  \ customer_group\n  FROM first_order\n)\nSELECT\n  customer_group,\n  COUNT(*) AS customers\nFROM labelled\n\
  GROUP BY\n  customer_group"
- "WITH first_order AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n  FROM\
  \ contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n), labelled AS (\n  SELECT\n \
  \   customer_key,\n    CASE\n      WHEN first_order_date >= CAST('2024-01-01' AS DATE)\n      THEN 'new\
  \ customers with first order from 2024 onwards'\n      ELSE 'customers older then 2024'\n    END AS\
  \ customer_group\n  FROM first_order\n)\nSELECT\n  l.customer_group,\n  ROUND(SUM(s.net_amount), 2)\
  \ AS revenue\nFROM labelled AS l\nJOIN contoso_served.v_contoso5_sales_line AS s\n  ON s.customer_key\
  \ = l.customer_key\nGROUP BY\n  l.customer_group\nORDER BY\n  revenue DESC"
