sql:
- "SELECT\n  store_name\nFROM contoso_served.dim_store\nWHERE\n  status_annotation = 'Restructured'\n\
  ORDER BY\n  store_name,\n  open_date"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation\nFROM contoso_served.dim_store\nORDER BY\n  store_key"
- "SELECT\n  s.store_key,\n  s.store_name,\n  s.location_code,\n  s.country_code,\n  s.state,\n  s.open_date,\n\
  \  s.close_date,\n  s.status_annotation,\n  (\n    SELECT\n      COUNT(*)\n    FROM contoso_served.dim_store\
  \ AS t\n    WHERE\n      t.location_code = s.location_code\n  ) AS rows_at_this_site\nFROM contoso_served.dim_store\
  \ AS s\nWHERE\n  s.status_annotation = 'Restructured'\nORDER BY\n  s.location_code,\n  s.open_date"
