sql:
- "WITH per_site AS (\n  SELECT\n    location_code,\n    SUM(CASE WHEN close_date IS NULL THEN 1 ELSE\
  \ 0 END) AS shops_trading\n  FROM contoso_served.dim_store\n  WHERE\n    location_code <> -1\n  GROUP\
  \ BY\n    location_code\n)\nSELECT\n  COUNT(DISTINCT location_code) AS sites_closed\nFROM per_site\n\
  WHERE\n  shops_trading = 0"
- "SELECT\n  COUNT(*) AS shop_rows,\n  COUNT(DISTINCT location_code) AS sites_behind_them,\n  SUM(CASE\
  \ WHEN NOT close_date IS NULL THEN 1 ELSE 0 END) AS shop_rows_with_a_close_date,\n  SUM(CASE WHEN close_date\
  \ IS NULL THEN 1 ELSE 0 END) AS shop_rows_still_trading\nFROM contoso_served.dim_store\nWHERE\n  location_code\
  \ <> -1"
- "SELECT\n  shops_ever,\n  shops_closed,\n  shops_trading,\n  COUNT(*) AS sites\nFROM (\n  SELECT\n \
  \   location_code,\n    COUNT(*) AS shops_ever,\n    SUM(CASE WHEN NOT close_date IS NULL THEN 1 ELSE\
  \ 0 END) AS shops_closed,\n    SUM(CASE WHEN close_date IS NULL THEN 1 ELSE 0 END) AS shops_trading\n\
  \  FROM contoso_served.dim_store\n  WHERE\n    location_code <> -1\n  GROUP BY\n    location_code\n\
  ) AS s\nGROUP BY\n  shops_ever,\n  shops_closed,\n  shops_trading\nORDER BY\n  shops_ever,\n  shops_closed"
- "WITH per_site AS (\n  SELECT\n    location_code,\n    SUM(CASE WHEN close_date IS NULL THEN 1 ELSE\
  \ 0 END) AS shops_trading\n  FROM contoso_served.dim_store\n  WHERE\n    location_code <> -1\n  GROUP\
  \ BY\n    location_code\n)\nSELECT\n  location_code\nFROM per_site\nWHERE\n  shops_trading = 0"
answer_sql: "WITH per_site AS (\n  SELECT\n    location_code,\n    SUM(CASE WHEN close_date IS NULL THEN\
  \ 1 ELSE 0 END) AS shops_trading\n  FROM contoso_served.dim_store\n  WHERE\n    location_code <> -1\n\
  \  GROUP BY\n    location_code\n)\nSELECT\n  COUNT(DISTINCT location_code) AS sites_closed\nFROM per_site\n\
  WHERE\n  shops_trading = 0"
