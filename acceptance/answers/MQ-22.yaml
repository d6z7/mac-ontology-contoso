sql:
- "WITH shops AS (\n  SELECT\n    store_name,\n    square_metres\n  FROM contoso_served.dim_store\n  WHERE\n\
  \    location_code <> -1 AND close_date IS NULL\n), avg_m2 AS (\n  SELECT\n    AVG(square_metres) AS\
  \ a\n  FROM shops\n)\nSELECT\n  s.store_name AS the_shop,\n  s.square_metres AS shop_m2,\n  ROUND(a.a,\
  \ 4) AS avg_all_shops_m2,\n  ROUND(s.square_metres / a.a, 4) AS ratio_to_average\nFROM shops AS s, avg_m2\
  \ AS a\nORDER BY\n  ratio_to_average DESC,\n  s.store_name"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
