answer: 'Which shop do you mean by "the actual shop"? I have the comparison ready for all 57 of them but
  cannot hand you one figure, because the answer swings between 0.16x and 2.32x depending on which shop
  you meant. (1) ONE SPECIFIC SHOP — name it and you get one number. The list runs: Contoso Store New
  Brunswick and Contoso Store North Dakota, both 3500 m², 2.3152x; South Australia 3000 m², 1.9844x; Mecklenburg-Vorpommern
  2800 m², 1.8522x; Newfoundland and Labrador 2105 m², 1.3924x; Ayrshire, Blaenau Gwent and Pesaro all
  2100 m², 1.3891x; down to Contoso Store Corse, 245 m², 0.1621x. The middle shop is 0.9922x — dead average.
  Only 18 of the 57 are within a quarter of average, and it is nearly a coin flip whether yours is above
  (28 shops) or below (29), so guessing would not serve you. (2) EVERY SHOP, ONE RATIO EACH — already
  computed: 57 rows, 2.3152x down to 0.1621x. Say the word and this is your answer. (3) ALL SHOPS ADDED
  TOGETHER against the average — exactly 57.00, since total floor area over average floor area can only
  ever be the shop count; almost certainly not what you meant. WHAT YOUR CHOICE DOES NOT CHANGE: the average,
  1511.75 m² over all 57 trading shops. It is the same denominator under all three readings, and even
  widening the population to include the 16 closed shops moves it only to 1494.79 m² — about 1%, too small
  to move any shop across the average line except one sitting right on it.'
