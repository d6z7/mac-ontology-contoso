sql:
- "SELECT\n  s.store_name,\n  s.square_metres AS actual_shop_size_m2,\n  ROUND(AVG(s.square_metres) OVER\
  \ (), 2) AS average_shop_size_m2,\n  ROUND(s.square_metres * 1.0 / AVG(s.square_metres) OVER (), 4)\
  \ AS size_ratio\nFROM contoso_served.dim_store AS s\nWHERE\n  s.is_online = FALSE AND s.close_date IS\
  \ NULL\nORDER BY\n  s.store_name"
- "SELECT\n  store_key,\n  store_name,\n  square_metres\nFROM contoso_served.dim_store\nWHERE\n  is_online\
  \ = FALSE AND close_date IS NULL"
- '(not run on its own: write this step inside the step that reads it)'
- "SELECT\n  store_key,\n  store_name,\n  MAX(square_metres) AS actual_shop_size\nFROM contoso_served.dim_store\n\
  WHERE\n  is_online = FALSE AND close_date IS NULL\nGROUP BY\n  store_key,\n  store_name"
- "SELECT\n  AVG(square_metres) AS average_shop_size\nFROM contoso_served.dim_store\nWHERE\n  is_online\
  \ = FALSE AND close_date IS NULL"
answer_sql: "SELECT\n  s.store_name,\n  s.square_metres AS actual_shop_size_m2,\n  ROUND(AVG(s.square_metres)\
