  \ AS s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_country\
  \ AS c\n  ON s.sale_country_code = c.country_code AND c.is_placeholder = FALSE\nGROUP BY\n  p.product_key,\n\
  \  p.product_name\nHAVING\n  COUNT(DISTINCT s.sale_country_code) = 1\nORDER BY\n  p.product_name"
