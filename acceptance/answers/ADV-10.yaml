sql:
- "WITH per_product AS (\n  SELECT\n    p.product_key,\n    p.product_name,\n    COUNT(DISTINCT CASE WHEN\
  \ st.country_code <> '--' THEN st.country_code END) AS n_store,\n    MIN(CASE WHEN st.country_code <>\
  \ '--' THEN st.country_code END) AS store_cc,\n    COUNT(DISTINCT c.country_code) AS n_cust,\n    MIN(c.country_code)\
  \ AS cust_cc,\n    SUM(CASE WHEN s.channel = 'online' THEN 1 ELSE 0 END) AS online_lines\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS s\n  JOIN contoso_served.dim_store AS st\n    ON s.store_key = st.store_key\n  JOIN contoso_served.dim_customer\
  \ AS c\n    ON s.customer_key = c.customer_key\n  JOIN contoso_served.dim_product AS p\n    ON s.product_key\
  \ = p.product_key\n  GROUP BY\n    p.product_key,\n    p.product_name\n)\nSELECT\n  'a: selling shop\
  \ country' AS reading,\n  p.product_name AS product,\n  dc.country_name AS country,\n  p.n_store AS\
  \ countries_sold_in\nFROM per_product AS p\nJOIN contoso_served.dim_country AS dc\n  ON p.store_cc =\
  \ dc.country_code\nWHERE\n  p.n_store = 1\nUNION ALL\nSELECT\n  'b: buyer country',\n  p.product_name,\n\
  \  dc.country_name,\n  p.n_cust\nFROM per_product AS p\nJOIN contoso_served.dim_country AS dc\n  ON\
  \ p.cust_cc = dc.country_code\nWHERE\n  p.n_cust = 1\nUNION ALL\nSELECT\n  'c: selling shop country,\
  \ strict',\n  p.product_name,\n  dc.country_name,\n  p.n_store\nFROM per_product AS p\nJOIN contoso_served.dim_country\
  \ AS dc\n  ON p.store_cc = dc.country_code\nWHERE\n  p.n_store = 1 AND p.online_lines = 0\nORDER BY\n\
  \  reading,\n  country,\n  product"
