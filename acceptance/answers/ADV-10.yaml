        \ AS c\n  ON s.customer_key = c.customer_key\n\n-- step 2\nSELECT\n  p.product_key,\n  p.product_name,\n\
        \  b.store_country_code,\n  b.customer_country_code\nFROM (\n  SELECT\n    s.product_key,\n  \
        \  CASE WHEN st.country_code <> '--' THEN st.country_code END AS store_country_code,\n    c.country_code\
        \ AS customer_country_code\n  FROM contoso_served.v_contoso5_sales_line AS s\n  JOIN contoso_served.dim_store\
        \ AS st\n    ON s.store_key = st.store_key\n  JOIN contoso_served.dim_customer AS c\n    ON s.customer_key\
        \ = c.customer_key\n) AS b\nJOIN contoso_served.dim_product AS p\n  ON b.product_key = p.product_key\n\
        GROUP BY\n  p.product_key,\n  p.product_name,\n  b.store_country_code,\n  b.customer_country_code\n\
        \n-- step 3\nSELECT\n  p.product_key,\n  p.product_name,\n  COUNT(DISTINCT CASE WHEN st.country_code\
        \ <> '--' THEN st.country_code END) AS n_store_countries,\n  COUNT(DISTINCT c.country_code) AS\
        \ n_customer_countries,\n  SUM(CASE WHEN s.channel = 'online' THEN 1 ELSE 0 END) AS online_lines,\n\
        \  COUNT(*) AS total_lines\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_store\
        \ AS st\n  ON s.store_key = st.store_key\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key\
        \ = c.customer_key\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\n\
        GROUP BY\n  p.product_key,\n  p.product_name\n\n-- step 4\nWITH per_product AS (\n  SELECT\n \
        \   p.product_key,\n    p.product_name,\n    COUNT(DISTINCT CASE WHEN st.country_code <> '--'\
        \ THEN st.country_code END) AS n_store,\n    MIN(CASE WHEN st.country_code <> '--' THEN st.country_code\
        \ END) AS store_cc,\n    COUNT(DISTINCT c.country_code) AS n_cust,\n    MIN(c.country_code) AS\
        \ cust_cc,\n    SUM(CASE WHEN s.channel = 'online' THEN 1 ELSE 0 END) AS online_lines\n  FROM\
        \ contoso_served.v_contoso5_sales_line AS s\n  JOIN contoso_served.dim_store AS st\n    ON s.store_key\
        \ = st.store_key\n  JOIN contoso_served.dim_customer AS c\n    ON s.customer_key = c.customer_key\n\
        \  JOIN contoso_served.dim_product AS p\n    ON s.product_key = p.product_key\n  GROUP BY\n  \
        \  p.product_key,\n    p.product_name\n)\nSELECT\n  'store (web set aside)' AS reading,\n  product_key,\n\
        \  product_name,\n  store_cc AS country_code,\n  n_store AS countries\nFROM per_product\nWHERE\n\
