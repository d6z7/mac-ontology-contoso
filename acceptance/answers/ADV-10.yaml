    then the products whose count is exactly one, each beside the single country it was sold in. The claimed
    answer is not one table but the choice between three, because the count of countries per product depends
    on which country column is read: 20 product-and-country rows by the selling shop''s country, the identical
    20 by the shop''s site country, 4 rows by the buyer''s country, and 1 row by the selling shop''s country
    when a web sale is held to be a sale somewhere else. The figure in each row, "how many countries it
    was sold in", is 1 by construction — it is the test that selected the row, not an independent measurement,
    and that is the one column in the requested output that carries no information. What I did NOT include:
    no period restriction, no channel restriction, no product rollup, and no money or units figure of
    any kind — the only quantity here is a count of distinct countries per product.'
