        \    MIN(c.country_code) AS cust_cc,\n    SUM(CASE WHEN s.channel = 'online' THEN 1 ELSE 0 END)\
        \ AS online_lines\n  FROM contoso_served.v_contoso5_sales_line AS s\n  JOIN contoso_served.dim_store\
