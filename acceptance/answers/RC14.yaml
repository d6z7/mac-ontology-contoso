  what_it_calculated: 'The row I got back holds the two figures the question can mean and the distance
    between them, and it matches what I predicted before running it. Both numbers count PEOPLE, not orders
    or purchases: individuals on Contoso''s customer register who had completed between 25 and 44 years
    of life on 10 December 2022, both ends of the band counted in, each person''s age worked out from
    their own date of birth against that one day. 31,586 is all of them — everyone the register has ever
    held, out of 104,990 people, with the date used only to fix how old each one was. 24,787 is the narrower
    set whose register record was actually in force on that day. 6,799 is the first minus the second:
    people who were the right age on that date but whose customer record had closed before it. What neither
    figure includes: no filter on whether the person ever bought anything, none on country, gender, continent,
    state or channel, and no sales data in the count at all — the sales table was read once, separately,
    purely to test whether the record window carries meaning, and it contributed no row to either number.'
