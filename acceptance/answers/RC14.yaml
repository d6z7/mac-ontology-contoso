    claimed: 'Did you want everyone who has ever been on the customer register, or only the people who
      were actually customers on 10 December 2022? — (a) "Count everyone on the customer list, using their
      age as it was on that date": 31,586 customers. (b) "Count only people who were customers on that
      date, using their age on that date": 24,787 customers. The gap is 6,799 people who were aged 25-44
      on that day but whose register record had already closed before it. I tried to settle this and could
      not: the record window looked at first like bookkeeping noise, but across all 223,974 sales not
      one purchase was ever made after a buyer''s record closed, and the last order from any of those
      6,799 was 25 November 2022 — so the window behaves like a genuine membership period, which makes
      (b) a serious reading. Against that, the ontology defines a Customer as the register of 104,990
      people and declares nothing about reading that register as of a date, which makes (a) a serious
      reading. Tell me which and I will hand you the single number. WHAT YOUR CHOICE DOES NOT CHANGE:
      reading the date as 12 October 2022 instead of 10 December moves (a) by 2 people and (b) by 98,
      so the day.month ordering genuinely does not matter here; counting age by birth year instead of
      completed years moves (a) by 24 and (b) by 20; and reading "between 25 and 44" as excluding its
      ends gives 28,328 and 22,202 — lower on both, but it does not decide between them.'
    shape: I will not choose
    answered_population: Both figures were computed over contoso_served.dim_customer restricted to the
      31,586 people who had completed 25 to 44 years of life on 10 December 2022 — that age band applied
      to the full 104,990-row register established at step 1, with no other restriction of any kind. Within
      that band, 31,586 is every one of them and 24,787 is the subset whose `valid_from`/`valid_to` window
      covers 10 December 2022; that window is the only difference between the two numbers. I applied no
      purchase filter, no country, gender, continent or channel filter, and no join to sales — the sales
