        104,990 people and declares nothing about reading that register as of a date, which makes (a)
        a serious reading. Tell me which and I will hand you the single number. WHAT YOUR CHOICE DOES
        NOT CHANGE: reading the date as 12 October 2022 instead of 10 December moves (a) by 2 people and
        (b) by 98, so the day.month ordering genuinely does not matter here; counting age by birth year
        instead of completed years moves (a) by 24 and (b) by 20; and reading "between 25 and 44" as excluding
        its ends gives 28,328 and 22,202 — lower on both, but it does not decide between them.'
