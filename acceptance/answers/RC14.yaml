sql:
- "SELECT\n  COUNT(*) AS everyone_on_the_register_aged_25_to_44,\n  COUNT(*) FILTER(WHERE\n    was_a_customer_on_the_day)\
  \ AS customers_on_that_day_aged_25_to_44,\n  COUNT(*) FILTER(WHERE\n    NOT was_a_customer_on_the_day)\
  \ AS difference_had_already_left_the_register\nFROM (\n  SELECT\n    (\n      valid_from <= CAST('2022-12-10'\
  \ AS DATE)\n      AND valid_to >= CAST('2022-12-10' AS DATE)\n    ) AS was_a_customer_on_the_day\n \
  \ FROM contoso_served.dim_customer\n  WHERE\n    DATE_PART('year', AGE(CAST('2022-12-10' AS DATE), birth_date))\
  \ BETWEEN 25 AND 44\n) AS t"
- "SELECT\n  customer_key,\n  birth_date,\n  valid_from,\n  valid_to,\n  country_code,\n  continent,\n\
  \  state,\n  gender\nFROM contoso_served.dim_customer"
- "SELECT\n  customer_key,\n  birth_date,\n  (\n    valid_from <= CAST('2022-12-10' AS DATE)\n    AND\
  \ valid_to >= CAST('2022-12-10' AS DATE)\n  ) AS was_a_customer_on_the_day\nFROM contoso_served.dim_customer"
- "SELECT\n  customer_key,\n  birth_date,\n  (\n    valid_from <= CAST('2022-12-10' AS DATE)\n    AND\
  \ valid_to >= CAST('2022-12-10' AS DATE)\n  ) AS was_a_customer_on_the_day\nFROM contoso_served.dim_customer\n\
  WHERE\n  DATE_PART('year', AGE(CAST('2022-12-10' AS DATE), birth_date)) BETWEEN 25 AND 44"
answer_sql: "SELECT\n  COUNT(*) AS everyone_on_the_register_aged_25_to_44,\n  COUNT(*) FILTER(WHERE\n\
  \    was_a_customer_on_the_day) AS customers_on_that_day_aged_25_to_44,\n  COUNT(*) FILTER(WHERE\n \
  \   NOT was_a_customer_on_the_day) AS difference_had_already_left_the_register\nFROM (\n  SELECT\n \
  \   (\n      valid_from <= CAST('2022-12-10' AS DATE)\n      AND valid_to >= CAST('2022-12-10' AS DATE)\n\
  \    ) AS was_a_customer_on_the_day\n  FROM contoso_served.dim_customer\n  WHERE\n    DATE_PART('year',\
  \ AGE(CAST('2022-12-10' AS DATE), birth_date)) BETWEEN 25 AND 44\n) AS t"
