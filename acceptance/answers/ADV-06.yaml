sql:
- 'SELECT dim_contoso_customer.Country, dim_contoso_calendar_day.Year, SUM(f."Quantity"
  * f."NetPrice")     AS net_sales_amount

  FROM contoso_served.v_contoso_order_line f

  JOIN contoso_served.dim_contoso_customer ON f.CustomerKey = dim_contoso_customer.CustomerKey

  JOIN contoso_served.dim_contoso_calendar_day ON f.OrderDate = dim_contoso_calendar_day.Date

  GROUP BY dim_contoso_customer.Country, dim_contoso_calendar_day.Year'
