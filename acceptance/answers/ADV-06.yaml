  assumptions:
  - kind: dq
    text: Every line carries a positive quantity, so no line contributes a negative
      net amount (Measured 0 of 223 974 rows on 2026-09-18. There is no returns or
      credit-note relation in this delivery, so a negative sale is not representable
      — an important limit, not a guarantee of correctness.)
    ref: concept://example/contoso/NetSalesAmount
  - kind: dq
    text: 'The calendar is gapless — one row per day across its whole span (Measured
      4 018 rows over a 4 018-day span, difference 0, on 2026-09-18. ERROR because
      the fact''s equality join to this dimension assumes it: a missing day would
      drop every line placed on it with no error anywhere.)'
    ref: concept://example/contoso/CalendarDay
  - kind: dq
    text: Both fact date roles fall entirely on the calendar (Measured 0 of 223 974
      lines on each role, total 0, on 2026-09-18. The second role reaches 2026-01-06,
      six days past the last order, so the calendar's forward extent is load-bearing
      for the delivery role and not merely generous.)
    ref: concept://example/contoso/CalendarDay
  - kind: dq
    text: WorkingDay is boolean in fact, whatever its declared type (Measured 0 of
      4 018 rows on 2026-09-18.)
    ref: concept://example/contoso/CalendarDay
  - kind: dq
    text: Country determines Continent — the roll-up is a function, not a many-to-many
      (Measured 0 of 8 countries on 2026-09-18. ERROR because a country on two continents
      would make every continent figure double-count silently, and this is the only
      relation that can answer a continent question at all.)
    ref: concept://example/contoso/Customer
  - kind: dq
    text: 'The dimension is not versioned — one row per customer (Measured 0 on 2026-09-18
      (104 990 = 104 990). Held as a constraint because StartDT / EndDT are served:
      the moment a second row per key arrives, every join to this dimension fans out
      and the shape becomes the store dimension''s (SCD-2), which needs a snapshot
      collapse this concept deliberately does not declare. See CUS-Q1.)'
    ref: concept://example/contoso/Customer
  - kind: dq
    text: Every store country except the sentinel is a country the customer dimension
      knows (Measured 0 on 2026-09-18. This is what lets the two roles be compared
      at country level at all, and what makes the '--' sentinel the single exception
      rather than one of several.)
    ref: concept://example/contoso/Country
