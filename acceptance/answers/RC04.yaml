answer: 'Which customers do you mean — everyone on the register, or only the ones who have actually bought
  something? (a) Everyone on our customer register, including people who have never placed an order: 104,990.
  (b) Only customers who have ever bought from us, with at least one order on record: 52,189. I am not
  picking for you, because this is not a rounding difference — fewer than half the register has ever ordered,
  and the Customer concept''s own definition warns that "the register is not the buyer list". Whichever
  you pick, three things do NOT change: each person is counted exactly once either way, since the register
  holds one row per customer and nobody is double-counted despite the record-history columns; no date
  matters, because neither figure moves whether you ask as of today or as of any earlier point; and (b)
  is a clean subset of (a), so there is no third population hiding between them — the 52,801 difference
  is precisely the people who have never ordered.'
