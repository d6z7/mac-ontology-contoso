sql:
- "SELECT\n  DATE_TRUNC('MONTH', sl.order_date) AS month,\n  SUM(sl.net_amount) AS revenue\nFROM contoso_served.v_contoso5_sales_line\
  \ AS sl\nJOIN contoso_served.dim_country AS c\n  ON sl.sale_country_code = c.country_code\nWHERE\n \
  \ c.country_name = 'Germany'\n  AND sl.channel = 'online'\n  AND sl.order_date BETWEEN CAST('2024-01-01'\
  \ AS DATE) AND CAST('2024-12-31' AS DATE)\nGROUP BY\n  DATE_TRUNC('MONTH', sl.order_date)\nORDER BY\n\
  \  month"
- "SELECT\n  *\nFROM contoso_served.v_contoso5_sales_line"
