          "0.00", "lines_customer_de": 2905, "revenue_customer_de": "2428570.52", "lines_location_de":
          0, "revenue_location_de": "0.00"}, {"channel": "physical", "lines_in_channel": 14922, "lines_store_de":
          1812, "revenue_store_de": "1540736.67", "lines_customer_de": 1812, "revenue_customer_de": "1540736.67",
          "lines_location_de": 1812, "revenue_location_de": "1540736.67"}]'
      - why: 'THIS CHANGES THE QUESTION: the document assumed Germany meant "the country of the business
          recorded on the sale", and that reading returns 0.00 over 0 lines for the Internet shop — the
