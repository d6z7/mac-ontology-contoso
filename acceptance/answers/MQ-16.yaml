sql:
- "WITH g AS (\n  SELECT\n    l.order_date,\n    l.net_amount\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS l\n  JOIN contoso_served.dim_customer AS cu\n    ON l.customer_key = cu.customer_key\n  JOIN contoso_served.dim_country\
  \ AS c\n    ON cu.country_code = c.country_code\n  WHERE\n    c.country_name = 'Germany'\n    AND l.channel\
  \ = 'online'\n    AND l.order_date >= CAST('2024-01-01' AS DATE)\n    AND l.order_date < CAST('2025-01-01'\
  \ AS DATE)\n)\nSELECT\n  STRFTIME(order_date, '%Y-%m') AS month,\n  ROUND(SUM(net_amount), 2) AS revenue\n\
  FROM g\nGROUP BY\n  1\nORDER BY\n  month ASC"
- "SELECT\n  order_key,\n  line_number,\n  order_date,\n  store_key,\n  channel,\n  customer_key,\n  net_amount\n\
  FROM contoso_served.v_contoso5_sales_line"
- "SELECT\n  l.order_key,\n  l.line_number,\n  l.order_date,\n  l.channel,\n  l.store_key,\n  l.customer_key,\n\
  \  l.net_amount\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_customer AS\
  \ cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country AS c\n  ON cu.country_code\
  \ = c.country_code\nWHERE\n  c.country_name = 'Germany'"
- "SELECT\n  l.order_key,\n  l.line_number,\n  l.order_date,\n  l.channel,\n  l.store_key,\n  l.customer_key,\n\
  \  l.net_amount\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_customer AS\
  \ cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country AS c\n  ON cu.country_code\
  \ = c.country_code\nWHERE\n  c.country_name = 'Germany' AND l.channel = 'online'"
- "SELECT\n  l.order_key,\n  l.line_number,\n  l.order_date,\n  l.net_amount\nFROM contoso_served.v_contoso5_sales_line\
  \ AS l\nJOIN contoso_served.dim_customer AS cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
  \ AS c\n  ON cu.country_code = c.country_code\nWHERE\n  c.country_name = 'Germany'\n  AND l.channel\
  \ = 'online'\n  AND l.order_date >= CAST('2024-01-01' AS DATE)\n  AND l.order_date < CAST('2025-01-01'\
