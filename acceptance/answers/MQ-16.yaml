          "net_revenue": "218814471.66"}]'
      settled_on: "SELECT\n  order_key,\n  line_number,\n  order_date,\n  store_key,\n  channel,\n  customer_key,\n\
        \  net_amount\nFROM contoso_served.v_contoso5_sales_line"
      means: 'One row per line of one order — 223,974 of them — each carrying the money that line actually
        took from the customer after discount, in USD, together with the day the order was placed, which
        channel it came through, which store rang it up and who bought it. Summed whole, that is 218,814,471.66
        USD of net revenue over every order from 2016-05-18 to 2025-12-31, both channels and all countries.
        This is the unnarrowed pool: nothing has yet been restricted to Germany, to the Internet shop
        or to 2024.'
      readings_taken:
      - word: revenue
        took: net_amount — what the customer was actually charged, after discount, in USD; reported as
          NET
        could_also_mean: gross_amount, the list value before discount (the gap between them is the discount)
        declaration: net_revenue.default.revenue_means_net — a question saying "revenue" without saying
          net or gross is answered on net_amount and must say NET
      - word: the period column
        took: order_date, so 2024 will mean orders placed in 2024
        could_also_mean: delivery_date — which moves revenue between periods without changing the total,
          and deliveries run to 2026-01-06
        declaration: order.default.period_is_order_date, default `ordered`
      - word: the unit of the amounts
        took: USD on every line regardless of currency_code
        could_also_mean: the currency each sale was transacted in — but currency_code is the transaction
          currency, not the unit of the figure
