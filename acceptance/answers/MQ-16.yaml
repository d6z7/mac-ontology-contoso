        \    END\n  ) AS lines_by_order_date,\n  ROUND(\n    SUM(\n      CASE\n        WHEN order_date\
        \ >= CAST('2024-01-01' AS DATE)\n        AND order_date < CAST('2025-01-01' AS DATE)\n       \
