          all three side by side and split by channel — because the Internet shop''s store row carries
          the ''--'' sentinel, I expect the store and location readings to vanish on exactly the channel
          this question asks for.'
        did: "WITH de AS (\n  SELECT\n    country_code\n  FROM contoso_served.dim_country\n  WHERE\n \
          \   country_name ILIKE '%german%'\n), base AS (\n  SELECT\n    l.net_amount,\n    l.channel,\n\
          \    ds.country_code AS store_cc,\n    cu.country_code AS cust_cc,\n    dl.country_code AS loc_cc\n\
          \  FROM contoso_served.v_contoso5_sales_line AS l\n  LEFT JOIN contoso_served.dim_store AS ds\n\
          \    ON l.store_key = ds.store_key\n  LEFT JOIN contoso_served.dim_customer AS cu\n    ON l.customer_key\
          \ = cu.customer_key\n  LEFT JOIN contoso_served.dim_location AS dl\n    ON ds.location_code\
          \ = dl.location_code\n  WHERE\n    l.order_date >= CAST('2024-01-01' AS DATE)\n    AND l.order_date\
          \ < CAST('2025-01-01' AS DATE)\n)\nSELECT\n  channel,\n  COUNT(*) AS lines_in_channel,\n  COUNT(CASE\
          \ WHEN store_cc IN (\n    SELECT\n      country_code\n    FROM de\n  ) THEN 1 END) AS lines_store_de,\n\
          \  ROUND(\n    SUM(\n      CASE\n        WHEN store_cc IN (\n          SELECT\n            country_code\n\
          \          FROM de\n        )\n        THEN net_amount\n        ELSE 0\n      END\n    ),\n\
          \    2\n  ) AS revenue_store_de,\n  COUNT(CASE WHEN cust_cc IN (\n    SELECT\n      country_code\n\
          \    FROM de\n  ) THEN 1 END) AS lines_customer_de,\n  ROUND(\n    SUM(\n      CASE\n      \
          \  WHEN cust_cc IN (\n          SELECT\n            country_code\n          FROM de\n      \
          \  )\n        THEN net_amount\n        ELSE 0\n      END\n    ),\n    2\n  ) AS revenue_customer_de,\n\
          \  COUNT(CASE WHEN loc_cc IN (\n    SELECT\n      country_code\n    FROM de\n  ) THEN 1 END)\
          \ AS lines_location_de,\n  ROUND(\n    SUM(\n      CASE\n        WHEN loc_cc IN (\n        \
          \  SELECT\n            country_code\n          FROM de\n        )\n        THEN net_amount\n\
          \        ELSE 0\n      END\n    ),\n    2\n  ) AS revenue_location_de\nFROM base\nGROUP BY\n\
          \  channel\nORDER BY\n  channel"
