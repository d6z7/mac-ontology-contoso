    one order — one single number, over all time, where revenue is the revenue from those ordering customers'
    orders. Customers with no orders are excluded from both the count and the revenue.
  population_actually_answered: '218,814,471.66 of net_amount summed over all 223,974 rows of contoso_served.v_contoso5_sales_line
    — the whole sales fact, with no period and no channel predicate — divided by the 52,189 customers
    of contoso_served.dim_customer holding at least one distinct order_key. The restrictions I applied,
    and where each came from: (1) customers cut to those with at least one order, because the question
    says "active customer" and the document''s reading of it is anyone who has ever ordered — this drops
    52,801 of the 104,990 registered customers; (2) no channel filter, because store.resolution.the_channel_is_the_location_sentinel
    carries applies: subject and this question''s subject is a measure, so the web shop''s 86,790,054.13
    is in alongside the shops'' 132,024,417.53; (3) no period filter, by order.default.an_unscoped_question_covers_all_time,
    giving the full extent 2016-05-18 to 2025-12-31; (4) net_amount rather than gross_amount, by net_revenue.default.revenue_means_net.
