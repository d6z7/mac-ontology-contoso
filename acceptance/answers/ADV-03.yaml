- id: what_it_calculated
  title: What it says its rows are
  subtitle: ''
  status: ok
  body:
    kind: prose
    value: 'For each of the 8 countries Contoso''s customers live in, the average amount one customer
      there has spent with Contoso over the entire ten years on record, after discount — stated twice
      because the divisor is genuinely ambiguous. Under Reading A a row is the average lifetime spend
      of a person who bought at least once; under Reading B it is the same money spread across every name
      on that country''s register, so it reads as revenue per registered name and comes out roughly half
      as large. Each row stands for one country, with internet purchases counted to the buyer''s home
      country rather than to a channel with no country. WHAT I DID NOT INCLUDE: no period restriction
      (all ten years, not this year or the last twelve months), no channel restriction (the web shop is
      in), no gross figure (these are net), no per-order or per-line view (this is per PERSON), and no
      listing of individual customers (these are 8 country averages, not 52,189 customer rows).'
- id: rows
  title: What the warehouse returned at the answer step
  subtitle: READ WHOLE — the answer step reads at ANSWER_CAP, not the probe cap
  status: ok
  body:
    kind: rows
    value:
      columns: *id007
      rows: *id004
      row_count: 8
      capped: false
- id: answer
  title: The answer it claimed
  subtitle: ''
  status: ok
  body:
    kind: pairs
    value:
    - - claimed
      - 'Which "per customer" do you mean — per person who actually bought, or per name on the customer
        register? Both are computed in full below; they differ by about half on every row, and no rule
        in this bundle chooses, so I am not picking for you.


        READING A — per BUYER (each country''s revenue ÷ the people there who bought at least once; 52,189
        buyers):

        United States 4,505.30 · Germany 4,437.83 · Canada 4,313.67 · Netherlands 3,877.17 · United Kingdom
        3,738.77 · Italy 3,564.05 · France 3,350.77 · Australia 3,347.70


        READING B — per REGISTERED CUSTOMER (the same revenue ÷ everyone on that country''s register,
        including the 52,801 who never ordered; 104,990 people):

        United States 2,475.76 · Germany 2,468.57 · Canada 2,298.69 · Netherlands 1,918.45 · United Kingdom
        1,559.40 · France 1,368.05 · Australia 1,321.79 · Italy 1,303.61


        WHAT YOUR CHOICE DOES NOT CHANGE: the winner and the whole top five, in the same order — United
        States, Germany, Canada, Netherlands, United Kingdom. It moves only places 6 to 8: Italy is 6th
        on A but LAST on B, because just 36.6% of registered Italians ever bought against 55.6% of Germans.
        France and Australia swap 7th and 8th.


        TWO NEAR-TIES ON EITHER READING: the US lead over Germany is 1.5% on A and only 0.3% on B, so
        "highest" is near a dead heat. On A, France (3,350.77) and Australia (3,347.70) differ by 3.07
        — 0.09% — so their 7th/8th order is not a real difference.


        FIXED WHICHEVER YOU PICK: revenue is NET of discount, totalling 218,814,471.66 (gross is ~6.3%
        higher and reorders nothing); it covers all ten years on record, 2016-05-18 to 2025-12-31, because
        no period was named; it includes the web shop''s 86,790,054.13 as well as the physical shops;
        and each sale counts to where the BUYER lives, not where it was rung up. These are ten-year lifetime
        averages per person, not annual rates — a customer with forty orders counts once.'
    - - shape
      - I will not choose
    - - population it answered over
      - 'All 8 countries Contoso customers live in, computed over all 223,974 sales lines across the full
        order_date extent 2016-05-18 to 2025-12-31. Nothing excluded: no channel predicate (both physical
        shops and the web shop — store.resolution.the_channel_is_the_location_sentinel is scoped `applies:
        subject` and so cannot reach a measure question, and the operator''s 2026-10-18 ruling puts both
        channels in revenue), no date filter (order.default.an_unscoped_question_covers_all_time), no
        trading-state filter. The `--` sentinel is excluded per country.exclusion.sentinel_is_not_a_country
        but removes nothing, since no customer carries it. THE NUMERATOR IS IDENTICAL IN BOTH READINGS
        AND PROVEN COMPLETE: the 8 country totals sum to exactly 218,814,471.66, the declared all-channel
        net total, and their online share to exactly 86,790,054.13, the declared online total — so no
        sale is lost or double-counted. THE DIVISOR IS THE ONLY DIFFERENCE: Reading A divides by the 52,189
        customers appearing on at least one sales line; Reading B divides by all 104,990 on the register,
        adding the 52,801 who never ordered. I restricted to neither — that is the open question I am
        returning.'
