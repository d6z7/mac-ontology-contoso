sql:
- "SELECT\n  c.country_name,\n  SUM(s.net_amount) AS revenue,\n  COUNT(DISTINCT s.customer_key) AS customers,\n\
  \  SUM(s.net_amount) * 1.0 / COUNT(DISTINCT s.customer_key) AS revenue_per_customer\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_country AS c\n  ON s.sale_country_code = c.country_code\nWHERE\n  c.is_placeholder\
  \ = FALSE\nGROUP BY\n  c.country_name\nORDER BY\n  revenue_per_customer DESC"
- "SELECT\n  *\nFROM contoso_served.v_contoso5_sales_line"
- '(not run on its own: write this step inside the step that reads it)'
