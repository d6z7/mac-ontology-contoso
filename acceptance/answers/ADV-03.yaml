sql:
- "WITH rev AS (\n  SELECT\n    c.country_code,\n    SUM(s.net_amount) AS net_revenue,\n    COUNT(DISTINCT\
  \ s.customer_key) AS buyers\n  FROM contoso_served.v_contoso5_sales_line AS s\n  JOIN contoso_served.dim_customer\
  \ AS c\n    ON s.customer_key = c.customer_key\n  GROUP BY\n    c.country_code\n), reg AS (\n  SELECT\n\
  \    country_code,\n    COUNT(*) AS on_register\n  FROM contoso_served.dim_customer\n  GROUP BY\n  \
  \  country_code\n)\nSELECT\n  co.country_name AS country,\n  ROUND(rev.net_revenue / rev.buyers, 2)\
  \ AS revenue_per_buyer,\n  ROUND(rev.net_revenue / reg.on_register, 2) AS revenue_per_registered_customer\n\
  FROM rev\nJOIN reg\n  ON rev.country_code = reg.country_code\nJOIN contoso_served.dim_country AS co\n\
  \  ON rev.country_code = co.country_code\nORDER BY\n  rev.net_revenue / rev.buyers DESC"
- "SELECT\n  customer_key,\n  country_code\nFROM contoso_served.dim_customer"
- "SELECT\n  co.country_name,\n  c.country_code,\n  COUNT(DISTINCT c.customer_key) AS customers_on_register,\n\
  \  COUNT(DISTINCT s.customer_key) AS customers_with_sales\nFROM contoso_served.dim_customer AS c\nJOIN\
  \ contoso_served.dim_country AS co\n  ON c.country_code = co.country_code\nLEFT JOIN contoso_served.v_contoso5_sales_line\
  \ AS s\n  ON s.customer_key = c.customer_key\nWHERE\n  co.country_code <> '--'\nGROUP BY\n  co.country_name,\n\
  \  c.country_code\nORDER BY\n  co.country_name"
- "SELECT\n  co.country_name,\n  c.country_code,\n  SUM(s.net_amount) AS net_revenue,\n  SUM(s.gross_amount)\
  \ AS gross_revenue,\n  SUM(CASE WHEN s.channel = 'online' THEN s.net_amount ELSE 0 END) AS net_revenue_online,\n\
  \  COUNT(DISTINCT s.customer_key) AS customers_with_sales,\n  MIN(s.order_date) AS first_order,\n  MAX(s.order_date)\
  \ AS last_order\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS\
  \ c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_country AS co\n  ON c.country_code\
  \ = co.country_code\nGROUP BY\n  co.country_name,\n  c.country_code\nORDER BY\n  net_revenue DESC"
- "SELECT\n  co.country_name,\n  c.country_code,\n  COUNT(DISTINCT s.customer_key) AS customers_who_bought,\n\
  \  COUNT(DISTINCT c.customer_key) AS customers_on_register\nFROM contoso_served.dim_customer AS c\n\
  JOIN contoso_served.dim_country AS co\n  ON c.country_code = co.country_code\nLEFT JOIN contoso_served.v_contoso5_sales_line\
  \ AS s\n  ON s.customer_key = c.customer_key\nGROUP BY\n  co.country_name,\n  c.country_code\nORDER\
  \ BY\n  customers_who_bought DESC"
- "WITH rev AS (\n  SELECT\n    c.country_code,\n    SUM(s.net_amount) AS net_revenue,\n    COUNT(DISTINCT\
  \ s.customer_key) AS buyers\n  FROM contoso_served.v_contoso5_sales_line AS s\n  JOIN contoso_served.dim_customer\
  \ AS c\n    ON s.customer_key = c.customer_key\n  GROUP BY\n    c.country_code\n), reg AS (\n  SELECT\n\
  \    country_code,\n    COUNT(*) AS on_register\n  FROM contoso_served.dim_customer\n  GROUP BY\n  \
  \  country_code\n)\nSELECT\n  co.country_name,\n  ROUND(rev.net_revenue, 2) AS net_revenue,\n  rev.buyers,\n\
  \  reg.on_register,\n  ROUND(rev.net_revenue / rev.buyers, 2) AS per_buyer,\n  ROUND(rev.net_revenue\
  \ / reg.on_register, 2) AS per_registered,\n  RANK() OVER (ORDER BY rev.net_revenue / rev.buyers DESC)\
  \ AS rank_per_buyer,\n  RANK() OVER (ORDER BY rev.net_revenue / reg.on_register DESC) AS rank_per_registered\n\
  FROM rev\nJOIN reg\n  ON rev.country_code = reg.country_code\nJOIN contoso_served.dim_country AS co\n\
  \  ON rev.country_code = co.country_code\nORDER BY\n  per_buyer DESC"
- "WITH rev AS (\n  SELECT\n    c.country_code,\n    SUM(s.net_amount) AS net_revenue,\n    COUNT(DISTINCT\
  \ s.customer_key) AS buyers\n  FROM contoso_served.v_contoso5_sales_line AS s\n  JOIN contoso_served.dim_customer\
  \ AS c\n    ON s.customer_key = c.customer_key\n  GROUP BY\n    c.country_code\n), reg AS (\n  SELECT\n\
  \    country_code,\n    COUNT(*) AS on_register\n  FROM contoso_served.dim_customer\n  GROUP BY\n  \
  \  country_code\n)\nSELECT\n  co.country_name,\n  ROUND(rev.net_revenue / rev.buyers, 2) AS per_buyer,\n\
  \  ROUND(rev.net_revenue / reg.on_register, 2) AS per_registered\nFROM rev\nJOIN reg\n  ON rev.country_code\
  \ = reg.country_code\nJOIN contoso_served.dim_country AS co\n  ON rev.country_code = co.country_code\n\
  ORDER BY\n  rev.net_revenue / rev.buyers DESC"
