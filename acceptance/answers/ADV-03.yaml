  what_it_calculated: 'For each of the 8 countries Contoso''s customers live in, the average amount one
    customer there has spent with Contoso over the entire ten years on record, after discount — stated
    twice because the divisor is genuinely ambiguous. Under Reading A a row is the average lifetime spend
    of a person who bought at least once; under Reading B it is the same money spread across every name
    on that country''s register, so it reads as revenue per registered name and comes out roughly half
    as large. Each row stands for one country, with internet purchases counted to the buyer''s home country
    rather than to a channel with no country. WHAT I DID NOT INCLUDE: no period restriction (all ten years,
    not this year or the last twelve months), no channel restriction (the web shop is in), no gross figure
    (these are net), no per-order or per-line view (this is per PERSON), and no listing of individual
    customers (these are 8 country averages, not 52,189 customer rows).'
