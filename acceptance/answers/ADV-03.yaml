      register? Both are computed in full below; they differ by about half on every row, and no rule in
      this bundle chooses, so I am not picking for you.


      READING A — per BUYER (each country''s revenue ÷ the people there who bought at least once; 52,189
      buyers):

      United States 4,505.30 · Germany 4,437.83 · Canada 4,313.67 · Netherlands 3,877.17 · United Kingdom
      3,738.77 · Italy 3,564.05 · France 3,350.77 · Australia 3,347.70


      READING B — per REGISTERED CUSTOMER (the same revenue ÷ everyone on that country''s register, including
      the 52,801 who never ordered; 104,990 people):

      United States 2,475.76 · Germany 2,468.57 · Canada 2,298.69 · Netherlands 1,918.45 · United Kingdom
      1,559.40 · France 1,368.05 · Australia 1,321.79 · Italy 1,303.61


      WHAT YOUR CHOICE DOES NOT CHANGE: the winner and the whole top five, in the same order — United
      States, Germany, Canada, Netherlands, United Kingdom. It moves only places 6 to 8: Italy is 6th
      on A but LAST on B, because just 36.6% of registered Italians ever bought against 55.6% of Germans.
      France and Australia swap 7th and 8th.


      TWO NEAR-TIES ON EITHER READING: the US lead over Germany is 1.5% on A and only 0.3% on B, so "highest"
      is near a dead heat. On A, France (3,350.77) and Australia (3,347.70) differ by 3.07 — 0.09% — so
      their 7th/8th order is not a real difference.


      FIXED WHICHEVER YOU PICK: revenue is NET of discount, totalling 218,814,471.66 (gross is ~6.3% higher
      and reorders nothing); it covers all ten years on record, 2016-05-18 to 2025-12-31, because no period
      was named; it includes the web shop''s 86,790,054.13 as well as the physical shops; and each sale
      counts to where the BUYER lives, not where it was rung up. These are ten-year lifetime averages
      per person, not annual rates — a customer with forty orders counts once.'
