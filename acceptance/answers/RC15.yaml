sql:
- "SELECT\n  COUNT(DISTINCT s.product_key) AS different_products\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key = c.customer_key\nWHERE\n  c.country_code\
  \ = 'FR' AND s.order_date >= $q1_start AND s.order_date <= $q1_end"
- "SELECT\n  customer_key,\n  country_code,\n  continent,\n  state\nFROM contoso_served.dim_customer"
- "SELECT\n  customer_key\nFROM contoso_served.dim_customer\nWHERE\n  country_code = 'FR'"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.delivery_date,\n  s.customer_key,\n\
  \  s.product_key,\n  s.channel\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer\
  \ AS c\n  ON s.customer_key = c.customer_key\nWHERE\n  c.country_code = 'FR'"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.customer_key,\n  s.product_key\nFROM\
  \ contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key\
  \ = c.customer_key\nWHERE\n  c.country_code = 'FR' AND s.order_date >= $q1_start AND s.order_date <=\
  \ $q1_end"
- "SELECT DISTINCT\n  p.product_key,\n  p.product_code,\n  p.product_name,\n  p.brand,\n  p.color,\n \
  \ p.category_name,\n  p.sub_category_name\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer\
  \ AS c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
  \ = p.product_key\nWHERE\n  c.country_code = 'FR' AND s.order_date >= $q1_start AND s.order_date <=\
  \ $q1_end"
answer_sql: "SELECT\n  COUNT(DISTINCT s.product_key) AS different_products\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key = c.customer_key\nWHERE\n  c.country_code\
  \ = 'FR' AND s.order_date >= $q1_start AND s.order_date <= $q1_end"
