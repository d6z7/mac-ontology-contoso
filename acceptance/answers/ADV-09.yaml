sql:
- "SELECT\n  c.country_name,\n  AVG(order_total) AS avg_order_value\nFROM (\n  SELECT\n    s.sale_country_code,\n\
  \    s.order_key,\n    SUM(s.net_amount) AS order_total\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS s\n  GROUP BY\n    s.sale_country_code,\n    s.order_key\n) AS o\nJOIN contoso_served.dim_country\
  \ AS c\n  ON o.sale_country_code = c.country_code\nWHERE\n  c.is_placeholder = FALSE\nGROUP BY\n  c.country_name\n\
  HAVING\n  AVG(order_total) > 500\nORDER BY\n  avg_order_value DESC"
- "SELECT\n  *\nFROM contoso_served.v_contoso5_sales_line"
