    averages if the country means the shop that sold it, and what it averages if the country means where
    the buyer lives. Both are the average value of a single order after discount, in USD, across all ten
    years of orders on record. The table does NOT give one reconciled figure per country, because averaging
    the two readings or picking between them silently is precisely what the governing ruling prohibits;
    and nothing here is restricted by order status, converted out of USD, limited to a date window, or
    filtered by a minimum order count.'
