  population_actually_answered: 'No single figure is claimed, so there are two populations and neither
    is offered as THE answer. (A) the shop reading: 54,502 orders, each rung up at a physical shop sited
    in one of the 8 real countries — EXCLUDING 38,968 online orders, because the web shop''s store and
    site country is the ''--'' sentinel and country.exclusion.sentinel_is_not_a_country forbids reporting
    it as a ninth country; these 8 country totals sum to 132,024,417.5, matching the declared physical-channel
    figure. (B) the buyer reading: all 93,470 orders, none excluded, each attributed to the country its
    customer lives in; these 8 country totals sum to 218,814,471.66, matching the declared both-channel
    figure to the cent. Common to both, and verified on these rows: the grain is the order (distinct order_key,
    93,470 behind 223,974 lines, each order carrying exactly one customer, store and date), the money
    is net_amount after discount in USD, the period is the full extent of order_date 2016-05-18 to 2025-12-31
    with no date limit, both channels are in scope as populations (no `physical` subject-default applied,
    the subject being a measure and not a Store), and NO order is dropped for being cancelled, refunded
    or unpaid — not by my choice but because this bundle records no status, payment or refund column at
    all. The ''--'' sentinel is excluded from the country list under both readings, and no minimum-order-count
    floor was imposed; none was needed, the thinnest base being France''s 1,638 orders.'
