sql:
- "WITH ord AS (\n  SELECT\n    l.order_key,\n    s.country_code AS store_cc,\n    c.country_code AS cust_cc,\n\
  \    SUM(l.net_amount) AS order_value\n  FROM contoso_served.v_contoso5_sales_line AS l\n  JOIN contoso_served.dim_store\
  \ AS s\n    ON l.store_key = s.store_key\n  JOIN contoso_served.dim_customer AS c\n    ON l.customer_key\
  \ = c.customer_key\n  GROUP BY\n    l.order_key,\n    s.country_code,\n    c.country_code\n), shop AS\
  \ (\n  SELECT\n    store_cc AS cc,\n    COUNT(*) AS orders,\n    AVG(order_value) AS aov\n  FROM ord\n\
  \  WHERE\n    store_cc <> '--'\n  GROUP BY\n    store_cc\n  HAVING\n    AVG(order_value) > 500\n), buyer\
  \ AS (\n  SELECT\n    cust_cc AS cc,\n    COUNT(*) AS orders,\n    AVG(order_value) AS aov\n  FROM ord\n\
  \  WHERE\n    cust_cc <> '--'\n  GROUP BY\n    cust_cc\n  HAVING\n    AVG(order_value) > 500\n)\nSELECT\n\
  \  d.country_name AS country,\n  s.orders AS orders_if_country_means_the_shop,\n  ROUND(s.aov, 2) AS\
  \ avg_order_value_if_country_means_the_shop,\n  b.orders AS orders_if_country_means_the_buyer,\n  ROUND(b.aov,\
  \ 2) AS avg_order_value_if_country_means_the_buyer\nFROM shop AS s\nFULL OUTER JOIN buyer AS b\n  ON\
  \ s.cc = b.cc\nJOIN contoso_served.dim_country AS d\n  ON d.country_code = COALESCE(s.cc, b.cc)\nORDER\
  \ BY\n  avg_order_value_if_country_means_the_buyer DESC"
- "SELECT\n  order_key,\n  customer_key,\n  store_key,\n  channel,\n  order_date,\n  SUM(net_amount) AS\
  \ order_value\nFROM contoso_served.v_contoso5_sales_line\nGROUP BY\n  order_key,\n  customer_key,\n\
  \  store_key,\n  channel,\n  order_date"
- "SELECT\n  o.order_key,\n  o.order_value,\n  s.country_code AS store_country_code,\n  c.country_code\
  \ AS customer_country_code\nFROM (\n  SELECT\n    order_key,\n    customer_key,\n    store_key,\n  \
  \  SUM(net_amount) AS order_value\n  FROM contoso_served.v_contoso5_sales_line\n  GROUP BY\n    order_key,\n\
  \    customer_key,\n    store_key\n) AS o\nJOIN contoso_served.dim_store AS s\n  ON o.store_key = s.store_key\n\
  JOIN contoso_served.dim_customer AS c\n  ON o.customer_key = c.customer_key"
- "WITH ord AS (\n  SELECT\n    o.order_key,\n    s.country_code AS store_country_code,\n    c.country_code\
  \ AS customer_country_code,\n    SUM(l.net_amount) AS order_value\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS l\n  JOIN contoso_served.dim_store AS s\n    ON l.store_key = s.store_key\n  JOIN contoso_served.dim_customer\
  \ AS c\n    ON l.customer_key = c.customer_key\n  JOIN (\n    SELECT DISTINCT\n      order_key\n   \
  \ FROM contoso_served.v_contoso5_sales_line\n  ) AS o\n    ON l.order_key = o.order_key\n  GROUP BY\n\
  \    o.order_key,\n    s.country_code,\n    c.country_code\n)\nSELECT\n  'store' AS country_reading,\n\
  \  d.country_name,\n  COUNT(*) AS orders,\n  ROUND(AVG(order_value), 2) AS avg_order_value\nFROM ord\n\
  JOIN contoso_served.dim_country AS d\n  ON ord.store_country_code = d.country_code\nWHERE\n  ord.store_country_code\
  \ <> '--'\nGROUP BY\n  d.country_name\nUNION ALL\nSELECT\n  'customer',\n  d.country_name,\n  COUNT(*),\n\
  \  ROUND(AVG(order_value), 2)\nFROM ord\nJOIN contoso_served.dim_country AS d\n  ON ord.customer_country_code\
  \ = d.country_code\nWHERE\n  ord.customer_country_code <> '--'\nGROUP BY\n  d.country_name\nORDER BY\n\
  \  country_reading,\n  avg_order_value DESC"
- "WITH ord AS (\n  SELECT\n    l.order_key,\n    s.country_code AS store_country_code,\n    c.country_code\
  \ AS customer_country_code,\n    SUM(l.net_amount) AS order_value\n  FROM contoso_served.v_contoso5_sales_line\
  \ AS l\n  JOIN contoso_served.dim_store AS s\n    ON l.store_key = s.store_key\n  JOIN contoso_served.dim_customer\
  \ AS c\n    ON l.customer_key = c.customer_key\n  GROUP BY\n    l.order_key,\n    s.country_code,\n\
  \    c.country_code\n)\nSELECT\n  'store' AS country_reading,\n  d.country_name,\n  COUNT(*) AS orders,\n\
  \  ROUND(AVG(order_value), 2) AS avg_order_value\nFROM ord\nJOIN contoso_served.dim_country AS d\n \
  \ ON ord.store_country_code = d.country_code\nWHERE\n  ord.store_country_code <> '--'\nGROUP BY\n  d.country_name\n\
  HAVING\n  AVG(order_value) > 500\nUNION ALL\nSELECT\n  'customer',\n  d.country_name,\n  COUNT(*),\n\
  \  ROUND(AVG(order_value), 2)\nFROM ord\nJOIN contoso_served.dim_country AS d\n  ON ord.customer_country_code\
  \ = d.country_code\nWHERE\n  ord.customer_country_code <> '--'\nGROUP BY\n  d.country_name\nHAVING\n\
  \  AVG(order_value) > 500\nORDER BY\n  country_reading,\n  avg_order_value DESC"
