sql:
- 'SELECT meta_concept.name, COUNT(DISTINCT meta_open_question.question_id) AS openquestion

  FROM contoso_served.meta_open_question

  JOIN contoso_served.meta_concept ON contoso_served.meta_concept.concept_id = contoso_served.meta_open_question.concept_id

  WHERE meta_open_question.question_id > :openquestion

  GROUP BY meta_concept.name'
