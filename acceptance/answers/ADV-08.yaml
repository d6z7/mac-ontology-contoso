sql:
- "SELECT\n  c.country_name,\n  SUM(s.net_amount) / COUNT(DISTINCT s.order_key) AS average_order_value\n\
  FROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_country AS c\n  ON s.sale_country_code\
  \ = c.country_code\nGROUP BY\n  c.country_name\nORDER BY\n  average_order_value DESC"
- "SELECT\n  *\nFROM contoso_served.v_contoso5_sales_line"
