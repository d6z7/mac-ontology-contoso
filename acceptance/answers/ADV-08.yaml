answer: 'Which country do you mean — where the customer lives, or where the shop that took the order stood?
  There is no country written on an order itself, so one can only be reached by choosing, and the choice
  decides whether 38,968 internet orders are in the answer or absent from it.


  IF YOU MEAN WHERE THE CUSTOMER LIVES — all 93,470 orders counted, internet included (average order value,
  net, USD):

  Italy 2,459.71 · United Kingdom 2,413.06 · United States 2,356.13 · Germany 2,319.60 · Canada 2,307.13
  · Australia 2,288.96 · France 2,250.41 · Netherlands 2,204.90


  IF YOU MEAN WHERE THE SHOP STOOD — only the 54,502 orders rung up in a physical shop; the 38,968 web-shop
  orders (86,790,054.13 USD) belong to no country and drop out entirely:

  Italy 2,617.62 · United Kingdom 2,498.53 · United States 2,430.24 · Germany 2,427.47 · Canada 2,396.95
  · Australia 2,348.50 · France 2,272.68 · Netherlands 2,239.53


  WHAT THE CHOICE DOES NOT CHANGE: the league table. Both readings give the same eight countries in the
  same order — Italy highest, Netherlands lowest, United States third either way. Every store figure is
  simply higher than its customer counterpart, by 22.27 (France) to 157.91 (Italy), because the internet
  orders the store reading omits are cheaper on average (2,227.21) than shop orders. So if you want to
  know WHERE ORDERS ARE BIGGEST, you have your answer already and need not choose. If you want to quote
  a FIGURE, you must.


  ONE PLACE THE CHOICE BITES HARDER: the United States and Germany sit 36.53 apart under the customer
  reading but 2.77 apart under the store reading — effectively tied. Do not call that gap real without
  saying which reading produced it.'
