sql:
- "SELECT\n  co.country_name AS customer_country,\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\nFROM\
  \ contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key\
  \ = cu.customer_key\nJOIN contoso_served.dim_country AS co\n  ON cu.country_code = co.country_code\n\
  GROUP BY\n  co.country_name\nORDER BY\n  net_revenue DESC"
- "SELECT\n  order_key,\n  line_number,\n  customer_key,\n  order_date,\n  channel,\n  net_amount\nFROM\
  \ contoso_served.v_contoso5_sales_line"
- "SELECT\n  co.country_name AS customer_country,\n  s.net_amount\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
  \ AS co\n  ON cu.country_code = co.country_code"
- "SELECT\n  co.country_name AS customer_country,\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\nFROM\
  \ contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key\
  \ = cu.customer_key\nJOIN contoso_served.dim_country AS co\n  ON cu.country_code = co.country_code\n\
  GROUP BY\n  co.country_name"
answer_sql: "SELECT\n  co.country_name AS customer_country,\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\n\
  FROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key\
  \ = cu.customer_key\nJOIN contoso_served.dim_country AS co\n  ON cu.country_code = co.country_code\n\
  GROUP BY\n  co.country_name\nORDER BY\n  net_revenue DESC"
