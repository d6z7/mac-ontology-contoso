sql:
- "SELECT\n  c.country_name AS customer_country,\n  SUM(s.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
  \ AS c\n  ON cu.country_code = c.country_code\nWHERE\n  c.is_placeholder = FALSE\nGROUP BY\n  c.country_name\n\
  ORDER BY\n  net_revenue DESC"
