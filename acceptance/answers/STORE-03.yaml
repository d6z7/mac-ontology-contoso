answer: 'Did you mean how many SHOPS have been restructured, or how many TRADING PERIODS ended in a restructuring?
  — "shops that were rebuilt or replaced, counting a shop once however often it happened" is 6; "tenancies
  that ended in a restructuring, so a shop restructured twice counts twice" is 7. The entire difference
  is one shop: Contoso Store New Brunswick (site 7) was restructured twice, closing 2014-03-09 and again
  2018-02-02; the other five were restructured once each. WHAT THE CHOICE DOES NOT CHANGE: the shops involved
  are the same six either way — New Brunswick (CA), South Australia (AU), Mecklenburg-Vorpommern (DE),
  Delaware, North Dakota and Rhode Island (US). It is unaffected by the physical/online channel (every
  restructured row is a physical shop; the web shop carries no status), by any date window (none was named,
  so this covers all time, and nothing is recorded after 2018-02-02), and by open-versus-closed (restructured
  is a kind of closed, so the 57 trading shops are out under either reading). If you meant "how many restructurings
  have there been", that is also 7. I cannot pick for you: the Store concept''s grounding declares `counts
  store_key`, which is 7, while dim_store.location_code is declared "what a store is counted by" and dim_location.units_ever_here
  says "a site re-tenanted twice has three store rows and is one store", which is 6 — and the Store definition
  itself concedes that "one word came to name two grains".'
