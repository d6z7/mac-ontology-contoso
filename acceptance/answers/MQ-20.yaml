sql:
- "SELECT\n  AVG(DATE_DIFF('DAY', open_date, close_date)) AS avg_days_open,\n  AVG(DATE_DIFF('DAY', open_date,\
  \ close_date)) / 365.25 AS avg_years_open\nFROM contoso_served.dim_store\nWHERE\n  location_code <>\
  \ -1 AND NOT close_date IS NULL"
- "SELECT\n  store_key,\n  location_code,\n  store_name,\n  country_code,\n  open_date,\n  close_date,\n\
  \  status_annotation\nFROM contoso_served.dim_store\nWHERE\n  location_code <> -1\nORDER BY\n  store_key"
- "SELECT\n  store_key,\n  store_name,\n  country_code,\n  state,\n  open_date,\n  close_date,\n  status_annotation\n\
  FROM contoso_served.dim_store\nWHERE\n  location_code <> -1 AND NOT close_date IS NULL\nORDER BY\n \
  \ open_date"
- "SELECT\n  store_key,\n  store_name,\n  close_date\nFROM contoso_served.dim_store\nWHERE\n  location_code\
  \ <> -1 AND NOT close_date IS NULL\nORDER BY\n  close_date"
- "SELECT\n  store_key,\n  store_name,\n  open_date\nFROM contoso_served.dim_store\nWHERE\n  location_code\
  \ <> -1 AND NOT close_date IS NULL\nORDER BY\n  open_date"
- "SELECT\n  store_key,\n  store_name,\n  country_code,\n  status_annotation,\n  open_date,\n  close_date,\n\
  \  DATE_DIFF('DAY', open_date, close_date) AS days_open,\n  ROUND(DATE_DIFF('DAY', open_date, close_date)\
  \ / 365.25, 2) AS years_open\nFROM contoso_served.dim_store\nWHERE\n  location_code <> -1 AND NOT close_date\
  \ IS NULL\nORDER BY\n  days_open DESC"
answer_sql: "SELECT\n  AVG(DATE_DIFF('DAY', open_date, close_date)) AS avg_days_open,\n  AVG(DATE_DIFF('DAY',\
  \ open_date, close_date)) / 365.25 AS avg_years_open\nFROM contoso_served.dim_store\nWHERE\n  location_code\
  \ <> -1 AND NOT close_date IS NULL"
