          \nCombining two measures is decided by their UNITS (mac.aggregate.unit_algebra):\
          \ decide from the UNITS. COMPARE and DIFFERENCE require unit(a) == unit(b).\
          \ SUM of two measures requires the same unit AND the same additivity on\
          \ the folding axis. A RATIO is always defined and yields unit(a)/unit(b)\
          \ — dimensionless when they are equal, which is what makes a share meaningful.\
          \ A PRODUCT is defined when AT MOST ONE factor carries a substantive unit\
          \ and yields that unit — so money times a fraction is money, and money times\
          \ money is refused as meaningless. It is taken ROW BY ROW, before any fold,\
          \ and the PRODUCT's own unit and additivity decide whether the fold is legal\
          \ — never the factors'.\nSo a question asking for an AMOUNT where the vocabulary\
          \ offers only a RATE is answered by naming the quantity that rate applies\
          \ to — never by folding the rate itself.\n\n## Dimensions (valid slice/filter\
