sql:
- 'SELECT DISTINCT dim_contoso_calendar_day.Quarter, dim_contoso_customer.GeoAreaKey
  AS customer

  FROM contoso_served.v_contoso_order_line

  JOIN contoso_served.dim_contoso_customer ON v_contoso_order_line.CustomerKey = dim_contoso_customer.CustomerKey

  JOIN contoso_served.dim_contoso_calendar_day ON v_contoso_order_line.OrderDate =
  dim_contoso_calendar_day.Date

  WHERE v_contoso_order_line.OrderDate >= :period_start AND v_contoso_order_line.OrderDate
  < :period_end'
