sql:
- "SELECT\n  s.customer_key AS customer,\n  COUNT(DISTINCT QUARTER(s.order_date)) AS quarters_of_2025_bought_in\n\
  FROM contoso_served.v_contoso5_sales_line AS s\nWHERE\n  YEAR(s.order_date) = 2025\nGROUP BY\n  s.customer_key\n\
  HAVING\n  COUNT(DISTINCT QUARTER(s.order_date)) = 4\nORDER BY\n  s.customer_key"
