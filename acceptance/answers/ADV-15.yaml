sql:
- 'SELECT COUNT(DISTINCT dim_contoso_customer.CustomerKey) AS customer

  FROM contoso_served.dim_contoso_customer

  JOIN contoso_served.v_contoso_order_line ON v_contoso_order_line.CustomerKey = dim_contoso_customer.CustomerKey

  JOIN contoso_served.dim_contoso_product ON v_contoso_order_line.ProductKey = dim_contoso_product.ProductKey

  JOIN contoso_served.dim_contoso_store ON v_contoso_order_line.StoreKey = dim_contoso_store.StoreKey

  WHERE dim_contoso_product.Brand = :brand AND dim_contoso_store.StoreKey ne dim_contoso_customer.Country'
