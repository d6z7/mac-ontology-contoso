sql:
- "SELECT\n  COUNT(DISTINCT sl.customer_key) AS how_many_customers\nFROM contoso_served.v_contoso5_sales_line\
  \ AS sl\nJOIN contoso_served.dim_product AS p\n  ON sl.product_key = p.product_key\nJOIN contoso_served.dim_store\
  \ AS s\n  ON sl.store_key = s.store_key\nJOIN contoso_served.dim_customer AS c\n  ON sl.customer_key\
  \ = c.customer_key\nWHERE\n  p.brand = 'Contoso' AND s.is_online = FALSE AND s.country_code <> c.country_code"
- "SELECT\n  customer_key,\n  country_code\nFROM contoso_served.dim_customer"
