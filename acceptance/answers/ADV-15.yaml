sql:
- "SELECT\n  COUNT(DISTINCT s.customer_key) AS how_many_customers\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_product\
  \ AS p\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_store AS st\n  ON s.store_key =\
  \ st.store_key\nWHERE\n  p.brand = 'Contoso'\n  AND st.country_code <> '--'\n  AND st.country_code <>\
  \ c.country_code"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.customer_key,\n  s.store_key,\n  s.product_key,\n\
  \  c.country_code AS customer_country_code\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer\
  \ AS c\n  ON s.customer_key = c.customer_key"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.customer_key,\n  s.store_key,\n  s.product_key,\n\
  \  c.country_code AS customer_country_code\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer\
  \ AS c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
  \ = p.product_key\nWHERE\n  p.brand = 'Contoso'"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.customer_key,\n  s.store_key,\n  s.product_key,\n\
  \  c.country_code AS customer_country_code\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer\
  \ AS c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
  \ = p.product_key\nWHERE\n  p.brand = 'Contoso'"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.customer_key,\n  s.store_key,\n  c.country_code\
  \ AS customer_country_code,\n  st.country_code AS store_country_code\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_product\
  \ AS p\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_store AS st\n  ON s.store_key =\
  \ st.store_key\nWHERE\n  p.brand = 'Contoso'\n  AND st.country_code <> '--'\n  AND st.country_code <>\
  \ c.country_code"
answer_sql: "SELECT\n  COUNT(DISTINCT s.customer_key) AS how_many_customers\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS c\n  ON s.customer_key = c.customer_key\nJOIN contoso_served.dim_product\
  \ AS p\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_store AS st\n  ON s.store_key =\
  \ st.store_key\nWHERE\n  p.brand = 'Contoso'\n  AND st.country_code <> '--'\n  AND st.country_code <>\
  \ c.country_code"
