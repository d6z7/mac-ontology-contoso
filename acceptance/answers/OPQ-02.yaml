sql:
- "SELECT\n  s.channel AS \"internet business or physical stores\",\n  SUM(CASE WHEN cu.country_code =\
  \ $de THEN s.net_amount ELSE 0 END) AS sales_germany_by_buyer_address,\n  SUM(s.net_amount) FILTER(WHERE\n\
  \    st.country_code = $de) AS sales_germany_by_shop_address,\n  MIN(s.order_date) AS first_order,\n\
  \  MAX(s.order_date) AS last_order\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_store\
  \ AS st\n  ON s.store_key = st.store_key\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key\
  \ = cu.customer_key\nWHERE\n  (\n    st.country_code = $de OR cu.country_code = $de\n  )\n  AND s.channel\
  \ IN ('online', 'physical')\nGROUP BY\n  s.channel\nORDER BY\n  s.channel"
- "SELECT\n  order_key,\n  line_number,\n  order_date,\n  store_key,\n  customer_key,\n  channel,\n  net_amount\n\
  FROM contoso_served.v_contoso5_sales_line"
