- "SELECT\n  s.channel,\n  SUM(s.net_amount) AS sales\nFROM contoso_served.v_contoso5_sales_line AS s\n\
  JOIN contoso_served.dim_customer AS cu\n  ON s.customer_key = cu.customer_key\nWHERE\n  cu.country_code\
  \ = $de AND s.channel IN ('online', 'physical')\nGROUP BY\n  s.channel\nORDER BY\n  s.channel"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.net_amount\nFROM contoso_served.v_contoso5_sales_line\
