  population_actually_answered: 'Two populations, both measured, neither chosen. (a) THE BUYER-ADDRESS
    POPULATION: sales lines joined to dim_customer and kept where the customer''s country_code = ''DE''
    — 4,697 web-shop orders carrying 10,256,061.74 USD and 5,925 in-store orders carrying 14,382,768.44
    USD. (b) THE SHOP-ADDRESS POPULATION: the same lines joined to dim_store and kept where the store''s
    country_code = ''DE'' — 14,190 lines from 9 German shops, every one of them physical, carrying 14,382,768.44
    USD, with no online rows in the set at all. The 0.00000 that appears on the online row of my result
    is the ELSE 0 of a CASE expression over rows that are in the set only because the BUYER was German;
    it is not a measured zero, and population (b) contains no online line to sum. Restrictions applied
    to both and their source: channel IN (''online'',''physical''), which removes nothing, because contoso5_channel
    declares exactly those two members; NO period restriction, by order.default.an_unscoped_question_covers_all_time,
    so the span is the full extent of order_date, 19 May 2016 to 31 December 2025; NO currency restriction
    and no FX conversion, the amounts being USD as declared whatever currency each sale was transacted
    in. I did NOT apply the `physical` channel default of store.resolution.the_channel_is_the_location_sentinel:
    its `applies: subject` scopes it to questions whose subject is a Store, and this question''s subject
    is a measure, so applying it would have silently deleted the very row the question exists to ask about.
    I did not use dim_location, the third path the country ruling names, as the question refers to no
    site.'
