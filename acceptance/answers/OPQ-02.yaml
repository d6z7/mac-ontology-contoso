answer: 'Which "in Germany" do you mean? Both readings are now measured and they disagree about whether
  your question has an answer, so I am asking rather than choosing. (a) GERMANY IS WHERE THE BUYER LIVES
  — internet business 10,256,061.74 USD, physical stores 14,382,768.44 USD; ratio 0.713, i.e. for every
  dollar the German shops took the German web shop took 71.3 cents (internet 41.6%, physical 58.4%, German
  total 24,638,830.18 USD). This is the complete two-row answer your question asks for; say "buyer" and
  it is yours. (b) GERMANY IS WHERE THE SHOP THAT RANG UP THE SALE STANDS — physical stores 14,382,768.44
  USD, and NO internet figure. Read (b) carefully: the internet business under it is not 14,382,768.44
  against zero. It is unattributable. All 93,550 web-shop lines belong to one outlet whose country is
  the ''--'' sentinel the ontology declares is not a place, so zero German shops sold online and there
  is no ratio under (b) at all, only the single shop figure. WHAT YOUR CHOICE DOES NOT CHANGE: the physical-store
  figure, 14,382,768.44 USD, and not just the total but the identical 14,190 sales lines under both readings
  — measured, no German shop ever served a foreign buyer and no German buyer ever shopped in a foreign
  shop; the period, all ten years on record, 19 May 2016 to 31 December 2025 (the web shop''s first German
  order is 26 May 2016); and the completeness of the split, since the warehouse records only these two
  channels, so the two rows are the whole of German sales. TWO SMALLER CHOICES YOU MAY RESET: money after
  discount, as the ontology directs for an unqualified "sales" — before discount it is 10,893,003.93 against
  15,297,211.48, moving the ratio from 0.713 to 0.712, which changes nothing. But if you meant ITEMS or
  ORDERS rather than money the ratio is 0.79, not 0.71, because the web shop sells cheaper goods: 287
  USD per item online against 318 in the shops.'
