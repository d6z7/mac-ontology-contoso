sql:
- "SELECT\n  SUM(s.net_amount) AS revenue\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_product\
  \ AS p\n  ON s.product_key = p.product_key\nWHERE\n  p.list_price > 1000"
- "SELECT\n  product_key,\n  product_name,\n  brand,\n  category_name,\n  list_price\nFROM contoso_served.dim_product"
- "SELECT\n  product_key,\n  product_name,\n  brand,\n  category_name,\n  list_price\nFROM contoso_served.dim_product\n\
  WHERE\n  list_price > 1000"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.order_date,\n  s.channel,\n  s.product_key,\n  p.list_price,\n\
  \  s.quantity,\n  s.net_amount,\n  s.gross_amount\nFROM contoso_served.v_contoso5_sales_line AS s\n\
  JOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nWHERE\n  p.list_price > 1000"
answer_sql: "SELECT\n  SUM(s.net_amount) AS revenue\nFROM contoso_served.v_contoso5_sales_line AS s\n\
  JOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nWHERE\n  p.list_price > 1000"
