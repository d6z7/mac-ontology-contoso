- stage: plan
  status: ok
  ms: 0
  summary: 3 statement(s), one per settled step · walk order 1 -> 2 -> 3
  detail:
    plan:
      sql: "-- step 1\nSELECT\n  product_key,\n  product_code,\n  product_name,\n  brand,\n  color,\n\
        \  category_name,\n  sub_category_name\nFROM contoso_served.dim_product\n\n-- step 2\nWITH pp\
        \ AS (\n  SELECT\n    product_key,\n    MAX(order_date) AS last_day\n  FROM contoso_served.v_contoso5_sales_line\n\
        \  GROUP BY\n    product_key\n), lat AS (\n  SELECT\n    s.product_key,\n    MAX(s.unit_price)\
        \ AS latest_list_price\n  FROM contoso_served.v_contoso5_sales_line AS s\n  JOIN pp\n    ON s.product_key\
        \ = pp.product_key AND s.order_date = pp.last_day\n  GROUP BY\n    s.product_key\n)\nSELECT\n\
        \  product_key,\n  latest_list_price\nFROM lat\nWHERE\n  latest_list_price > 1000\n\n-- step 3\n\
        WITH pp AS (\n  SELECT\n    product_key,\n    MAX(order_date) AS last_day\n  FROM contoso_served.v_contoso5_sales_line\n\
        \  GROUP BY\n    product_key\n), high_value AS (\n  SELECT\n    s.product_key\n  FROM contoso_served.v_contoso5_sales_line\
        \ AS s\n  JOIN pp\n    ON s.product_key = pp.product_key AND s.order_date = pp.last_day\n  GROUP\
        \ BY\n    s.product_key\n  HAVING\n    MAX(s.unit_price) > 1000\n)\nSELECT\n  ROUND(SUM(s.net_amount),\
        \ 2) AS revenue\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN high_value AS h\n  ON h.product_key\
        \ = s.product_key"
      params: {}
