sql:
- "SELECT\n  c.country_name,\n  SUM(s.net_amount) AS net_sales_2024,\n  COUNT(*) AS lines\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
  \ AS c\n  ON cu.country_code = c.country_code\nWHERE\n  (\n    LOWER(c.country_name) IN ('turkey', 'turkiye',\
  \ 'türkiye')\n    OR UPPER(c.country_code) = 'TR'\n  )\n  AND s.order_date >= CAST('2024-01-01' AS DATE)\n\
  \  AND s.order_date < CAST('2025-01-01' AS DATE)\nGROUP BY\n  c.country_name"
- "SELECT\n  'customer_state' AS where_found,\n  state AS value,\n  COUNT(*) AS n\nFROM contoso_served.dim_customer\n\
  WHERE\n  LOWER(state) LIKE '%turk%'\nGROUP BY\n  1,\n  2\nUNION ALL\nSELECT\n  'store_state',\n  state,\n\
  \  COUNT(*)\nFROM contoso_served.dim_store\nWHERE\n  LOWER(state) LIKE '%turk%'\nGROUP BY\n  1,\n  2\n\
  UNION ALL\nSELECT\n  'location_state',\n  state,\n  COUNT(*)\nFROM contoso_served.dim_location\nWHERE\n\
  \  LOWER(state) LIKE '%turk%'\nGROUP BY\n  1,\n  2\nUNION ALL\nSELECT\n  'distinct_customer_country',\n\
  \  country_code,\n  COUNT(*)\nFROM contoso_served.dim_customer\nGROUP BY\n  1,\n  2\nUNION ALL\nSELECT\n\
  \  'distinct_store_country',\n  country_code,\n  COUNT(*)\nFROM contoso_served.dim_store\nGROUP BY\n\
  \  1,\n  2"
- "SELECT\n  'via_store' AS route,\n  COUNT(*) AS lines,\n  COALESCE(SUM(s.net_amount), 0) AS net_sales\n\
  FROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_store AS st\n  ON s.store_key\
  \ = st.store_key\nJOIN contoso_served.dim_country AS c\n  ON st.country_code = c.country_code\nWHERE\n\
  \  LOWER(c.country_name) IN ('turkey', 'turkiye', 'türkiye')\n  OR UPPER(c.country_code) = 'TR'\nUNION\
  \ ALL\nSELECT\n  'via_customer',\n  COUNT(*),\n  COALESCE(SUM(s.net_amount), 0)\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
  \ AS c\n  ON cu.country_code = c.country_code\nWHERE\n  LOWER(c.country_name) IN ('turkey', 'turkiye',\
  \ 'türkiye')\n  OR UPPER(c.country_code) = 'TR'\nUNION ALL\nSELECT\n  'via_location',\n  COUNT(*),\n\
  \  COALESCE(SUM(s.net_amount), 0)\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_store\
  \ AS st\n  ON s.store_key = st.store_key\nJOIN contoso_served.dim_location AS l\n  ON st.location_code\
  \ = l.location_code\nJOIN contoso_served.dim_country AS c\n  ON l.country_code = c.country_code\nWHERE\n\
  \  LOWER(c.country_name) IN ('turkey', 'turkiye', 'türkiye')\n  OR UPPER(c.country_code) = 'TR'"
- "SELECT\n  'store_country' AS route,\n  c.country_name,\n  SUM(s.net_amount) AS net_sales_2024,\n  COUNT(*)\
  \ AS lines\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_store AS st\n  ON\
  \ s.store_key = st.store_key\nJOIN contoso_served.dim_country AS c\n  ON st.country_code = c.country_code\n\
  WHERE\n  s.order_date >= CAST('2024-01-01' AS DATE)\n  AND s.order_date < CAST('2025-01-01' AS DATE)\n\
  GROUP BY\n  1,\n  2\nUNION ALL\nSELECT\n  'customer_country',\n  c.country_name,\n  SUM(s.net_amount),\n\
  \  COUNT(*)\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS cu\n\
  \  ON s.customer_key = cu.customer_key\nJOIN contoso_served.dim_country AS c\n  ON cu.country_code =\
  \ c.country_code\nWHERE\n  s.order_date >= CAST('2024-01-01' AS DATE)\n  AND s.order_date < CAST('2025-01-01'\
  \ AS DATE)\nGROUP BY\n  1,\n  2\nORDER BY\n  route,\n  net_sales_2024 DESC"
answer_sql: "SELECT\n  c.country_name,\n  SUM(s.net_amount) AS net_sales_2024,\n  COUNT(*) AS lines\n\
  FROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key\
  \ = cu.customer_key\nJOIN contoso_served.dim_country AS c\n  ON cu.country_code = c.country_code\nWHERE\n\
  \  (\n    LOWER(c.country_name) IN ('turkey', 'turkiye', 'türkiye')\n    OR UPPER(c.country_code) =\
  \ 'TR'\n  )\n  AND s.order_date >= CAST('2024-01-01' AS DATE)\n  AND s.order_date < CAST('2025-01-01'\
  \ AS DATE)\nGROUP BY\n  c.country_name"
