answer: 'Cannot be answered: Contoso has no sales in Turkey, in 2024 or in any year, because Turkey is
  not a country in this warehouse. The query returned zero rows. The business trades in exactly eight
  countries — Australia, Canada, France, Germany, Italy, Netherlands, United Kingdom, United States —
  plus an ''Online'' sentinel that is not a place. This is NOT a Turkish revenue of zero: no Turkish row
  exists to sum, and reporting 0 would wrongly say Contoso operated there and took nothing. The 2024 year
  itself is fine — it holds 31,639,690.93 USD net over 38,109 lines — so the year is not what blocks this.
  If you meant one of the real markets, 2024 net sales by customer country were: United States 15,517,267.62,
  Germany 3,969,307.19, Canada 3,686,333.97, United Kingdom 2,719,342.39, Australia 2,205,593.99, Netherlands
  1,605,182.72, France 1,240,001.03, Italy 696,662.02. If Turkey ought to be in this data, the bundle
  is incomplete — that is a sourcing question, not a query one.'
