- stage: plan
  status: ok
  ms: 0
  summary: 6 statement(s), one per settled step · walk order 1 -> 2 -> 3 -> 4 -> 5 -> 6
  detail:
    plan:
      sql: "-- step 1\nSELECT\n  order_key,\n  line_number,\n  order_date,\n  channel,\n  net_amount,\n\
        \  gross_amount\nFROM contoso_served.v_contoso5_sales_line\n\n-- step 2\nSELECT\n  order_key,\n\
        \  line_number,\n  order_date,\n  channel,\n  net_amount,\n  gross_amount\nFROM contoso_served.v_contoso5_sales_line\n\
        WHERE\n  channel IN ('online', 'physical')\n\n-- step 3\nSELECT\n  channel,\n  COUNT(*) AS lines,\n\
        \  COUNT(DISTINCT order_key) AS orders,\n  SUM(net_amount) AS net_sales,\n  SUM(gross_amount)\
        \ AS gross_sales,\n  MIN(order_date) AS first_order,\n  MAX(order_date) AS last_order\nFROM contoso_served.v_contoso5_sales_line\n\
        WHERE\n  channel IN ('online', 'physical')\nGROUP BY\n  channel\nORDER BY\n  channel\n\n-- step\
        \ 4\nSELECT\n  channel,\n  SUM(net_amount) AS net_sales,\n  SUM(gross_amount) AS gross_sales,\n\
        \  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  MIN(order_date) AS first_order,\n\
        \  MAX(order_date) AS last_order\nFROM contoso_served.v_contoso5_sales_line\nWHERE\n  channel\
        \ IN ('online', 'physical')\nGROUP BY\n  channel\nORDER BY\n  channel\n\n-- step 5\nWITH by_channel\
        \ AS (\n  SELECT\n    channel,\n    SUM(net_amount) AS net_sales\n  FROM contoso_served.v_contoso5_sales_line\n\
        \  WHERE\n    channel IN ('online', 'physical')\n  GROUP BY\n    channel\n)\nSELECT\n  channel,\n\
        \  net_sales,\n  MAX(CASE WHEN channel = 'online' THEN net_sales END) OVER () / MAX(CASE WHEN\
        \ channel = 'physical' THEN net_sales END) OVER () AS sales_ratio_internet_to_physical\nFROM by_channel\n\
        ORDER BY\n  channel\n\n-- step 6\nWITH by_channel AS (\n  SELECT\n    channel,\n    SUM(net_amount)\
        \ AS net_sales\n  FROM contoso_served.v_contoso5_sales_line\n  WHERE\n    channel IN ('online',\
        \ 'physical')\n  GROUP BY\n    channel\n)\nSELECT\n  channel,\n  net_sales AS sales_usd_net,\n\
        \  MAX(CASE WHEN channel = 'online' THEN net_sales END) OVER () / MAX(CASE WHEN channel = 'physical'\
        \ THEN net_sales END) OVER () AS sales_ratio_internet_to_physical\nFROM by_channel\nORDER BY\n\
        \  channel"
      params: {}
