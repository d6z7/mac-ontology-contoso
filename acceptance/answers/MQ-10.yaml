sql:
- "SELECT\n  store_name AS store,\n  close_date AS when_it_closed\nFROM contoso_served.dim_store\nWHERE\n\
  \  NOT close_date IS NULL AND EXTRACT(YEAR FROM close_date) > 2018\nORDER BY\n  close_date,\n  store_name"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation\nFROM contoso_served.dim_store\nORDER BY\n  store_key"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation\nFROM contoso_served.dim_store\nWHERE\n  NOT close_date IS NULL\nORDER BY\n  close_date,\n\
  \  store_key"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation,\n  CASE\n    WHEN EXTRACT(YEAR FROM close_date) > 2018\n    THEN 'in both readings\
  \ (closed 2019 or later)'\n    ELSE 'only if 2018 counts as \"after 2018\"'\n  END AS which_reading\n\
  FROM contoso_served.dim_store\nWHERE\n  NOT close_date IS NULL AND EXTRACT(YEAR FROM close_date) >=\
  \ 2018\nORDER BY\n  close_date,\n  store_key"
answer_sql: "SELECT\n  store_name AS store,\n  close_date AS when_it_closed\nFROM contoso_served.dim_store\n\
  WHERE\n  NOT close_date IS NULL AND EXTRACT(YEAR FROM close_date) > 2018\nORDER BY\n  close_date,\n\
  \  store_name"
