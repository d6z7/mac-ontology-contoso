  unit: 'items — a count of product units on the order line, carried by `Quantity`.
    DIMENSIONLESS IN THE SENSE THAT MATTERS HERE: unlike NetSalesAmount and GrossSalesAmount,
    it carries no currency, so it may be summed across markets and across the five
    currencies without any conversion, and two QuantitySold figures are always comparable
    and differenceable.

    WHAT THE UNIT DOES NOT LICENSE. An item is not a comparable magnitude across products:
    a television and a cable each count 1, so a quantity total spanning product categories
    is a count of things sold and NOT a measure of volume, weight or worth. Where
    the question means "how much", the currency measures are the ones that answer
    it; this one answers "how many". Nor is it a count of ORDERS or of LINES — it
    sums a per-line quantity, so a single line carrying 5 contributes 5, not 1.'
  measure: QuantitySold
  reading: A bare "quantity sold" or "units sold" means SUM(Quantity) over the order
