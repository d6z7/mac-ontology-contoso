sql:
- 'SELECT dim_contoso_product.ProductCode, SUM(f."Quantity") AS quantity_sold

  FROM contoso_served.v_contoso_order_line f

  JOIN contoso_served.dim_contoso_product ON f.ProductKey = dim_contoso_product.ProductKey

  GROUP BY dim_contoso_product.ProductCode

  ORDER BY quantity_sold DESC

  LIMIT 3'
