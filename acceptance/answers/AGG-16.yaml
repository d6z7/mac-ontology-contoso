sql:
- "SELECT\n  SUM(CASE WHEN co.country_name = $country THEN l.net_amount ELSE 0 END) AS net_revenue_germany,\n\
  \  SUM(l.net_amount) AS total_net_revenue,\n  ROUND(\n    100.0 * SUM(CASE WHEN co.country_name = $country\
  \ THEN l.net_amount ELSE 0 END) / SUM(l.net_amount),\n    2\n  ) AS pct_of_total_net_revenue\nFROM contoso_served.v_contoso5_sales_line\
  \ AS l\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\nJOIN contoso_served.dim_country\
  \ AS co\n  ON c.country_code = co.country_code"
- "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  SUM(net_amount) AS total_net_amount,\n\
  \  MIN(order_date) AS first_order_date,\n  MAX(order_date) AS last_order_date,\n  SUM(CASE WHEN customer_key\
