- id: sql_by_step
  title: The statements that ran, in walk order
  subtitle: ''
  status: ok
  body:
    kind: sql
    value:
    - step: '1'
      sql: "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  SUM(net_amount) AS\
        \ total_net_amount,\n  MIN(order_date) AS first_order_date,\n  MAX(order_date) AS last_order_date,\n\
        \  SUM(CASE WHEN customer_key IS NULL THEN 1 ELSE 0 END) AS lines_with_no_customer\nFROM contoso_served.v_contoso5_sales_line"
      params: {}
    - step: '2'
      sql: "SELECT\n  SUM(net_amount) AS total_net_revenue\nFROM contoso_served.v_contoso5_sales_line"
      params: {}
    - step: '3'
      sql: "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT l.order_key) AS orders,\n  COUNT(DISTINCT l.customer_key)\
        \ AS customers,\n  SUM(l.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\nJOIN contoso_served.dim_country\
        \ AS co\n  ON c.country_code = co.country_code\nWHERE\n  co.country_name = $country"
      params: *id007
    - step: '4'
      sql: "SELECT\n  SUM(l.net_amount) AS net_revenue_germany\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\nJOIN contoso_served.dim_country\
        \ AS co\n  ON c.country_code = co.country_code\nWHERE\n  co.country_name = $country"
      params: *id008
    - step: '5'
      sql: "SELECT\n  SUM(CASE WHEN co.country_name = $country THEN l.net_amount ELSE 0 END) AS net_revenue_germany,\n\
        \  SUM(l.net_amount) AS total_net_revenue,\n  ROUND(\n    100.0 * SUM(CASE WHEN co.country_name\
        \ = $country THEN l.net_amount ELSE 0 END) / SUM(l.net_amount),\n    2\n  ) AS pct_of_total_net_revenue\n\
        FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nJOIN contoso_served.dim_country AS co\n  ON c.country_code = co.country_code"
      params: *id009
- id: what_it_calculated
  title: What it says its rows are
  subtitle: ''
  status: ok
  body:
    kind: prose
    value: '11.26 per cent. Of every dollar Contoso has ever charged customers after discount, 11.26%
      was charged to a customer whose register record says they live in Germany: 24,638,830.18 USD out
      of 218,814,471.66, across 25,552 of 223,974 sales lines. That makes Germany the second largest home
      country behind the United States at 111,862,187.56 (51.1%). WHAT IS IN THE FIGURE: all ten years
      of sales, 18 May 2016 to 31 December 2025, no period cut; both channels, with the web shop''s 86,790,054.13
      included and attributed to the real countries its buyers live in; every sale on record in the denominator,
      none dropped for want of a customer or a country. WHAT IT IS NOT: not the share taken by shops standing
      in Germany, which is 14,382,768.44 or 6.57% — a reading that strands 40% of all revenue in a sentinel
      belonging to no country. Not a share of gross, which is before discount. Not a share of customers,
      orders or units — by lines Germany is 11.41%. And not residence as at the order date: the register
      serves one current address per customer, so anyone who has since moved counts wholly where they
      are recorded now.'
