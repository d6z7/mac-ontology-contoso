- "SELECT\n  COUNT(DISTINCT store_key) AS \"how many stores\"\nFROM contoso_served.dim_store\nWHERE\n\
  \  store_code <> -1 AND close_date IS NULL"
- "SELECT\n  COUNT(*) AS all_rows,\n  COUNT(DISTINCT store_key) AS distinct_premises,\n  COUNT(DISTINCT\
  \ store_code) AS distinct_site_codes,\n  SUM(CASE WHEN store_code <> -1 THEN 1 ELSE 0 END) AS physical_rows,\n\
  \  SUM(CASE WHEN store_code = -1 THEN 1 ELSE 0 END) AS online_rows,\n  SUM(CASE WHEN close_date IS NULL\
  \ THEN 1 ELSE 0 END) AS active_rows_all_channels,\n  SUM(CASE WHEN store_code <> -1 AND close_date IS\
  \ NULL THEN 1 ELSE 0 END) AS physical_active,\n  SUM(CASE WHEN store_code <> -1 AND NOT close_date IS\
  \ NULL THEN 1 ELSE 0 END) AS physical_closed\nFROM contoso_served.dim_store"
