sql:
- "SELECT\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS\
  \ s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nWHERE\n  p.brand = $brand"
- "SELECT\n  order_key,\n  line_number,\n  net_amount,\n  order_date,\n  product_key,\n  channel\nFROM\
  \ contoso_served.v_contoso5_sales_line"
- "SELECT\n  s.order_key,\n  s.line_number,\n  s.net_amount,\n  s.order_date,\n  s.channel\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nWHERE\n  p.brand =\
  \ $brand"
