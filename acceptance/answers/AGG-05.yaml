sql:
- "SELECT\n  SUM(CASE WHEN sc.country_name = 'Germany' THEN l.net_amount END) AS germany_by_store,\n \
  \ SUM(CASE WHEN cc.country_name = 'Germany' THEN l.net_amount END) AS germany_by_customer,\n  SUM(\n\
  \    CASE\n      WHEN cc.country_name = 'Germany' AND l.channel = 'online'\n      THEN l.net_amount\n\
  \    END\n  ) AS the_difference_web_only,\n  MIN(l.order_date) AS covered_from,\n  MAX(l.order_date)\
  \ AS covered_to\nFROM contoso_served.v_contoso5_sales_line AS l\nLEFT JOIN contoso_served.dim_store\
  \ AS s\n  ON l.store_key = s.store_key\nLEFT JOIN contoso_served.dim_country AS sc\n  ON s.country_code\
  \ = sc.country_code\nLEFT JOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\n\
  LEFT JOIN contoso_served.dim_country AS cc\n  ON c.country_code = cc.country_code"
- "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  MIN(order_date) AS first_order,\n\
  \  MAX(order_date) AS last_order,\n  SUM(net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line"
- "SELECT\n  SUM(CASE WHEN sc.country_name = 'Germany' THEN l.net_amount END) AS store_de,\n  SUM(CASE\
  \ WHEN cc.country_name = 'Germany' THEN l.net_amount END) AS customer_de,\n  SUM(\n    CASE\n      WHEN\
  \ cc.country_name = 'Germany' AND l.channel = 'online'\n      THEN l.net_amount\n    END\n  ) AS customer_de_online,\n\
  \  SUM(\n    CASE\n      WHEN sc.country_name = 'Germany' AND cc.country_name <> 'Germany'\n      THEN\
  \ l.net_amount\n    END\n  ) AS german_store_foreign_customer\nFROM contoso_served.v_contoso5_sales_line\
  \ AS l\nLEFT JOIN contoso_served.dim_store AS s\n  ON l.store_key = s.store_key\nLEFT JOIN contoso_served.dim_country\
  \ AS sc\n  ON s.country_code = sc.country_code\nLEFT JOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
  \ = c.customer_key\nLEFT JOIN contoso_served.dim_country AS cc\n  ON c.country_code = cc.country_code"
answer_sql: "SELECT\n  SUM(CASE WHEN sc.country_name = 'Germany' THEN l.net_amount END) AS germany_by_store,\n\
  \  SUM(CASE WHEN cc.country_name = 'Germany' THEN l.net_amount END) AS germany_by_customer,\n  SUM(\n\
  \    CASE\n      WHEN cc.country_name = 'Germany' AND l.channel = 'online'\n      THEN l.net_amount\n\
  \    END\n  ) AS the_difference_web_only,\n  MIN(l.order_date) AS covered_from,\n  MAX(l.order_date)\
  \ AS covered_to\nFROM contoso_served.v_contoso5_sales_line AS l\nLEFT JOIN contoso_served.dim_store\
  \ AS s\n  ON l.store_key = s.store_key\nLEFT JOIN contoso_served.dim_country AS sc\n  ON s.country_code\
  \ = sc.country_code\nLEFT JOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\n\
  LEFT JOIN contoso_served.dim_country AS cc\n  ON c.country_code = cc.country_code"
