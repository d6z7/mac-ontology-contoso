answer: 'Which Germany do you mean? The two readings are 10,256,061.74 USD apart, and nothing in the ontology
  picks between them, so I won''t guess.


  • "The German shops'' takings" — what was rung up at Contoso''s stores standing in Germany: **14,382,768.44
  USD**

  • "What German customers spent" — what customers whose registered country is Germany paid, wherever
  they bought it: **24,638,830.18 USD**


  What the choice does NOT change: not one cent was sold at a German shop to a customer living elsewhere,
  so every counter sale in Germany sits in both figures and the shop-by-shop picture is identical either
  way. The whole difference is 10,256,061.74 USD of web-shop purchases by German residents — the web shop
  records its country as `--`, a sentinel that is not a place, so those sales can only be placed in Germany
  through the buyer, never through the store.


  Both figures are net of discount, in USD, and cover every order in the data, placed between 2016-05-18
  and 2025-12-31. Say "the shops" or "the customers" and I''ll hand you that one.


  One reading from your question I cannot price at all: revenue shipped to a German address. The data
  records when an order was delivered, never where.'
