sql:
- "SELECT\n  ROUND(SUM(l.net_amount), 2) AS revenue,\n  COUNT(*) AS sales_lines,\n  COUNT(DISTINCT l.store_key)\
  \ AS stores_with_sales,\n  MIN(l.order_date) AS first_order,\n  MAX(l.order_date) AS last_order\nFROM\
  \ contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store AS s\n  ON l.store_key =\
  \ s.store_key"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation,\n  square_metres\nFROM contoso_served.dim_store\nORDER BY\n  store_key"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation,\n  square_metres,\n  (\n    store_name LIKE 'Contoso%'\n  ) AS name_begins_contoso\n\
  FROM contoso_served.dim_store\nORDER BY\n  store_key"
- "SELECT\n  l.order_key,\n  l.line_number,\n  l.order_date,\n  l.store_key,\n  l.channel,\n  l.net_amount\n\
  FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store AS s\n  ON l.store_key\
  \ = s.store_key"
answer_sql: "SELECT\n  ROUND(SUM(l.net_amount), 2) AS revenue,\n  COUNT(*) AS sales_lines,\n  COUNT(DISTINCT\
  \ l.store_key) AS stores_with_sales,\n  MIN(l.order_date) AS first_order,\n  MAX(l.order_date) AS last_order\n\
  FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store AS s\n  ON l.store_key\
  \ = s.store_key"
