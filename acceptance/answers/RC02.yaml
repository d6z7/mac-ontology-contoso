sql:
- "SELECT\n  ct.country_name\nFROM contoso_served.dim_customer AS c\nJOIN contoso_served.dim_country AS\
  \ ct\n  ON c.country_code = ct.country_code\nWHERE\n  ct.country_code <> '--'\nGROUP BY\n  ct.country_name\n\
  ORDER BY\n  ct.country_name"
- "SELECT\n  c.customer_key,\n  c.country_code\nFROM contoso_served.dim_customer AS c"
- "SELECT\n  ct.country_code,\n  ct.country_name,\n  COUNT(*) AS customer_rows\nFROM contoso_served.dim_customer\
  \ AS c\nLEFT JOIN contoso_served.dim_country AS ct\n  ON c.country_code = ct.country_code\nGROUP BY\n\
  \  ct.country_code,\n  ct.country_name\nORDER BY\n  ct.country_name"
