sql:
- "SELECT\n  co.country_name AS country\nFROM contoso_served.dim_customer AS c\nJOIN contoso_served.dim_country\
  \ AS co\n  ON c.country_code = co.country_code\nWHERE\n  co.country_code <> '--'\nGROUP BY\n  co.country_name\n\
  ORDER BY\n  co.country_name"
- "SELECT\n  c.country_code,\n  co.country_name,\n  COUNT(*) AS customers_on_record\nFROM contoso_served.dim_customer\
  \ AS c\nJOIN contoso_served.dim_country AS co\n  ON c.country_code = co.country_code\nGROUP BY\n  c.country_code,\n\
  \  co.country_name\nORDER BY\n  co.country_name"
- "SELECT DISTINCT\n  co.country_code,\n  co.country_name\nFROM contoso_served.dim_customer AS c\nJOIN\
