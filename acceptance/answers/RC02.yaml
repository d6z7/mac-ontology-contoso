sql:
- "SELECT\n  co.country_name\nFROM contoso_served.dim_customer AS cu\nJOIN contoso_served.dim_country\
  \ AS co\n  ON cu.country_code = co.country_code\nGROUP BY\n  co.country_name\nORDER BY\n  co.country_name"
- "SELECT\n  customer_key,\n  country_code\nFROM contoso_served.dim_customer"
