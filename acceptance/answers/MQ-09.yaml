        \  open_date,\n  close_date\nFROM contoso_served.dim_store\nWHERE\n  location_code <> -1 AND close_date\
        \ IS NULL\nORDER BY\n  country_code,\n  store_key\n\n-- step 2\nSELECT\n  store_key,\n  store_name,\n\
        \  state,\n  country_code,\n  open_date,\n  close_date\nFROM contoso_served.dim_store\nWHERE\n\
        \  location_code <> -1 AND close_date IS NULL AND country_code = 'IT'\nORDER BY\n  store_key\n\
        \n-- step 3\nSELECT\n  store_key,\n  store_name,\n  state\nFROM contoso_served.dim_store\nWHERE\n\
        \  location_code <> -1 AND close_date IS NULL AND country_code = 'IT'\nGROUP BY\n  store_key,\n\
        \  store_name,\n  state\nORDER BY\n  store_key\n\n-- step 4\nSELECT\n  s.store_key,\n  s.store_name,\n\
        \  COUNT(f.order_key) AS sales_lines,\n  COUNT(DISTINCT f.order_key) AS orders,\n  COALESCE(SUM(f.net_amount),\
        \ 0) AS net_revenue,\n  MIN(f.order_date) AS first_order,\n  MAX(f.order_date) AS last_order\n\
        FROM contoso_served.dim_store AS s\nLEFT JOIN contoso_served.v_contoso5_sales_line AS f\n  ON\
        \ f.store_key = s.store_key\nWHERE\n  s.location_code <> -1 AND s.close_date IS NULL AND s.country_code\
        \ = 'IT'\nGROUP BY\n  1,\n  2\nORDER BY\n  1\n\n-- step 5\nSELECT\n  s.store_key,\n  s.store_name,\n\
        \  COUNT(f.order_key) AS sales_lines,\n  COUNT(DISTINCT f.order_key) AS orders,\n  COALESCE(SUM(f.net_amount),\
        \ 0) AS net_revenue\nFROM contoso_served.dim_store AS s\nLEFT JOIN contoso_served.v_contoso5_sales_line\
        \ AS f\n  ON f.store_key = s.store_key\nWHERE\n  s.location_code <> -1 AND s.close_date IS NULL\
        \ AND s.country_code = 'IT'\nGROUP BY\n  1,\n  2\nHAVING\n  COUNT(f.order_key) = 0\nORDER BY\n\
        \  1\n\n-- step 6\nSELECT\n  s.store_name AS store,\n  COUNT(f.order_key) AS how_many_sales\n\
        FROM contoso_served.dim_store AS s\nLEFT JOIN contoso_served.v_contoso5_sales_line AS f\n  ON\
        \ f.store_key = s.store_key\nWHERE\n  s.location_code <> -1 AND s.close_date IS NULL AND s.country_code\
        \ = 'IT'\nGROUP BY\n  s.store_key,\n  s.store_name\nHAVING\n  COUNT(f.order_key) = 0\nORDER BY\n\
        \  s.store_name\n\n-- step 7\nSELECT\n  CASE\n    WHEN COUNT(*) FILTER(WHERE\n      trading_state\
        \ = 'active' AND sales_lines = 0) > 0\n    THEN 'yes'\n    ELSE 'no'\n  END AS answer_trading_shops,\n\
        \  CASE WHEN COUNT(*) FILTER(WHERE\n    sales_lines = 0) > 0 THEN 'yes' ELSE 'no' END AS answer_including_closed,\n\
        \  COUNT(*) FILTER(WHERE\n    trading_state = 'active') AS trading_shops_checked,\n  COUNT(*)\
