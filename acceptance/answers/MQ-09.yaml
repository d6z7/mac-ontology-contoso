sql:
- 'SELECT DISTINCT cycle.StoreCode AS store

  FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY StoreKey ORDER BY OpenDate DESC)
  AS _mac_cycle_rank FROM contoso_served.dim_contoso_store) cycle

  JOIN contoso_served.v_contoso_order_line ON v_contoso_order_line.StoreKey = cycle.StoreKey

  WHERE cycle._mac_cycle_rank = 1 AND cycle.StoreKey NOT IN (SELECT DISTINCT contoso_served.v_contoso_order_line.StoreKey
  FROM contoso_served.v_contoso_order_line) AND cycle.CountryName = :country AND cycle.StoreKey
  not_in v_contoso_order_line.StoreKey'
