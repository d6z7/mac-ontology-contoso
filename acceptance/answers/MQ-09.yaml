sql:
- "SELECT\n  CASE\n    WHEN EXISTS(\n      SELECT\n        1\n      FROM contoso_served.dim_store AS s\n\
  \      LEFT JOIN contoso_served.v_contoso5_sales_line AS sl\n        ON sl.store_key = s.store_key\n\
  \      WHERE\n        s.country_code = 'IT' AND s.is_online = FALSE AND s.close_date IS NULL\n     \
  \ GROUP BY\n        s.store_key\n      HAVING\n        COUNT(sl.order_key) = 0\n    )\n    THEN 'yes'\n\
  \    ELSE 'no'\n  END AS answer"
