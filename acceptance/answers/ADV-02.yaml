  \ AS s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_customer\
  \ AS c\n  ON s.customer_key = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  p.brand\n\
