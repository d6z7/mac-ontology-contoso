        \ AS c\n  ON l.customer_key = c.customer_key\nWHERE\n  c.continent = 'Europe'\nORDER BY\n  p.brand\n\
        \n-- step 3\nSELECT\n  COALESCE(p.brand, '— ALL ELEVEN BRANDS —') AS brand,\n  COUNT(*) AS lines,\n\
        \  ROUND(SUM(l.gross_amount), 2) AS gross,\n  ROUND(SUM(l.net_amount), 2) AS net,\n  ROUND(SUM(l.gross_amount\
        \ - l.net_amount), 2) AS gross_minus_net\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN\
        \ contoso_served.dim_product AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer\
        \ AS c\n  ON l.customer_key = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  ROLLUP\
        \ (\n    p.brand\n  )\nORDER BY\n  gross_minus_net DESC\n\n-- step 4\nSELECT\n  COALESCE(p.brand,\
        \ '— TOTAL, all brands (reconciliation row) —') AS brand,\n  ROUND(SUM(l.gross_amount), 2) AS\
        \ gross\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product AS p\n\
        \  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  ROLLUP (\n    p.brand\n  )\n\
        ORDER BY\n  gross DESC\n\n-- step 5\nSELECT\n  COALESCE(p.brand, '— TOTAL, all brands (reconciliation\
        \ row) —') AS brand,\n  ROUND(SUM(l.net_amount), 2) AS net\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer\
        \ AS c\n  ON l.customer_key = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  ROLLUP\
