        did: "WITH euro AS (\n  SELECT DISTINCT\n    country_code\n  FROM contoso_served.dim_customer\n\
          \  WHERE\n    continent = 'Europe'\n)\nSELECT\n  'A: customer lives in Europe' AS reading,\n\
          \  COUNT(*) AS lines,\n  COUNT(DISTINCT p.brand) AS brands,\n  ROUND(SUM(l.gross_amount), 2)\
          \ AS gross,\n  ROUND(SUM(l.net_amount), 2) AS net,\n  ROUND(SUM(l.gross_amount - l.net_amount),\
          \ 2) AS gross_minus_net,\n  ROUND(SUM(l.margin_amount), 2) AS margin_amount,\n  SUM(CASE WHEN\
          \ l.channel = 'online' THEN 1 ELSE 0 END) AS online_lines\nFROM contoso_served.v_contoso5_sales_line\
          \ AS l\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\nJOIN contoso_served.dim_product\
          \ AS p\n  ON l.product_key = p.product_key\nWHERE\n  c.continent = 'Europe'\nUNION ALL\nSELECT\n\
          \  'B: store trades in a European country',\n  COUNT(*),\n  COUNT(DISTINCT p.brand),\n  ROUND(SUM(l.gross_amount),\
          \ 2),\n  ROUND(SUM(l.net_amount), 2),\n  ROUND(SUM(l.gross_amount - l.net_amount), 2),\n  ROUND(SUM(l.margin_amount),\
          \ 2),\n  SUM(CASE WHEN l.channel = 'online' THEN 1 ELSE 0 END)\nFROM contoso_served.v_contoso5_sales_line\
