- id: sql_by_step
  title: The statements that ran, in walk order
  subtitle: ''
  status: ok
  body:
    kind: sql
    value:
    - step: '1'
      sql: "SELECT\n  brand,\n  COUNT(*) AS products\nFROM contoso_served.dim_product\nGROUP BY\n  brand\n\
        ORDER BY\n  brand"
      params: {}
    - step: '2'
      sql: "SELECT DISTINCT\n  p.brand\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nWHERE\n  c.continent = 'Europe'\nORDER BY\n  p.brand"
      params: {}
    - step: '3'
      sql: "SELECT\n  COALESCE(p.brand, '— ALL ELEVEN BRANDS —') AS brand,\n  COUNT(*) AS lines,\n  ROUND(SUM(l.gross_amount),\
        \ 2) AS gross,\n  ROUND(SUM(l.net_amount), 2) AS net,\n  ROUND(SUM(l.gross_amount - l.net_amount),\
        \ 2) AS gross_minus_net\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  ROLLUP (\n    p.brand\n  )\n\
        ORDER BY\n  gross_minus_net DESC"
      params: {}
    - step: '4'
      sql: "SELECT\n  COALESCE(p.brand, '— TOTAL, all brands (reconciliation row) —') AS brand,\n  ROUND(SUM(l.gross_amount),\
        \ 2) AS gross\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  ROLLUP (\n    p.brand\n  )\n\
        ORDER BY\n  gross DESC"
      params: {}
    - step: '5'
      sql: "SELECT\n  COALESCE(p.brand, '— TOTAL, all brands (reconciliation row) —') AS brand,\n  ROUND(SUM(l.net_amount),\
        \ 2) AS net\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product AS\
        \ p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  ROLLUP (\n    p.brand\n  )\n\
        ORDER BY\n  net DESC"
      params: {}
    - step: '6'
      sql: "SELECT\n  p.brand,\n  ROUND(SUM(l.gross_amount), 2) AS gross,\n  ROUND(SUM(l.net_amount),\
        \ 2) AS net,\n  ROUND(SUM(l.gross_amount) - SUM(l.net_amount), 2) AS margin_gross_minus_net,\n\
        \  ROUND(SUM(l.discount_amount), 2) AS declared_discount,\n  ROUND(SUM(l.gross_amount) - SUM(l.net_amount)\
        \ - SUM(l.discount_amount), 2) AS should_be_zero,\n  ROUND(SUM(l.margin_amount), 2) AS declared_margin_net_minus_cost\n\
        FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key\
        \ = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key = c.customer_key\n\
        WHERE\n  c.continent = 'Europe'\nGROUP BY\n  p.brand\nORDER BY\n  margin_gross_minus_net DESC"
      params: {}
    - step: '7'
      sql: "SELECT\n  p.brand,\n  ROUND(SUM(l.gross_amount) - SUM(l.net_amount), 2) AS margin_gross_minus_net,\n\
        \  ROUND(SUM(l.gross_amount), 2) AS gross,\n  ROUND(SUM(l.net_amount), 2) AS net\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer\
        \ AS c\n  ON l.customer_key = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  p.brand\n\
        ORDER BY\n  margin_gross_minus_net DESC\nLIMIT 1"
      params: {}
    - step: '8'
      sql: "SELECT\n  p.brand AS \"brand\",\n  ROUND(SUM(l.gross_amount) - SUM(l.net_amount), 2) AS \"\
        margin (gross minus net)\",\n  ROUND(SUM(l.gross_amount), 2) AS \"gross\",\n  ROUND(SUM(l.net_amount),\
        \ 2) AS \"net\"\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_customer AS c\n  ON l.customer_key\
        \ = c.customer_key\nWHERE\n  c.continent = 'Europe'\nGROUP BY\n  p.brand\nORDER BY\n  \"margin\
        \ (gross minus net)\" DESC\nLIMIT 1"
      params: {}
- id: what_it_calculated
  title: What it says its rows are
  subtitle: ''
  status: ok
  body:
    kind: prose
    value: 'One row, as returned: Adventure Works. Its European sales would have listed for 16,790,109.21
      USD and were actually charged out at 15,791,952.49 USD, leaving a gap of 998,156.72 USD — the largest
      such gap of the eleven brands, 31% ahead of the runner-up Contoso at 759,507.67. WHAT THE CLAIMED
      FIGURE IS: the money Adventure Works did not collect on its European sales because of discounting.
      This bundle declares discount_amount to be exactly gross_amount minus net_amount, so the subtraction
      the question asked for produces the discount given away, not profit earned. Adventure Works'' actual
      profit on those same sales — net revenue minus cost of goods, which is what this bundle calls Margin
      — is 8,837,878.37 USD, and it leads that ranking as well, so the answer holds under either sense
      of the word. WHAT IS NOT IN IT: no cost of goods; no sales outside Europe (151,942 of the 223,974
      lines are excluded); no narrower period than the full ten years; and no percentage scaling, under
      which a different brand would win.'
