          \ AS p\n  ON l.product_key = p.product_key\nWHERE\n  s.country_code IN (\n    SELECT\n     \
          \ country_code\n    FROM euro\n  )\nUNION ALL\nSELECT\n  'C: every line, no Europe filter',\n\
          \  COUNT(*),\n  COUNT(DISTINCT p.brand),\n  ROUND(SUM(l.gross_amount), 2),\n  ROUND(SUM(l.net_amount),\
          \ 2),\n  ROUND(SUM(l.gross_amount - l.net_amount), 2),\n  ROUND(SUM(l.margin_amount), 2),\n\
          \  SUM(CASE WHEN l.channel = 'online' THEN 1 ELSE 0 END)\nFROM contoso_served.v_contoso5_sales_line\
          \ AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key = p.product_key\nUNION ALL\n\
          SELECT\n  'D: country codes carrying >1 continent (0 = clean roll-up)',\n  COUNT(*),\n  NULL,\n\
          \  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL\nFROM (\n  SELECT\n    country_code\n  FROM contoso_served.dim_customer\n\
          \  GROUP BY\n    country_code\n  HAVING\n    COUNT(DISTINCT continent) > 1\n)"
