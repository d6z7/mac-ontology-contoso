      - why: Find out whether the Europe fork actually changes the WINNING brand or only the figure, and
          at the same time price "margin" as the question defines it (gross minus net) against the bundle's
          declared Margin concept.
        did: "WITH euro AS (\n  SELECT DISTINCT\n    country_code\n  FROM contoso_served.dim_customer\n\
          \  WHERE\n    continent = 'Europe'\n)\nSELECT\n  p.brand,\n  ROUND(SUM(CASE WHEN c.continent\
          \ = 'Europe' THEN l.gross_amount - l.net_amount END), 2) AS a_gross_minus_net,\n  ROUND(\n \
