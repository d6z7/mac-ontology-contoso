sql:
- "WITH firsts AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n  FROM contoso_served.v_contoso5_sales_line\n\
  \  GROUP BY\n    customer_key\n)\nSELECT\n  CASE\n    WHEN f.first_order_date < CAST('2024-01-01' AS\
  \ DATE)\n    THEN 'customers older than 2024'\n    ELSE 'customers who first bought in 2024'\n  END\
  \ AS \"customer group\",\n  ROUND(SUM(s.net_amount), 2) AS \"revenue in 2024\"\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN firsts AS f\n  ON s.customer_key = f.customer_key\nWHERE\n  s.order_date >= CAST('2024-01-01'\
  \ AS DATE)\n  AND s.order_date < CAST('2025-01-01' AS DATE)\nGROUP BY\n  1\nORDER BY\n  2 DESC"
