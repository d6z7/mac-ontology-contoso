- stage: understood_as
  status: ok
  ms: 0
  summary: ''
  detail:
    prose: Split customers into two groups by when they first bought — those whose first purchase was
      before 2024 ("older than 2024") and those whose first purchase fell in 2024 — and show each group's
      total revenue booked in calendar year 2024, side by side. Two rows, one per group. Customers with
      no purchase in 2024 contribute nothing, and customers who first bought after 2024 are not in either
      group.
    population: 'Sales lines placed between 2024-01-01 and 2024-12-31 inclusive, dated by order_date,
      by customers assigned to a group on their first-ever order date read across the bundle''s whole
      history (2016-05-18 to 2025-12-31). Restrictions I applied, and where each came from: (1) net of
      discount, `net_amount`, because net_revenue.default.revenue_means_net declares an unqualified "revenue"
      to be net — gross gives 19,779,914.64 and 13,851,533.83; (2) order date, not delivery date, for
      both the 2024 window and the first-purchase date, because order.default.period_is_order_date declares
      `default: ordered` — the delivery basis gives 18,682,978.61 and 13,001,979.52 and shifts 278 of
      52,189 customers between cohorts; (3) NO channel filter: both the physical shops and the web shop
      are in both rows, because store.resolution.the_channel_is_the_location_sentinel scopes its `physical`
      default with `applies: subject` and the operator''s 2026-10-18 ruling makes an unqualified revenue
      question span both channels. Outside the two rows: the 4,865 customers whose first purchase fell
      in 2025 (no 2024 purchase, so zero either way) and the 52,801 of 104,990 registered customers who
      have never bought. Inside the older group, 33,273 of its 41,392 members placed no 2024 order and
      contribute nothing. The two rows are exhaustive of calendar 2024 — their shares sum to 100% of 31,639,690.93.'
