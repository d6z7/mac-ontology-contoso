        )\nSELECT\n  CASE\n    WHEN f.first_order_date < CAST('2024-01-01' AS DATE)\n    THEN 'customers\
        \ older than 2024'\n    ELSE 'customers who first bought in 2024'\n  END AS customer_group,\n\
        \  ROUND(SUM(y.net_amount), 2) AS revenue_in_2024,\n  COUNT(DISTINCT y.customer_key) AS customers_contributing,\n\
        \  ROUND(100 * SUM(y.net_amount) / SUM(SUM(y.net_amount)) OVER (), 2) AS share_of_2024_pct\nFROM\
        \ y2024 AS y\nJOIN firsts AS f\n  ON y.customer_key = f.customer_key\nGROUP BY\n  1\nORDER BY\n\
