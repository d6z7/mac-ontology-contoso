  population_actually_answered: 'The denominator under both readings is every row of contoso_served.v_contoso5_sales_line
    — all 223,974 sales lines, 93,470 orders, both channels, all five transaction currencies, the full
    order-date extent 2016-05-18 to 2025-12-31, nothing excluded. It came back as 218,814,471.66, matching
    step 1 exactly, which proves the four dimension joins caused no row fan-out. The numerator is computed
    over TWO populations, because I declined to choose one: (a) lines whose CUSTOMER is resident in Germany
