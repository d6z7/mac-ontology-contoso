  detail:
    plan:
      sql: "-- step 1\nSELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  SUM(net_amount)\
        \ AS total_net_amount,\n  MIN(order_date) AS first_order_date,\n  MAX(order_date) AS last_order_date\n\
        FROM contoso_served.v_contoso5_sales_line\n\n-- step 2\nSELECT\n  SUM(net_amount) AS total_net_revenue,\n\
        \  MIN(order_date) AS first_order_date,\n  MAX(order_date) AS last_order_date\nFROM contoso_served.v_contoso5_sales_line\n\
        \n-- step 3\nSELECT\n  SUM(l.net_amount) AS total_net_revenue,\n  SUM(CASE WHEN cc.country_name\
        \ = 'Germany' THEN l.net_amount ELSE 0 END) AS germany_by_customer,\n  SUM(CASE WHEN sc.country_name\
        \ = 'Germany' THEN l.net_amount ELSE 0 END) AS germany_by_store,\n  SUM(CASE WHEN lc.country_name\
        \ = 'Germany' THEN l.net_amount ELSE 0 END) AS germany_by_site,\n  SUM(\n    CASE\n      WHEN\
        \ cc.country_name = 'Germany' AND l.channel = 'online'\n      THEN l.net_amount\n      ELSE 0\n\
        \    END\n  ) AS germany_customer_online,\n  SUM(\n    CASE\n      WHEN cc.country_name = 'Germany'\
        \ AND l.channel = 'physical'\n      THEN l.net_amount\n      ELSE 0\n    END\n  ) AS germany_customer_physical,\n\
        \  100.0 * SUM(CASE WHEN cc.country_name = 'Germany' THEN l.net_amount ELSE 0 END) / SUM(l.net_amount)\
        \ AS pct_by_customer,\n  100.0 * SUM(CASE WHEN sc.country_name = 'Germany' THEN l.net_amount ELSE\
        \ 0 END) / SUM(l.net_amount) AS pct_by_store,\n  100.0 * SUM(CASE WHEN lc.country_name = 'Germany'\
        \ THEN l.net_amount ELSE 0 END) / SUM(l.net_amount) AS pct_by_site\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_customer AS cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
        \ AS cc\n  ON cu.country_code = cc.country_code\nJOIN contoso_served.dim_store AS st\n  ON l.store_key\
        \ = st.store_key\nJOIN contoso_served.dim_country AS sc\n  ON st.country_code = sc.country_code\n\
        JOIN contoso_served.dim_location AS lo\n  ON st.location_code = lo.location_code\nJOIN contoso_served.dim_country\
        \ AS lc\n  ON lo.country_code = lc.country_code\n\n-- step 4\nSELECT\n  SUM(CASE WHEN cc.country_name\
        \ = 'Germany' THEN l.net_amount ELSE 0 END) AS germany_net_by_customer,\n  COUNT(DISTINCT CASE\
        \ WHEN cc.country_name = 'Germany' THEN l.order_key END) AS germany_orders_by_customer,\n  SUM(CASE\
        \ WHEN sc.country_name = 'Germany' THEN l.net_amount ELSE 0 END) AS germany_net_by_store,\n  COUNT(DISTINCT\
        \ CASE WHEN sc.country_name = 'Germany' THEN l.order_key END) AS germany_orders_by_store,\n  MIN(l.order_date)\
        \ AS first_order_date,\n  MAX(l.order_date) AS last_order_date\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_customer AS cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
        \ AS cc\n  ON cu.country_code = cc.country_code\nJOIN contoso_served.dim_store AS st\n  ON l.store_key\
        \ = st.store_key\nJOIN contoso_served.dim_country AS sc\n  ON st.country_code = sc.country_code\n\
        \n-- step 5\nSELECT\n  ROUND(\n    100.0 * SUM(CASE WHEN cc.country_name = 'Germany' THEN l.net_amount\
        \ ELSE 0 END) / SUM(l.net_amount),\n    2\n  ) AS pct_germany_by_customer_country,\n  ROUND(\n\
        \    100.0 * SUM(CASE WHEN sc.country_name = 'Germany' THEN l.net_amount ELSE 0 END) / SUM(l.net_amount),\n\
        \    2\n  ) AS pct_germany_by_store_country,\n  ROUND(SUM(CASE WHEN cc.country_name = 'Germany'\
        \ THEN l.net_amount ELSE 0 END), 2) AS germany_net_by_customer_country,\n  ROUND(SUM(CASE WHEN\
        \ sc.country_name = 'Germany' THEN l.net_amount ELSE 0 END), 2) AS germany_net_by_store_country,\n\
        \  ROUND(\n    SUM(\n      CASE\n        WHEN cc.country_name = 'Germany' AND l.channel = 'online'\n\
        \        THEN l.net_amount\n        ELSE 0\n      END\n    ),\n    2\n  ) AS the_disputed_amount_german_customers_online,\n\
        \  ROUND(SUM(l.net_amount), 2) AS total_net_revenue,\n  MIN(l.order_date) AS first_order_date,\n\
        \  MAX(l.order_date) AS last_order_date\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN\
        \ contoso_served.dim_customer AS cu\n  ON l.customer_key = cu.customer_key\nJOIN contoso_served.dim_country\
        \ AS cc\n  ON cu.country_code = cc.country_code\nJOIN contoso_served.dim_store AS st\n  ON l.store_key\
        \ = st.store_key\nJOIN contoso_served.dim_country AS sc\n  ON st.country_code = sc.country_code"
