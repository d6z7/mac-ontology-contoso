  what_it_calculated: '16 is the number of physical shops in Contoso''s store register that have stopped
    trading — one count per shop per trading period, each carrying a day it closed. Those 16 shops stood
    on 14 distinct places, so two places each held two shops that have since closed. All 16 closures are
    already in the past, between 2013-12-05 and 2019-11-03; none is a future closing date that would make
    a shop merely scheduled to shut. What the figure does NOT say: it is not how many closed in any given
    year (no date window is applied — it is the whole history of the register), it is not how many places
