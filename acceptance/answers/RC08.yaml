    value:
    - step: '1'
      sql: "SELECT\n  'every row in dim_store' AS population,\n  COUNT(*) AS store_rows,\n  COUNT(DISTINCT\
        \ store_key) AS premises,\n  COUNT(DISTINCT store_code) AS sites\nFROM contoso_served.dim_store\n\
        UNION ALL\nSELECT\n  'physical (declared default: store_code <> -1)',\n  COUNT(*),\n  COUNT(DISTINCT\
        \ store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\nWHERE\n  CAST(store_code\
        \ AS TEXT) <> '-1'\nUNION ALL\nSELECT\n  'online (store_code = -1)',\n  COUNT(*),\n  COUNT(DISTINCT\
        \ store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\nWHERE\n  CAST(store_code\
        \ AS TEXT) = '-1'\nUNION ALL\nSELECT\n  'physical + active (close_date IS NULL)',\n  COUNT(*),\n\
        \  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\nWHERE\n\
        \  CAST(store_code AS TEXT) <> '-1' AND close_date IS NULL\nUNION ALL\nSELECT\n  'physical + closed\
        \ (close_date IS NOT NULL)',\n  COUNT(*),\n  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\n\
        FROM contoso_served.dim_store\nWHERE\n  CAST(store_code AS TEXT) <> '-1' AND NOT close_date IS\
        \ NULL\nUNION ALL\nSELECT\n  'physical + shut (subset: status_annotation = Closed)',\n  COUNT(*),\n\
        \  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\nWHERE\n\
        \  CAST(store_code AS TEXT) <> '-1'\n  AND NOT close_date IS NULL\n  AND status_annotation = 'Closed'\n\
        UNION ALL\nSELECT\n  'physical + restructured (subset: status_annotation = Restructured)',\n \
        \ COUNT(*),\n  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\n\
        WHERE\n  CAST(store_code AS TEXT) <> '-1'\n  AND NOT close_date IS NULL\n  AND status_annotation\
        \ = 'Restructured'\nORDER BY\n  1"
