sql:
- "SELECT\n  COUNT(DISTINCT store_key) AS closed_stores,\n  COUNT(DISTINCT store_code) AS closed_sites,\n\
  \  COUNT(*) AS closed_rows,\n  SUM(CASE WHEN status_annotation = 'Closed' THEN 1 ELSE 0 END) AS shut_for_good,\n\
  \  SUM(CASE WHEN status_annotation = 'Restructured' THEN 1 ELSE 0 END) AS closed_and_reopened,\n  MIN(close_date)\
  \ AS earliest_closure,\n  MAX(close_date) AS latest_closure\nFROM contoso_served.dim_store\nWHERE\n\
  \  CAST(store_code AS TEXT) <> '-1' AND NOT close_date IS NULL"
- "SELECT\n  'every row in dim_store' AS population,\n  COUNT(*) AS store_rows,\n  COUNT(DISTINCT store_key)\
  \ AS premises,\n  COUNT(DISTINCT store_code) AS sites\nFROM contoso_served.dim_store\nUNION ALL\nSELECT\n\
  \  'physical (declared default: store_code <> -1)',\n  COUNT(*),\n  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT\
  \ store_code)\nFROM contoso_served.dim_store\nWHERE\n  CAST(store_code AS TEXT) <> '-1'\nUNION ALL\n\
  SELECT\n  'online (store_code = -1)',\n  COUNT(*),\n  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\n\
  FROM contoso_served.dim_store\nWHERE\n  CAST(store_code AS TEXT) = '-1'\nUNION ALL\nSELECT\n  'physical\
  \ + active (close_date IS NULL)',\n  COUNT(*),\n  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\n\
  FROM contoso_served.dim_store\nWHERE\n  CAST(store_code AS TEXT) <> '-1' AND close_date IS NULL\nUNION\
  \ ALL\nSELECT\n  'physical + closed (close_date IS NOT NULL)',\n  COUNT(*),\n  COUNT(DISTINCT store_key),\n\
  \  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\nWHERE\n  CAST(store_code AS TEXT) <> '-1'\
  \ AND NOT close_date IS NULL\nUNION ALL\nSELECT\n  'physical + shut (subset: status_annotation = Closed)',\n\
  \  COUNT(*),\n  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\n\
  WHERE\n  CAST(store_code AS TEXT) <> '-1'\n  AND NOT close_date IS NULL\n  AND status_annotation = 'Closed'\n\
  UNION ALL\nSELECT\n  'physical + restructured (subset: status_annotation = Restructured)',\n  COUNT(*),\n\
  \  COUNT(DISTINCT store_key),\n  COUNT(DISTINCT store_code)\nFROM contoso_served.dim_store\nWHERE\n\
  \  CAST(store_code AS TEXT) <> '-1'\n  AND NOT close_date IS NULL\n  AND status_annotation = 'Restructured'\n\
  ORDER BY\n  1"
- "SELECT\n  store_key,\n  store_code,\n  store_name,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation\nFROM contoso_served.dim_store\nWHERE\n  CAST(store_code AS TEXT) <> '-1' AND NOT\
  \ close_date IS NULL\nORDER BY\n  close_date,\n  store_key"
answer_sql: "SELECT\n  COUNT(DISTINCT store_key) AS closed_stores,\n  COUNT(DISTINCT store_code) AS closed_sites,\n\
  \  COUNT(*) AS closed_rows,\n  SUM(CASE WHEN status_annotation = 'Closed' THEN 1 ELSE 0 END) AS shut_for_good,\n\
  \  SUM(CASE WHEN status_annotation = 'Restructured' THEN 1 ELSE 0 END) AS closed_and_reopened,\n  MIN(close_date)\
  \ AS earliest_closure,\n  MAX(close_date) AS latest_closure\nFROM contoso_served.dim_store\nWHERE\n\
  \  CAST(store_code AS TEXT) <> '-1' AND NOT close_date IS NULL"
