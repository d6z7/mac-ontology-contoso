sql:
- "SELECT\n  CASE\n    WHEN EXISTS(\n      SELECT\n        1\n      FROM contoso_served.dim_store AS s\n\
  \      LEFT JOIN contoso_served.dim_country AS c\n        ON s.country_code = c.country_code\n     \
  \ LEFT JOIN contoso_served.v_contoso5_sales_line AS l\n        ON l.store_key = s.store_key\n      WHERE\n\
  \        s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\n      GROUP BY\n    \
  \    s.store_key,\n        s.store_name\n      HAVING\n        COUNT(l.order_key) = 0\n    )\n    THEN\
  \ 'yes'\n    ELSE 'no'\n  END AS any_hungarian_store_with_no_sales"
- "SELECT\n  store_key,\n  store_name,\n  location_code,\n  country_code,\n  state,\n  open_date,\n  close_date,\n\
  \  status_annotation,\n  square_metres\nFROM contoso_served.dim_store"
- "SELECT\n  s.store_key,\n  s.store_name,\n  s.location_code,\n  s.country_code,\n  c.country_name,\n\
  \  s.close_date\nFROM contoso_served.dim_store AS s\nLEFT JOIN contoso_served.dim_country AS c\n  ON\
  \ s.country_code = c.country_code\nWHERE\n  s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name)\
  \ = 'HUNGARY'"
- "SELECT\n  s.store_key,\n  s.store_name,\n  s.country_code\nFROM contoso_served.dim_store AS s\nLEFT\
  \ JOIN contoso_served.dim_country AS c\n  ON s.country_code = c.country_code\nWHERE\n  s.country_code\
  \ IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name,\n\
  \  s.country_code"
- "SELECT\n  s.store_key,\n  s.store_name,\n  COUNT(l.order_key) AS sales\nFROM contoso_served.dim_store\
  \ AS s\nLEFT JOIN contoso_served.dim_country AS c\n  ON s.country_code = c.country_code\nLEFT JOIN contoso_served.v_contoso5_sales_line\
  \ AS l\n  ON l.store_key = s.store_key\nWHERE\n  s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name)\
  \ = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name"
- "SELECT\n  s.store_key,\n  s.store_name,\n  COUNT(l.order_key) AS sales\nFROM contoso_served.dim_store\
  \ AS s\nLEFT JOIN contoso_served.dim_country AS c\n  ON s.country_code = c.country_code\nLEFT JOIN contoso_served.v_contoso5_sales_line\
  \ AS l\n  ON l.store_key = s.store_key\nWHERE\n  s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name)\
  \ = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name\nHAVING\n  COUNT(l.order_key) = 0"
- "SELECT\n  s.store_name AS store,\n  COUNT(l.order_key) AS sales\nFROM contoso_served.dim_store AS s\n\
  LEFT JOIN contoso_served.dim_country AS c\n  ON s.country_code = c.country_code\nLEFT JOIN contoso_served.v_contoso5_sales_line\
  \ AS l\n  ON l.store_key = s.store_key\nWHERE\n  s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name)\
  \ = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name\nHAVING\n  COUNT(l.order_key) = 0\nORDER BY\n\
  \  s.store_name"
answer_sql: "SELECT\n  CASE\n    WHEN EXISTS(\n      SELECT\n        1\n      FROM contoso_served.dim_store\
  \ AS s\n      LEFT JOIN contoso_served.dim_country AS c\n        ON s.country_code = c.country_code\n\
  \      LEFT JOIN contoso_served.v_contoso5_sales_line AS l\n        ON l.store_key = s.store_key\n \
  \     WHERE\n        s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\n      GROUP\
  \ BY\n        s.store_key,\n        s.store_name\n      HAVING\n        COUNT(l.order_key) = 0\n   \
  \ )\n    THEN 'yes'\n    ELSE 'no'\n  END AS any_hungarian_store_with_no_sales"
