        \ JOIN contoso_served.v_contoso5_sales_line AS l\n  ON l.store_key = s.store_key\nWHERE\n  s.country_code\
        \ IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name"
      params: {}
    - step: '5'
      sql: "SELECT\n  s.store_key,\n  s.store_name,\n  COUNT(l.order_key) AS sales\nFROM contoso_served.dim_store\
        \ AS s\nLEFT JOIN contoso_served.dim_country AS c\n  ON s.country_code = c.country_code\nLEFT\
        \ JOIN contoso_served.v_contoso5_sales_line AS l\n  ON l.store_key = s.store_key\nWHERE\n  s.country_code\
        \ IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name\n\
        HAVING\n  COUNT(l.order_key) = 0"
      params: {}
    - step: '6'
      sql: "SELECT\n  s.store_name AS store,\n  COUNT(l.order_key) AS sales\nFROM contoso_served.dim_store\
        \ AS s\nLEFT JOIN contoso_served.dim_country AS c\n  ON s.country_code = c.country_code\nLEFT\
        \ JOIN contoso_served.v_contoso5_sales_line AS l\n  ON l.store_key = s.store_key\nWHERE\n  s.country_code\
        \ IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\nGROUP BY\n  s.store_key,\n  s.store_name\n\
        HAVING\n  COUNT(l.order_key) = 0\nORDER BY\n  s.store_name"
      params: {}
    - step: '7'
      sql: "SELECT\n  CASE\n    WHEN EXISTS(\n      SELECT\n        1\n      FROM contoso_served.dim_store\
        \ AS s\n      LEFT JOIN contoso_served.dim_country AS c\n        ON s.country_code = c.country_code\n\
        \      LEFT JOIN contoso_served.v_contoso5_sales_line AS l\n        ON l.store_key = s.store_key\n\
        \      WHERE\n        s.country_code IN ('HU', 'HUN') OR UPPER(c.country_name) = 'HUNGARY'\n \
        \     GROUP BY\n        s.store_key,\n        s.store_name\n      HAVING\n        COUNT(l.order_key)\
