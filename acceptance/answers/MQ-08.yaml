        key and its reader-facing name. No sales are read here and no period applies: this is the full
        set that step 5 will subtract the 2024 sellers from. Colour is part of the SKU, so "E400 Green"
        and "E400 Orange" are two separate rows by design.'
      readings_taken:
      - word: products
        took: every row of dim_product — all 2,517 SKUs, with no restriction on status or launch date,
          as understood_as states
        could_also_mean: only currently active/available products, or only products that already existed
          during 2024
        declaration: 'No declaration settles this, but neither alternative is expressible: dim_product
          serves only product_key, product_code, product_name, manufacturer, brand, color, category_name,
          sub_category_name, list_cost, list_price. There is no status column, no discontinued flag and
          no launch date anywhere on the product, so the catalogue admits exactly one population and there
          is nothing to ask about. (The active/closed populations declared in store.resolution.active_is_the_absent_close_date
          bind close_date on dim_store and reach stores, not products.)'
      - word: product
        took: the SKU grain — product_key, 2,517 of them, which Product declares as 'the level the shelf
          knows it'
        could_also_mean: a model ignoring colour, e.g. treating 'E400 Green' and 'E400 Orange' as one
          product
        declaration: 'Color: ''the one attribute that on its own makes a new SKU — E400 Green and E400
          Orange are two products''. The SKU grain is declared, so this is not a fork.'
      blocked_by: []
    - step: '2'
      step_asks: sold
      turns:
      - why: Establish the sales line grain, how many products it ever reaches, and its date extent —
          and test whether any line looks cancelled or returned, which is the only expressible form of
          the "completed sales only" reading.
        did: "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT order_key) AS orders,\n  COUNT(DISTINCT product_key)\
          \ AS products_ever_sold,\n  MIN(order_date) AS first_order,\n  MAX(order_date) AS last_order,\n\
          \  MIN(quantity) AS min_qty,\n  SUM(CASE WHEN quantity <= 0 THEN 1 ELSE 0 END) AS non_positive_qty_lines,\n\
