  understood_as_in_human_words: Of all the products in the catalogue, I'm listing the ones that had no
    sales at all during calendar year 2024 — one row per product, names only, no figures. Products that
    sold in 2024, even once, are excluded; I'm not restricting the catalogue to currently active products
    or to products that already existed in 2024.
  population_actually_answered: 'All 2,517 rows of contoso_served.dim_product — the whole catalogue, with
    NO restriction on active status or launch date, because dim_product carries no status column, no discontinued
    flag and no launch date, so no narrower population is expressible — minus the 2,461 products carrying
    at least one line in contoso_served.v_contoso5_sales_line whose order_date falls between 2024-01-01
    and 2024-12-31 inclusive. That leaves exactly 56, verified by anti-join returning 56 rows and by 2,517
    − 2,461 with 0 orphan product keys. Inside 2024 I applied NO further restriction: both channels (physical
    shops and the web shop), every store including closed ones, all customers, all currencies, all quantities,
    no sale-status filter — one unit on one line anywhere excludes a product. I deliberately did NOT apply
    the `physical` channel default of store.resolution.the_channel_is_the_location_sentinel, because its
    `applies: subject` scopes it to questions whose subject is a Store and this question''s subject is
    Products; had I applied it, products sold only online would have been wrongly listed as unsold. The
    period column is order_date, not delivery_date, per order.default.period_is_order_date.'
