        orders, each line carrying one product and the date its order was placed, over the full ten-year
        extent from 2016-05-18 to 2025-12-31. No period, channel or product filter is applied here; this
        is the unrestricted sales population that step 3 will cut down to 2024. Each line carries exactly
        one product, so no collapsing is needed to reach products from it.
      readings_taken:
      - word: sold
        took: any order line recorded against the product, whatever its status — all 223,974 lines
        could_also_mean: only completed sales, excluding cancellations and returns
        declaration: 'No declaration settles it and the readings cannot differ: v_contoso5_sales_line
          serves no status, cancellation or return column, min(quantity) is 1, and 0 of 223,974 lines
          carry a non-positive quantity or net amount. Both readings select the identical 223,974 lines,
          so there is nothing to ask.'
      - word: NOT sold in 2024
        took: no sales during calendar 2024, regardless of other years — as understood_as states and as
          the question's own naming of the year implies
        could_also_mean: never sold in any year
        declaration: 'Measured here: all 2,517 catalogue products appear on the sales fact at some point
          over 2016-05-18 to 2025-12-31, so the ''never sold at all'' reading returns an EMPTY list —
          0 products. The two readings differ materially, but the question names the period explicitly
          and understood_as fixed it, so the reading is taken and the alternative''s figure is disclosed.'
      - word: sales
        took: the line grain of v_contoso5_sales_line, which is where every money and quantity measure
          is grounded
        could_also_mean: distinct orders (93,470) rather than lines (223,974)
        declaration: 'Immaterial to this question: the step only needs which products appear, and Order
          declares the relation is ''NOT collapsed, so each row it reads carries exactly one product''
          — so lines and orders reach the same product set.'
      blocked_by: []
    - step: '3'
      step_asks: in 2024
      turns:
      - why: Price both date readings of "in 2024" at once — how many products each admits, and the symmetric
          difference, which is precisely how many rows the column choice would move in the final list.
        did: "WITH p AS (\n  SELECT\n    product_key,\n    MAX(\n      CASE\n        WHEN order_date >=\
          \ CAST('2024-01-01' AS DATE)\n        AND order_date < CAST('2025-01-01' AS DATE)\n        THEN\
          \ 1\n        ELSE 0\n      END\n    ) AS ordered_2024,\n    MAX(\n      CASE\n        WHEN delivery_date\
          \ >= CAST('2024-01-01' AS DATE)\n        AND delivery_date < CAST('2025-01-01' AS DATE)\n  \
          \      THEN 1\n        ELSE 0\n      END\n    ) AS delivered_2024\n  FROM contoso_served.v_contoso5_sales_line\n\
          \  GROUP BY\n    product_key\n)\nSELECT\n  COUNT(*) AS products_ever_sold,\n  SUM(ordered_2024)\
          \ AS products_ordered_in_2024,\n  SUM(delivered_2024) AS products_delivered_in_2024,\n  SUM(CASE\
          \ WHEN ordered_2024 = 1 AND delivered_2024 = 0 THEN 1 ELSE 0 END) AS ordered_not_delivered,\n\
          \  SUM(CASE WHEN ordered_2024 = 0 AND delivered_2024 = 1 THEN 1 ELSE 0 END) AS delivered_not_ordered,\n\
          \  (\n    SELECT\n      COUNT(*)\n    FROM contoso_served.v_contoso5_sales_line\n    WHERE\n\
          \      order_date >= CAST('2024-01-01' AS DATE)\n      AND order_date < CAST('2025-01-01' AS\
          \ DATE)\n  ) AS lines_ordered_2024\nFROM p"
        came_back: '1 row(s): [{"products_ever_sold": 2517, "products_ordered_in_2024": 2461, "products_delivered_in_2024":
          2462, "ordered_not_delivered": 0, "delivered_not_ordered": 1, "lines_ordered_2024": 38109}]'
      settled_on: "SELECT\n  order_key,\n  line_number,\n  order_date,\n  product_key\nFROM contoso_served.v_contoso5_sales_line\n\
        WHERE\n  order_date >= CAST('2024-01-01' AS DATE)\n  AND order_date < CAST('2025-01-01' AS DATE)"
      means: 'Every sale placed during calendar year 2024 — 38,109 order lines dated 1 January to 31 December
        2024 inclusive, one row per line, each carrying the product sold. Those lines touch 2,461 of the
        2,517 catalogue products. Both channels are included: no channel predicate is applied, since the
        subject here is sales and not stores. Sales placed in 2023 but delivered in 2024 are excluded,
        and sales placed in 2024 but delivered in 2025 are included.'
      readings_taken:
      - word: in 2024
        took: calendar year 2024 by ORDER date — order_date from 2024-01-01 to 2024-12-31 inclusive, admitting
          2,461 products and leaving 56 unsold
        could_also_mean: by delivery date, which admits 2,462 products and leaves 55 unsold — one product
          ordered before 2024 but delivered inside it
        declaration: 'order.default.period_is_order_date declares `default: ordered` on order_date, because
          ''both dates are on every line and they differ, so the choice moves revenue between periods...
          Order date is the reporting convention''. The default applies and the one-row cost of the alternative
          is stated. Measured: 0 products ordered-in-2024-but-not-delivered-in-2024, 1 delivered-but-not-ordered.'
      - word: '2024'
        took: the calendar year, January to December
        could_also_mean: a fiscal year 2024
        declaration: 'Fiscal 2024 is not expressible in this bundle: no relation carries a fiscal year,
          period or calendar column, and order_date is the only column declared with `period_binding:
          True`, on which ''a grain (day/month/quarter/year) is computed''. There is nothing to ask about.'
      - word: in 2024
        took: a real window inside the data — the sales extent runs 2016-05-18 to 2025-12-31, so 2024
          is a complete year, not a partial or empty one
        could_also_mean: nothing else; recorded for the reader
        declaration: order.resolution.the_anchor_is_the_newest_order fixes the bundle's vintage at max(order_date)
          = 2025-12-31. 2024 is named absolutely, so no relative anchoring is involved.
      blocked_by: []
    - step: '4'
      step_asks: products ... sold in 2024
      turns:
      - why: Verify the pivot joins cleanly — that every product key on a 2024 sales line resolves to
          a catalogue row — since an orphan key would break the 2,517 minus 2,461 subtraction in step
          5.
        did: "WITH sold_2024 AS (\n  SELECT DISTINCT\n    s.product_key\n  FROM contoso_served.v_contoso5_sales_line\
          \ AS s\n  WHERE\n    s.order_date >= CAST('2024-01-01' AS DATE)\n    AND s.order_date < CAST('2025-01-01'\
          \ AS DATE)\n)\nSELECT\n  COUNT(*) AS distinct_products_on_2024_lines,\n  COUNT(p.product_key)\
          \ AS matched_to_catalogue,\n  SUM(CASE WHEN p.product_key IS NULL THEN 1 ELSE 0 END) AS orphan_keys,\n\
          \  (\n    SELECT\n      COUNT(*)\n    FROM contoso_served.dim_product\n  ) - COUNT(p.product_key)\
          \ AS catalogue_remainder\nFROM sold_2024 AS s\nLEFT JOIN contoso_served.dim_product AS p\n \
          \ ON s.product_key = p.product_key"
        came_back: '1 row(s): [{"distinct_products_on_2024_lines": 2461, "matched_to_catalogue": 2461,
          "orphan_keys": 0, "catalogue_remainder": 56}]'
      settled_on: "SELECT DISTINCT\n  s.product_key\nFROM contoso_served.v_contoso5_sales_line AS s\n\
        WHERE\n  s.order_date >= CAST('2024-01-01' AS DATE)\n  AND s.order_date < CAST('2025-01-01' AS\
        \ DATE)"
      means: 'The products that sold at least once during calendar 2024 — 2,461 rows, one per distinct
        product, each being a SKU that appears on at least one order line placed between 1 January and
        31 December 2024. How many times or how much each sold is deliberately not carried: this step
        only answers whether a product sold in 2024 at all, because step 5 needs membership and nothing
        more. All 2,461 keys resolve to catalogue rows, so the set is a strict subset of step 1''s 2,517.'
      readings_taken:
      - word: products ... sold in 2024
        took: sold at least once — any number of lines, any quantity, any channel, any store, any customer,
          any currency
        could_also_mean: sold above some threshold of units or revenue, which would move products with
          only token 2024 sales onto the unsold list
        declaration: 'The question sets no threshold and ''NOT sold'' is a plain absence, so no threshold
          is imposed. Disclosed because it is the boundary that defines the answer: a product with a single
          unit sold in 2024 counts as sold and is excluded from the final list.'
      - word: pivot to products
        took: the declared product_key edge, v_contoso5_sales_line.product_key = dim_product.product_key
        could_also_mean: no alternative route exists
        declaration: 'order__of__product and net_revenue__by__product both declare this join_rule, the
          latter as (1..N) -> (1) and verified in evidence/edge_measurements.json. Measured here: 0 orphan
          keys, so the hop loses no sale and invents no product.'
      blocked_by: []
    - step: '5'
      step_asks: products were NOT sold in 2024
      turns:
      - why: Perform the subtraction and read the actual rows — the catalogue products with no order line
          in calendar 2024 — rather than trusting the count of 56 from arithmetic alone.
        did: "SELECT\n  p.product_key,\n  p.product_name\nFROM contoso_served.dim_product AS p\nWHERE\n\
          \  NOT EXISTS(\n    SELECT\n      1\n    FROM contoso_served.v_contoso5_sales_line AS s\n  \
          \  WHERE\n      s.product_key = p.product_key\n      AND s.order_date >= CAST('2024-01-01' AS\
          \ DATE)\n      AND s.order_date < CAST('2025-01-01' AS DATE)\n  )\nORDER BY\n  p.product_name"
        came_back: '50 row(s) (first 8 of 50): [{"product_key": 1032, "product_name": "A. Datum All in
          One Digital Camera M200 Azure"}, {"product_key": 979, "product_name": "A. Datum Consumer Digital
          Camera E100 Pink"}, {"product_key": 1005, "product_name": "A. Datum Interchangeable lens Non-SLR
          Digital Camera X250 Orange"}, {"product_key": 984, "product_name": "A. Datum Point Shoot Digital
          Camera M500 Pink"}, {"product_key": 969, "product_name": "A. Datum SLR-like Digital Camera M400
          Grey"}, {"product_key": 983, "product_name": "A. Datum SLR-like Digital Camera M400 Pink"},
          {"product_key": 950, "product_name": "A. Datum Super-zoom Digital Camera X300 Black"}, {"product_key":
          2224, "product_name": "Adventure Works Chandelier M8150 Blue"}]  [capped at the row limit —
          there may be more]'
      - why: The previous result was capped at 50 of 56 rows, so I am collapsing the list into a single
          row to capture every name without truncation.
        did: "SELECT\n  COUNT(*) AS unsold_products,\n  LISTAGG(product_name, ' | '\n  ORDER BY\n    product_name)\
          \ AS names\nFROM (\n  SELECT\n    p.product_name\n  FROM contoso_served.dim_product AS p\n \
          \ WHERE\n    NOT EXISTS(\n      SELECT\n        1\n      FROM contoso_served.v_contoso5_sales_line\
          \ AS s\n      WHERE\n        s.product_key = p.product_key\n        AND s.order_date >= CAST('2024-01-01'\
