        came_back: '1 row(s): [{"lines": 223974, "orders": 93470, "products_ever_sold": 2517, "first_order":
          "2016-05-18", "last_order": "2025-12-31", "min_qty": 1, "non_positive_qty_lines": 0, "non_positive_net_lines":
          0}]'
      settled_on: "SELECT\n  order_key,\n  line_number,\n  order_date,\n  product_key\nFROM contoso_served.v_contoso5_sales_line"
