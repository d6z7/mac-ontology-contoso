      settled_on: "SELECT\n  color\nFROM contoso_served.dim_product\nGROUP BY\n  color\nORDER BY\n  color"
      means: The sixteen distinct colours catalogued products come in — one row per colour name, alphabetically,
        each standing for "at least one of the 2,517 products is this colour". No product count and no
        product name is carried, and the rows say nothing about how many products or how much revenue
        sits behind any colour.
      readings_taken:
      - word: colors
        took: the colour values exactly as the product row stores them, so 'Grey', 'Silver' and 'Silver
          Grey' are three separate colours
        could_also_mean: colour families a reader might expect merged — 'Silver Grey' folded into 'Silver'
