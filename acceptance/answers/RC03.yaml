  \ AS products_ever_sold\nFROM contoso_served.dim_product AS p\nLEFT JOIN contoso_served.v_contoso5_sales_line\
  \ AS s\n  ON s.product_key = p.product_key\nGROUP BY\n  p.color\nORDER BY\n  p.color"
