  subtitle: ''
  status: ok
  body:
    kind: prose
    value: 'The sixteen colours Contoso''s catalogue comes in — one row per colour name, each meaning
      "at least one of the 2,517 catalogued products is this colour". The query returned exactly 16 rows
      and the view I was shown lists the first 8 (Azure through Orange); the remaining 8 — Pink, Purple,
      Red, Silver, Silver Grey, Transparent, Yellow and White — come from the complete enumeration of
      the same unfiltered column by the column probe, which read all 16 distinct values in the same alphabetical
      order, and the two reads agree on the count and on every value they share. What this answer does
      NOT include: no count of products per colour and no revenue, since the question asked only for names;
      no claim that any colour is currently orderable, since this bundle holds no stock or product-status
      column; and no colour that some catalogue palette might list but no product is sold in, since the
      value-set relation the declarations name for this column does not exist in the database. The values
      stand as stored, so ''Grey'', ''Silver'' and ''Silver Grey'' are three separate colours.'
