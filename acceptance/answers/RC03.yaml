        "Silver", "Silver Grey", "Transparent", "White", "Yellow"]'
    - - shape
      - a list of names
    - - population it answered over
      - Every one of the 2,517 rows of contoso_served.dim_product — the full catalogue at SKU grain, with
        no restriction applied at any step. No stock, active or discontinued filter, because dim_product
        declares no such column; no "ever sold" filter, which I measured rather than assumed, finding
        all 2,517 catalogued products on at least one sales line and the same 16 colours either way; no
