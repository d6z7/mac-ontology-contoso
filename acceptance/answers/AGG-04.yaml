      figure here is its shop sales and its online sales combined. WHAT I DID NOT USE: delivery dates,
      which run six days further into 2026, and list prices, which are what products are catalogued at
      rather than what they sold for. One caution on reading it: volume does not track money here. Contoso''s
      products appear on 59,896 lines and take less than Adventure Works'' 22,362, and Southridge Video
      is third by lines but seventh by revenue — cheap-goods brands, not small ones.'
