sql:
- "SELECT\n  p.brand,\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand\n\
  ORDER BY\n  net_revenue DESC"
- "SELECT\n  order_key,\n  line_number,\n  order_date,\n  product_key,\n  channel,\n  net_amount\nFROM\
  \ contoso_served.v_contoso5_sales_line"
- "SELECT\n  p.brand,\n  SUM(s.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS\
  \ s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand"
- "SELECT\n  p.brand,\n  SUM(s.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS\
  \ s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand"
- "SELECT\n  p.brand,\n  SUM(s.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS\
  \ s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand\n\
  ORDER BY\n  net_revenue DESC"
answer_sql: "SELECT\n  p.brand,\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line\
