        \  net_amount\nFROM contoso_served.v_contoso5_sales_line\n\n-- step 2\nSELECT\n  p.brand,\n  SUM(s.net_amount)\
        \ AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_product\
        \ AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand\n\n-- step 3\nSELECT\n  p.brand,\n\
        \  SUM(s.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_product\
        \ AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand\n\n-- step 4\nSELECT\n  p.brand,\n\
        \  SUM(s.net_amount) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_product\
        \ AS p\n  ON s.product_key = p.product_key\nGROUP BY\n  p.brand\nORDER BY\n  net_revenue DESC\n\
        \n-- step 5\nSELECT\n  p.brand,\n  ROUND(SUM(s.net_amount), 2) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line\
