      in USD. The eleven figures add to 218,814,471.66 over 223,974 sales lines, which is every sale in
      the warehouse to the cent, so this is a complete split of the business rather than a sample or a
      top-N. WHAT I DID NOT TAKE OUT: this is after discount and after nothing else — no returns, refunds,
