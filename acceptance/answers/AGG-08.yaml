answer: 'Germany is well ahead of France — but by how much depends on one thing you did not say, so tell
  me which you meant and the pair of figures is ready either way: by "in Germany" and "in France", do
  you mean where the customer lives, or where the shop stands?


  • WHERE OUR CUSTOMERS LIVE — web orders included: Germany 24,638,830.18, France 6,674,724.85

  • WHERE OUR SHOPS STAND — walk-in sales only, because the web shop stands in no country: Germany 14,382,768.44,
  France 3,722,647.45


  There is no country recorded on a sale itself, which is why this has to be asked rather than assumed
  — a sale reaches a country either through the shop that rang it up or through the buyer who placed it.


  What the choice does NOT change: Germany leads France either way, and by much the same multiple — 3.7x
  on the customer reading, 3.9x on the shop reading. So if the comparison is what you are after, you have
  it already. The entire difference between the two readings is web-shop revenue, 10,256,061.74 for Germany
  and 2,952,077.40 for France; the walk-in figures are identical under both readings, because every sale
  in a German or French shop was made by a customer registered in that same country.


  All four figures are USD after discount, over every order from 2016-05-18 to 2025-12-31, since you named
  no period.'
