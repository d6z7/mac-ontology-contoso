sql:
- "SELECT\n  reading,\n  country,\n  SUM(net_amount) AS net_revenue\nFROM (\n  SELECT\n    'shop' AS reading,\n\
  \    c.country_name AS country,\n    l.net_amount\n  FROM contoso_served.v_contoso5_sales_line AS l\n\
  \  JOIN contoso_served.dim_store AS s\n    ON l.store_key = s.store_key\n  JOIN contoso_served.dim_country\
  \ AS c\n    ON s.country_code = c.country_code\n  WHERE\n    c.country_name IN ('Germany', 'France')\n\
  \  UNION ALL\n  SELECT\n    'buyer' AS reading,\n    c.country_name AS country,\n    l.net_amount\n\
  \  FROM contoso_served.v_contoso5_sales_line AS l\n  JOIN contoso_served.dim_customer AS cu\n    ON\
  \ l.customer_key = cu.customer_key\n  JOIN contoso_served.dim_country AS c\n    ON cu.country_code =\
  \ c.country_code\n  WHERE\n    c.country_name IN ('Germany', 'France')\n) AS t\nGROUP BY\n  reading,\n\
  \  country\nORDER BY\n  reading,\n  country"
- "SELECT\n  order_key,\n  line_number,\n  net_amount,\n  order_date,\n  customer_key,\n  store_key,\n\
  \  channel\nFROM contoso_served.v_contoso5_sales_line"
- "SELECT\n  'shop' AS reading,\n  c.country_name AS country,\n  l.order_key,\n  l.line_number,\n  l.net_amount,\n\
  \  l.order_date,\n  l.channel\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_store\
  \ AS s\n  ON l.store_key = s.store_key\nJOIN contoso_served.dim_country AS c\n  ON s.country_code =\
  \ c.country_code\nWHERE\n  c.country_name IN ('Germany', 'France')\nUNION ALL\nSELECT\n  'buyer' AS\
  \ reading,\n  c.country_name AS country,\n  l.order_key,\n  l.line_number,\n  l.net_amount,\n  l.order_date,\n\
