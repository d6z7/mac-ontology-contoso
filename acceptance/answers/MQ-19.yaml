- "SELECT\n  COUNT(*) AS shops,\n  ROUND(AVG(square_metres), 2) AS average_size_sqm,\n  MIN(square_metres)\
  \ AS smallest_sqm,\n  MAX(square_metres) AS largest_sqm\nFROM contoso_served.dim_store\nWHERE\n  location_code\
  \ <> -1 AND close_date IS NULL"
- "SELECT\n  store_key,\n  store_name,\n  country_code,\n  state,\n  square_metres\nFROM contoso_served.dim_store\n\
  WHERE\n  location_code <> -1 AND close_date IS NULL\nORDER BY\n  store_key"
