sql:
- 'SELECT COUNT(DISTINCT cycle.StoreCode) AS store, cycle.CloseDate

  FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY StoreCode ORDER BY OpenDate DESC)
  AS _mac_cycle_rank FROM contoso_served.dim_contoso_store) cycle

  WHERE cycle._mac_cycle_rank = 1 AND cycle.Status = :storestatus

  ORDER BY cycle.CloseDate ASC

  LIMIT 1'
