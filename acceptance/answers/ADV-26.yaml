        did: "WITH per_customer AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date,\n\
          \    SUM(net_amount) AS lifetime_net_revenue\n  FROM contoso_served.v_contoso5_sales_line\n\
          \  GROUP BY\n    customer_key\n)\nSELECT\n  COUNT(*) FILTER(WHERE\n    first_order_date > CAST('2024-01-01'\
          \ AS DATE)) AS cust_first_strictly_after,\n  COUNT(*) FILTER(WHERE\n    first_order_date >=\
          \ CAST('2024-01-01' AS DATE)) AS cust_first_on_or_after,\n  COUNT(*) FILTER(WHERE\n    first_order_date\
          \ = CAST('2024-01-01' AS DATE)) AS cust_first_on_the_cutoff_day,\n  ROUND(\n    SUM(lifetime_net_revenue)\
          \ FILTER(WHERE\n      first_order_date > CAST('2024-01-01' AS DATE)),\n    2\n  ) AS rev_strictly_after,\n\
          \  ROUND(\n    SUM(lifetime_net_revenue) FILTER(WHERE\n      first_order_date >= CAST('2024-01-01'\
          \ AS DATE)),\n    2\n  ) AS rev_on_or_after,\n  COUNT(*) FILTER(WHERE\n    first_order_date\
          \ >= CAST('2023-12-31' AS DATE)\n    AND first_order_date <= CAST('2024-01-01' AS DATE)) AS\
          \ cust_in_the_gap_neither_group,\n  ROUND(\n    SUM(lifetime_net_revenue) FILTER(WHERE\n   \
          \   first_order_date >= CAST('2023-12-31' AS DATE)\n      AND first_order_date <= CAST('2024-01-01'\
          \ AS DATE)),\n    2\n  ) AS rev_in_the_gap,\n  COUNT(*) FILTER(WHERE\n    first_order_date >\
          \ CAST('2024-01-01' AS DATE)\n    AND customer_key IN (\n      SELECT DISTINCT\n        customer_key\n\
          \      FROM contoso_served.v_contoso5_sales_line\n      WHERE\n        order_date < CAST('2023-12-31'\
          \ AS DATE)\n    )) AS overlap_group_a_and_b,\n  COUNT(*) AS all_customers_who_ever_bought\n\
          FROM per_customer"
