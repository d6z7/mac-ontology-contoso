  \ existing — purchased before 31.12.2023'\n      WHEN first_order_date > CAST('2024-01-01' AS DATE)\n\
  \      THEN '(b) new — first purchased after 01.01.2024'\n    END AS customer_group\n  FROM per_customer\n\
