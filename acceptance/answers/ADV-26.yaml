- id: thinking
  title: Every turn it took, and what came back
  subtitle: the reasoning a verdict can be re-examined from, without a model call
  status: ok
  body:
    kind: table
    value:
    - step: '1'
      step_asks: customers
      turns:
      - why: Establish the base population for step 1 — the customer register — and measure how many of
          those customers ever purchase, since every later step keys off purchase dates.
        did: "SELECT\n  (\n    SELECT\n      COUNT(*)\n    FROM contoso_served.dim_customer\n  ) AS customers_on_register,\n\
          \  (\n    SELECT\n      COUNT(DISTINCT customer_key)\n    FROM contoso_served.v_contoso5_sales_line\n\
          \  ) AS customers_with_a_purchase,\n  (\n    SELECT\n      MIN(order_date)\n    FROM contoso_served.v_contoso5_sales_line\n\
          \  ) AS first_order_date,\n  (\n    SELECT\n      MAX(order_date)\n    FROM contoso_served.v_contoso5_sales_line\n\
          \  ) AS last_order_date"
        came_back: '1 row(s): [{"customers_on_register": 104990, "customers_with_a_purchase": 52189, "first_order_date":
          "2016-05-18", "last_order_date": "2025-12-31"}]'
      settled_on: "SELECT\n  customer_key\nFROM contoso_served.dim_customer"
      means: 'Every person on Contoso''s customer register, one row per customer — 104,990 of them, the
        unfiltered starting set before any purchase-date condition is applied. Measured alongside it:
        only 52,189 of these people ever appear on a sale, so 52,801 registered customers have no purchase
        at all and can fall into neither the "existing" nor the "new" group. The sales these groups will
        later be measured over run 2016-05-18 to 2025-12-31, which places both cut-off dates inside the
        data rather than at its edge.'
      readings_taken:
      - word: customers
        took: the customer register, contoso_served.dim_customer, all 104,990 rows — the only declared
          Customer entity
        could_also_mean: the 52,189 customers who have actually bought something; the declaration on dim_customer.customer_key
          states outright that the register 'is not the buyer list'. This fork costs nothing here because
          steps 2 and 3 both filter on a purchase date, which removes the 52,801 non-buyers either way.
        declaration: 'Customer concept grounding: contoso_served.dim_customer key customer_key, 104,990
          rows, ''HALF HAVE NEVER ORDERED: 52,189 of the 104,990 appear on a sale'''
      blocked_by: []
    - step: '2'
      step_asks: having purchased before 31.12.2023
      turns:
      - why: Price both forks on this filter at once — strict `&lt; 31.12.2023` against `on or before`,
          and (to confirm it dissolves) "any purchase before" against "first purchase before" — in customers
          and in the lifetime revenue they carry.
        did: "WITH per_customer AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date,\n\
          \    SUM(net_amount) AS lifetime_net_revenue\n  FROM contoso_served.v_contoso5_sales_line\n\
          \  GROUP BY\n    customer_key\n)\nSELECT\n  COUNT(*) FILTER(WHERE\n    first_order_date < CAST('2023-12-31'\
          \ AS DATE)) AS cust_any_purchase_strictly_before,\n  COUNT(*) FILTER(WHERE\n    first_order_date\
          \ <= CAST('2023-12-31' AS DATE)) AS cust_any_purchase_on_or_before,\n  COUNT(*) FILTER(WHERE\n\
          \    first_order_date = CAST('2023-12-31' AS DATE)) AS cust_whose_first_purchase_is_the_cutoff_day,\n\
          \  ROUND(\n    SUM(lifetime_net_revenue) FILTER(WHERE\n      first_order_date < CAST('2023-12-31'\
          \ AS DATE)),\n    2\n  ) AS rev_strictly_before,\n  ROUND(\n    SUM(lifetime_net_revenue) FILTER(WHERE\n\
          \      first_order_date <= CAST('2023-12-31' AS DATE)),\n    2\n  ) AS rev_on_or_before,\n \
          \ (\n    SELECT\n      COUNT(DISTINCT customer_key)\n    FROM contoso_served.v_contoso5_sales_line\n\
          \    WHERE\n      order_date < CAST('2023-12-31' AS DATE)\n  ) AS cross_check_exists_form\n\
          FROM per_customer"
        came_back: '1 row(s): [{"cust_any_purchase_strictly_before": 41390, "cust_any_purchase_on_or_before":
          41392, "cust_whose_first_purchase_is_the_cutoff_day": 2, "rev_strictly_before": "193042649.52",
          "rev_on_or_before": "193043381.89", "cross_check_exists_form": 41390}]'
      settled_on: "SELECT DISTINCT\n  customer_key\nFROM contoso_served.v_contoso5_sales_line\nWHERE\n\
        \  order_date < CAST('2023-12-31' AS DATE)"
      means: 'The 41,390 customers who bought something from Contoso at least once before 31 December
        2023 — group (a), the "existing" customers. One row per customer, identified only by key. This
        is a membership list, not a measurement: no money is counted here. For scale, these are 41,390
        of the 52,189 people who have ever bought, and 41,390 of the 104,990 on the register; the lifetime
