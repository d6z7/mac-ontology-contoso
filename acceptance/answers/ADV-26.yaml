sql:
- "SELECT\n  'Purchased before 2023-12-31' AS customer_group,\n  SUM(s.net_amount) AS revenue\nFROM contoso_served.v_contoso5_sales_line\
  \ AS s\nWHERE\n  s.customer_key IN (\n    SELECT DISTINCT\n      customer_key\n    FROM contoso_served.v_contoso5_sales_line\n\
  \    WHERE\n      order_date < '2023-12-31'\n  )\nUNION ALL\nSELECT\n  'First purchased after 2024-01-01'\
  \ AS customer_group,\n  SUM(s.net_amount) AS revenue\nFROM contoso_served.v_contoso5_sales_line AS s\n\
  WHERE\n  s.customer_key IN (\n    SELECT\n      customer_key\n    FROM contoso_served.v_contoso5_sales_line\n\
  \    GROUP BY\n      customer_key\n    HAVING\n      MIN(order_date) > '2024-01-01'\n  )"
