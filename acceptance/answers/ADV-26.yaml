- id: sql_by_step
  title: The statements that ran, in walk order
  subtitle: ''
  status: ok
  body:
    kind: sql
    value:
    - step: '1'
      sql: "SELECT\n  customer_key\nFROM contoso_served.dim_customer"
      params: {}
    - step: '2'
      sql: "SELECT DISTINCT\n  customer_key\nFROM contoso_served.v_contoso5_sales_line\nWHERE\n  order_date\
        \ < CAST('2023-12-31' AS DATE)"
      params: {}
    - step: '3'
      sql: "SELECT\n  customer_key\nFROM contoso_served.v_contoso5_sales_line\nGROUP BY\n  customer_key\n\
        HAVING\n  MIN(order_date) > CAST('2024-01-01' AS DATE)"
      params: {}
    - step: '4'
      sql: "WITH group_a AS (\n  SELECT DISTINCT\n    customer_key\n  FROM contoso_served.v_contoso5_sales_line\n\
        \  WHERE\n    order_date < CAST('2023-12-31' AS DATE)\n)\nSELECT\n  ROUND(SUM(l.net_amount), 2)\
        \ AS revenue\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN group_a\n  USING (customer_key)"
      params: {}
    - step: '5'
      sql: "WITH group_b AS (\n  SELECT\n    customer_key\n  FROM contoso_served.v_contoso5_sales_line\n\
        \  GROUP BY\n    customer_key\n  HAVING\n    MIN(order_date) > CAST('2024-01-01' AS DATE)\n)\n\
        SELECT\n  ROUND(SUM(l.net_amount), 2) AS revenue\nFROM contoso_served.v_contoso5_sales_line AS\
        \ l\nJOIN group_b\n  USING (customer_key)"
      params: {}
    - step: '6'
      sql: "WITH per_customer AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n\
        \  FROM contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n), labelled AS (\n\
        \  SELECT\n    customer_key,\n    CASE\n      WHEN first_order_date < CAST('2023-12-31' AS DATE)\n\
        \      THEN '(a) existing — purchased before 31.12.2023'\n      WHEN first_order_date > CAST('2024-01-01'\
        \ AS DATE)\n      THEN '(b) new — first purchased after 01.01.2024'\n    END AS customer_group\n\
        \  FROM per_customer\n)\nSELECT\n  g.customer_group,\n  COUNT(DISTINCT l.customer_key) AS customers,\n\
        \  ROUND(SUM(l.net_amount), 2) AS revenue\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN\
        \ labelled AS g\n  USING (customer_key)\nWHERE\n  NOT g.customer_group IS NULL\nGROUP BY\n  g.customer_group\n\
        ORDER BY\n  revenue DESC"
      params: {}
    - step: '7'
      sql: "WITH per_customer AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n\
        \  FROM contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n), labelled AS (\n\
        \  SELECT\n    customer_key,\n    CASE\n      WHEN first_order_date < CAST('2023-12-31' AS DATE)\n\
        \      THEN '(a) existing — purchased before 31.12.2023'\n      WHEN first_order_date > CAST('2024-01-01'\
        \ AS DATE)\n      THEN '(b) new — first purchased after 01.01.2024'\n    END AS customer_group\n\
        \  FROM per_customer\n)\nSELECT\n  g.customer_group,\n  ROUND(SUM(l.net_amount), 2) AS revenue\n\
        FROM contoso_served.v_contoso5_sales_line AS l\nJOIN labelled AS g\n  USING (customer_key)\nWHERE\n\
        \  NOT g.customer_group IS NULL\nGROUP BY\n  g.customer_group\nORDER BY\n  revenue DESC"
      params: {}
    - step: '8'
      sql: "WITH per_customer AS (\n  SELECT\n    customer_key,\n    MIN(order_date) AS first_order_date\n\
        \  FROM contoso_served.v_contoso5_sales_line\n  GROUP BY\n    customer_key\n), labelled AS (\n\
        \  SELECT\n    customer_key,\n    CASE\n      WHEN first_order_date < CAST('2023-12-31' AS DATE)\n\
        \      THEN 'a'\n      WHEN first_order_date > CAST('2024-01-01' AS DATE)\n      THEN 'b'\n  \
        \  END AS grp\n  FROM per_customer\n)\nSELECT\n  ROUND(\n    SUM(l.net_amount) FILTER(WHERE\n\
        \      g.grp = 'a') - SUM(l.net_amount) FILTER(WHERE\n      g.grp = 'b'),\n    2\n  ) AS difference_in_revenue\n\
        FROM contoso_served.v_contoso5_sales_line AS l\nJOIN labelled AS g\n  USING (customer_key)\nWHERE\n\
        \  NOT g.grp IS NULL"
      params: {}
- id: what_it_calculated
  title: What it says its rows are
  subtitle: ''
  status: ok
  body:
    kind: prose
    value: 'Two rows: how much money Contoso has ever taken, after discount, from each of two groups of
      people. The 41,390 customers who were already buying before 31 December 2023 have paid 193,042,649.52
      USD. The 10,782 whose very first purchase came after 1 January 2024 have paid 25,732,927.48 USD.
      Each figure is that group''s WHOLE buying history rather than only the period that defined the group,
      so (a)''s total includes the 35,167,849.45 those existing customers went on to spend in 2024 and
      2025. The period covered is 2016-05-18 to 2025-12-31, the full extent of order dates in this bundle,
      and both the web shop and the physical shops are counted. WHAT IS NOT IN THESE FIGURES: discount,
      which is already deducted — gross would be 205,222,088.74 and 27,337,846.80; the 17 buyers whose
      first purchase fell on or between the two cut-off days, worth 38,894.66, who are in neither row;
      and the 52,801 people on the customer register who have never bought anything, who have no revenue
      to report. THE COMPARISON IS NOT LIKE-FOR-LIKE ON TIME: group (a) has had up to ten years to spend
      and group (b) about two, which is why per customer — 4,663.99 against 2,386.66 — the gap narrows
      from 7.5-to-1 to 2.0-to-1.'
