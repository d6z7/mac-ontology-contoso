sql:
- 'SELECT dim_contoso_product.Brand, dim_contoso_customer.Country, SUM(f."Quantity"
  * f."NetPrice")     AS net_sales_amount

  FROM contoso_served.v_contoso_order_line f

  JOIN contoso_served.dim_contoso_product ON f.ProductKey = dim_contoso_product.ProductKey

  JOIN contoso_served.dim_contoso_customer ON f.CustomerKey = dim_contoso_customer.CustomerKey

  WHERE f.OrderDate >= :period_start AND f.OrderDate < :period_end

  GROUP BY dim_contoso_product.Brand, dim_contoso_customer.Country'
