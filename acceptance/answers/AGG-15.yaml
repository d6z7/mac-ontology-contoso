sql:
- "SELECT\n  p.brand,\n  c.country_name AS customer_country,\n  SUM(s.net_amount) AS net_revenue\nFROM\
  \ contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
  \ = p.product_key\nJOIN contoso_served.dim_customer AS cu\n  ON s.customer_key = cu.customer_key\nJOIN\
  \ contoso_served.dim_country AS c\n  ON cu.country_code = c.country_code\nWHERE\n  s.order_date BETWEEN\
  \ CAST('2024-01-01' AS DATE) AND CAST('2024-12-31' AS DATE)\n  AND c.is_placeholder = FALSE\nGROUP BY\n\
  \  p.brand,\n  c.country_name\nORDER BY\n  p.brand ASC,\n  net_revenue DESC"
- "SELECT\n  *\nFROM contoso_served.v_contoso5_sales_line AS s"
