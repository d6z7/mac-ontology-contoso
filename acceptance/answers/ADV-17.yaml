sql:
- "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code END) AS how_many_countries_sold_in\n\
  FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key\
  \ = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key = s.store_key\nGROUP BY\n  p.brand\n\
  HAVING\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code END) = (\n    SELECT\n\
  \      COUNT(DISTINCT country_code)\n    FROM contoso_served.dim_country\n    WHERE\n      country_code\
  \ <> '--'\n  )\nORDER BY\n  p.brand"
- "SELECT\n  country_code,\n  country_name\nFROM contoso_served.dim_country\nWHERE\n  country_code <>\
  \ '--'\nORDER BY\n  country_code"
- "SELECT\n  COUNT(DISTINCT country_code) AS how_many_countries\nFROM contoso_served.dim_country\nWHERE\n\
  \  country_code <> '--'"
- "SELECT\n  l.order_key,\n  l.line_number,\n  p.brand,\n  CASE WHEN s.country_code <> '--' THEN s.country_code\
  \ END AS store_country,\n  cu.country_code AS customer_country\nFROM contoso_served.v_contoso5_sales_line\
  \ AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_store\
  \ AS s\n  ON l.store_key = s.store_key\nJOIN contoso_served.dim_customer AS cu\n  ON l.customer_key\
  \ = cu.customer_key"
- "SELECT\n  p.brand\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
  \ AS p\n  ON l.product_key = p.product_key\nGROUP BY\n  p.brand"
- "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code END) AS how_many_countries_sold_in\n\
  FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key\
  \ = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key = s.store_key\nGROUP BY\n  p.brand"
- "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code END) AS how_many_countries_sold_in\n\
  FROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key\
  \ = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key = s.store_key\nGROUP BY\n  p.brand\n\
  HAVING\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code END) = (\n    SELECT\n\
  \      COUNT(DISTINCT country_code)\n    FROM contoso_served.dim_country\n    WHERE\n      country_code\
  \ <> '--'\n  )"
answer_sql: "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code\
  \ END) AS how_many_countries_sold_in\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
  \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key = s.store_key\n\
  GROUP BY\n  p.brand\nHAVING\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code END)\
  \ = (\n    SELECT\n      COUNT(DISTINCT country_code)\n    FROM contoso_served.dim_country\n    WHERE\n\
  \      country_code <> '--'\n  )\nORDER BY\n  p.brand"
