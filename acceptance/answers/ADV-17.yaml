        \ <> '--'\nORDER BY\n  country_code"
      params: {}
    - step: '2'
      sql: "SELECT\n  COUNT(DISTINCT country_code) AS how_many_countries\nFROM contoso_served.dim_country\n\
        WHERE\n  country_code <> '--'"
      params: {}
    - step: '3'
      sql: "SELECT\n  l.order_key,\n  l.line_number,\n  p.brand,\n  CASE WHEN s.country_code <> '--' THEN\
        \ s.country_code END AS store_country,\n  cu.country_code AS customer_country\nFROM contoso_served.v_contoso5_sales_line\
        \ AS l\nJOIN contoso_served.dim_product AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_store\
        \ AS s\n  ON l.store_key = s.store_key\nJOIN contoso_served.dim_customer AS cu\n  ON l.customer_key\
        \ = cu.customer_key"
      params: {}
    - step: '4'
      sql: "SELECT\n  p.brand\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nGROUP BY\n  p.brand"
      params: {}
    - step: '5'
      sql: "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code\
        \ END) AS how_many_countries_sold_in\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key\
        \ = s.store_key\nGROUP BY\n  p.brand"
      params: {}
    - step: '6'
      sql: "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code\
        \ END) AS how_many_countries_sold_in\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key\
        \ = s.store_key\nGROUP BY\n  p.brand\nHAVING\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--'\
        \ THEN s.country_code END) = (\n    SELECT\n      COUNT(DISTINCT country_code)\n    FROM contoso_served.dim_country\n\
        \    WHERE\n      country_code <> '--'\n  )"
      params: {}
    - step: '7'
      sql: "SELECT\n  p.brand,\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--' THEN s.country_code\
        \ END) AS how_many_countries_sold_in\nFROM contoso_served.v_contoso5_sales_line AS l\nJOIN contoso_served.dim_product\
        \ AS p\n  ON l.product_key = p.product_key\nJOIN contoso_served.dim_store AS s\n  ON l.store_key\
        \ = s.store_key\nGROUP BY\n  p.brand\nHAVING\n  COUNT(DISTINCT CASE WHEN s.country_code <> '--'\
        \ THEN s.country_code END) = (\n    SELECT\n      COUNT(DISTINCT country_code)\n    FROM contoso_served.dim_country\n\
        \    WHERE\n      country_code <> '--'\n  )\nORDER BY\n  p.brand"
      params: {}
