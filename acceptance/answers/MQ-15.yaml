sql:
- "WITH anchor AS (\n  SELECT\n    MAX(order_date) AS as_of\n  FROM contoso_served.v_contoso5_sales_line\n\
  ), aged AS (\n  SELECT\n    DATE_DIFF('YEAR', c.birth_date, a.as_of) - CASE\n      WHEN (\n        MONTH(a.as_of)\
  \ * 100 + DAY(a.as_of)\n      ) < (\n        MONTH(c.birth_date) * 100 + DAY(c.birth_date)\n      )\n\
  \      THEN 1\n      ELSE 0\n    END AS age\n  FROM contoso_served.dim_customer AS c\n  CROSS JOIN anchor\
  \ AS a\n)\nSELECT\n  ROUND(AVG(age), 2) AS average_customer_age\nFROM aged"
- "SELECT\n  customer_key,\n  birth_date\nFROM contoso_served.dim_customer"
