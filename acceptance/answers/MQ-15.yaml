sql:
- "WITH as_of AS (\n  SELECT\n    MAX(order_date) AS ref_date\n  FROM contoso_served.v_contoso5_sales_line\n\
  )\nSELECT\n  ROUND(AVG(DATE_PART('year', AGE(a.ref_date, c.birth_date))), 2) AS average_customer_age\n\
  FROM contoso_served.dim_customer AS c\nCROSS JOIN as_of AS a\nWHERE\n  c.valid_from <= a.ref_date AND\
  \ c.valid_end > a.ref_date"
