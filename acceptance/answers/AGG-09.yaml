sql:
- "SELECT\n  p.brand,\n  SUM(s.net_amount) AS total_sold\nFROM contoso_served.v_contoso5_sales_line AS\
  \ s\nJOIN contoso_served.dim_product AS p\n  ON s.product_key = p.product_key\nWHERE\n  p.brand IN ('Contoso',\
