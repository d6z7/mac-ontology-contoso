answer: 'The data does not hold what this question asks.


  cities: a city or town column on the store or on its site. `dim_store` serves only store_key, location_code,
  store_name, country_code, state, open_date, close_date, status_annotation, square_metres; `dim_location`
  serves only location_code, country_code, country_name, state, units_ever_here. Neither holds a city,
  and `dim_location.location_code` is an INTEGER site code that would answer ''12, 13, 14'' if bound to
  ''which cities''. The only city in the bundle is `dim_customer.city` (34,581 values, 453 French) which
  is (a) where a CUSTOMER lives, not where a shop stands, and (b) declared suppressed under DQ-IDENTIFYING-DIM_CUSTOMER-CITY
  and must not appear in an answer.'
