    sql: "SELECT\n  p.product_name\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_country\
      \ AS c\n  ON s.sale_country_code = c.country_code\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
      \ = p.product_key\nWHERE\n  c.country_name IN ('Germany', 'France')\nGROUP BY\n  p.product_key,\n\
      \  p.product_name\nHAVING\n  COUNT(DISTINCT c.country_name) = 2\nORDER BY\n  p.product_name"
    params: {}
  what_it_calculated: '1840 distinct products (by product_name) that had at least one sale attributed
    to Germany AND at least one sale attributed to France, over all time, both channels included. Attribution
    is by territory: shop sales go to the shop''s country, online sales to the customer''s country.'
  rows_returned: &id004
