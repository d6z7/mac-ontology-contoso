      but never by both countries'' shops. No money and no units are in these rows, and no period was
      cut: each row asserts only joint presence in two countries'' assortments over the whole order history
      2016-05-18 to 2025-12-31. What I did NOT include: products sold in only one of the two countries
      or in neither, any per-country sales figure, any brand or category rollup, and any narrowing to
      a recent window.'
- stage: evaluate
