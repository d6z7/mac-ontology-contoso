    why: '''sold in'' = Products with at least one recorded sale attributed to that country, via sale_country_code'
  - id: 'dim_product.product_name as:common is #1 in preference order'
    why: '''products'' = Distinct product_name from dim_product, one row per product'
  edges: []
sql:
- "SELECT\n  p.product_name\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_country\
  \ AS c\n  ON s.sale_country_code = c.country_code\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
  \ = p.product_key\nWHERE\n  c.country_name IN ('Germany', 'France')\nGROUP BY\n  p.product_key,\n  p.product_name\n\
  HAVING\n  COUNT(DISTINCT c.country_name) = 2\nORDER BY\n  p.product_name"
- "SELECT DISTINCT\n  p.product_key,\n  p.product_name\nFROM contoso_served.dim_product AS p"
- "SELECT DISTINCT\n  p.product_key,\n  p.product_name\nFROM contoso_served.dim_product AS p\nJOIN contoso_served.v_contoso5_sales_line\
  \ AS s\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_country AS c\n  ON s.sale_country_code\
  \ = c.country_code\nWHERE\n  c.country_name = 'Germany'"
- "SELECT DISTINCT\n  p.product_key,\n  p.product_name\nFROM contoso_served.dim_product AS p\nJOIN contoso_served.v_contoso5_sales_line\
  \ AS s\n  ON s.product_key = p.product_key\nJOIN contoso_served.dim_country AS c\n  ON s.sale_country_code\
  \ = c.country_code\nWHERE\n  c.country_name = 'France'"
answer_sql: "SELECT\n  p.product_name\nFROM contoso_served.v_contoso5_sales_line AS s\nJOIN contoso_served.dim_country\
  \ AS c\n  ON s.sale_country_code = c.country_code\nJOIN contoso_served.dim_product AS p\n  ON s.product_key\
  \ = p.product_key\nWHERE\n  c.country_name IN ('Germany', 'France')\nGROUP BY\n  p.product_key,\n  p.product_name\n\
  HAVING\n  COUNT(DISTINCT c.country_name) = 2\nORDER BY\n  p.product_name"
