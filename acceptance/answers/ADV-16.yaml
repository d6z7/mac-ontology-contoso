  raw: 'Which "sold in Germany and France" did you mean — the shop that sold it, or the customer who bought
    it? I built both lists and will not choose between them, because they are different lengths. (a) SOLD
    BY OUR GERMAN AND FRENCH SHOPS — a shop in Germany rang it up and a shop in France did too: 1,437
    products. (b) SOLD TO GERMAN AND FRENCH CUSTOMERS — a customer living in Germany bought it and a customer
    living in France bought it, web-shop orders included: 1,840 products. The fork cuts between colour
    variants of the same model, so it is not a cosmetic difference: of the first few rows alphabetically,
    "A. Datum Advanced Digital Camera M300" in Azure, Green and Grey is on BOTH lists, while the same
    camera in Black and Orange is on list (b) only. WHAT THE CHOICE DOES NOT CHANGE: all 1,437 products
    on list (a) are also on list (b), so choosing never drops a product — it only decides whether 403
    further products join, and those 403 reached both countries'' customers only through the web shop,
    which carries no country of its own. It also does not change the period (all time, 2016-05-18 to 2025-12-31,
    on order date), the grain (one row per SKU; names are unique 1:1 with product keys, so the list is
    faithful), or the starting set (all 2,517 catalogue products have sold somewhere). Say "shops" for
    the 1,437 or "customers" for the 1,840 and I will hand you that list of names.'
