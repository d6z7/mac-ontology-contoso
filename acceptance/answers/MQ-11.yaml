      that no buyer in this bundle has ever bought from a physical shop outside their own country, so
      these figures are simply each country''s physical-shop revenue. WHAT IS NOT IN THEM: the web shop,
      93,550 sales lines and 86,790,054.13 — 40% of all recorded revenue — which the condition removed
      because the web shop''s country is the ''--'' sentinel that no customer can match. Also not included:
      gross revenue before discount, any currency conversion (the amounts are USD as stored), and no period
      was narrowed away.'
