    value: 'Eight rows, one per country, each saying how much money Contoso actually took — net of discount,
      in USD — from sales rung up at physical shops standing in that country to buyers who live in that
      same country, across all ten years on record, 2016-05-18 to 2025-12-31. The eight add to 132,024,417.53.
