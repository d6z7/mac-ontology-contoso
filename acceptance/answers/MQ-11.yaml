sql:
- "SELECT\n  dc.country_name AS country,\n  SUM(sl.net_amount) AS revenue\nFROM contoso_served.v_contoso5_sales_line\
  \ AS sl\nJOIN contoso_served.dim_customer AS cust\n  ON sl.customer_key = cust.customer_key\nJOIN contoso_served.dim_store\
  \ AS st\n  ON sl.store_key = st.store_key\nJOIN contoso_served.dim_country AS dc\n  ON cust.country_code\
  \ = dc.country_code\nWHERE\n  cust.country_code = st.country_code\nGROUP BY\n  dc.country_name\nORDER\
  \ BY\n  revenue DESC"
