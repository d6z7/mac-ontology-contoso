- stage: plan
  status: ok
  ms: 0
  summary: 6 statement(s), one per settled step · walk order 1 -> 2 -> 3 -> 4 -> 5 -> 6
  detail:
    plan:
      sql: "-- step 1\nSELECT\n  COUNT(*) AS customer_rows,\n  COUNT(DISTINCT customer_key) AS distinct_customers,\n\
        \  COUNT(DISTINCT country_code) AS distinct_country_codes,\n  SUM(CASE WHEN country_code IS NULL\
        \ THEN 1 ELSE 0 END) AS null_country\nFROM contoso_served.dim_customer\n\n-- step 2\nSELECT\n\
        \  COUNT(*) AS kept_lines,\n  COUNT(DISTINCT f.customer_key) AS kept_customers,\n  COUNT(DISTINCT\
        \ c.country_code) AS kept_countries,\n  ROUND(SUM(f.net_amount), 2) AS net_revenue,\n  SUM(CASE\
        \ WHEN c.country_code <> s.country_code THEN 1 ELSE 0 END) AS mismatched_lines_kept,\n  MIN(f.order_date)\
        \ AS first_order,\n  MAX(f.order_date) AS last_order\nFROM contoso_served.v_contoso5_sales_line\
        \ AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store\
        \ AS s\n  ON f.store_key = s.store_key\nWHERE\n  c.country_code = s.country_code\n\n-- step 3\n\
        SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT (\n    CAST(f.order_key AS TEXT) || ':' || CAST(f.line_number\
        \ AS TEXT)\n  )) AS distinct_line_keys,\n  ROUND(SUM(f.net_amount), 2) AS net_revenue,\n  ROUND(SUM(f.gross_amount),\
        \ 2) AS gross_revenue_for_contrast,\n  COUNT(DISTINCT f.currency_code) AS transaction_currencies\n\
        FROM contoso_served.v_contoso5_sales_line AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key\
        \ = c.customer_key\nJOIN contoso_served.dim_store AS s\n  ON f.store_key = s.store_key\nWHERE\n\
        \  c.country_code = s.country_code\n\n-- step 4\nSELECT\n  cc.country_name,\n  c.country_code\
        \ AS customer_country,\n  s.country_code AS store_country,\n  COUNT(*) AS lines,\n  COUNT(DISTINCT\
        \ f.customer_key) AS buyers,\n  ROUND(SUM(f.net_amount), 2) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line\
        \ AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store\
        \ AS s\n  ON f.store_key = s.store_key\nJOIN contoso_served.dim_country AS cc\n  ON c.country_code\
        \ = cc.country_code\nWHERE\n  c.country_code = s.country_code\nGROUP BY\n  1,\n  2,\n  3\nORDER\
        \ BY\n  net_revenue DESC\n\n-- step 5\nSELECT\n  cc.country_name,\n  ROUND(SUM(CASE WHEN s.country_code\
        \ = c.country_code THEN f.net_amount ELSE 0 END), 2) AS revenue_buyer_matches_shop_country,\n\
        \  ROUND(SUM(f.net_amount), 2) AS revenue_all_sales_by_buyer_country,\n  ROUND(SUM(CASE WHEN s.country_code\
        \ = '--' THEN f.net_amount ELSE 0 END), 2) AS web_shop_revenue_in_the_gap\nFROM contoso_served.v_contoso5_sales_line\
        \ AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store\
        \ AS s\n  ON f.store_key = s.store_key\nJOIN contoso_served.dim_country AS cc\n  ON c.country_code\
        \ = cc.country_code\nGROUP BY\n  1\nORDER BY\n  3 DESC\n\n-- step 6\nSELECT\n  cc.country_name\
        \ AS country,\n  ROUND(SUM(CASE WHEN s.country_code = c.country_code THEN f.net_amount ELSE 0\
        \ END), 2) AS revenue_buyer_matches_shop_country,\n  ROUND(SUM(f.net_amount), 2) AS revenue_all_sales_by_buyer_country,\n\
        \  ROUND(SUM(CASE WHEN s.country_code = '--' THEN f.net_amount ELSE 0 END), 2) AS web_shop_revenue_in_the_gap\n\
        FROM contoso_served.v_contoso5_sales_line AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key\
        \ = c.customer_key\nJOIN contoso_served.dim_store AS s\n  ON f.store_key = s.store_key\nJOIN contoso_served.dim_country\
        \ AS cc\n  ON c.country_code = cc.country_code\nGROUP BY\n  1\nORDER BY\n  2 DESC"
