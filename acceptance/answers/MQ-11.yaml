sql:
- 'SELECT dim_contoso_customer.Country, SUM(f."Quantity" * f."NetPrice")     AS net_sales_amount

  FROM contoso_served.v_contoso_order_line f

  JOIN contoso_served.dim_contoso_customer ON f.CustomerKey = dim_contoso_customer.CustomerKey

  JOIN contoso_served.dim_contoso_store ON f.StoreKey = dim_contoso_store.StoreKey

  WHERE dim_contoso_customer.CustomerKey = dim_contoso_store.CountryCode

  GROUP BY dim_contoso_customer.Country'
