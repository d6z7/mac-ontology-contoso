- id: sql_by_step
  title: The statements that ran, in walk order
  subtitle: ''
  status: ok
  body:
    kind: sql
    value:
    - step: '1'
      sql: "SELECT\n  COUNT(*) AS customer_rows,\n  COUNT(DISTINCT customer_key) AS distinct_customers,\n\
        \  COUNT(DISTINCT country_code) AS distinct_country_codes,\n  SUM(CASE WHEN country_code IS NULL\
        \ THEN 1 ELSE 0 END) AS null_country\nFROM contoso_served.dim_customer"
      params: {}
    - step: '2'
      sql: "SELECT\n  COUNT(*) AS kept_lines,\n  COUNT(DISTINCT f.customer_key) AS kept_customers,\n \
        \ COUNT(DISTINCT c.country_code) AS kept_countries,\n  ROUND(SUM(f.net_amount), 2) AS net_revenue,\n\
        \  SUM(CASE WHEN c.country_code <> s.country_code THEN 1 ELSE 0 END) AS mismatched_lines_kept,\n\
        \  MIN(f.order_date) AS first_order,\n  MAX(f.order_date) AS last_order\nFROM contoso_served.v_contoso5_sales_line\
        \ AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store\
        \ AS s\n  ON f.store_key = s.store_key\nWHERE\n  c.country_code = s.country_code"
      params: {}
    - step: '3'
      sql: "SELECT\n  COUNT(*) AS lines,\n  COUNT(DISTINCT (\n    CAST(f.order_key AS TEXT) || ':' ||\
        \ CAST(f.line_number AS TEXT)\n  )) AS distinct_line_keys,\n  ROUND(SUM(f.net_amount), 2) AS net_revenue,\n\
        \  ROUND(SUM(f.gross_amount), 2) AS gross_revenue_for_contrast,\n  COUNT(DISTINCT f.currency_code)\
        \ AS transaction_currencies\nFROM contoso_served.v_contoso5_sales_line AS f\nJOIN contoso_served.dim_customer\
        \ AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store AS s\n  ON f.store_key\
        \ = s.store_key\nWHERE\n  c.country_code = s.country_code"
      params: {}
    - step: '4'
      sql: "SELECT\n  cc.country_name,\n  c.country_code AS customer_country,\n  s.country_code AS store_country,\n\
        \  COUNT(*) AS lines,\n  COUNT(DISTINCT f.customer_key) AS buyers,\n  ROUND(SUM(f.net_amount),\
        \ 2) AS net_revenue\nFROM contoso_served.v_contoso5_sales_line AS f\nJOIN contoso_served.dim_customer\
        \ AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store AS s\n  ON f.store_key\
        \ = s.store_key\nJOIN contoso_served.dim_country AS cc\n  ON c.country_code = cc.country_code\n\
        WHERE\n  c.country_code = s.country_code\nGROUP BY\n  1,\n  2,\n  3\nORDER BY\n  net_revenue DESC"
      params: {}
    - step: '5'
      sql: "SELECT\n  cc.country_name,\n  ROUND(SUM(CASE WHEN s.country_code = c.country_code THEN f.net_amount\
        \ ELSE 0 END), 2) AS revenue_buyer_matches_shop_country,\n  ROUND(SUM(f.net_amount), 2) AS revenue_all_sales_by_buyer_country,\n\
        \  ROUND(SUM(CASE WHEN s.country_code = '--' THEN f.net_amount ELSE 0 END), 2) AS web_shop_revenue_in_the_gap\n\
        FROM contoso_served.v_contoso5_sales_line AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key\
        \ = c.customer_key\nJOIN contoso_served.dim_store AS s\n  ON f.store_key = s.store_key\nJOIN contoso_served.dim_country\
        \ AS cc\n  ON c.country_code = cc.country_code\nGROUP BY\n  1\nORDER BY\n  3 DESC"
      params: {}
    - step: '6'
      sql: "SELECT\n  cc.country_name AS country,\n  ROUND(SUM(CASE WHEN s.country_code = c.country_code\
        \ THEN f.net_amount ELSE 0 END), 2) AS revenue_buyer_matches_shop_country,\n  ROUND(SUM(f.net_amount),\
        \ 2) AS revenue_all_sales_by_buyer_country,\n  ROUND(SUM(CASE WHEN s.country_code = '--' THEN\
        \ f.net_amount ELSE 0 END), 2) AS web_shop_revenue_in_the_gap\nFROM contoso_served.v_contoso5_sales_line\
        \ AS f\nJOIN contoso_served.dim_customer AS c\n  ON f.customer_key = c.customer_key\nJOIN contoso_served.dim_store\
        \ AS s\n  ON f.store_key = s.store_key\nJOIN contoso_served.dim_country AS cc\n  ON c.country_code\
        \ = cc.country_code\nGROUP BY\n  1\nORDER BY\n  2 DESC"
      params: {}
