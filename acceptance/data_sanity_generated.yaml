    QUESTION. Does this table still go back as far as it did?

    ANSWER. The earliest recorded is 1980-01-01 00:00:00.

    RISK. If the start moves forward, older periods stop being answerable and every total over them silently
    shrinks. Row counts would not show it — the table is growing at the other end.

