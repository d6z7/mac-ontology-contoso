      open-ended (`>= 2023-01-01` keeps 2025 too).
    not_expressible: >-
      NEW. `set_operation` declares INTERSECT/UNION and explicitly exempts EXCEPT as "the anti-join
      the `exists` operation already covers"; this is an EXCEPT whose two sides differ only by
