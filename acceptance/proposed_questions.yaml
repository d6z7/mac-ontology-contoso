  # MEMBER vs MEMBER AS A RATIO — the operator's two questions of 2026-10-17, both measured
  # inexpressible the same day. They are NOT association failures: the spike read both correctly.
  - id: PROP-21
    question: What is the ratio of female to male customers?
    shape: >-
      MEMBER vs MEMBER as a ratio — one measure, one axis, two named members of that axis.
      Not a share of the total, and not a side-by-side breakdown.
    assumptions:
    - the two members are the whole of the gender register (female, male); there is no third
    - the figure is a count of customers, not of orders
    oracle_sql: |
      SELECT SUM(CASE WHEN gender='female' THEN 1 ELSE 0 END) AS female,
             SUM(CASE WHEN gender='male'   THEN 1 ELSE 0 END) AS male,
             SUM(CASE WHEN gender='female' THEN 1.0 ELSE 0 END)
               / NULLIF(SUM(CASE WHEN gender='male' THEN 1.0 ELSE 0 END), 0) AS ratio
      FROM contoso_served.dim_customer
    oracle:
      female: 51927
      male: 53063
      ratio: 0.9785914855925975
    verdict: not_expressible
    not_expressible: >-
      MEASURED 2026-10-17, both routes. (1) Intent.denominator is a str naming another MEASURE and
      DenominatorScope is filtered|total — there is no way to say "the same measure over a different
      named population", so this refuses with "divided by itself over the same rows is 1.0".
      (2) CompareAs.RATIO IS implemented (planner/sql.py:2757 composes (x) / NULLIF(prev, 0)), but
      CompareTo has exactly ONE member, `previous` — the ratio only ever runs against the preceding
      row of an ordered axis. Nothing can name the comparand.
    missing:
    - a CompareTo member naming another member of the same axis, OR a denominator carrying a population
    attempts:
    - 'operation ratio, denominator naming the same measure -> Refusal UNSUPPORTED_INTENT'
    - 'operation compare along gender -> desugars to a side-by-side breakdown, no ratio composed'
  - id: PROP-22
    question: What is the size ratio of German shops to French shops?
    shape: >-
      The same MEMBER vs MEMBER ratio as PROP-21 on a different axis, over a COLUMN measure
