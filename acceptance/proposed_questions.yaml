      among products that were never sold online?
    shape: >-
      the operator's own sentence — "how many something is more or less than something else
      somewhere else where this is here or there and something is not somewhere else"
    assumptions:
      - units = quantity; Germany/France are STORE countries
      - '"never sold online" = no line against the location sentinel (-1), over all time'
      - products with no German and no French sale are excluded by the comparison being strict
    oracle_sql: |
      WITH u AS (SELECT sl.product_key,
         SUM(CASE WHEN st.country_code='DE' THEN sl.quantity ELSE 0 END) AS de_units,
         SUM(CASE WHEN st.country_code='FR' THEN sl.quantity ELSE 0 END) AS fr_units,
         SUM(CASE WHEN st.location_code = -1 THEN 1 ELSE 0 END) AS online_lines
        FROM contoso_served.v_contoso5_sales_line sl
        JOIN contoso_served.dim_store st ON st.store_key=sl.store_key
        JOIN contoso_served.dim_product p ON p.product_key=sl.product_key
        WHERE sl.order_date >= DATE '2024-01-01' AND sl.order_date < DATE '2025-01-01'
          AND p.category_name IN ('Computers','Audio')
        GROUP BY 1)
      SELECT COUNT(*) AS products FROM u WHERE de_units > fr_units AND online_lines = 0
    oracle:
      value: 3
    verdict: CANNOT_ENCODE
    missing: >-
      THREE of the gaps above at once, which is why this is the operator's sentence: a comparison
      between two MEMBERS of one dimension on the same row (PROP-04/PROP-20's `compare` refuses a
      label axis), a negated existence group (PROP-02), and a count of the identities that survive
      both (PROP-13). What the grammar DOES reach is the raw grid, and it reaches it correctly.
    not_expressible: >-
      the pieces are NEW individually; as a whole this is the shape `multiple_measures` gestures at
      with "STILL NOT EXPRESSIBLE: arithmetic BETWEEN the columns".
    attempts:
      - label: the grid — product x country units, categories OR'd, online excluded by default
        classification: PLANS_WRONG
        detail: >-
          469 rows of product x country units. Every INGREDIENT is right: `any_of` emitted
          `(category_name = 'Computers' OR category_name = 'Audio')`, the IN filter bound both
          countries, the period bound, and the store population default excluded the online
          channel. What is missing is everything after the grid — the comparison, the negation and
          the count. 469 rows for an answer of 3.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 469}
        intent:
          measure: UnitsSold
          operation: sum
          period: {start: '2024-01-01', end: '2025-01-01', raw: '2024'}
          slices:
