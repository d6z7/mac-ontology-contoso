      SELECT COUNT(*) AS products FROM (
        SELECT DISTINCT product_key FROM contoso_served.v_contoso5_sales_line
        WHERE order_date >= DATE '2023-01-01' AND order_date < DATE '2024-01-01'
        EXCEPT
