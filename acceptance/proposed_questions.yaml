# PROPOSED QUESTIONS — twenty questions composed to find the EXPRESSIVE LIMIT of the MAC query
# grammar, not to be answered by it. 2026-10-09.
#
# WHY THIS FILE EXISTS, in the operator's words: "i know that the current ontology vocabulary and
# grammar is incomplete for complexer queries and we need to solve it ... if we first solve all
# other aspects and leave this to the end ... then i might find myself in the trouble of figuring
# inherent limitation of the system is so big that these questions cannot be handled at all."
#
# THIS IS NOT THE CORPUS. `acceptance/questions.yaml` is the operator's and is untouched. Nothing
# here is approved, nothing here is a reference answer, and no board reads it. Every entry carries
# a HAND-WRITTEN oracle SQL statement that was EXECUTED against this bundle's own
# `contoso5.duckdb` on 2026-10-09, and the figure it returned. The oracle is the standard; the
# intents below are the attempts, and their verdicts are measurements of the grammar.
#
# THE HYPOTHESIS UNDER TEST. A prior measurement concluded "grammar is not the bottleneck: 70/70
# corpus questions encode, 1 needs new grammar". These twenty are harder than the corpus on
# purpose — the shapes the operator named: "how many something is more or less than something else
# somewhere else where this is here or there and something is not somewhere else", and trends over
# months, years and quarters.
#
#   MEASURED, 20 questions / 45 encoding attempts:
#     3  of 20  reach a CORRECT answer — and all three only because a PERSON supplied, by hand,
#               the derived set or the derived constant that the grammar cannot compute
#     2  of 20  have exactly one available encoding and it answers a DIFFERENT question
#     4  of 20  refuse or clarify honestly
#    11 of 20   CANNOT BE ENCODED — a field, an operation or a construct does not exist
#    13 of 20   have a plausible nearest encoding that PLANS, EXECUTES and returns a confident
#               WRONG number. That is the figure that matters: the grammar's reach is not the
#               risk, its SILENCE about its own reach is.
#
#   WHY THE CORPUS COULD NOT HAVE FOUND THESE, measured: 13 of this bundle's 85 recorded intents
#   carry a `having` or an `all_of`, and every one of the thirteen is `operation: list` or
#   `operation: exists`. Not one is a `count`. The shape that breaks is absent from the corpus,
#   so "70 of 70 encode" is a fact about which questions were written down.
#
# HOW TO READ AN ENTRY. `verdict` is the best outcome any attempt reached. `attempts` are every
# encoding tried, each with the classification MEASURED today:
#
#   CANNOT_ENCODE  the Intent model rejects it (pydantic) — no field carries the question
#   REFUSED        the planner returned a Refusal; `detail` quotes its own reason
#   CLARIFIED      the planner asked back
#   SQL_INVALID    a Plan was produced and the ENGINE rejected the statement
#   PLANS_WRONG    it ran, and the figure answers a different question than the oracle
#   PLANS_PARTIAL  it ran, the figure is EXACT for a NARROWER question, and the asked question
#                  is not answered — the comparison, the threshold or the delta is simply absent
#   PLANS_CORRECT  it ran, and the figure is the oracle's
#
# `matches_oracle` is the honest flag beside every PLANS_* row. `expect` is what the attempt
# returned on 2026-10-09 and is what `meaning-as-code/tools/mac_grammar_reach.py` holds it to: a
# recorded REFUSED that becomes a PLANS_CORRECT is NEWS and the gate says so.
#
# ASSUMPTIONS ARE STATED PER QUESTION, because most of these questions have more than one
# defensible reading and a silent choice would make the oracle worthless. Where the bundle's own
# declarations settle the reading, the oracle follows the BUNDLE and says so — a sales question
# means the STORE's country (country.yaml#country.default.a_sales_question_means_the_store_country),
# "stores" means the physical, trading ones (store.yaml, `physical` + `active`, 57 of 74 rows), and
# the `--` country sentinel is not a country. Aligning the oracle with the declared reading is what
# makes a WRONG verdict a statement about the GRAMMAR rather than about a population default.

metadata:
  schema: mac.proposed_questions/1
  status: PROPOSED — not approved, not a reference, not read by the board
  pack: example/contoso5
  composed_on: '2026-10-09'
  measured_against:
    bundle: example/contoso5
    warehouse: contoso5.duckdb
    view_schema: contoso_served
    runtime: mac-platform @ packages/mac-runtime/src/mac_runtime
  read_by: meaning-as-code/tools/mac_grammar_reach.py
  default_assumptions:
    - a sales question means the STORE's country, per country.yaml#country.default
    - '"stores" means the 57 physical, trading rows of dim_store (populations `physical` + `active`)'
    - the `--` country/location sentinel is excluded (country.yaml, location.yaml exclusions)
    - '"revenue" means net_amount, per net_revenue.yaml#net_revenue.default.revenue_means_net'
    - a question naming no period covers all of order_date, 2016-05-18 .. 2025-12-31

questions:

  # ───────────────────────────────────────────────────────────────────────────────────────────
  - id: PROP-01
    question: Which stores sold more than the average store in their own country?
    shape: a threshold that is a CORRELATED aggregate — the average of the group the row is in
    assumptions:
      - the store's own country, not the customer's
      - the comparison set is the other stores of that country, trading and physical
      - the average is the mean of the per-store totals, not the mean of the line amounts
    oracle_sql: |
      WITH s AS (
        SELECT st.store_key, st.store_name, st.country_code, SUM(sl.net_amount) AS rev
        FROM contoso_served.v_contoso5_sales_line sl
        JOIN contoso_served.dim_store st ON st.store_key = sl.store_key
        WHERE st.location_code <> -1 AND st.close_date IS NULL
        GROUP BY 1,2,3)
      SELECT store_name, country_code, rev
      FROM s WHERE rev > (SELECT AVG(rev) FROM s s2 WHERE s2.country_code = s.country_code)
      ORDER BY country_code, rev DESC
    oracle:
      rows: 25
      first_row_note: Contoso Store Victoria (AU) 2 432 039.27 against an AU mean of 1 500 222.98
    verdict: CANNOT_ENCODE
    missing: >-
      `HavingRef.value` is a SCALAR float. There is no way to say "the value is the average of this
      measure over the other members of my own group", which needs a correlated scalar subquery.
    not_expressible: >-
      DECLARED — `having` (scope: intent), and `correlated_subquery_filter` + `derived_table` name
      the SQL half. This is ADV-13's defect with one more hop (per country rather than global).
    attempts:
      - label: name the correlated aggregate in the threshold
        classification: CANNOT_ENCODE
        detail: "having.0.value — Input should be a valid number, unable to parse string as a number"
        expect: {classification: CANNOT_ENCODE}
        intent:
          measure: Store
          operation: list
          having:
            - subject: NetRevenue
              operation: average
              op: gt
              value: country_avg
              utterance: above the average of stores in their own country
          confidence: 0.6
      - label: ADV-13's vacuous 0.0 threshold with a country slice
        classification: SQL_INVALID
        detail: >-
          a Plan was composed and DuckDB rejected it — `SELECT dim_country.country_name,
          dim_store.store_name ... GROUP BY dim_country.country_code, dim_country.country_name`
          leaves store_name ungrouped (BinderException). A `list` of one concept sliced by ANOTHER
          and carrying a `having` composes a statement no engine runs; nothing in the grammar says
          so. (With `column: country_code` instead it refuses policy_denied — country_code claims
          no `axis` role — so this slice column is the only one available.)
        expect: {classification: SQL_INVALID}
        intent:
          measure: Store
          operation: list
          slices:
            - {term: Country, utterance: in their own country, column: country_name}
          having:
            - {subject: NetRevenue, operation: average, op: gt, value: 0.0, utterance: above the average store in their country}
          confidence: 0.5
      - label: ADV-13 exactly — the global shape, no slice
        classification: PLANS_WRONG
        detail: >-
          `HAVING AVG(net_amount) > 0.0` — every store with any sale passes. 57 of 57 trading
          stores, where the per-country question is 25 and ANCHOR_21's global reading is 8.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 57}
        intent:
          measure: Store
          operation: list
          having:
            - {subject: NetRevenue, operation: average, op: gt, value: 0.0, utterance: more than the average store}
          confidence: 0.5

  # ───────────────────────────────────────────────────────────────────────────────────────────
  - id: PROP-02
    question: How many customers bought Contoso products but never bought Litware?
    shape: exclusion plus existence — a NEGATED existence group at the identity grain
    assumptions:
      - all time; brand is read off the product row
      - '"bought" means at least one sales line; "never" means zero sales lines'
    oracle_sql: |
      SELECT COUNT(*) AS customers FROM (
        SELECT sl.customer_key FROM contoso_served.v_contoso5_sales_line sl
        JOIN contoso_served.dim_product p ON p.product_key = sl.product_key
        GROUP BY 1
        HAVING SUM(CASE WHEN p.brand='Contoso' THEN 1 ELSE 0 END) > 0
           AND SUM(CASE WHEN p.brand='Litware' THEN 1 ELSE 0 END) = 0)
    oracle:
      value: 29768
      reference_figures: 52189 customers bought anything, 33229 bought Contoso at all
    verdict: CANNOT_ENCODE
    missing: >-
      `Intent.all_of` is a conjunction of groups that must EACH have a row; there is no `none_of`
      — a group that must have NO row. A row-level `ne`/`not_in` cannot say it: "has a row that is
      not Litware" is true of every Contoso buyer.
    not_expressible: >-
      NEW, and a declared entry DENIES it. `set_operation` reads "EXCEPT is NOT in this gap — it is
      the anti-join the `exists` operation already covers". It is not covered: `exists` anti-joins
      the subject's canonical key against an EVENT concept and cannot carry "no row where brand =
      X" (`correlated_subquery_filter` is the declared reason the inner query cannot be qualified).
    attempts:
      - label: all_of Contoso, plus a row filter brand ne Litware
        classification: PLANS_WRONG
        detail: >-
          `WHERE brand IS DISTINCT FROM 'Litware' HAVING SUM(CASE WHEN brand='Contoso'...) > 0`
          with NO GROUP BY — the group-level quantifier became a predicate on the whole
          population. 51 936 = every customer with any non-Litware line.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, value: 51936}
        intent:
          measure: Customer
          operation: count
          filters:
            - {term: Brand, op: ne, value: Litware, utterance: never Litware}
          all_of:
            - filters: [{term: Brand, op: eq, value: Contoso, utterance: Contoso}]
              utterance: bought Contoso
          confidence: 0.5
      - label: two all_of groups, the second negated with ne
        classification: PLANS_WRONG
        detail: >-
          same missing GROUP BY. 52 189 = every customer who ever bought anything, for a question
          whose answer is 29 768. The HAVING is evaluated once over the entire result set.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, value: 52189}
        intent:
          measure: Customer
          operation: count
          all_of:
            - filters: [{term: Brand, op: eq, value: Contoso, utterance: Contoso}]
              utterance: bought Contoso
            - filters: [{term: Brand, op: ne, value: Litware, utterance: never Litware}]
              utterance: never Litware
          confidence: 0.5
      - label: a `none_of` field
        classification: CANNOT_ENCODE
        detail: "none_of — Extra inputs are not permitted (Intent model_config extra='forbid')"
        expect: {classification: CANNOT_ENCODE}
        intent:
          measure: Customer
          operation: count
          none_of:
            - filters: [{term: Brand, op: eq, value: Litware, utterance: Litware}]
          confidence: 0.5
      - label: all_of with a not_in group, asked as a LIST so the identity is grouped
        classification: PLANS_WRONG
        detail: >-
          `GROUP BY customer_key HAVING SUM(CASE WHEN brand='Contoso'...) > 0 AND SUM(CASE WHEN
          brand NOT IN ('Litware') ...) > 0` — correctly grouped and still the wrong QUESTION:
          33 229 = everyone who bought Contoso, because every one of them also has a non-Litware
          line. An existence group cannot be turned into a non-existence group by negating its
          predicate.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 33229}
        intent:
          measure: Customer
          operation: list
          all_of:
            - filters: [{term: Brand, op: eq, value: Contoso, utterance: Contoso}]
              utterance: bought Contoso
            - filters: [{term: Brand, op: not_in, value: [Litware], utterance: never Litware}]
              utterance: never Litware
          confidence: 0.4

  # ───────────────────────────────────────────────────────────────────────────────────────────
  - id: PROP-03
    question: How many products were sold in EVERY country where we have an open store?
    shape: set division where the DIVISOR is itself derived from the data
    assumptions:
      - '"open store" = the `active` + `physical` population; on this data that is 8 countries'
      - the same population is applied to the sales side, which is what the planner does
    oracle_sql: |
      WITH universe AS (
        SELECT DISTINCT st.country_code FROM contoso_served.dim_store st
        WHERE st.location_code <> -1 AND st.close_date IS NULL),
      sold AS (
        SELECT DISTINCT sl.product_key, st.country_code
        FROM contoso_served.v_contoso5_sales_line sl
        JOIN contoso_served.dim_store st ON st.store_key = sl.store_key
        WHERE st.location_code <> -1 AND st.close_date IS NULL)
      SELECT COUNT(*) AS products FROM (
        SELECT product_key FROM sold WHERE country_code IN (SELECT country_code FROM universe)
        GROUP BY 1 HAVING COUNT(DISTINCT country_code) = (SELECT COUNT(*) FROM universe))
    oracle:
      value: 817
    verdict: ENCODES_PLANS_CORRECT — with the universe enumerated by hand
    missing: >-
      the universe. `all_of` takes a LIST OF LITERAL GROUPS, so "every country where we have an
      open store" has to be typed out as eight `eq` groups by whoever writes the intent. Nothing
      computes the divisor, and nothing notices when it changes: open a store in a ninth country
      and the same intent silently answers the old question.
    not_expressible: NEW — a derived universe for a set division is nowhere declared.
    attempts:
      - label: eight hand-written all_of groups, asked as a COUNT
        classification: PLANS_WRONG
        detail: >-
          2517 — the entire catalogue. The eight `SUM(CASE WHEN country_code = ...) > 0` terms are
          emitted with NO GROUP BY, so they test the whole population instead of each product.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, value: 2517}
        intent:
          measure: Product
          operation: count
          all_of:
            - {filters: [{term: Country, op: eq, value: AU, utterance: AU}], utterance: sold in AU}
            - {filters: [{term: Country, op: eq, value: CA, utterance: CA}], utterance: sold in CA}
            - {filters: [{term: Country, op: eq, value: DE, utterance: DE}], utterance: sold in DE}
            - {filters: [{term: Country, op: eq, value: FR, utterance: FR}], utterance: sold in FR}
            - {filters: [{term: Country, op: eq, value: GB, utterance: GB}], utterance: sold in GB}
            - {filters: [{term: Country, op: eq, value: IT, utterance: IT}], utterance: sold in IT}
            - {filters: [{term: Country, op: eq, value: NL, utterance: NL}], utterance: sold in NL}
            - {filters: [{term: Country, op: eq, value: US, utterance: US}], utterance: sold in US}
          confidence: 0.6
      - label: the same eight groups, asked as a LIST
        classification: PLANS_CORRECT
        detail: >-
          817 rows, exactly the oracle. `GROUP BY dim_product.product_name` is present because the
          answer is a list of the subject, and that is the only reason the group-level conjunction
          works at all.
        matches_oracle: true
        expect: {classification: PLANS_CORRECT, rows: 817}
        intent:
          measure: Product
          operation: list
          all_of:
            - {filters: [{term: Country, op: eq, value: AU, utterance: AU}], utterance: sold in AU}
            - {filters: [{term: Country, op: eq, value: CA, utterance: CA}], utterance: sold in CA}
            - {filters: [{term: Country, op: eq, value: DE, utterance: DE}], utterance: sold in DE}
            - {filters: [{term: Country, op: eq, value: FR, utterance: FR}], utterance: sold in FR}
            - {filters: [{term: Country, op: eq, value: GB, utterance: GB}], utterance: sold in GB}
            - {filters: [{term: Country, op: eq, value: IT, utterance: IT}], utterance: sold in IT}
            - {filters: [{term: Country, op: eq, value: NL, utterance: NL}], utterance: sold in NL}
            - {filters: [{term: Country, op: eq, value: US, utterance: US}], utterance: sold in US}
          confidence: 0.6

  # ───────────────────────────────────────────────────────────────────────────────────────────
  - id: PROP-04
    question: Which brands grew year over year in 2021 against 2020?
    shape: YtY delta, and a predicate ON the delta
    assumptions:
      - 2020 and 2021 chosen because every brand FELL 2023 -> 2024, which makes a weaker oracle
      - growth means net revenue in 2021 strictly greater than in 2020
    oracle_sql: |
      SELECT p.brand,
        SUM(CASE WHEN sl.order_date >= DATE '2020-01-01' AND sl.order_date < DATE '2021-01-01' THEN sl.net_amount ELSE 0 END) AS rev_2020,
        SUM(CASE WHEN sl.order_date >= DATE '2021-01-01' AND sl.order_date < DATE '2022-01-01' THEN sl.net_amount ELSE 0 END) AS rev_2021
      FROM contoso_served.v_contoso5_sales_line sl
      JOIN contoso_served.dim_product p ON p.product_key = sl.product_key
      WHERE sl.order_date >= DATE '2020-01-01' AND sl.order_date < DATE '2022-01-01'
      GROUP BY 1 HAVING rev_2021 > rev_2020 ORDER BY 1
    oracle:
      rows: 4
      first_row_note: Litware, Southridge Video, Tailspin Toys, The Phone Company — 4 of 11 brands
    verdict: CANNOT_ENCODE
    missing: >-
      TWO things. (1) There is no YEAR-grain comparison axis: a grain slice (`term: year`) is
      resolved as a FUNCTION of the subject's date column and is not accepted as `compare.along`,
      while the only axis that IS accepted (`Order.order_date`) is the raw day. (2) Even with a
      delta column there is no predicate on it — SQL's QUALIFY, or a wrapper query.
    not_expressible: >-
      NEW, and `CompareRef`'s own docstring claims the opposite: "'year-over-year growth by
      country' ... one row set, one grouping, and one more column". Measured here: not at year
      grain, not at month grain, not at quarter grain.
    attempts:
      - label: year grain slice plus a brand slice, compare along NetRevenue.order_date
        classification: REFUSED
        detail: >-
          unsupported_intent — "this asks each row to be compared with the previous
          NetRevenue.order_date, and the answer is not broken down by it". The axis check reads the
          SliceRef's declared `column`, which a grain slice leaves None, so a temporal grain can
          never satisfy it.
        expect: {classification: REFUSED, reason_code: unsupported_intent}
        intent:
          measure: NetRevenue
          operation: sum
          slices:
            - {term: Brand, utterance: by brand, column: brand}
            - {term: year, utterance: year over year, column: null}
          period: {start: '2020-01-01', end: '2022-01-01', raw: 2020 and 2021}
          compare: {against: previous, along: NetRevenue.order_date, as: difference, utterance: year over year}
          confidence: 0.6
      - label: year grain slice carrying column=order_date, so the axis check passes
        classification: REFUSED
        detail: >-
          policy_denied — the composer emitted UNPARSEABLE SQL and only the bundle's declared SQL
          guards noticed: `OVER (PARTITION BY dim_product.brand, CAST(date_trunc(:grain_1,
          ...order_date) ORDER BY ...)`. `sql.py` builds the partition list with
          `item.split(" AS ")[0]`, which truncates the grain's `CAST(... AS DATE)` mid-expression.
          The refusal blames the guards ("A guard that cannot see its subject does not pass it")
          and never names the real fault. Had the guards been absent the statement would have gone
          to the engine; had the parenthesis been balanced the answer would still be NULL in every
          row, because partitioning BY the month makes every partition one row long.
        expect: {classification: REFUSED, reason_code: policy_denied}
        intent:
          measure: NetRevenue
          operation: sum
          slices:
            - {term: Brand, utterance: by brand, column: brand}
            - {term: year, utterance: year over year, column: order_date}
          period: {start: '2020-01-01', end: '2022-01-01', raw: 2020 and 2021}
          compare: {against: previous, along: NetRevenue.order_date, as: difference, utterance: year over year}
          confidence: 0.6
      - label: the only axis that resolves — Order.order_date, a DAY
        classification: PLANS_WRONG
        detail: >-
          6190 rows of brand x DAY with a day-over-day delta, for a question about two years. Valid
          SQL, a real LAG, and a different question.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 6190}
        intent:
          measure: NetRevenue
          operation: sum
          slices:
            - {term: Brand, utterance: by brand, column: brand}
            - {term: Order, utterance: year, column: order_date}
          period: {start: '2020-01-01', end: '2022-01-01', raw: 2020 and 2021}
          compare: {against: previous, along: Order.order_date, as: difference, utterance: year over year}
          confidence: 0.6

  # ───────────────────────────────────────────────────────────────────────────────────────────
  - id: PROP-05
    question: What was the month-over-month change in net revenue in 2024?
    shape: MtM — period-over-period at month grain
    assumptions:
      - calendar months of order_date; the first month has no predecessor and reads NULL
    oracle_sql: |
      WITH m AS (SELECT date_trunc('month', order_date) AS mth, SUM(net_amount) AS rev
        FROM contoso_served.v_contoso5_sales_line
        WHERE order_date >= DATE '2024-01-01' AND order_date < DATE '2025-01-01' GROUP BY 1)
      SELECT mth, rev, rev - LAG(rev) OVER (ORDER BY mth) AS mom_change FROM m ORDER BY mth
    oracle:
      rows: 12
      first_row_note: "2024-01 3 282 292.89 (NULL); 2024-02 4 147 885.77 (+865 592.88); 2024-03 -2 083 578.86"
    verdict: CANNOT_ENCODE
    missing: >-
      a comparison axis at a temporal GRAIN. The grain mechanism (`_temporal_axis`, a date_trunc
      function over the subject's period column) and the comparison mechanism
      (`compare_axis`, a declared `<Concept>.<column>` that must also appear as a slice) are two
      separate readers that cannot name the same axis.
    not_expressible: NEW — and contradicted by `CompareRef`, which names "monthly revenue trend" as its own purpose.
    attempts:
      - label: month grain slice, compare along NetRevenue.order_date
        classification: REFUSED
        detail: unsupported_intent — "the answer is not broken down by it"
        expect: {classification: REFUSED, reason_code: unsupported_intent}
        intent:
          measure: NetRevenue
          operation: sum
          slices: [{term: month, utterance: monthly, column: null}]
          period: {start: '2024-01-01', end: '2025-01-01', raw: '2024'}
          compare: {against: previous, along: NetRevenue.order_date, as: difference, utterance: month over month}
          confidence: 0.6
      - label: month grain slice carrying column=order_date
        classification: REFUSED
        detail: >-
          policy_denied — unparseable SQL, the same truncated `CAST(date_trunc(...)` as PROP-04.
        expect: {classification: REFUSED, reason_code: policy_denied}
        intent:
          measure: NetRevenue
          operation: sum
          slices: [{term: month, utterance: monthly, column: order_date}]
          period: {start: '2024-01-01', end: '2025-01-01', raw: '2024'}
          compare: {against: previous, along: NetRevenue.order_date, as: difference, utterance: month over month}
          confidence: 0.6
      - label: Order.order_date — day over day
        classification: PLANS_WRONG
        detail: >-
          3450 rows (one per trading day over all time; with the 2024 period, 365) with a
          day-over-day delta. Also note the outer ORDER BY is the AGGREGATE, descending, so a
          series is returned out of its own axis order.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 365}
        intent:
          measure: NetRevenue
          operation: sum
          slices: [{term: Order, utterance: monthly, column: order_date}]
          period: {start: '2024-01-01', end: '2025-01-01', raw: '2024'}
          compare: {against: previous, along: Order.order_date, as: difference, utterance: month over month}
          confidence: 0.6

  # ───────────────────────────────────────────────────────────────────────────────────────────
  - id: PROP-06
    question: What are the top 3 products by net revenue within each product category?
    shape: rank WITHIN a group — per-group top-N
    assumptions:
      - all time; category means `category_name`, the declared default level
      - ties broken arbitrarily; none occur in the first three of any category
    oracle_sql: |
      WITH r AS (
        SELECT p.category_name, p.product_name, SUM(sl.net_amount) AS rev,
               ROW_NUMBER() OVER (PARTITION BY p.category_name ORDER BY SUM(sl.net_amount) DESC) AS rk
        FROM contoso_served.v_contoso5_sales_line sl
        JOIN contoso_served.dim_product p ON p.product_key = sl.product_key
        GROUP BY 1,2)
      SELECT category_name, product_name, rev FROM r WHERE rk <= 3
      ORDER BY category_name, rev DESC
    oracle:
      rows: 24
      first_row_note: 3 per category over 8 categories; Audio's leader is WWI 4GB Video Recording Pen X200 Yellow
    verdict: ENCODES_PLANS_WRONG
    missing: >-
      `Intent.limit` is a GLOBAL row cap. There is no per-partition limit, which is
      `ROW_NUMBER() OVER (PARTITION BY ...)` plus a predicate on it.
    not_expressible: NEW — per-group top-N is not among the nine entries.
    attempts:
      - label: category and product slices, ordering by the aggregate, limit 3
        classification: PLANS_WRONG
        detail: >-
          3 rows, all three from Computers. The limit truncated the GLOBAL ranking.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 3}
        intent:
