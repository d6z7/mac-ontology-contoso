  - id: PROP-19
    question: How many stores earn more revenue per square metre than the median store?
    shape: a derived measure from a COLUMN, thresholded against a MEDIAN
    assumptions:
      - revenue per square metre = the store's all-time net revenue over its square_metres
      - median over the 57 trading physical stores; the median is 1 594.28 USD/m2
    oracle_sql: |
      WITH s AS (SELECT st.store_name, st.square_metres,
                        SUM(sl.net_amount)/st.square_metres AS rev_per_m2
        FROM contoso_served.v_contoso5_sales_line sl
        JOIN contoso_served.dim_store st ON st.store_key=sl.store_key
        WHERE st.location_code <> -1 AND st.close_date IS NULL GROUP BY 1,2)
      SELECT COUNT(*) AS stores, (SELECT MEDIAN(rev_per_m2) FROM s) AS median_rev_per_m2
      FROM s WHERE rev_per_m2 > (SELECT MEDIAN(rev_per_m2) FROM s)
    oracle:
      rows: 1
      first_row_note: 28 stores above a median of 1 594.2795256550
    verdict: CANNOT_ENCODE
    missing: >-
      THREE things. (1) `median` is not a member of `OperationKind`, so the central statistic of
      any distribution cannot be asked for. (2) `Intent.denominator` names a SUBJECT, so a measure
      cannot be divided by a COLUMN of a dimension — and naming one is not refused, it is
      fuzzy-matched. (3) The median-as-threshold is PROP-01's correlated aggregate again.
    not_expressible: >-
      NEW on all three counts. The grammar lists eleven operations and declares nothing about the
      statistics it does not have.
    attempts:
      - label: denominator naming the square_metres COLUMN
        classification: PLANS_WRONG
        detail: >-
          the denominator resolved to the STORE CONCEPT and became `COUNT(DISTINCT
          dim_store.location_code)`, which is 1 inside each store's group — so the ratio equals
          the numerator. 57 rows, byte-identical to the plain revenue-by-store answer
          (Connecticut 3 897 804.53 in both), labelled `netrevenue_per_store`. A question about
          floor-area productivity answered with gross revenue, under a column name that almost
          says so.
        matches_oracle: false
        expect: {classification: PLANS_WRONG, rows: 57}
        intent:
          measure: NetRevenue
          operation: ratio
          denominator: square_metres
          slices: [{term: Store, utterance: by store, column: store_name}]
          confidence: 0.4
      - label: operation=median
        classification: CANNOT_ENCODE
        detail: >-
          "operation — Input should be 'count', 'sum', 'average', 'min', 'max', 'list', 'rank',
          'compare', 'ratio', 'define' or 'exists'". Eleven operations, no median, no percentile,
          no standard deviation, no mode.
        expect: {classification: CANNOT_ENCODE}
        intent:
          measure: NetRevenue
          operation: median
          confidence: 0.4

