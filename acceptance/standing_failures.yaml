# acceptance/standing_failures.yaml — THIS BUNDLE'S DECLARED STANDING FINDINGS.
#
# The shape and the rule are `meaning-as-code/tools/gate_register.py`'s: "A fact about one bundle
# lives WITH THE BUNDLE ... An entry in the wrong file is refused — without that rule the framework
# file becomes the dumping ground within a week."
#
# These two were carried in `check_axis_resolution.py` itself for a few hours on 2026-10-10, keyed
# by bundle name, which made a framework tool hold one warehouse's rulings: any other bundle running
# that gate read two entries about columns it does not have, and this bundle's own owners could not
# change their own ruling without editing the framework. Operator: "i hope you are doing these
# changes in fully GENERIC way ... so that underlying data sources and models can be completely
# arbitrary".
spec_version: mac.gate_failures/1
scope: bundle:contoso5
declared: '2026-10-10'
review_by: '2026-11-10'
# ONE ENTRY, TWO SUBJECTS — and `standing` counts ENTRIES, which is what gate_register.py's own
# shape says ("standing: <n>  # MUST equal len(entries)"). It read 2 because two COLUMNS are
# parked, and the register refused the file outright: "standing says 2 but 1 entr(y/ies) are
# declared — two statements of one size disagree, so one is stale". One gate is red; the two
# columns are its `subjects`, which is the key added to the schema on 2026-10-10 precisely so each
# carries its own owner, reason and unpark condition.
standing: 1
entries:
  check_axis_resolution.py:
    kind: fail
    owner: operator
    since: '2026-10-10'
    reason: >-
      two columns OFFER an axis and have no route from a word to a value — AXIS_WITHOUT_MECHANISM
    expected: >-
      each is either given a resolution mechanism or has `offers.axis` withdrawn
    subjects:
      dim_customer.city:
        owner: operator
        since: '2026-10-10'
        reason: >-
          34 581 distinct over 104 990 customers, text, no `label_of`, and already
          `offers: [axis, suppressed]`. Too large to ship as a register (~160 000 prompt tokens) and
          it names no entity, so it is a TIER 4 PROBE case.
        expected: >-
          the probe mechanism exists as of 2026-10-10 (`mac.canon.resolve_by_probe`); this unparks
          when a resolution rule on this column binds it, which is a declaration about THIS bundle
          and therefore the operator's to make
      dim_customer.state:
        owner: operator
        since: '2026-10-10'
        reason: >-
          565 distinct state CODES (AB, ACT, AG, AK) scoped by country — `rulings: [scoped_by]`.
          MEASURED: `dim_location.state` holds 67 state NAMES and the two sets overlap by FIVE, so
          the existing register cannot attach; they are different value sets wearing one column
          name. Cutting a register of 565 bare codes would resolve 'ON' to 'ON' and never 'Ontario'
          — a file and no capability.
        expected: >-
          either a code->name reference this bundle does not have today, or the `scope_relative`
          alias tier, which resolves in the PLANNER because only it holds the scope. Both are
          rulings about this bundle's data, not derivations
