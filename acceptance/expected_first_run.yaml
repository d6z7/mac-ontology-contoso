# acceptance/expected_first_run.yaml — AUTHORED ONCE AND FROZEN. Not generated: a contract derived
# from the run it checks would re-record whatever happened (CORE.md §7), which is why this file says
# where each number's AUTHORITY comes from and does not simply echo today's report.
#
# WHY THIS FILE EXISTS AT ALL. `mac_import --report` already prints all twenty deliverables, and on
# 2026-10-14 it printed FULL STATE — every deliverable present. That is a REPORT. Until this file
# existed `check_first_run` answered "COULD NOT RUN: contoso5 declares no first-run contract ... this
# is not a pass", so NOTHING in the estate failed when an ingestion skipped a stage: a run that went
# straight to datasets without sources, or wrote no profiles, no lineage, no samples, or half the
# value registers, produced a shorter report and no red. The operator's standing ruling on this
# bundle (quoted in mac.project.yaml) is the authority for requiring all twenty:
#
#     "split data plane delivery in two parts: data sources and datasets / have checklist for each
#      one of them / have linter and enforcement for every syntax thing we implement"
#     "i effectively want to achieve repeatibiliy. it is super important that you create ALL relevant
#      components of the data plane - so that NOTHING GETS LOST"   — operator, 2026-09-28
#
# TWO KINDS OF NUMBER, AND THEY ARE NOT EQUALLY AUTHORED — stated because conflating them is how a
# baseline turns into a tautology:
#   STRUCTURAL   a consequence of the warehouse's shape, not of a run. contoso5 lands EIGHT relations
#                and serves EIGHT, and the pipeline owes one artifact per relation per plane — so
#                D1=8, D2=8, D9=16 (8+8 profiles), D10=16 (8 references + 8 references_served),
#                D11b=16 (8+8 previews). Re-derivable by anyone counting the landing schema; a drop
#                to 7 is loss, which is exactly what this gate is for.
#   STAMPED      a curation outcome frozen as a baseline on 2026-10-14 (17 concepts, 14 value
#                registers, 4 diagrams, 111 DQ cases, the 10 findings below). These are NOT derivable
#                from the warehouse — they are what a person built. Frozen so that LOSS is a finding;
#                they move only by a deliberate edit to this file, and they want the operator's
#                countersign. Freezing is not deriving: a contract regenerated each run always
#                passes, and that is the failure mode CORE.md §7 names.
#
# D11 IS PINNED AT 17, NOT AT THE 19 ON DISK, AND THAT IS DELIBERATE. "A sample per concept" owes one
# sample per concept and there are 17 concepts. The directory holds 19: `channel.sample.csv` and
# `sale.sample.csv` survive concepts that were DELETED (git: both `channel.yaml` and `sale.yaml` are
# diff-filter=D), and the regeneration that followed reported "17 of 17" while writing beside two
# files it never pruned — so the producer's accounting was right and the directory was wrong. Pinning
# 19 would freeze the debris into the contract and make a stale artifact a requirement. The gate
# therefore reports COUNT here until the two orphans are removed; that red is TRUE and its fix is a
# two-file deletion the operator must sanction.
#
# D3, D7a, D7c, D8a, D8b CARRY NO COUNT. Each is a probe whose number has more than one reader —
# D3 answers 8 entities while a second reader over the same bundle counted 5 node-class concepts
# — and pinning a figure whose definition is contested would gate the disagreement instead of the
# delivery. (The second reader was `mac_to_mermaid --er`, deleted 2026-10-15; the point stands
# because the contest was about what an ENTITY is, not about who drew it.) D7c's loss is caught by `findings:` below, which is the stronger check.

expected:
  # ALL TWENTY. Every id `mac_import`'s DELIVERABLES register defines; nothing is optional here,
  # because "NOTHING GETS LOST" is the ruling and a deliverable left off this list is a stage an
  # ingestion may silently skip.
  present:
    - D1      # all data sources            — data/sources/*.yaml
    - D2      # all data assets             — data/datasets/*.yaml
    - D3      # ER model (actual state)
    - D4      # all concepts                — ontology/concepts/**/*.yaml
    - D4b     # edges                       — ontology/edges.yaml
    - D5      # SME questions
    - D7a     # DQ test cases
    - D7b     # DQ tests executed
    - D7c     # DQ results (per case + findings)
    - D8a     # ontology test cases
    - D8b     # ontology tests executed + results
    - D9      # measurement plane (profiles)
    - D10     # referential structure
    - D11     # sample per concept
    - D11b    # relation previews
    - D12     # value registers
    - D12b    # closure monitor executed
    - D13     # resource description
    - D15     # lineage (engine + the console's graph)

  # NOTHING IS DECLARED ABSENT. An `absent:` entry is a claim that a deliverable must NOT exist, and
  # on this bundle there is no such deliverable — the served plane was declared-and-empty at first
  # delivery and has since been filled (datasets observed 2026-10-03), so D2 is owed, not excused.
  absent: []

  counts:
    D1: 8        # STRUCTURAL — one descriptor per landed relation
    D2: 8        # STRUCTURAL — one descriptor per served relation
    D9: 16       # STRUCTURAL — one profile per relation, both planes
    D10: 16      # STRUCTURAL — 8 references + 8 references_served
    D11b: 16     # STRUCTURAL — one preview per relation, both planes
    D11: 17      # STAMPED, and currently RED by design — one per concept; 19 on disk, 2 are orphans
    D4: 17       # STAMPED — the authored concepts
    D4b: 1       # STRUCTURAL — one edges file
    D12: 14      # STAMPED — the value registers pre-resolution produced
    D5: 1        # STRUCTURAL — one SME-questions page
    D7b: 1       # STRUCTURAL — one DQ run record
    D12b: 1      # STRUCTURAL — one closure-monitor run record
    D13: 1       # STRUCTURAL — one .mac resource description

  # FINDING LOST IS THE MOST IMPORTANT CLASS: it means the platform stopped detecting a defect it
  # once caught. These ten are the open issues in data/quality/data_quality_register.yaml on
  # 2026-10-14. The list is EXACT — a finding raised and not listed here reports FINDING EXTRA, which
  # catches a false-positive regression in the measurer.
  findings:
    - DQ-AMBIGREF-CURRENCYCODE                    # high
    - DQ-DANGLINGKEY-CATEGORYKEY
    - DQ-DANGLINGKEY-GEOAREAKEY
    - DQ-DANGLINGKEY-SUBCATEGORYKEY
    - DQ-DUP-ORDERROWS-SALES
    - DQ-IDENTIFYING-DIM_CUSTOMER-CITY
    - DQ-IDENTIFYING-DIM_CUSTOMER-CUSTOMER_NAME
    - DQ-ORPHAN-DATE
    - DQ-ORPHAN-ORDERROWS
    - DQ-ORPHAN-ORDERS

  dq_cases: 111   # STAMPED — acceptance/data_sanity_generated.yaml#cases
