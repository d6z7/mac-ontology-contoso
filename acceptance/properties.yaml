# acceptance/properties.yaml — the ENGINE DECLARATION, and (later) this bundle's property suite.
#
# WHY IT EXISTS AT P1 AT ALL. Seven framework tools read `engine:` out of this file, `mac_profile.py`
# among them, so the measurement plane cannot be built without it. Nothing else here is authored yet.
#
# WHAT IS *NOT* HERE: the connection. The four `engine:` keys below are the labels the framework
# hands to the bundle's read path (tools/run_properties.py) and then records in the evidence — the
# profile's `engine:` field comes out as `<database>@<region>`. They do NOT decide which warehouse is
# opened. That is connection.yaml (declared by mac.project.yaml#runtime.connection), which is the one
# overridable home for this bundle's connection. An engine string in two files is how a measurement
# ends up naming a different warehouse than the one it read.
suite: contoso-source-sanity

purpose: >
  Invariants over the Contoso warehouse. EMPTY AT P1 BY DESIGN: the data-sanity properties are
  PROJECTED from the census in data/profiles/ by tools/mac_generate_sanity.py — nobody authors them
  by hand — and that projection belongs to a later step. A suite hand-written here now would be a
  second home for facts the profile already holds.

# An embedded engine authenticates nobody and bills nothing, so three of these four keys have no
# counterpart to name. They are kept truthful rather than plausible: `local` means "there is no such
# thing here", not "the default one".
engine:
  profile: local              # no credential profile — the warehouse is a file in this bundle
  region: duckdb-local        # no region — recorded so the evidence says where it was measured
  workgroup: local            # no workgroup — nothing is queued or billed
  database: contoso           # the DuckDB catalog name inside the warehouse file

properties: []
