  outcome: REFUSAL
  cause: decl:register-undeclared
  detail: 'ontology_gap: [''Store: resolve_by_register'']'
  intent:
    measure: Store
    operation: list
    filters:
    - term: Store
      op: gt
      value: '2020-12-31'
- id: MQ-11
  question: Show me revenue by country for customers in the same country as their store
  outcome: PLAN
  detail: SELECT dim_contoso_customer.Country, SUM(f."Quantity" * f."NetPrice")     AS net_sales_amount
    FROM contoso_served.v_contoso_order_line f JOIN contoso_served.dim_contoso_customer ON f.CustomerKey
    = dim_contoso_customer.CustomerKey JOIN contoso_served.dim_contoso_store ON f.StoreKey = dim_contoso_stor
  intent:
    measure: NetSalesAmount
    operation: sum
    slices:
    - term: Country
    join_filters:
    - left_term: Country
      op: eq
      right_term: Store
      right_column: CountryCode
- id: MQ-12
  question: Total sales in dollars
  outcome: PLAN
  detail: SELECT SUM(f."Quantity" * f."NetPrice")     AS net_sales_amount FROM contoso_served.v_contoso_order_line
    f WHERE f.CurrencyCode = :currency
  intent:
    measure: NetSalesAmount
    operation: sum
    filters:
    - term: Currency
      op: eq
      value: USD
- id: MQ-13
  question: Show all edges from the Customer concept and what each connects to
  outcome: PLAN
  detail: SELECT DISTINCT meta_edge.from_concept AS edge FROM contoso_served.meta_edge WHERE meta_edge.edge_id
    = :edge
  intent:
    measure: Edge
    operation: list
    filters:
    - term: Edge
      op: eq
      value: Customer
- id: MQ-14
  question: How many constraints are there across all concepts, and which concept has the most?
  outcome: REFUSAL
  cause: bug:generated-concept-not-countable
  detail: 'ontology_gap: [''DeclaredConstraint.measure_column'']'
  intent:
    measure: DeclaredConstraint
    operation: count
    slices:
    - term: DeclaredConstraint
      column: concept_id
- id: MQ-15
  question: What is the average customer age?
  outcome: REFUSAL
  cause: correct:declared-unanswerable
  detail: 'ontology_gap: [''Customer.City'']'
  intent:
    measure: Customer
    operation: average
- id: RC01
  question: What brands do we sell?
  outcome: PLAN
  detail: SELECT DISTINCT dim_contoso_product.Brand AS brand FROM contoso_served.dim_contoso_product
  intent:
    measure: Brand
    operation: list
- id: RC02
  question: List all countries where we have customers.
  outcome: PLAN
  detail: SELECT DISTINCT dim_contoso_customer.Country AS country FROM contoso_served.dim_contoso_customer
  intent:
    measure: Country
    operation: list
- id: RC03
  question: What product colors are available in our catalog?
  outcome: PLAN
  detail: SELECT DISTINCT dim_contoso_product.Color AS color FROM contoso_served.dim_contoso_product
  intent:
    measure: Color
    operation: list
- id: RC04
  question: How many customers do we have?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT dim_contoso_customer.CustomerKey) AS customer FROM contoso_served.dim_contoso_customer
  intent:
    measure: Customer
    operation: count
- id: RC05
  question: How many stores do we have?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT cycle.StoreKey) AS store FROM (SELECT *, ROW_NUMBER() OVER (PARTITION
    BY StoreKey ORDER BY OpenDate DESC) AS _mac_cycle_rank FROM contoso_served.dim_contoso_store) cycle
    WHERE cycle._mac_cycle_rank = 1
  intent:
    measure: Store
    operation: count
- id: RC06
  question: How many products are in our catalog?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT dim_contoso_product.ProductKey) AS product FROM contoso_served.dim_contoso_product
  intent:
    measure: Product
    operation: count
- id: RC07
  question: How many customers are in Germany?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT dim_contoso_customer.CustomerKey) AS customer FROM contoso_served.dim_contoso_customer
    WHERE dim_contoso_customer.Country = :country
  intent:
    measure: Customer
    operation: count
    filters:
    - term: Country
      op: eq
      value: Germany
- id: RC08
  question: How many stores are closed?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT cycle.StoreKey) AS store FROM (SELECT *, ROW_NUMBER() OVER (PARTITION
    BY StoreKey ORDER BY OpenDate DESC) AS _mac_cycle_rank FROM contoso_served.dim_contoso_store) cycle
    WHERE cycle._mac_cycle_rank = 1 AND cycle.Status = :storestatus
  intent:
    measure: Store
    operation: count
    filters:
    - term: StoreStatus
      op: eq
      value: Closed
- id: RC09
  question: How many products does the Contoso brand have?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT dim_contoso_product.ProductKey) AS product FROM contoso_served.dim_contoso_product
    WHERE dim_contoso_product.Brand = :brand
  intent:
    measure: Product
    operation: count
    filters:
    - term: Brand
      op: eq
      value: Contoso
- id: RC10
  question: How many orders were placed in 2024?
  outcome: REFUSAL
  cause: sme:no-order-concept
  detail: 'ontology_gap: [''OrderLine.measure_column'']'
  intent:
    measure: OrderLine
    operation: count
    period:
      start: '2024-01-01'
      end: '2025-01-01'
- id: RC11
  question: How many distinct products were sold in 2023?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT v_contoso_order_line.ProductKey) AS product FROM contoso_served.v_contoso_order_line
    JOIN contoso_served.dim_contoso_product ON v_contoso_order_line.ProductKey = dim_contoso_product.ProductKey
    WHERE v_contoso_order_line.OrderDate >= :period_start AND v_contoso_order_line.OrderD
  intent:
    measure: Product
    operation: count
    period:
      start: '2023-01-01'
      end: '2024-01-01'
- id: RC12
  question: How many female customers are in Europe?
  outcome: REFUSAL
  cause: decl:no-gender-concept
  detail: 'unresolved_term: [''Female'']'
  intent:
    measure: Customer
    operation: count
    filters:
    - term: Gender
      op: eq
      value: Female
    - term: Continent
      op: eq
      value: Europe
- id: RC13
  question: How many orders were placed in euros during Q1 2024?
  outcome: REFUSAL
  cause: sme:no-order-concept
  detail: 'ontology_gap: [''OrderLine.measure_column'']'
  intent:
    measure: OrderLine
    operation: count
    filters:
    - term: Currency
      op: eq
      value: EUR
    period:
      start: '2024-01-01'
      end: '2024-04-01'
- id: RC14
  question: How many customers are aged between 25 and 44?
  outcome: REFUSAL
  cause: decl:age-band-values
  detail: 'unresolved_term: [''25-29'']'
  intent:
    measure: Customer
    operation: count
    filters:
    - term: AgeBand
      op: in
      value:
      - 25-29
      - 30-34
      - 35-39
      - 40-44
- id: RC15
  question: How many different products did customers in France buy in Q1 2024?
  outcome: PLAN
  detail: SELECT COUNT(DISTINCT v_contoso_order_line.ProductKey) AS product FROM contoso_served.v_contoso_order_line
    JOIN contoso_served.dim_contoso_product ON v_contoso_order_line.ProductKey = dim_contoso_product.ProductKey
    JOIN contoso_served.dim_contoso_customer ON v_contoso_order_line.CustomerKey = dim_co
  intent:
    measure: Product
    operation: count
    filters:
    - term: Country
      op: eq
      value: France
    period:
      start: '2024-01-01'
      end: '2024-04-01'
