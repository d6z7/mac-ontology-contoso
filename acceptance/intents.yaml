# Hand-written intents — the reference interpretation of every corpus question.
#
# WHAT THIS IS
#   For each question, the Intent a PERFECT interpreter would emit. Written by hand,
#   with no LLM involved.
#
# WHY IT EXISTS
#   Running these through the planner separates the two failure sources that are
#   otherwise indistinguishable from a wrong answer:
#     * the intent PLANS  -> the planner is capable; the interpretation was at fault
#     * the intent FAILS  -> a real declaration, framework or grammar gap, named exactly
#   Before this file existed a wrong answer could not be attributed to either, and the
#   same question was "fixed" repeatedly in the wrong layer.
#
# HOW TO USE IT
#   As a regression fixture: these intents are inputs the planner must keep handling.
#   `outcome` and `cause` record what the planner did on the run named below; they are
#   observations, not expectations — when a declaration lands the outcome changes, and
#   this file should be RE-RUN (acceptance/tools/intent_killtest.py), not hand-edited.
#
#   An intent here is one reading, not the only one. Where a question is genuinely
#   ambiguous the intent takes the bundle's declared default; disagreeing with it is a
#   finding about the ontology, not a bug in this file.
#
# CAUSE VOCABULARY (closed)
#   decl:*     a declaration the bundle does not make — the planner refuses correctly
#   sme:*      a modelling question only an SME can rule on (no concept for the grain)
#   bug:*      the runtime or generator has the fact but one code path does not read it
#   model:*    the Intent model genuinely cannot express the question
#   correct:*  refusing IS the right answer
#
# WHAT THIS RUN IS NOT
#   A correctness result. It says the pipeline can FORM the query — not that the number
#   it returns is right. The corpus still carries no oracles.
#
run:
  planner: mac-platform develop @ ratio refuses
  bundle: example/contoso
  captured: '2026-09-24'
  counts:
    C. Intent-model gap (new grammar needed): 5
    A. bundle declaration gap (planner correct): 7
    PLANS from a hand-written intent: 51
    B. framework gap in the generated meaning plane: 3
    D. correctly refused: 2
    A2. SME modelling question (no concept for the grain asked): 2

