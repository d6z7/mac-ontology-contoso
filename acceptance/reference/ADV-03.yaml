sql: >-
  SELECT co.country_name, ROUND(SUM(l.net_amount) / (SELECT COUNT(*) FROM
  contoso_served.dim_customer x WHERE x.country_code = cu.country_code), 2) AS
  revenue_per_customer FROM contoso_served.v_contoso5_sales_line l JOIN
  contoso_served.dim_customer cu ON l.customer_key = cu.customer_key JOIN
  contoso_served.dim_country co ON cu.country_code = co.country_code GROUP BY co.country_name,
  cu.country_code ORDER BY revenue_per_customer DESC
note: >-
  INDEPENDENTLY VERIFIED 2026-10-18, not read back from the engine: the SQL below was written by
  hand against contoso5.duckdb and returns this figure exactly. BOTH CHANNELS, AND THE STATEMENT
  ABOVE APPLIES NO `location_code` RESTRICTION AT ALL. The sentence that stood here claimed a
  shop-only population and that shop-only was the bundle''s default for Store, and on 2026-10-24
  neither half was true of this reference: the statement never carried the filter, and the default
  was reversed by the operator on 2026-10-18 -- "now i am for correctnes and correctness is both"
  -- so an unqualified revenue question spans the online channel too. THE APPROVED FIGURE IS
  UNCHANGED and was always the both-channels figure; only the sentence describing it was wrong,
  which is why this is a prose repair and not a re-approval. A RATIO WITH A COUNTABLE DENOMINATOR:
  revenue divided by DISTINCT customers, not by rows. United States verified at
  3640.9837488560847. RE-RULED 2026-10-23 ON TWO OPERATOR DECISIONS, and BOTH halves of the old
  figure were wrong. First: "genuinly disputable but i hitnk the model migt right. path over
  customer is correct" — so the country is the CUSTOMER'S, not the store's, which alone
  invalidated every figure this reference held. Then, on the denominator: "adv03 accept",
  accepting the walk's reading. WHAT THIS QUESTION NOW MEANS, said plainly because it is the whole
  disagreement: a country's total net revenue, from customers REGISTERED in that country, over
  both channels and all time, divided by EVERY CUSTOMER ON FILE in that country — not by the ones
  who bought. THE DENOMINATOR IS THE QUESTION, and the bundle states the fact it turns on in
  capitals on `dim_customer.customer_key`: "HALF HAVE NEVER ORDERED". Measured 2026-10-23 —
  104,990 customers on file, 52,189 who ever placed an order, 52,801 who never did, and it is
  upstream DESIGN rather than a data defect (docs.sqlbi.com/contoso-data-generator). So "per
  customer" is a factor of two depending on which customer is meant: per customer ON FILE US
  2,475.76 DE 2,468.57 CA 2,298.69 <- this reference per ACTIVE customer US 4,505.30 DE 4,437.83
  CA 4,313.67 (the old store-path figures were US 3,640.98, DE 3,607.42, CA 3,492.85 — neither
  reading, because the path was wrong too)

  AND THE PAIR IS NOW DISCRIMINATING, which is why this reading and not the other. `MQ-23` asks
  "revenue per active customer, counting only customers who have placed an order" and is pinned at
  4,192.73 bundle-wide. If THIS question — the unqualified one — also meant active customers, the
  two would ask one thing and MQ-23 would add nothing. Unqualified means everyone on the register;
  naming "active" narrows it. One word, two questions, two numbers. WHAT IS STILL NOT DECLARED,
  and it is the reason this took two rulings rather than none: `mac.canon.ratio_select` is the
  mechanism for a denominator and the bundle uses it four times (discount -> GrossRevenue, margin
  -> NetRevenue, margin -> SalesCost, net_revenue -> UnitsSold). A ratio whose denominator is a
  COUNT OF THINGS has no declaration anywhere, so nothing could have told a reader which customer
  "per customer" divides by. Until it does, this reference and MQ-23 are the only places that say
  it.
