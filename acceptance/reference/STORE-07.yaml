id: STORE-07
question: >-
  How many of our stores have closed?
expected: 16
sql: >-
  SELECT COUNT(DISTINCT store_key) FROM contoso_served.dim_store WHERE close_date IS NOT NULL AND
  store_code IS DISTINCT FROM -1
note: >-
  INDEPENDENTLY VERIFIED, not read back from the engine. The SQL below was written by hand against
  contoso5.duckdb in a different spelling from the planner's own statement, and it returns this
  figure exactly. Approving a number the engine produced, on the engine's own query, would test
  the engine against itself. COUNTED BY DISTINCT LOCATION, not by row: dim_store is time-versioned
  (location 7 carries 3 trading periods), so counting rows would over-count. 14 closed + 57
  trading = 71 of the 73 rows' distinct locations; the remainder is the sentinel and the
  restructured pair.
