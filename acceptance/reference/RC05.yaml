id: RC05
question: >-
  How many stores do we have?
expected: 57
sql: >-
  SELECT COUNT(DISTINCT store_key) FROM contoso_served.dim_store WHERE close_date IS NULL AND
  store_code <> -1
note: >-
  57 ACTIVE STORES, on an operator ruling of 2026-09-30: "stores that are closed, restructured
  have close date and are not active anymore; other stores without status do not have close date
  are ONLY stores currently active and this is the scope of our interest in most questions." The
  population is declared, not described — store.yaml#grounding.value_filter is `close_date IS NULL
  AND store_code <> -1`, which the planner applies and discloses on every answer. WHAT EACH
  OTHER NUMBER IS, because this relation offers four and three of them have been believed at some
  point: 74 is every row, and it counts New Brunswick three times (three successive shops at one
  location, 1 105 -> 1 500 -> 3 500 m2). 67 is every distinct location code, which is what THIS
  FILE said until the ruling — it includes the nine locations whose shop has shut and the online
  sentinel. 58 is every row with no close date, which includes the online sentinel. 57 is the
  shops you can walk into. SUPERSEDES AN APPROVAL OF THE SAME DAY. 67 was approved on 2026-09-30,
  hours before the ruling, on the reading that counting stores counts location codes. It does —
  the ruling narrows WHICH codes are a store's, not how to count them, and `identity.counts_as:
  store_code` is untouched.
approved_by: operator
