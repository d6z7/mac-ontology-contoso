id: MQ-07
question: What is the revenue from the online store?
expected: 86790054.13
sql: >-
  SELECT round(sum(s.net_amount),2) FROM contoso_served.v_contoso5_sales_line s JOIN
  contoso_served.dim_store d ON d.store_key = s.store_key WHERE d.store_code = -1
note: >-
  40% OF THE BUNDLE'S REVENUE. The online business is written as one row of the store table
  (store_code -1) and no column carries the word "online". This reported `no_value` with an
  empty disclosure list until 2026-10-01 — the figure was bound onto `store_key`, declared
  integer, and silently matched nothing.
