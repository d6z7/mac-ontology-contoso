sql: >-
  WITH trading AS (SELECT store_name, square_metres FROM contoso_served.dim_store WHERE
  store_code IS DISTINCT FROM -1 AND close_date IS NULL), mean AS (SELECT AVG(square_metres) AS
  m FROM trading) SELECT t.store_name, t.square_metres / mean.m AS ratio_to_average FROM trading t
  CROSS JOIN mean ORDER BY ratio_to_average DESC, t.store_name ASC
note: >-
  THE SQL ABOVE IS NOT THE PLANNER'S OWN SPELLING, DELIBERATELY. The planner composes a scalar
  subquery (`SUM(x) / (SELECT AVG(x) FROM ...)`); this reference is written as a CTE plus a CROSS
  JOIN, so the approved number is not the engine graded against its own query. Both were executed
  on 2026-10-17 against contoso5.duckdb and agree to twelve decimal places over all 57 rows. THE
  POPULATION IS THE 57 TRADING SHOPS, AND THAT IS THIS REFERENCE'S OWN CHOICE: shop-only was the
  bundle's default for Store until the operator reversed it on 2026-10-18 -- "now i am for
  correctnes and correctness is both". Here the question itself says SHOPS, and the `--` sentinel
  (`store_code = -1`, the online channel) carries no floor area to put in a ratio of sizes, so
  it is excluded by the measure rather than by a default: the `--` sentinel (`store_code = -1`,
  the online channel) is excluded because `physical` applies when the question names none, and
  `close_date IS NULL` because `active` does. 73 shops exist, 57 trade. Anchors: total floor space
  86,170 m2, average 1,511.7543859649122 m2. THE TEST THE NUMBER CARRIES WITH IT: the mean of the
  57 ratios is EXACTLY 1.0. That is the one arithmetic property this shape must have -- every shop
  measured against the mean of all shops -- and it is what distinguishes this answer from the
  share-of-total it was confused with for three weeks. The same shops as a share of total floor
  space run 0.040617 (New Brunswick) down to 0.002843 (Corse) and sum to 1.0; as a ratio to the
  average they run 2.3151909017059302 down to 0.1620633631194151 and AVERAGE to 1.0. Both are
  legitimate answers to differently-worded questions, and they differ by a factor of 57. WHY THIS
  QUESTION EXISTS. Operator, 2026-10-17: "put this question into corpus ... we need to answer it
  by all means", then "this is fully legal and simple question !?!?!?!??! we cannot have such huge
  bottleneck about the simlest query ?!?!?!?". Until that day it was inexpressible: the grammar
  said WHICH POPULATION a denominator covers (`denominator_scope`) and nothing said WITH WHAT
  FUNCTION, so the nearest sayable reading divided by the SUM. Two different models each self-
  scored 0.30 and the reader was told to rephrase a question that was already clear.
