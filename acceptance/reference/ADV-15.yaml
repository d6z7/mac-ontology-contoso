id: ADV-15
question: >-
  How many customers bought Contoso brand products in stores outside their home country?
expected: 0
sql: >-
  SELECT COUNT(DISTINCT l.customer_key) FROM contoso_served.v_contoso5_sales_line l JOIN
  contoso_served.dim_store s ON l.store_key=s.store_key JOIN contoso_served.dim_customer cu ON
  l.customer_key=cu.customer_key JOIN contoso_served.dim_product p ON l.product_key=p.product_key
  WHERE s.store_code IS DISTINCT FROM -1 AND p.brand='Contoso' AND cu.country_code <>
  s.country_code
