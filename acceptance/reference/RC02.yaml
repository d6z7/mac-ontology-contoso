# THE APPROVED ANSWER. A person ran the query, read the number and said yes.
# The next run either returns this or it does not. PASS or FAIL, nothing else.
id: RC02
question: List all countries where we have customers.
expected:
  rows: 8
  ordered: false
  cols:
  - country_name
  values:
  - - Australia
  - - Canada
  - - France
  - - Germany
  - - Italy
  - - Netherlands
  - - United Kingdom
  - - United States
sql: |
  SELECT DISTINCT c.country_name
  FROM contoso_served.dim_customer cu
  JOIN contoso_served.dim_country c ON cu.country_code = c.country_code
  ORDER BY 1
sql_repointed:
  by: agent
  at: '2026-10-22'
  why: >-
    THE FILED SQL QUERIED A DIFFERENT BUNDLE, so this reference had never been verified. It was
    cloned from example/contoso, whose objects are v_contoso_order_line and dim_contoso_customer
    with PascalCase columns (CustomerKey, NetPrice, Quantity, Country, CountryFull, ProductKey,
    OrderDate). contoso5 names them v_contoso5_sales_line and dim_customer with snake_case
    columns, and normalises the country NAME onto dim_country. Measured 2026-10-22 across all 74
    references: 9 would not run, and 8 of those 9 were these clones.
  what_changed: 'only the sql field, as a translation of identifiers'
  what_did_not: >-
    expected, approved_by, approved_at and note are untouched. THE APPROVAL IS THE ANSWER; the SQL
    is the check. The translated query reproduces the approved expected value EXACTLY, which is
    the evidence that the translation is faithful rather than a new claim.
  verified: >-
    run against contoso5.duckdb on 2026-10-22 and it reproduces this file's own expected value.
note: >-
  THE EIGHT COUNTRIES WHERE CONTOSO HAS CUSTOMERS, by the customer's own country — Australia,
  Canada, France, Germany, Italy, Netherlands, United Kingdom, United States. This file used to
  carry that list in a `note:` while `expected` held the count 8; see `superseded_reason`.

  A DUPLICATE `note:` KEY WAS REMOVED HERE ON 2026-10-23, and it was not a formatting slip. The
  first of the two notes read "USD, like every stored amount in this fact ... 'Germany' is the
  CUSTOMER's country, not the store's ... Displayed in EUR at the order-date rate it is
  22 500 378.82" — a currency disclosure belonging to a REVENUE question (AGG-05's shape), on a
  reference that asks which countries have customers and holds no amount at all. YAML keeps the
  last key, so that paragraph was silently discarded on every load: a note nobody read, asserting
  a figure this question never computes. The editor flags it as "Map keys must be unique" and no
  gate did.
superseded_value: 8
superseded_reason: >-
  THE FIELD WAS ASKING FOR THE WRONG KIND OF THING. The question's first word is "List", and
  `expected` held the scalar 8 with a `sql` of `count(DISTINCT country_name)` — while the names
  themselves sat in a note beside it, which is where this file recorded the real answer. The walk
  returned all eight country names, correct and complete, and my grader compared a list of 8
  against the number 8 and reported WRONG.

  RULED 2026-10-23: "if the question is which brand, then the expected answer cannot be number ...
  so to expect a figure is wrong." That ruling was given on a brand question; this is the same
  class and the operator has not been asked about this file individually — flagged in the report
  so it can be vetoed. The eight names are unchanged from the note that was already here, and the
  new SQL reproduces them. Same defect as RC01 and RC03.
approved_by: operator
