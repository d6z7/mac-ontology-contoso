id: RC15
question: How many different products did customers in France buy in Q1 2024?
expected: 359
sql: |
  SELECT count(DISTINCT l."product_key")
  FROM contoso_served.v_contoso5_sales_line l
  JOIN contoso_served.dim_customer cu USING ("customer_key")
  WHERE cu."country_code" = 'FR' AND l."order_date" BETWEEN '2024-01-01' AND '2024-03-31'
