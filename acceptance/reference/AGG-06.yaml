id: AGG-06
question: What is the net revenue for the Contoso brand?
expected: 38431107.32
sql: |
  SELECT round(sum(l.net_price * l.quantity), 2)
  FROM   contoso_served.v_contoso5_sales_line l
  JOIN   contoso_served.dim_product p USING (product_key)
  WHERE  p.brand = 'Contoso'
note: >-
