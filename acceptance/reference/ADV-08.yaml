sql: >-
  SELECT co.country_name, SUM(l.net_amount)/COUNT(DISTINCT l.order_key) FROM
  contoso_served.v_contoso5_sales_line l JOIN contoso_served.dim_store s ON
  l.store_key=s.store_key JOIN contoso_served.dim_country co ON s.country_code=co.country_code
  WHERE s.store_code IS DISTINCT FROM -1 GROUP BY co.country_name ORDER BY 2 DESC
