id: ADV-22
question: >-
  Total Revenue
expected: 218814471.65866
sql: >-
  SELECT ROUND(
      (SELECT SUM(l.net_amount) FROM contoso_served.v_contoso5_sales_line l
         JOIN contoso_served.dim_store s ON l.store_key = s.store_key
        WHERE s.store_code IS DISTINCT FROM -1)
    + (SELECT SUM(net_amount) FROM contoso_served.v_contoso5_sales_line WHERE store_key = 999999)
  , 5)
note: >-
  RE-APPROVED 2026-10-19, SUPERSEDING THE 132,024,417.53 APPROVED 2026-10-17. That figure was not
  wrong when it was signed: it was the shop default declared at the time. THE OPERATOR REVERSED
  THAT DEFAULT ON 2026-10-18, in their own words recorded on `ontology/concepts/store.yaml`: "then
  it was aimed at simplicity ... now i am for correctnes and correct is that both internet and
  physical shops combined make revenue." A BARE QUESTION, deliberately in the corpus: 'Total
  Revenue' names no channel, and under the ruling nothing is assumed on the reader's behalf, so it
  spans both. The figure is NOT a second decision — it follows mechanically from the ruling, and it
  was re-derived by hand against contoso5.duckdb, not read back from the engine.

  THE SQL IS SPELLED AS THE SUM OF THE TWO CHANNEL PARTITIONS ON PURPOSE. It is a different
  statement from the planner's single unfiltered SUM, so it still tests the engine against
  something other than itself, and it CARRIES THE PROOF OF THE RULING'S ARITHMETIC: the shop
  partition is 132,024,417.53167 -- the old approved figure, unchanged -- and the online partition
  is 86,790,054.12699, one store row, `store_key` 999999 named 'Online store'. The two partitions
  are disjoint and exhaustive and sum to this figure exactly. What the ruling admitted is that one
  row, and nothing else moved. Same figure as MQ-12 because both ask one question two ways;
  STORE-09 is NO LONGER the same question, see its own note.
