id: STORE-11
question: >-
  What is the revenue of all closed stores?
expected: 3205452.32521
sql: >-
  SELECT ROUND(SUM(l.net_amount), 5) FROM contoso_served.v_contoso5_sales_line l
    JOIN contoso_served.dim_store s ON l.store_key = s.store_key
   WHERE s.close_date IS NOT NULL
