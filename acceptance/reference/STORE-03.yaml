id: STORE-03
question: >-
  How many stores have been restructured?
expected: 7
sql: >-
  SELECT COUNT(DISTINCT store_key) FROM contoso_served.dim_store WHERE status_annotation =
  'Restructured'
note: >-
  SIX STORES over SEVEN ROWS. A row is a trading period and a store is a location
  (identity.counts_as: location_code), and New Brunswick was restructured twice — so a COUNT of
  stores is 6 and the relation holds 7 such rows. The same declaration that makes RC05 57 rather
  than 74 makes this 6 rather than 7.
approved_by: operator
approved_at: '2026-10-24'
approved_here: true
ruling: >-
  operator, 2026-09-30, verbatim: "stores that are closed, restructured have close data and are
  not active anymore / other stories without status do not have close date are ONLY stores
  currently active and this is the scope of our interest im most questions"
superseded_value: 6
superseded_reason: >-
  THE STORE GRAIN MOVED AND THIS FOLLOWED IT, on the operator's instruction of 2026-10-24 ("go 1 2
  3 4", against a proposal naming this change and its two moving figures).
  `store.grounding.bindings[].counts` was `location_code` and is now `store_key`: a Location is
  the PLACE and a Store is the PREMISES standing on it, and `dim_store.store_key` declares
  `finer_than: location_code` for the lift between them. This statement counted DISTINCT
  location_code -- the place -- for a question that says STORES, so it answered a different
  question than the one filed above. NOTHING ABOUT THE DATA CHANGED; the declaration did, and this
  reference had not followed it. A question that names the SITE keeps the place grain and is right
  to -- see STORE-16, 14 sites, where `site` and `location` are `dim_location.location_code`'s own
  declared surfaces. Found by `check_corpus_semantics.py`'s rule 9, which reads the `counts:`
  declaration live and reports the two figures side by side so a grain mismatch is only charged
  once it is known to move.
basis: >-
  APPROVED HERE, on this bundle's own served plane — not cloned. The number was ruled by the
  operator and then used as the oracle of every verification run of 2026-10-01; this file is that
