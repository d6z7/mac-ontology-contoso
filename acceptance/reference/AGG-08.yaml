id: AGG-08
question: Compare net revenue in Germany versus France
expected:
  rows: 2
  ordered: false
  values:
  - - DE
    - 24638830.18
  - - FR
    - 6674724.85
sql: SELECT sale_country_code, ROUND(SUM(net_amount), 2) AS net_sales_amount FROM contoso_served.v_contoso5_sales_line
  WHERE sale_country_code IN ('DE', 'FR') GROUP BY sale_country_code ORDER BY 2 DESC
follows:
- rule: Country.whose
  option: territory
  otherwise:
    store:
      expected:
        rows: 2
        ordered: false
        values:
        - - DE
          - 14382768.44
        - - FR
          - 3722647.45
      sql: SELECT s.country_code, ROUND(SUM(l.net_amount), 2) AS net_sales_amount FROM contoso_served.v_contoso5_sales_line
        l JOIN contoso_served.dim_store s ON l.store_key = s.store_key WHERE s.country_code IN ('DE', 'FR') GROUP
        BY s.country_code ORDER BY 2 DESC
    customer:
      expected:
        rows: 2
        ordered: false
        values:
        - - DE
          - 24638830.18
        - - FR
          - 6674724.85
      sql: |
        SELECT cu."country_code", round(sum(l."net_price" * l."quantity"), 2) AS net_sales_amount
        FROM contoso_served.v_contoso5_sales_line l
        JOIN contoso_served.dim_customer cu USING ("customer_key")
        WHERE cu."country_code" IN ('DE', 'FR')
        GROUP BY cu."country_code"
        ORDER BY 2 DESC
note: 'FOLLOWS Country.whose = territory: a question that names a country but not whose is answered on the country
  of the sale: a shop sale in the country the shop stands in, a web sale in the country the customer lives in (operator
  ruling 2026-10-25, RULED-2026-10-25_a-sale-is-attributed-by-its-channel). The answer under every other option
  is under `follows[].otherwise`, with its signature where a person signed it; acceptance/tools/rule_switch_test.py
  runs each and shows which differ.'
