id: AGG-09
question: Which brand sold more in total, Contoso or Fabrikam?
expected:
  rows: 2
  ordered: true
  values:
    - [Contoso, 38431107.32]
    - [Fabrikam, 19594532.31]
sql: |
  SELECT p.brand, round(sum(l.net_price * l.quantity), 2) AS net_sales_amount
  FROM   contoso_served.v_contoso5_sales_line l
  JOIN   contoso_served.dim_product p USING (product_key)
  WHERE  p.brand IN ('Contoso', 'Fabrikam')
  GROUP  BY p.brand ORDER BY 2 DESC
note: >-
  THE ANSWER IS "CONTOSO", AND IT IS CHECKED AS AN ORDERED PAIR. A comparison question has a
  winner, and the winner is the first row — so the ORDER is the answer and a reversed result is
  wrong even with both numbers right. Contoso is 2.0x Fabrikam.

