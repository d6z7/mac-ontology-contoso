sql: "SELECT nm, ROUND(net,2) FROM (\n  SELECT s.store_code lc, MIN(s.store_name) nm, SUM(l.net_amount)\
  \ net\n  FROM contoso_served.v_contoso5_sales_line l\n  JOIN contoso_served.dim_store s ON l.store_key\
  \ = s.store_key\n  WHERE s.store_code <> -1\n  GROUP BY 1) p\nWHERE net > (SELECT AVG(net) FROM\
  \ (\n  SELECT s.store_code, SUM(l.net_amount) net\n  FROM contoso_served.v_contoso5_sales_line\
  \ l\n  JOIN contoso_served.dim_store s ON l.store_key = s.store_key\n  WHERE s.store_code <> -1\
  \ GROUP BY 1) q)\nORDER BY net DESC\nLIMIT 5\n"
