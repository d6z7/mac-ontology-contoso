id: RC07
question: How many customers are in Germany?
expected: 9981
sql: |
  SELECT count(DISTINCT cu.customer_key)
  FROM contoso_served.dim_customer cu
  JOIN contoso_served.dim_country c ON cu.country_code = c.country_code
  WHERE c.country_name = 'Germany'
sql_repointed:
  by: agent
  at: '2026-10-22'
  why: >-
    THE FILED SQL QUERIED A DIFFERENT BUNDLE, so this reference had never been verified. It was
    cloned from example/contoso, whose objects are v_contoso_order_line and dim_contoso_customer
    with PascalCase columns (CustomerKey, NetPrice, Quantity, Country, CountryFull, ProductKey,
    OrderDate). contoso5 names them v_contoso5_sales_line and dim_customer with snake_case
    columns, and normalises the country NAME onto dim_country. Measured 2026-10-22 across all 74
    references: 9 would not run, and 8 of those 9 were these clones.
  what_changed: 'only the sql field, as a translation of identifiers'
  what_did_not: >-
    expected, approved_by, approved_at and note are untouched. THE APPROVAL IS THE ANSWER; the SQL
    is the check. The translated query reproduces the approved expected value EXACTLY, which is
    the evidence that the translation is faithful rather than a new claim.
  verified: >-
    run against contoso5.duckdb on 2026-10-22 and it reproduces this file's own expected value.
note: >-
  USD, like every stored amount in this fact — see AGG-01 for the measurement that establishes
  it. "Germany" is the CUSTOMER's country, not the store's.

  THE ANSWER MUST DISCLOSE ITS CURRENCY, because a German reader will assume euros and the
  number is not in euros. Displayed in EUR at the order-date rate it is 22 500 378.82 — six per
  cent lower, and a figure nobody would notice was the wrong currency.
  CountryFull='Germany'
note: CountryFull, not Country -- Country holds the ISO code 'DE'
