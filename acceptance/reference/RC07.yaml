question: How many customers are in Germany?
expected: 7135
sql: SELECT count(DISTINCT customer_key) FROM contoso_served.dim_customer WHERE country_code = 'DE' AND valid_from
  <= DATE '2025-12-31' AND valid_to >= DATE '2025-12-31'
follows:
- rule: Customer.active_on_the_reference_date
