sql: >-
  SELECT DISTINCT p.product_name
    FROM contoso_served.dim_product p
   WHERE p.product_key NOT IN (
          SELECT DISTINCT product_key FROM contoso_served.v_contoso5_sales_line
           WHERE order_date >= DATE '2024-01-01' AND order_date < DATE '2025-01-01')
   ORDER BY 1
