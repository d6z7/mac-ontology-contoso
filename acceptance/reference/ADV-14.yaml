note: >-
  SUPERSEDED 2026-10-24 — SEE `reapproved` ABOVE. The paragraph below is the 2026-10-19 reasoning, kept
  because it is why this reference exists and because its argument against a FIGURE stands.
  APPROVED BY THE OPERATOR 2026-10-19: "3 refusals correct". A REFUSAL IS THE ANSWER HERE, and it
  is not a near miss or a partial credit -- it is the only correct reply. WHY A NUMBER WOULD BE
  WORSE THAN NO ANSWER: answering 0 says this is a population with nothing in it, when the truth
  is that it is not a population of this bundle at all. That difference is invisible in a figure
  and decisive to a reader, and it is the silent-wrong-answer class this whole plane exists to
  catch. THE STATEMENT BELOW PROVES THE ABSENCE and must keep returning NOTHING. That is what
  makes this reference checkable at all: there is no value to re-derive, but presence is a fact
  about the warehouse, so `check_reference_agrees_with_itself` runs it and fails if the bundle
  ever gains the thing the question names -- the direction in which an approved refusal goes stale
  in silence. AND THE REFUSAL MUST NAME THE TERM, which `expected_refusal_names` enforces.
  Refusals are not interchangeable: ADV-05 in this same corpus refuses with "self-score 0.40 is
  below the 0.50 threshold", which is the interpreter declining to read a question it did
  understand the shape of. Approving "it refused" would accept that too and grade the STAGE
  instead of the ANSWER. THERE IS NO `Electronics` CATEGORY IN THIS BUNDLE. The eight it has are
  Audio, Cameras and camcorders, Cell phones, Computers, Games and Toys, Home Appliances, Music,
  Movies and Audio Books, and TV and Video -- several of which a reader might reasonably call
  electronics, which is exactly why the engine must not pick one. The rest of the question is
  answerable (German stores resolve, as ADV-04 shows), so the refusal turns on this one unresolved
  term and the engine says so: "No product category named 'Electronics' in
  data/lookups/contoso5_category_name.lookup.csv".

  WHY THIS REFERENCE DEMANDS MORE THAN THE REFUSAL THE ENGINE GIVES TODAY, added 2026-10-19 after
  the operator asked why a single pass is treated as sufficient: "if something responds that
  something doesn't exist here - then its the repsonsibility of an agent to check adn
  doublecheck". They are right, and this file as first written would have APPROVED the unhelpful
  answer.

  THE MEASUREMENT THAT SETTLES IT. The near-miss ladder cannot see this case and not by accident:
  difflib scores 'electronics' at 0.455 against its best category ('Cell phones') and 0.545
  against its best sub-category ('Televisions'), both far under the 0.80 NEAR_MISS_FLOOR. That is
  correct behaviour for the instrument -- 'Electronics' is not a MISSPELLING of anything, it is a
  SUPERSET of several of these, and edit distance has no access to that. So the system runs its
  two deterministic passes, finds nothing, and reports the exhaustion of its instruments as
  certainty. Compare 'Turkey', which scores 0.36 against its best country: the same score, a
  completely different situation, and no way to tell them apart from the number.

  AND THE MODEL WAS NEVER SHOWN THE EIGHT CATEGORIES. Measured on the prompt as sent: not one of
  'Cell phones', 'Home Appliances' or 'TV and Video' appears anywhere in its 36,764 characters.
  The word 'category' does. So the model was asked for a category value, given no values, and
  guessed a reasonable English word -- then the system refused it for not being in a list it had
  never been given, and the refusal did not print the list either. Every register in this bundle
  is small enough to show: 234 values over twelve registers, the largest 67.

  WHAT IS APPROVED HERE IS STILL A REFUSAL. There is no Electronics revenue to report and picking
  a subset of categories would be the system making the reader's decision, which it must never
  do. What changes is that the refusal must DISCLOSE the population it checked against, per the
  estate's standing rule -- answer the whole range and disclose the narrower population, or ASK;
  never narrow silently -- and per the resolution ladder's own third rung, exact -> near miss ->
  ask with candidates. STORE-04 already reaches that rung and names all three of its columns, so
  the mechanism exists and simply is not wired to an unresolved VALUE.

  THIS REFERENCE THEREFORE FAILS TODAY, deliberately. The engine refuses and offers nothing, so
  `expected_refusal_offers` is unmet. That is a measured gap with an owner rather than a silent
  one, which is the whole point of writing it down.
