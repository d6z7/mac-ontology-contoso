question: >-
  What is the revenue of all Contoso stores?
expected: 132024417.53167
sql: >-
  SELECT ROUND(SUM(l.net_amount), 5) FROM contoso_served.v_contoso5_sales_line l JOIN
  contoso_served.dim_store s ON l.store_key = s.store_key WHERE s.store_code IS DISTINCT FROM
  -1
