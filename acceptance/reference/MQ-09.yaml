question: "Are there any stores in Italy with no sales?"
expected: false
sql: >-
  SELECT COUNT(*) > 0 AS any_such_store
    FROM contoso_served.dim_store s
    JOIN contoso_served.dim_country co ON s.country_code = co.country_code
   WHERE co.country_name = 'Italy'
     AND s.close_date IS NULL
     AND s.store_key NOT IN (SELECT DISTINCT store_key FROM contoso_served.v_contoso5_sales_line)
note: >-
  DERIVED BY HAND 2026-10-19 AND IT REPRODUCES THE APPROVED VALUE. This file carried the PLANNER'S
  OWN parameterised statement, which the first two lines of this file forbid: approving a number
  the engine produced, on the engine's own query, tests the engine against itself. The approved
  value is UNCHANGED and keeps the operator's original date. FALSE IS THE ANSWER AND IT IS AN
  ANSWER, not a failure: every active Italian store has sales, so the honest reply to 'are there
  any' is no. The statement asks it as the question does -- EXISTENCE, as a boolean -- rather than
