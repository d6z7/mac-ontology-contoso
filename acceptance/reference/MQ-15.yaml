id: MQ-15
question: >-
  What is the average customer age?
expected: 56.80108581769692
sql: >-
  SELECT AVG(date_diff('year', birth_date, DATE '2025-12-31') - CASE WHEN
  strftime(birth_date,'%m%d') > strftime(DATE '2025-12-31','%m%d') THEN 1 ELSE 0 END) FROM
  contoso_served.dim_customer WHERE birth_date IS NOT NULL
superseded_value: 57.59449471378227
superseded_reason: >-
  THE ANCHOR MOVED BY OPERATOR RULING, exactly as this file demanded it should. Its own note said
  "THE ANCHOR IS 2026-10-17 and it is part of the figure, not incidental: an age moves every day. A
  rerun on a later anchor must supersede this number with that date stated." On 2026-10-23 the
  operator ruled the sampling date: "but as the time move on ... we need to specify the sampling
  date lets say on 31.12.2025". That anchor is not typed anywhere — `max(order_date)` over
  `v_contoso5_sales_line` IS 2025-12-31, so it is a measurement, bound through
  `mac.canon.scoped_latest` and `order.resolution.the_anchor_is_the_newest_order`.

  SO THE WALK WAS RIGHT AND THE REFERENCE WAS STALE. It claimed 56.8; completed years at the ruled
  anchor are 56.80108581769692. My grader reported "claimed '56.8', reference 57.59449471378227" —
  a 0.79-year gap that was entirely the difference between the date the operator ruled and the date
  someone happened to run the query on.

  AND THE RULING COLLAPSES THE ROUNDING FORK HERE, which is the part worth keeping. Measured
  2026-10-23 over all 104,990 customers (every one carries a birth_date):

      anchor 2025-12-31   birthday-aware COMPLETED years   56.80108581769692
                          year BOUNDARIES crossed          56.80108581769692   <- identical
                          fractional (days/365.25)         57.29913817938632

      anchor 2026-10-17   birthday-aware COMPLETED years   57.59449471378227
                          year BOUNDARIES crossed          57.80108581769692   <- differ by 0.21
                          fractional (days/365.25)         58.09311490765531

  The two DECLARED integer readings agree to the last digit on a 31 December anchor and disagree
  mid-year, which this file already knew: "The two agree on a 31 December anchor and differ here,
  which is the whole reason the test anchor is mid-year." The old anchor was chosen to EXPOSE the
  fork; the ruled anchor removes it. Only the fractional reading still differs, and that axis is
  the one the operator still owes a ruling on — it is what MQ-14 and MQ-20 turn on.
note: >-
  INDEPENDENTLY VERIFIED 2026-10-18 and it took three attempts to verify honestly, which is worth
  recording. A plain fractional age (days / 365.25) gives 58.093 at this anchor and
  `date_diff('year', ...)` gives 57.801 — both wrong, and either would have been approved by an
  eye that stopped at 'close enough'. The declared reading is BIRTHDAY-AWARE COMPLETED YEARS:
  whole years since the birth date, minus one for anyone whose birthday has not yet arrived this
  year. The SQL above reproduces this figure to the last digit.

  THE OTHER ROUNDING IS A DIFFERENT, ALSO-DECLARED FIGURE: `year_boundaries_since_birth_date`
  counts year boundaries crossed and is 57.80108581769692. The two agree on a 31 December anchor
  and differ here, which is the whole reason the test anchor is mid-year.

  THE ANCHOR IS 2026-10-17 and it is part of the figure, not incidental: an age moves every day. A
  rerun on a later anchor must supersede this number with that date stated.

  THIS QUESTION WAS TAGGED `edge-case-unanswerable` UNTIL TODAY. Elapsed time had no mechanism, so
  there was no way to get an age from a birth date; it shipped 2026-10-16 and the tag was still
  asserting the closed gap, which made the oracle expect a REFUSE and the working answer read as a
  contradiction. A duplicate of this question (MQ-18, same text, tagged `advanced-time`) was added
  2026-10-17 and removed with this approval.
