id: STORE-16
question: >-
  How many different sites that had shops were closed?
expected: 14
sql: >-
  SELECT COUNT(DISTINCT store_code) FROM contoso_served.dim_store
   WHERE close_date IS NOT NULL
note: >-
  ADDED 2026-10-23 BY THE OPERATOR AS A DELIBERATE TEST, verbatim: "how about you ask the model how
  many shop sites were closed? if it answers this correct then its genious". It exists because
  RC08 and STORE-14 are ambiguous and the operator said plainly of them: "actually this question i
  dont know myself what would i think ... model could also be right".

  WHAT THE WORDING SETTLES, AND IT IS NOT EVERYTHING. This paragraph claimed the question "settles
  both axes in its own words" until 2026-10-24; that was the claim the walk's own answer refuted,
  and it had sat here contradicting nothing because nothing read it. One axis is settled:
    "DIFFERENT SITES" -> the grain is `store_code`: 67 of them, being 66 physical premises plus
                     the online sentinel (-1). NOT the 74 ROWS, which are versions of a site, and
                     NOT the 16 closure EVENTS. `dim_store` declares this itself: "a store is its
                     store_code, of which there are 67". The word "different" is what rules out
                     counting a twice-closed site twice, and it is the half the wording fixes.
    "SHOP"        -> physical. It changes nothing here, since the web shop carries no close_date,
                     and that is worth knowing rather than assuming.
  The other axis is NOT settled by any wording, and claiming it was is how this reference came to
  rest on a guess:
    "WERE CLOSED" -> read here as EVER closed, so a site that closed and reopened still counts.
                     That is a READING, not a declaration. "had shops ... were closed" admits the
                     narrower one — sites that used to have a shop and no longer do, which is 9 —
                     and nothing in the ontology says which is meant. See `reworded_reason`.

  SO THE ANSWER IS 14, and the two readings it is NOT are recorded so a wrong answer can be read
  rather than merely marked:
      16   closure EVENTS — rows carrying a close_date. Two sites closed TWICE: New Brunswick
           (2014-03-09 and 2018-02-02, both Restructured, trading again since 2018-06-02) and
           Delaware (2015-03-03 Restructured, then 2019-08-03 Closed for good). 16 - 14 = those 2.
      14   SITES ever closed                                    <- this reference
       9   sites closed NOW — latest version carries a close_date. Of the 66 physical sites, 9 are
           shut today and 57 trade; with the online sentinel that is 9 + 58 = 67 location codes.
           This is the only one of the three readings that PARTITIONS the estate, and 5 of the 14
           fall on the trading side of it, which is precisely why it is not the answer here.

  WHY THE CORPUS NEEDS THIS QUESTION AND NOT ONLY RC08. The walk answered RC08 with 16 and
  STORE-14 with 1 — two different readings of one word, in two questions whose only difference is
  a country filter. Neither reading is wrong; the questions never said which. This one does, so a
  wrong answer here is a real finding about the walk rather than about the wording.

  AND IT IS STILL NOT A DECLARATION. `store.resolution.active_is_the_absent_close_date` declares
  what ACTIVE means over a versioned dimension and says nothing about what CLOSED means. Until it
  does, this question works because its own words are careful, and RC08 does not. Note for whoever
  writes that declaration: it cannot say "a site is closed if it has a Closed row", because
  Delaware carries BOTH a Restructured row and a Closed one — a site's state is the state of its
  LATEST version.
