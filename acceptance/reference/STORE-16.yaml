reworded_reason: >-
  REPHRASED BY THE OPERATOR, verbatim: "rephrase question to: how many different sites that had
  shops were closed". The figure is UNCHANGED at 14; only the wording moved, so the approval of
  2026-10-23 stands on the same number.

  WHY. Asked as "How many shop sites were closed?" the walk did not commit. It gave all three
  readings with their figures -- 9 closed now, 14 ever closed, 16 closure events -- and asked which
  was meant, which is what the operator's own instruction of 2026-10-23 tells it to do when a
  question carries a fork. My grader bucketed that DECLINED and I reported it as a failure to
  answer; it was neither. The answer contained 14, labelled.

  WHAT THE NEW WORDING SETTLES AND WHAT IT DOES NOT. "different sites" names the GRAIN and kills the
  16 reading outright: events are not sites. It does NOT settle ever-closed against closed-now, and
  "sites that HAD shops" arguably leans the other way -- a site trading today does not "have had" a
  shop, it has one -- so 9 is a live reading of these words too.

  THE WORDING IS NOT THE REAL FIX AND THIS FILE SAID SO BEFORE IT WAS SIGNED:
  `store.resolution.active_is_the_absent_close_date` declares what ACTIVE means over a versioned
  dimension and says nothing about what CLOSED means. Until that declaration exists, every pass on
  this question is the model guessing the same way the reference did.
