id: RC13
question: How many orders were placed in euros during Q1 2024?
expected: 1099
sql: |
  SELECT count(DISTINCT order_key) FROM contoso_served.v_contoso5_sales_line
  WHERE currency_code = 'EUR' AND order_date BETWEEN '2024-01-01' AND '2024-03-31'
note: >-
  Distinct OrderKey, not lines. The currency is a property of the order and one order is
  denominated in exactly one currency (measured 0 of 93 470 orders carry two). Q1 is the
  calendar quarter on OrderDate — the period axis ruled in NSA-Q2.

