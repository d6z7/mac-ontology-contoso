id: OPQ-01
question: what is the sales ratio from the internet business compared with physical stores?
expected: 0.6574
sql: |
  SELECT ROUND(SUM(CASE WHEN st.store_code = -1 THEN sl.net_amount ELSE 0 END)
               / NULLIF(SUM(CASE WHEN st.store_code <> -1 THEN sl.net_amount ELSE 0 END), 0), 4)
  FROM contoso_served.v_contoso5_sales_line sl
  JOIN contoso_served.dim_store st ON sl.store_key = st.store_key
note: >-
  THE OPERATOR'S OWN QUESTION, asked on 2026-10-22, and added to the deck at his instruction. It is
  here because it is the first question in this corpus whose SUBJECT is the declared populations
  themselves: `online` and `physical` are not a filter it happens to need, they are the two things
  being compared.

  USD. 86,790,054.13 over 132,024,417.53 — the amounts in v_contoso5_sales_line ARE USD and must not
  be converted (currency.ambiguity.code_is_not_the_unit_of_the_amounts; `currency_code` is the
  currency TRANSACTED IN). Converting through ExchangeRate gives 0.6461, and a run without the
  declarations did exactly that.

  NET, not gross. Gross gives 0.6567, units sold 0.7153, distinct orders 0.7150 and distinct
  customers 0.7789 — five defensible figures for one English sentence, which is why
  net_revenue.default.revenue_means_net says to answer with net_amount and SAY NET.

  THE CHANNEL SPLIT IS THE DECLARED PREDICATE, not the store's name: Store's `physical` population
  is store_code <> -1 and `online` is = -1, from
  store.resolution.the_channel_is_the_location_sentinel. A reading that finds the online store by
  matching store_name = 'Online store' is right by luck.
