sql: >-
  SELECT co.country_name, ROUND(SUM(l.net_amount),5) FROM contoso_served.v_contoso5_sales_line l
  JOIN contoso_served.dim_store s ON l.store_key=s.store_key JOIN contoso_served.dim_customer cu
  ON l.customer_key=cu.customer_key JOIN contoso_served.dim_country co ON
  s.country_code=co.country_code WHERE s.store_code IS DISTINCT FROM -1 AND cu.country_code =
  s.country_code GROUP BY co.country_name ORDER BY 2 DESC
note: >-
  INDEPENDENTLY VERIFIED 2026-10-18, not read back from the engine: the SQL below was written by
  hand against contoso5.duckdb and returns this figure exactly. SHOP POPULATION throughout
  (`store_code IS DISTINCT FROM -1`), AND IT IS DECLARED HERE RATHER THAN INHERITED. Shop-only
  was the bundle''s default for Store until the operator reversed it on 2026-10-18 -- "now i am
  for correctnes and correctness is both" -- so this restriction is a choice this reference has to
  justify, and the justification is the AXIS and not a default: the online channel is one row of
  `dim_store` carrying `store_code = -1`, and it has neither a country nor a floor area, so it
  cannot appear on an axis that groups by either. A question that names the online channel is
  answered -- see MQ-07 and ADV-24. THE CROSS- DIMENSION PREDICATE IS THE POINT: `cu.country_code
  = s.country_code` compares a column of one concept to a column of another, which is what
  `join_filters` exists for. United States verified at 67827886.25744.
