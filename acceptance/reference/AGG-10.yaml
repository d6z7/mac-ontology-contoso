id: AGG-10
question: What are the top 5 countries by net revenue?
expected:
  rows: 5
  cols:
  - Country
  - net_sales_amount
  ordered: true
  values:
  - - US
    - 111862187.56
  - - DE
    - 24638830.18
  - - CA
    - 23242027.53
  - - GB
    - 23049533.37
  - - AU
    - 13360672.61
sql: SELECT sale_country_code, ROUND(SUM(net_amount), 2) AS net_sales_amount FROM contoso_served.v_contoso5_sales_line
  GROUP BY sale_country_code ORDER BY 2 DESC LIMIT 5
follows:
- rule: Country.whose
  option: territory
  otherwise:
    store:
      expected:
        rows: 5
        ordered: true
        cols:
        - Country
        - net_sales_amount
        values:
        - - US
          - 67827886.26
        - - GB
          - 15058669.67
        - - DE
          - 14382768.44
        - - CA
          - 13712923.81
        - - AU
          - 7501114.89
      sql: SELECT s.country_code, ROUND(SUM(l.net_amount), 2) AS net_sales_amount FROM contoso_served.v_contoso5_sales_line
        l JOIN contoso_served.dim_store s ON l.store_key = s.store_key JOIN contoso_served.dim_country co ON s.country_code
        = co.country_code WHERE NOT co.is_placeholder GROUP BY s.country_code ORDER BY 2 DESC LIMIT 5
    customer:
      expected:
        rows: 5
        cols:
        - Country
        - net_sales_amount
        ordered: true
        values:
        - - US
          - 111862187.56
        - - DE
          - 24638830.18
        - - CA
          - 23242027.53
        - - GB
          - 23049533.37
        - - AU
          - 13360672.61
      sql: |
        SELECT cu."country_code", round(sum(l."net_price" * l."quantity"), 2) AS net_sales_amount
        FROM contoso_served.v_contoso5_sales_line l
        JOIN contoso_served.dim_customer cu USING ("customer_key")
        GROUP BY cu."country_code"
        ORDER BY 2 DESC
        LIMIT 5
note: 'FOLLOWS Country.whose = territory: a question that names a country but not whose is answered on the country
  of the sale: a shop sale in the country the shop stands in, a web sale in the country the customer lives in (operator
  ruling 2026-10-25, RULED-2026-10-25_a-sale-is-attributed-by-its-channel). The answer under every other option
  is under `follows[].otherwise`, with its signature where a person signed it; acceptance/tools/rule_switch_test.py
  runs each and shows which differ. ORDERED, unlike AGG-03: a "top 5" question is a ranking and a wrong order is
  a wrong answer. The US alone is 51% of all revenue, so the first row carries most of the risk.'
