  verified: >-
    run against contoso5.duckdb on 2026-10-22 and it reproduces this file's own expected value.
note: >-
  ORDERED, unlike AGG-03: a "top 5" question is a ranking and a wrong order is a wrong answer.
  The US alone is 51% of all revenue, so the first row carries most of the risk.
