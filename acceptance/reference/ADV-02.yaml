id: ADV-02
question: >-
  Which brand has the highest margin (gross minus net) in Europe?
expected:
  rows: 1
  cols: [brand, gross_minus_net]
  values:
  - - Adventure Works
    - 998156.72329
sql: >-
  SELECT p.brand, SUM(l.gross_amount) - SUM(l.net_amount) AS gross_minus_net
  FROM contoso_served.v_contoso5_sales_line l
  JOIN contoso_served.dim_customer cu ON l.customer_key = cu.customer_key
  JOIN contoso_served.dim_product p ON l.product_key = p.product_key
  WHERE cu.continent = 'Europe'
  GROUP BY p.brand ORDER BY gross_minus_net DESC LIMIT 1
