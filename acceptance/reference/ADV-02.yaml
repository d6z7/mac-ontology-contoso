      sql: SELECT p.brand, SUM(l.gross_amount) - SUM(l.net_amount) AS gross_minus_net FROM contoso_served.v_contoso5_sales_line
        l JOIN contoso_served.dim_customer cu ON l.customer_key = cu.customer_key JOIN contoso_served.dim_product
        p ON l.product_key = p.product_key WHERE cu.continent = 'Europe' GROUP BY p.brand ORDER BY gross_minus_net
        DESC LIMIT 1
note: 'FOLLOWS Country.whose = territory: a question that names a country but not whose is answered on the country
