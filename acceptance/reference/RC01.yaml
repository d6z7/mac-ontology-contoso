superseded_reason: >-
  THE FIELD WAS ASKING FOR THE WRONG KIND OF THING, and this file said so itself the whole time.
  Its own note read "The approved answer is the SET as much as the count -- a list question returns
  the 11 members", and `approved_here.basis` records what the operator actually read and approved:
  "11 rows, SQL `SELECT DISTINCT dim_product.brand`". So the SET is what was signed on 2026-09-30.
  `expected: 11` and `sql: count(DISTINCT brand)` were a count of that set, contradicting the two
  prose fields beside them — the FIFTH instance this week of a decision recorded where no machine
  reader can see it, after `applies: subject`, the channel `why:`, the naming term order and the
  age rounding. A grader reads `expected`, not the note.

  WHAT IT COST: the walk answered with the 11 brand names, correct and complete, and my grader in
  `spikes/v3/run_corpus.py` compared a list of 11 against the scalar 11 and reported WRONG. The
  operator's reply was "who graded rc01 wrong ?!?!?!? to me it looks valid ?!?!!?!?" — it was my
  grader, and the model was right. The same defect sat on RC02 and RC03.

  AND IT WAS ALREADY RULED, on 2026-10-23, before this file was touched: "if the question is which
  brand, then the expected answer cannot be number ... unless this number is the name of the
  'brand'!!! so to expect a figure is wrong." This change applies that ruling to the field the
  grader reads. The value is not new; it is the one the console capture carried and the operator
  approved. `ordered: false` because the question asks WHICH brands and names no ranking.
