sql: 'SELECT p.brand, ROUND(SUM(l.gross_amount),2), ROUND(SUM(l.net_amount),4)

  FROM contoso_served.v_contoso5_sales_line l

  JOIN contoso_served.dim_store s ON l.store_key=s.store_key

  JOIN contoso_served.dim_product p ON l.product_key=p.product_key

  WHERE l.order_date >= DATE ''2024-01-01'' AND l.order_date < DATE ''2025-01-01''

  GROUP BY p.brand

  ORDER BY 3 DESC

  '
