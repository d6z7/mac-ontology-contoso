sql: >-
  SELECT dim_product.brand, dim_customer.country_code, SUM(v_contoso5_sales_line.net_amount) AS
  netrevenue FROM contoso_served.v_contoso5_sales_line JOIN contoso_served.dim_product USING
  (product_key) JOIN contoso_served.dim_customer USING (customer_key) WHERE order_date >= date
  '2024-01-01' AND order_date < date '2025-01-01' GROUP BY 1,2 ORDER BY dim_product.brand ASC,
  netrevenue DESC
note: >-
  88 rows, not 88 = 11 x 8: three brand/country combinations sold nothing in 2024, and the row
  count is the thing that catches a cross join or a dropped combination. THREE VALUES SPOT-
  CHECKED, not all 88, and now POSITIONALLY: the question names its own order (brand alphabetical,
  then revenue descending within the brand), so the first three rows are a contract about the
  ordering as well as the arithmetic. A. Datum leads because the order is by brand first; under
  the previous undated, unordered wording the spot-checks were the three largest by revenue.
