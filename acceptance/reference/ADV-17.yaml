sql: >-
  SELECT p.brand FROM contoso_served.v_contoso5_sales_line l JOIN contoso_served.dim_product p ON
  l.product_key = p.product_key JOIN contoso_served.dim_store s ON l.store_key = s.store_key GROUP
  BY p.brand HAVING COUNT(DISTINCT s.country_code) = (SELECT COUNT(DISTINCT country_code) FROM
  contoso_served.dim_store) ORDER BY 1
