question: Show revenue from new customers with first order from 2024 onwards vs customers older then 2024
expected:
  rows: 2
  ordered: true
  cols: [cohort, customers, net_revenue]
  values:
  - - older than 2024
    - 41392
    - 193043381.89
  - - new in 2024
