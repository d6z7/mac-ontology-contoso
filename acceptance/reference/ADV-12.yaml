id: ADV-12
question: >-
  Revenue from high-value products (Price > 1000)
expected: 44657111.19
sql: >-
  WITH latest_price AS (
    SELECT
      product_key,
      unit_price,
      ROW_NUMBER() OVER (
        PARTITION BY product_key
        ORDER BY order_date DESC, order_key DESC, line_number DESC
      ) AS rn
    FROM contoso_served.v_contoso5_sales_line
  )
  SELECT ROUND(SUM(l.net_amount), 2)
    FROM contoso_served.v_contoso5_sales_line l
    JOIN latest_price p ON p.product_key = l.product_key AND p.rn = 1
   WHERE p.unit_price > 1000
superseded_value: 'a 154-row list: product_name + revenue, ordered by revenue desc'
