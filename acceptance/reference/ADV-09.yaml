  statement does not order and an unordered answer must not be graded on sequence. Nothing was
  decided here: the note already asserted that all eight trading countries qualify, and the
  per-country figures are 2239.53 to 2617.62, every one far above 500.

  THE SHOP FILTER STAYS, AND NOT BECAUSE OF THE OLD DEFAULT. The operator's ruling of 2026-10-18
  makes an unqualified revenue question span both channels, and this question names no channel, so
  the filter looks stale. IT IS NOT, AND THE REASON IS A SEPARATE OPEN DEFECT: the online store
  carries `country_code` '--', and `dim_country` holds a row for that sentinel whose
