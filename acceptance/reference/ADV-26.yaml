sql: >-
  WITH f AS (SELECT customer_key, MIN(order_date) AS first_order FROM
  contoso_served.v_contoso5_sales_line GROUP BY 1) SELECT 'purchased before 31.12.2023' AS cohort,
  COUNT(DISTINCT l.customer_key) AS customers, ROUND(SUM(l.net_amount), 2) AS net_revenue FROM
  contoso_served.v_contoso5_sales_line l JOIN f USING (customer_key) WHERE f.first_order <= DATE
  '2023-12-31' UNION ALL SELECT 'first purchased after 01.01.2024' AS cohort, COUNT(DISTINCT
  l.customer_key), ROUND(SUM(l.net_amount), 2) FROM contoso_served.v_contoso5_sales_line l JOIN f
  USING (customer_key) WHERE f.first_order >= DATE '2024-01-01'
