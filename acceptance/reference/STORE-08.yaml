id: STORE-08
question: What is the revenue of Contoso Store Armagh?
expected: 2282987.24
sql: >-
  SELECT round(sum(s.net_amount),2) FROM contoso_served.v_contoso5_sales_line s JOIN
  contoso_served.dim_store d ON d.store_key = s.store_key WHERE d.store_name = 'Contoso Store
  Armagh'
note: >-
