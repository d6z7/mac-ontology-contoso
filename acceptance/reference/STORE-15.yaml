note: >-
  A COMPOUND QUESTION, AND THE SECOND HALF CANNOT BE ANSWERED. "how many store we have in france"
  has one answer; "in what cities are they" has none, and the right reply names that rather than
  substituting the nearest column.

  THE COUNT. Trading premises whose own country is France, by the store's country rather than the
  customer's — "stores WE HAVE in France" is about where our shops stand. The declared `active`
  default supplies "currently", since the question names no past state. On this question the grains
  do not part company: every French site holds exactly one premises and none has ever closed, so
  premises, sites and trading all give the same figure. That is worth knowing, because it means a
  wrong answer here cannot be blamed on the store/location grain.

  THE CITIES. `main.store` carries no city or town column; a store's finest place is its `state`,
  which in France means regions and overseas territories. `GeoAreaKey` identifies the site, not a
  geography. City exists in this bundle only as `dim_customer.city` — where a customer LIVES, not
  where a shop stands — and it is declared `offers.suppressed:
  DQ-IDENTIFYING-DIM_CUSTOMER-CITY`, so it may not appear in an answer even for customers.

  SO THE CORRECT REPLY IS A FIGURE PLUS A NAMED GAP: the count, and that stores carry no city, with
  the regions offered instead if the reader wants them. Substituting regions SILENTLY is the failure
  this question is here to catch — it is the same move that once bound "internet business" to
  `Country = 'Online'`, the nearest register value available, and returned a plausible wrong figure.

  WHAT THIS REFERENCE CANNOT GRADE, said plainly. `expected` holds one value and `expected_outcome`
  takes one outcome, so the format cannot express "answer this half, refuse that half". A walk that
  returns the count and says nothing about cities grades EXACT here, the same as one that returns the
  count and names the gap. The partial refusal is the thing worth measuring and it is not yet
