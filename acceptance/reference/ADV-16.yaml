sql: >-
  SELECT DISTINCT p.product_name
    FROM contoso_served.dim_product p
   WHERE p.product_key IN (
          SELECT l.product_key FROM contoso_served.v_contoso5_sales_line l JOIN contoso_served.dim_store s ON l.store_key = s.store_key
           WHERE s.country_code = 'DE')
     AND p.product_key IN (
          SELECT l.product_key FROM contoso_served.v_contoso5_sales_line l JOIN contoso_served.dim_store s ON l.store_key = s.store_key
           WHERE s.country_code = 'FR')
   ORDER BY 1
note: >-
  DERIVED BY HAND 2026-10-19 AND IT REPRODUCES THE APPROVED VALUE. This file carried the PLANNER'S
  OWN parameterised statement, which the first two lines of this file forbid: approving a number
  the engine produced, on the engine's own query, tests the engine against itself. The approved
  value is UNCHANGED and keeps the operator's original date. DELIBERATELY STILL A SPOT-CHECK, and
  this is the one case where that is right: 1,437 product names is not a list a person reads, so
  the reference approves the COUNT plus three named members and `ordered: false`. BOTH is an
  INTERSECT, not a union: a product qualifies only if a sale line exists in a German store AND in
  a French store, which is why the statement uses two IN subqueries over the same fact rather than
  one country filter. Germany and France are STORE countries here, consistent with ADV-04.
