sql: >-
  SELECT CAST(DATE_TRUNC('month', l.order_date) AS DATE) AS month,
         ROUND(SUM(l.net_amount), 4) AS net
    FROM contoso_served.v_contoso5_sales_line l
    JOIN contoso_served.dim_customer cu ON l.customer_key = cu.customer_key
    JOIN contoso_served.dim_store s  ON l.store_key = s.store_key
   WHERE s.store_code = -1 AND cu.country_code = 'DE'
     AND l.order_date >= DATE '2024-01-01' AND l.order_date < DATE '2025-01-01'
   GROUP BY 1 ORDER BY 1
