id: AGG-04
question: Break down net revenue by brand
expected:
  rows: 11
  ordered: false
  values:
    - [Adventure Works, 49040587.93]
    - [Contoso, 38431107.32]
    - [Wide World Importers, 35254595.03]
    - [The Phone Company, 31575307.61]
    - [Fabrikam, 19594532.31]
    - [Proseware, 18405119.84]
    - [Southridge Video, 10785498.42]
    - [Litware, 6978883.88]
    - [A. Datum, 4460259.90]
    - [Northwind Traders, 2630394.76]
    - [Tailspin Toys, 1658184.66]
sql: |
  SELECT p.brand, round(sum(l.net_price * l.quantity), 2) AS net_sales_amount
  FROM   contoso_served.v_contoso5_sales_line l
  JOIN   contoso_served.dim_product p USING (product_key)
  GROUP  BY p.brand
note: >-
  All eleven brands, USD. Grouped on Brand and NOT on Manufacturer: the two are 1:1 (BRD-Q1)
  so a Manufacturer grouping would return the same eleven rows under legal names, which is a
  different answer to the same cut.

