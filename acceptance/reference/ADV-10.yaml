superseded_reason: >-
  ROW ORDER IS NOT AN ANSWER UNLESS THE QUESTION ASKED FOR ONE, and this question asks for a SET.
  Ruled by the operator on 2026-10-24 ("go 1 2 3 4") over a proposal naming all nine references.
  `ordered: true` made row POSITION part of the signed contract, so a correct answer returning the
  right members in another order graded as a failure -- the defect measured on MQ-08 on
  2026-10-09, where two products inside the approved set at different positions failed a question
  asking set membership. THE CHECK IS NOT WEAKENED. The value list here is COMPLETE, so with
  `ordered: false` every approved row must still be PRESENT in the result --
  `sdk/acceptance/selfcheck.py#compare` runs a membership test over all of them, not a sample.
  What is given up is only the claim that the question asked for a sequence, which it does not. A
  ranking keeps its order: no `top`, `highest`, `trend` or `compare` question is touched.
