sql: >-
  SELECT p.product_name, max(co.country_name) AS country_name FROM
  contoso_served.v_contoso5_sales_line l JOIN contoso_served.dim_store s ON l.store_key =
  s.store_key JOIN contoso_served.dim_country co ON s.country_code = co.country_code JOIN
  contoso_served.dim_product p ON l.product_key = p.product_key WHERE s.store_code IS DISTINCT
  FROM -1 GROUP BY p.product_name HAVING count(DISTINCT co.country_name) = 1 ORDER BY 2, 1
note: >-
  TWENTY PRODUCTS, each sold in exactly one country, with that country beside it. "Their
  respective countries" is what makes this two columns rather than a list of names: the answer
  must carry the country each product is confined to. Seventeen of the twenty are confined to the
  United States, with one each in Canada, the Netherlands and the United Kingdom. Of the 2,517
  products that have ever sold, these twenty are the only ones that never crossed a border. THE
  READING IS THE STORE'S COUNTRY WITH THE WEB SHOP EXCLUDED -- the same path the superseded
  question used and the same ADV-16 uses -- and on this question that choice is more violent than
  on any other in the corpus. All three declared readings of
  `country.default.whose_country_is_asked_never_assumed` were measured on 2026-10-23:

  store country, web shop EXCLUDED 20 products <- this reference store country, web shop INCLUDED
  1 product customer country 4 products

  ADMITTING THE WEB SHOP COLLAPSES THE ANSWER FROM 20 TO 1. The online row carries the `--`
  sentinel that `country.exclusion.sentinel_is_not_a_country` excludes; counted as a country it
  becomes a SECOND country for almost every product that ever sold online, and nineteen of the
  twenty stop qualifying. That is not a rounding difference between readings -- it is a different
  question wearing the same words, which makes this the sharpest discrimination case in the corpus
  for whether a reader obeys the sentinel exclusion. THE CUSTOMER PATH GIVES 4 and is equally
  defensible English. This reference takes the store path because the superseded question did and
  because ADV-16 does; that is NOT a claim that the store path is what "sold in one country" must
  mean. It is what `awaiting_approval` below is for.
