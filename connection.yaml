# connection.yaml — this bundle's OWN warehouse, built by ./build.sh from its own copy of the public
# landings. It shares nothing with any other bundle (operator ruling, 2026-09-26), and no path here
# points outside — enforced by meaning-as-code/tools/check_bundle_isolation.py.
#
# `view_schema` NAMES A SCHEMA OF ITS OWN AND THE BUILD CREATES IT EMPTY. On this bundle that is not a
# transitional state, it is the POINT: contoso5 exists to deliver the LANDING plane on its own, so the
# served schema is declared and stays empty until a datasets delivery fills it. Pointing it at `main`
# would make the landings masquerade as served datasets and every downstream tool would read a curated
# plane where none exists.
spec_version: mac.connector/1
label: Contoso 5 (its own DuckDB, built by ./build.sh)
config:
  database: contoso5.duckdb
  read_only: true
view_schema: contoso_served
