name: example/contoso5
label: Contoso 5
standard: mac.container/1
data_source:
  name: contoso5
connector: mac.connector.duckdb/1
connection: connection.yaml
serving:
  schema:
    - contoso_served
as_of:
  anchor: v_contoso5_sales_line.order_date
out_of_scope:
  - path: connection.yaml
    rule: project.out_of_scope.connection_yaml
  - path: acceptance/expected_first_run.yaml
    rule: project.out_of_scope.acceptance_expected_first_run_yaml
  - path: acceptance/proposed_questions.yaml
    rule: project.out_of_scope.acceptance_proposed_questions_yaml
  - path: acceptance/questions.yaml
    rule: project.out_of_scope.acceptance_questions_yaml
  - path: acceptance/paraphrases.yaml
    rule: project.out_of_scope.acceptance_paraphrases_yaml
  - path: acceptance/reference/**
    rule: project.out_of_scope.acceptance_reference
  - path: acceptance/oracle/**
    rule: project.out_of_scope.acceptance_oracle
  - path: acceptance/anchors/**
    rule: project.out_of_scope.acceptance_anchors
  - path: acceptance/answers/**
    rule: project.out_of_scope.acceptance_answers
  - path: acceptance/tools/**
    rule: project.out_of_scope.acceptance_tools
  - path: acceptance/intents/**
    rule: project.out_of_scope.acceptance_intents
  - path: acceptance/interpret_errors/**
    rule: project.out_of_scope.acceptance_interpret_errors
  - path: evidence/migration-*.yaml
    rule: project.out_of_scope.evidence_migration_yaml
  - path: evidence/tombstones.yaml
    rule: project.out_of_scope.evidence_tombstones_yaml
