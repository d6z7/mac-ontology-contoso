rule: Store.channel
says: 'A store is a shop you can walk into. The online channel is recorded as a store, but a question about stores — how
  many there are, which ones — covers physical shops only unless it names the online channel. That default holds only when
  the question is about stores: revenue and every other figure of the sale includes both channels, even when the question''s
  route passes through stores.'
said:
  - by: operator
    date: '2026-10-18'
    words: now i am for correctnes and correct is that both internet and physical shops combined make revenue.
    in: meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
  - by: operator
    date: '2026-10-18'
    words: i would like to revert my ruling from before. then it was aimed at simplicity ... now i am for correctnes and
      correct is that both internet and physical shops combined make revenue.
    in: meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
state: ruled
about:
  - project
  - concept:Store
  - concept:Order
  - dataset:dim_store.store_code
  - dataset:dim_store.is_online
  - dataset:v_contoso5_sales_line.channel
choice:
  options:
    physical:
      rows:
        all:
          - is_online:
              is: false
    online:
      rows:
        all:
          - is_online:
              is: true
  default: physical
evidence:
  - meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
examples:
  - ask: what is our revenue
    says: both channels
