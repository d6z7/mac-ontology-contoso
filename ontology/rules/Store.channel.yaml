metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Store.channel
  statement: 'A store is a shop you can walk into. The online channel is recorded as a store, but a question
    about stores — how many there are, which ones — covers physical shops only unless it names the online
    channel. That default holds only when the question is about stores: revenue and every other figure
    of the sale includes both channels, even when the question''s route passes through stores.'
  wording: proposed
  keywords:
  - store
  - shop
  - online
  - physical
  - channel
  - web
  - internet
  - revenue
  - both channels
  state: ruled
  said:
  - by: operator
    'on': '2026-10-18'
    words: now i am for correctnes and correct is that both internet and physical shops combined make
      revenue.
    recorded_in: meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
  - by: operator
    'on': '2026-10-18'
    words: i would like to revert my ruling from before. then it was aimed at simplicity ... now i am
      for correctnes and correct is that both internet and physical shops combined make revenue.
    recorded_in: meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
  decided_in: meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
  supersedes:
  - Store.revenue_is_shop_only
  formerly:
  - store.resolution.the_channel_is_the_location_sentinel
  formal: symbolic
  tested_by: [RC05, MQ-07, OPQ-01]
  examples:
  - ask: what is our revenue
    reads: both channels
