rule: Order.now_is_the_newest_order
says: '"Now", for this data, is the date of the newest order — measured from the data, not taken from the clock. Relative
  periods such as "last month" are read against it, and it moves forward by itself when new orders arrive.'
said:
  - by: operator
    date: '2026-10-23'
    words: but as the time move on ... we need to specify the sampling date lets say on 31.12.2025
    in: meaning-as-code#decisions/RULED-2026-10-23_the-sampling-date-is-the-newest-order.md
state: ruled
about:
