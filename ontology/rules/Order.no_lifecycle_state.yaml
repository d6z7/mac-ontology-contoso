rule: Order.no_lifecycle_state
says: 'An order has no state beyond its two dates: it was placed on one day and delivered on another. Nothing records a
  cancellation or a return, so a question about either has no answer in this business''s data and says so; an absent state
  is never read as zero.'
state: proposed
about:
  - concept:Order
implemented: prose
said:
  - by: operator
    date: '2026-11-16'
    in: 'migration to grammar v3: owner assigned (Y-7)'
examples:
  - ask: how many orders were cancelled
    says: 'unanswerable: no cancellation is recorded'
