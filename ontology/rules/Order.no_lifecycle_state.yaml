rule:
  id: Order.no_lifecycle_state
  concepts:
  - Order
  statement: 'An order has no state beyond its two dates: it was placed on one day and delivered on another.
    Nothing records a cancellation or a return, so a question about either has no answer in this business''s
    data and says so; an absent state is never read as zero.'
  wording: proposed
  keywords:
  - order status
  - cancelled
  - returned
  - cancellation
  - return
  - lifecycle
  state: proposed
  formal: prose
  examples:
  - ask: how many orders were cancelled
    reads: 'unanswerable: no cancellation is recorded'
