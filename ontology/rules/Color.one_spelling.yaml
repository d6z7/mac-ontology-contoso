metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Color.one_spelling
  statement: 'A colour is one member however the source spells its case: colour names are capitalised,
    so Blue and blue are one colour. A breakdown or count by colour never lists two spellings of one colour.'
  wording: proposed
  keywords:
  - colour
  - color
  - blue
  - spelling
  - case
  - fold
  state: ruled
  said:
  - by: operator
    'on': '2026-09-30'
    words: the word is fold
    recorded_in: data/transforms/dim_product.sql
  formal: prose
  examples:
  - ask: how many colours do our products come in
    reads: each colour counted once regardless of spelling
