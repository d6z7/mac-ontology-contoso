rule: Color.one_spelling
says: 'A colour is one member however the source spells its case: colour names are capitalised, so Blue and blue are one
  colour. A breakdown or count by colour never lists two spellings of one colour.'
said:
  - by: operator
    date: '2026-09-30'
    words: the word is fold
    in: data/transforms/dim_product.sql
state: proposed
about:
  - concept:Color
implemented: prose
examples:
  - ask: how many colours do our products come in
    says: each colour counted once regardless of spelling
