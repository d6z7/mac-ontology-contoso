rule: ProductCategory.level
says: A product category is the top level of the product hierarchy. A question saying category is answered on the category;
  one saying sub-category is answered on the sub-category.
state: proposed
about:
  - concept:ProductCategory
choice:
  options:
    category:
      column: dataset:dim_product.category_name
    sub_category:
      column: dataset:dim_product.sub_category_name
  default: category
