rule: Order.discount_total_is_money
says: 'A total discount is money: the sum of what was given away below the regular price on every discounted sale in scope.
  It is never a sum or an average of discount rates. The rate is meant only when the question names it — discount percentage,
  discount rate, average discount.'
said:
  - by: operator
    date: '2026-10-13'
    words: if i ask what is a total discount then i would expect to get THE DISCOUNTED AMOUNT OF MONEY and not %. total
      discount in 2024 should be refused to answer to the rate ... but it is the SUM of all discounts allowed in 2024 to
      ALL customers who got discounts
    in: meaning-as-code#decisions/RULED-2026-10-13_what-a-total-discount-means.md
