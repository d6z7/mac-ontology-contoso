metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.discount_total_is_money
  statement: 'A total discount is money: the sum of what was given away below the regular price on every
    discounted sale in scope. It is never a sum or an average of discount rates. The rate is meant only
    when the question names it — discount percentage, discount rate, average discount.'
  wording: proposed
  keywords:
  - discount
  - total discount
  - discount amount
  - money off
  - rebate
  - discount rate
  state: ruled
  formerly:
  - Order.discount_amount.total
  said:
  - by: operator
    'on': '2026-10-13'
    words: if i ask what is a total discount then i would expect to get THE DISCOUNTED AMOUNT OF MONEY
      and not %. total discount in 2024 should be refused to answer to the rate ... but it is the SUM
      of all discounts allowed in 2024 to ALL customers who got discounts
    recorded_in: meaning-as-code#decisions/RULED-2026-10-13_what-a-total-discount-means.md
  decided_in: meaning-as-code#decisions/RULED-2026-10-13_what-a-total-discount-means.md
  formal: prose
  examples:
  - ask: what is the total discount in 2024
    reads: discount amount in USD summed over 2024 sales
