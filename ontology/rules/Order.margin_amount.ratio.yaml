metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.margin_amount.ratio
  concepts:
  - Order
  statement: 'A margin ratio can be stated two ways over the same profit, and the question must say which:
    margin percent is profit over net revenue, markup is profit over cost. A question naming neither is
    asked.'
  wording: proposed
  keywords:
  - margin
  - markup
  - margin percent
  - profit
  - margin on cost
  - net margin
  state: ruled
  formerly:
  - margin.aggregation.two_named_ratios
  formal: symbolic
  examples:
  - ask: what is our margin percentage
    reads: profit over net revenue
  - ask: what is our margin ratio
    reads: 'asked: margin percent or markup'
