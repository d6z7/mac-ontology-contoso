rule: Currency.whose
says: 'A currency is reached by three routes: the currency a sale was paid in, or one of the two currencies of an exchange
  rate — its source (the currency it converts from; for a sale, the currency the amounts are stored in) or its target (the
  currency it converts to; for a sale, the sale''s own currency). A question that reaches a currency without saying which
  — from a sale, a store, a site or an exchange rate — is answered on the currency the sale was paid in; a question may
  name the rate''s source or target currency instead. The answer says which currency it used.'
state: proposed
about:
  - concept:Currency
  - concept:Order
  - concept:Store
  - concept:Location
  - concept:ExchangeRate
choice:
  options:
    paid_in:
      route:
        - edge:order__paid_in__currency
    rate_source:
      route:
        - edge:exchange_rate__quotes_from__currency
    rate_target:
      route:
        - edge:exchange_rate__quotes_to__currency
  default: paid_in
examples:
  - ask: how many orders were placed in euros
    reads: rule:Currency.whose.paid_in
    says: the orders whose sale currency is EUR
