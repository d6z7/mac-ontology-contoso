metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: Q
  provenance: authored
rule:
  id: Country.rows
  concepts:
  - Country
  statement: The placeholder country code `--` is not a country. It marks rows that carry no real country,
    such as the online store. Questions about countries count and list real countries only, unless they
    name the placeholder.
  wording: proposed
  keywords:
  - country
  - countries
  - placeholder
  - sentinel
  - no country
  - unknown country
  - online
  state: proposed
  formerly:
  - country.exclusion.sentinel_is_not_a_country
  formal: symbolic
  examples:
  - ask: how many countries do we sell in
    reads: real countries only; the placeholder is not counted
