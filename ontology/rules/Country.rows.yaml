rule: Country.rows
says: The placeholder country code `--` is not a country. It marks rows that carry no real country, such as the online store.
  Questions about countries count and list real countries only, unless they name the placeholder.
state: proposed
about:
  - concept:Country
  - dataset:dim_country.country_code
  - dataset:dim_country.is_placeholder
choice:
  options:
    real:
      rows:
        all:
          - is_placeholder:
              is: false
    sentinel:
      rows:
        all:
          - is_placeholder:
              is: true
  default: real
examples:
  - ask: how many countries do we sell in
    says: real countries only; the placeholder is not counted
