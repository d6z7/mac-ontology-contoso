rule: Order.discount_percent_is_over_gross
says: A discount percentage is the money given away divided by the gross amount before discount — not by the net amount.
state: proposed
about:
  - concept:Order
choice:
  options:
    percent:
      ratio:
        numerator: dataset:v_contoso5_sales_line.discount_amount
        denominator: dataset:v_contoso5_sales_line.gross_amount
  default: percent
