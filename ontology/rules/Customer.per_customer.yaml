rule: Customer.per_customer
says: 'A figure "per customer" divides by a count of customers, and which customers it counts is a choice. By default it
  counts the buyers: the distinct customers on the sales lines the figure is summed over, so revenue per customer by country
  divides each country''s revenue by the customers who bought in that country. The other options count the customers active
  on the reference date, or every customer on the register. The answer says which customers it divided by.'
state: proposed
about:
  - concept:Customer
  - concept:Order
choice:
  options:
    buyers:
      ratio:
        denominator: concept:Order
        denominator_count: customer_key
    active:
      ratio:
        denominator: rule:Customer.active_on_the_reference_date.active
        denominator_count: customer_key
    registered:
      ratio:
        denominator: rule:Customer.active_on_the_reference_date.registered
        denominator_count: customer_key
  default: buyers
examples:
  - ask: revenue per customer by country
    reads: rule:Customer.per_customer.buyers
    says: each country's revenue divided by the distinct customers who bought in that country
  - ask: revenue per registered customer
    reads: rule:Customer.per_customer.registered
    says: revenue divided by every customer on the register
