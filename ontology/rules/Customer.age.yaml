rule: Customer.age
says: 'An age is computed, never stored: a customer''s age from the birth date and a store''s age from its opening date,
  both measured at the sampling date rather than at today''s date. Which age arithmetic is meant — completed years counting
  the birthday, or calendar year boundaries crossed — has not been ruled.'
said:
  - by: operator
    date: '2026-10-23'
    words: and just as we can calculate average age of customers we can do the same with shops
    in: meaning-as-code#decisions/RULED-2026-10-23_the-sampling-date-is-the-newest-order.md
state: proposed
about:
  - concept:Customer
  - concept:Store
implemented: prose
