rule: Order.is_the_purchase
says: 'An order is the purchase: one customer buying at one store on one day in one currency. Its lines are not orders and
  not events of their own — a line borrows the when, the who and the where from its order and adds only which product and
  how many. Counting orders counts purchases, never lines.'
state: proposed
about:
  - concept:Order
implemented: prose
said:
  - by: operator
    date: '2026-11-16'
    in: 'migration to grammar v3: owner assigned (Y-7)'
examples:
  - ask: how many orders
    says: distinct orders (purchases), not order lines
