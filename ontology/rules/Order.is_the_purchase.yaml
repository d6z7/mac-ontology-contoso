  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.is_the_purchase
  statement: 'An order is the purchase: one customer buying at one store on one day in one currency. Its
    lines are not orders and not events of their own — a line borrows the when, the who and the where
    from its order and adds only which product and how many. Counting orders counts purchases, never lines.'
  wording: proposed
  keywords:
  - order
  - purchase
  - order line
  - sale
  - event
  - how many orders
  state: ruled
  formal: prose
  examples:
  - ask: how many orders
    reads: distinct orders (purchases), not order lines
