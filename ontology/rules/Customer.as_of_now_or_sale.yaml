rule:
  id: Customer.as_of_now_or_sale
  concepts:
  - Customer
  - Order
  statement: 'The customer register keeps history: a row is a version of a person, valid over a window.
    The customer as they are now and the customer a past sale was made to can be different rows, and reading
    one as the other moves old sales to new addresses. A question joining customers to sales over a period
    says which it means; neither reading is declared the default.'
  wording: proposed
  keywords:
  - customer
  - history
  - valid from
  - valid to
  - as of
  - moved
  - version
  state: proposed
  formal: prose
