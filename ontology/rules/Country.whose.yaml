rule: Country.whose
says: 'When a question asks for figures by country without saying whose country, a sale is attributed to the country it
  was made in: a shop sale to the country the shop stands in, an online sale to the country the customer lives in. Every
  sale reaches exactly one country, so the parts add up to the whole. A question may instead ask by store country, customer
  country or site country and gets that reading. The answer says which country it used.'
said:
  - by: operator
    date: '2026-10-25'
    words: ok go B1 now
    in: meaning-as-code#decisions/RULED-2026-10-25_a-sale-is-attributed-by-its-channel.md
state: ruled
about:
