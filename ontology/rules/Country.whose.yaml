metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Country.whose
  concepts:
  - Country
  - Order
  - Store
  - Customer
  statement: 'When a question asks for figures by country without saying whose country, a sale is attributed
    to the country it was made in: a shop sale to the country the shop stands in, an online sale to the
    country the customer lives in. Every sale reaches exactly one country, so the parts add up to the
    whole. A question may instead ask by store country, customer country or site country and gets that
    reading. The answer says which country it used.'
  wording: proposed
  keywords:
  - country
  - whose country
  - attribution
  - territory
  - market
  - store country
  - customer country
  - by country
  state: ruled
  said:
  - by: operator
    'on': '2026-10-25'
    words: ok go B1 now
    recorded_in: meaning-as-code#decisions/RULED-2026-10-25_a-sale-is-attributed-by-its-channel.md
  decided_in: meaning-as-code#decisions/RULED-2026-10-25_a-sale-is-attributed-by-its-channel.md
  supersedes:
  - Country.whose_is_asked
  formerly:
  - country.default.whose_country_is_asked_never_assumed
  formal: symbolic
  examples:
  - ask: revenue by country
    reads: 'country of the sale: shop country for shop sales, customer country for online sales; disclosed'
