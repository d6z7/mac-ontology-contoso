metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.net_amount.price
  concepts:
  - Order
  statement: 'An unqualified price means what the customer paid per article: the net amount divided by
    the number of units, both summed over the lines asked about — never an average of line prices.'
  wording: proposed
  keywords:
  - price
  - average price
  - unit price
  - per article
  - per unit
  - net price
  state: ruled
  formerly:
  - net_revenue.default.a_price_is_revenue_per_article
  formal: symbolic
