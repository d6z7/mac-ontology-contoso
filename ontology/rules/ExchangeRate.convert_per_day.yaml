rule:
  id: ExchangeRate.convert_per_day
  statement: 'An amount is converted at its own day''s rate, never at a rate averaged over a period. A
    rate is not a quantity to add up: over time it can at most be averaged, and across currency pairs
    it is not combined at all.'
  wording: proposed
  keywords:
  - exchange rate
  - average rate
  - daily rate
  - conversion
  - fx
  - additivity
  state: proposed
  formerly:
  - exchange_rate.aggregation.convert_per_day_never_average
  formal:
    canon: additivity_guard
    confidence: P
    measure_column: rate
    axis_effects:
      time: mac.concept.aggregation_effect.average
      categorical: mac.concept.aggregation_effect.none
