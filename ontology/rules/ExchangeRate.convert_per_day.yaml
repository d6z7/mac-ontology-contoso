rule: ExchangeRate.convert_per_day
says: 'An amount is converted at its own day''s rate, never at a rate averaged over a period. A rate is not a quantity to
  add up: over time it can at most be averaged, and across currency pairs it is not combined at all.'
state: proposed
about:
  - concept:ExchangeRate
