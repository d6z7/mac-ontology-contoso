rule: Order.channel
says: 'A sale is made in one of two channels: a shop you can walk into or the web shop. A figure of the sale that names no
  channel covers both channels, even when the question reaches the sale through stores; a question that names the shops
  or the web shop gets that channel. The answer says which channels it covered.'
said:
  - by: operator
    date: '2026-10-18'
    words: now i am for correctnes and correct is that both internet and physical shops combined make revenue.
    in: meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
state: proposed
about:
  - concept:Order
  - dataset:v_contoso5_sales_line.is_web_sale
choice:
  options:
    both:
      all_rows: true
    shops:
      rows:
        all:
          - is_web_sale:
              is: false
    online:
      rows:
        all:
          - is_web_sale:
              is: true
  default: both
evidence:
  - meaning-as-code#decisions/RULED-2026-10-18_both-channels-make-revenue.md
examples:
  - ask: what is the revenue of all Contoso stores
    reads: rule:Order.channel.both
    says: both channels, the web shop included
