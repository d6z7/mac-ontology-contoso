rule:
  id: Order.period
  concepts:
  - Order
  statement: A question that names no period covers all time. There is no implied "this year" and no implied
    latest month, and the answer states the window it covered.
  wording: proposed
  keywords:
  - period
  - all time
  - no period
  - time window
  - unscoped
  - this year
  state: ruled
  formerly:
  - order.default.an_unscoped_question_covers_all_time
  formal: symbolic
