rule: Store.premises_not_place
says: 'A store is the premises Contoso sells from: a shop standing on one place for one trading period, with its own name,
  floor area, opening date and closing date. It is part of a location, not the location itself — one place may hold a succession
  of premises over time, each of them a store. So one store is counted and listed by its premises, and a count, list or sum
  over stores is a different question from the same figure over places; an answer that could be read at either level says
  which level it used. The site reading (one row per place, whatever premises it held) is the other option.'
said:
  - by: operator
    date: '2026-10-24'
    words: a Store is a PLACE on one location you can shop at ... store is part of location
state: proposed
about:
  - project
  - concept:Store
  - concept:Location
  - dataset:dim_location.units_ever_here
choice:
  options:
    premises:
      column: dataset:dim_store.store_key
    site:
      column: dataset:dim_store.store_code
  default: premises
supersedes:
  - Store.counted_by_site
examples:
  - ask: list all closed stores
    reads: rule:Store.premises_not_place.premises
    says: one row per closed premises; a place closed twice is listed twice
