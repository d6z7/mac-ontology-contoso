metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Store.premises_not_place
  concepts:
  - Store
  - Location
  statement: 'A store is the premises Contoso sells from: a shop standing on one place for one trading
    period, with its own name, floor area, opening date and closing date. It is part of a location, not
    the location itself — one place may hold a succession of premises over time, each of them a store.
    So one store is counted by its premises, and a count or sum over stores is a different question from
    the same figure over places; an answer that could be read at either level says which level it used.'
  wording: proposed
  keywords:
  - store
  - premises
  - shop
  - location
  - place
  - site
  - count stores
  - tenancy
  state: ruled
  said:
  - by: operator
    'on': '2026-10-24'
    words: a Store is a PLACE on one location you can shop at ... store is part of location
    recorded_in: ontology/concepts/store.yaml
  supersedes:
  - Store.counted_by_site
  formal: prose
  examples:
  - ask: how many stores do we have
    reads: count of premises (store rows), trading and physical by default, not of sites
