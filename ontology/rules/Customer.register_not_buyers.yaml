rule: Customer.register_not_buyers
says: 'The customer register is wider than the buyers: a customer is a person on the register, and many registered customers
  have never bought anything. This is by design of the source, not a defect. "Customers" and "buyers" are two populations,
  and an answer counting customers says which one it counted.'
state: proposed
about:
  - concept:Customer
  - dataset:dim_customer.customer_key
implemented: prose
said:
  - by: operator
    date: '2026-11-16'
    in: 'migration to grammar v3: owner assigned (Y-7)'
examples:
  - ask: how many customers have bought something
    says: customers with at least one order, said to be buyers and not the register
