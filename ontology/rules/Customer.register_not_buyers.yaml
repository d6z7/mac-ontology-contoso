  schema_version: 0.3.1-develop
  confidence: Q
  provenance: authored
rule:
  id: Customer.register_not_buyers
  concepts:
  - Customer
  statement: 'The customer register is wider than the buyers: a customer is a person on the register,
    and many registered customers have never bought anything. This is by design of the source, not a defect.
    "Customers" and "buyers" are two populations, and an answer counting customers says which one it counted.'
  wording: proposed
  keywords:
  - customer
  - buyer
  - register
  - count customers
  - never bought
  - population
  state: proposed
  formal: prose
  examples:
  - ask: how many customers do we have
    reads: states whether it counted the register or the customers who bought, and which
