rule:
  id: Store.record_questions
  statement: A question about what the store table records — how many store versions or rows there are,
    or a list of every restructured store — covers every recorded row, the online channel included, with
    no channel or trading-state restriction. "How many stores do we have" is a different question and
    keeps the physical and active defaults.
  wording: proposed
  keywords:
  - store
  - versions
  - records
  - rows
  - all stores
  - store history
  state: proposed
  decided_in: meaning-as-code#decisions/PROPOSED-2026-10-25_four-rules-need-a-canon.md
  formal: prose
