rule: Store.record_questions
says: A question about what the store table records — how many store versions or rows there are, or a list of every restructured
  store — covers every recorded row, the online channel included, with no channel or trading-state restriction. "How many
  stores do we have" is a different question and keeps the physical and active defaults.
