  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.price_terms
  concepts:
  - Order
  statement: 'Four facts on a sale carry every price and cost. The unit price is the regular, list price
    of one unit before discount; the net price is the actual selling price of one unit after discount;
    the unit cost is what one unit cost Contoso; the quantity is how many units. Every amount derives
    from them: gross is quantity times unit price, net is quantity times net price, cost is quantity times
    unit cost, discount is gross less net, and margin is net less cost — so margin is profit on the discounted
    price, not on list. "Unit price" names the regular price, not what was paid.'
  wording: proposed
  keywords:
  - unit price
  - list price
  - net price
  - selling price
  - unit cost
  - gross
  - net
  - margin
  - discount
  state: ruled
  said:
  - by: operator
    'on': '2026-10-26'
    words: UnitPrice = regular/list price per unit
    recorded_in: meaning-as-code#decisions/HANDOVER-2026-10-26_retire-product-prices.md
  formal: prose
  examples:
  - ask: what was the unit price
    reads: the regular price before discount, not the price paid
