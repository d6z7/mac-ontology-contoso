rule: Order.price_terms
says: 'Four facts on a sale carry every price and cost. The unit price is the regular, list price of one unit before discount;
  the net price is the actual selling price of one unit after discount; the unit cost is what one unit cost Contoso; the
  quantity is how many units. Every amount derives from them: gross is quantity times unit price, net is quantity times
  net price, cost is quantity times unit cost, discount is gross less net, and margin is net less cost — so margin is profit
  on the discounted price, not on list. "Unit price" names the regular price, not what was paid.'
said:
  - by: operator
    date: '2026-10-26'
    words: UnitPrice = regular/list price per unit
    in: meaning-as-code#decisions/HANDOVER-2026-10-26_retire-product-prices.md
state: ruled
about:
