rule: Order.how_many
says: How many is three questions. Purchases are counted as orders; items sold are the quantity summed; order lines are
  how the data is stored and are not a business quantity. "How many did we sell" asks for items, "how many times did we
  sell" or "how many orders" asks for purchases.
state: proposed
about:
  - concept:Order
implemented: prose
said:
  - by: operator
    date: '2026-11-16'
    in: 'migration to grammar v3: owner assigned (Y-7)'
examples:
  - ask: how many did we sell in 2024
    says: 'units: quantity summed over 2024 orders'
  - ask: how many orders did we get in 2024
    says: distinct orders placed in 2024
