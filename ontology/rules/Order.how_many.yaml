rule:
  id: Order.how_many
  concepts:
  - Order
  statement: How many is three questions. Purchases are counted as orders; items sold are the quantity
    summed; order lines are how the data is stored and are not a business quantity. "How many did we sell"
    asks for items, "how many times did we sell" or "how many orders" asks for purchases.
  wording: proposed
  keywords:
  - how many
  - units sold
  - items
  - orders
  - lines
  - volume
  - quantity
  state: proposed
  formal: prose
  examples:
  - ask: how many did we sell in 2024
    reads: 'units: quantity summed over 2024 orders'
  - ask: how many orders did we get in 2024
    reads: distinct orders placed in 2024
