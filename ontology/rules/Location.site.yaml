rule:
  id: Location.site
  statement: 'Site and location name the same notion: the place a store stands on, described by its country
    and its state or region. A store''s place has no city in this business''s data — its finest geography
    is the state or region — and a city is only where a customer lives, so a question about the cities
    stores are in has no answer here and must say so rather than offer site codes.'
  wording: proposed
  keywords:
  - site
  - location
  - place
  - city
  - state
  - region
  - geography
  state: ruled
  said:
  - by: operator
    'on': '2026-10-24'
    words: dont call it site code ... just site, location, city
    recorded_in: ontology/relations/dim_location.yaml
  formal: prose
