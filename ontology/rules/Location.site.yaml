rule: Location.site
says: 'Site and location name the same notion: the place a store stands on, described by its country and its state or region.
  A store''s place has no city in this business''s data — its finest geography is the state or region — and a city is only
  where a customer lives, so a question about the cities stores are in has no answer here and must say so rather than offer
  site codes.'
said:
  - by: operator
    date: '2026-10-24'
    words: dont call it site code ... just site, location, city
    in: data/datasets/dim_location.yaml
state: ruled
about:
  - concept:Location
  - dataset:dim_location.location_code
implemented: prose
