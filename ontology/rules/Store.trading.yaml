metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Store.trading
  concepts:
  - Store
  statement: A store is active while it has no closing date. A store with a closing date is closed, and
    a closed store is either shut — closed for good — or restructured — closed and replaced. A question
    about stores covers active stores unless it names another state.
  wording: proposed
  keywords:
  - store
  - active
  - open
  - closed
  - trading
  - shut
  - restructured
  - close date
  state: ruled
  said:
  - by: operator
    'on': '2026-09-30'
    words: stores that are closed, restructured have close date and are not active anymore; other stores
      without status do not have close date are ONLY stores currently active and this is the scope of
      our interest in most questions.
    recorded_in: knowledge/store.md
  - by: operator
    'on': '2026-10-01'
    words: we should define that closed stores have only close date is not null, then the active stores
      will be the negation of it ... this should be able to avoid the problem by design.
    recorded_in: knowledge/store.md
  - by: operator
    'on': '2026-10-01'
    words: this is data impurity ... we can fix in transformation ... but the business side is correct
    recorded_in: data/transforms/dim_store.sql
  formerly:
  - store.resolution.active_is_the_absent_close_date
  formal: symbolic
  tested_by: [RC05, RC08, STORE-01, STORE-12]
  examples:
  - ask: how many stores are open
    reads: stores with no closing date
