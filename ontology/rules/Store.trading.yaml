rule: Store.trading
says: A store is active while it has no closing date. A store with a closing date is closed, and a closed store is either
  shut — closed for good — or restructured — closed and replaced. A question about stores covers active stores unless it
  names another state.
said:
  - by: operator
    date: '2026-09-30'
    words: stores that are closed, restructured have close date and are not active anymore; other stores without status
      ... are ONLY stores currently active
    in: meaning-as-code#decisions/DNA-2026-09-25_ontology-design-requirements.md
  - by: operator
    date: '2026-09-30'
    words: stores that are closed, restructured have close date and are not active anymore; other stores without status
      do not have close date are ONLY stores currently active and this is the scope of our interest in most questions.
    in: pages/knowledge/store.md
  - by: operator
    date: '2026-10-01'
    words: we should define that closed stores have only close date is not null, then the active stores will be the negation
      of it ... this should be able to avoid the problem by design.
    in: pages/knowledge/store.md
  - by: operator
    date: '2026-10-01'
    words: this is data impurity ... we can fix in transformation ... but the business side is correct
    in: data/transforms/dim_store.sql
state: ruled
about:
  - concept:Store
  - dataset:dim_store.status_annotation
  - dataset:dim_store.is_shut
  - dataset:dim_store.is_restructured
choice:
  options:
    closed:
      rows:
        all:
          - close_date:
              empty: false
    active:
      rows:
        not: closed
    shut:
      rows:
        all:
          - is_shut:
              is: true
      of: closed
    restructured:
      rows:
        all:
          - is_restructured:
              is: true
      of: closed
  default: active
examples:
  - ask: how many stores are open
    says: stores with no closing date
