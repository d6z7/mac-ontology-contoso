metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.cost_is_procurement
  statement: Cost means only what the goods cost Contoso to buy — the procurement cost. Every other money
    figure on a sale, gross, net, discount and margin, is revenue or income, never a cost.
  wording: proposed
  keywords:
  - cost
  - procurement cost
  - cost of goods
  - cogs
  - income
  - what it cost us
  state: ruled
  said:
  - by: operator
    'on': '2026-10-28'
    words: from the shop perspective cost is procurement cost. The rest is revenue or income.
    recorded_in: ontology/MODELLING-LOG.md
  formal: prose
  examples:
  - ask: what did the goods sold in 2024 cost us
    reads: procurement cost summed over 2024 sales
