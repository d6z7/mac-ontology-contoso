rule: Order.cost_is_procurement
says: Cost means only what the goods cost Contoso to buy — the procurement cost. Every other money figure on a sale, gross,
  net, discount and margin, is revenue or income, never a cost.
said:
  - by: operator
    date: '2026-10-28'
    words: from the shop perspective cost is procurement cost. The rest is revenue or income.
    in: decisions/MODELLING-LOG.md#entry-19--the-pricing-rulebook-and-one-home-for-every-price-and-cost-word
state: ruled
about:
  - concept:Order
implemented: prose
examples:
  - ask: what did the goods sold in 2024 cost us
    says: procurement cost summed over 2024 sales
