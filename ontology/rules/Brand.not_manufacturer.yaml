rule:
  id: Brand.not_manufacturer
  statement: A brand is the name a customer buys a product under; a manufacturer is who made it. The two
    sets overlap in names but are two notions, and a question asking who is behind a product says which
    it means rather than treating them as interchangeable.
  wording: proposed
  keywords:
  - brand
  - manufacturer
  - maker
  - made by
  - label
  - who makes
  state: proposed
  formal: prose
