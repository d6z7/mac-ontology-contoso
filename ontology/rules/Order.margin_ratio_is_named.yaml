rule: Order.margin_ratio_is_named
says: 'A margin ratio can be stated two ways over the same profit, and the question must say which: margin percent is profit
  over net revenue, markup is profit over cost. A question naming neither is asked.'
state: proposed
about:
  - concept:Order
choice:
  options:
    margin_percent:
      ratio:
        numerator: dataset:v_contoso5_sales_line.margin_amount
        denominator: dataset:v_contoso5_sales_line.net_amount
    markup_percent:
      ratio:
        numerator: dataset:v_contoso5_sales_line.margin_amount
        denominator: dataset:v_contoso5_sales_line.cost_amount
  default: ask
examples:
  - ask: what is our margin percentage
    says: profit over net revenue
  - ask: what is our margin ratio
    says: 'asked: margin percent or markup'
