rule: Location.channel
says: The online store is recorded as a location, but it is not a place. Questions about locations and places cover physical
  locations only, unless they name the online channel.
state: proposed
about:
  - concept:Location
  - dataset:dim_location.location_code
  - dataset:dim_location.is_online
choice:
  options:
    physical:
      rows:
        all:
          - is_online:
              is: false
    online:
      rows:
        all:
          - is_online:
              is: true
  default: physical
