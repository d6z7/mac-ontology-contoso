rule: Order.rate_on_order_date
says: An amount is converted at the exchange rate of the order's own day. A rate is identified by its day and both of its
  currencies together; a target currency alone does not pick a rate.
state: proposed
about:
  - concept:Order
  - concept:ExchangeRate
  - edge:order__converts_at__exchange_rate
implemented_by:
  law.L0: dataset:v_contoso5_fx_rate
  dataset:v_contoso5_fx_rate.to_currency: dimension
  dataset:v_contoso5_fx_rate.date_day: date
  dataset:v_contoso5_fx_rate.from_currency: dimension
formerly:
  - order.resolution.rate_on_order_date
