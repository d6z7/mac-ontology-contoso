says: 'THE PREVIOUS CAPTURES, byte-identical in shape to `acceptance/answers/**` above and waived for the same reason: observation,
  not declaration. `spikes/v3/to_board.py` copies the whole answer set here before overwriting it, so the board''s record
  of an earlier architecture''s run on the same questions survives — which is why these are kept rather than deleted. .
  DECLARED ON 2026-10-24 BECAUSE THEY TOOK THE BUNDLE DOWN. The waiver above covered the live directory and never its backup,
  so every re-capture added ~90 undeclared files to the bundle: 21 directories and 1,902 files by today, which is the exact
  count validate_schema reported when it turned MAC001/MAC002 from clean to ERROR and the compiler answered DOES NOT COMPILE.
  At 01:54 the same bundle compiled with 0 errors and the identical 13 warnings, so the only thing that changed was the
  size of this tree. A waiver that names the live path and not the archive of that same path is half a declaration.'
