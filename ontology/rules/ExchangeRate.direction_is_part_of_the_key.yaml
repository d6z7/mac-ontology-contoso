rule:
  id: ExchangeRate.direction_is_part_of_the_key
  concepts:
  - ExchangeRate
  - Currency
  statement: 'An exchange rate''s target currency means something only together with its source currency:
    the direction is part of the rate''s identity, so a rate is never picked or grouped by its target
    currency alone.'
  wording: proposed
  keywords:
  - exchange rate
  - currency
  - direction
  - from currency
  - to currency
  - fx
  state: proposed
  formerly:
  - ExchangeRate.to_currency.scoped_by
  - exchange_rate.exclusion.direction_is_part_of_the_key
  formal: symbolic
  tested_by: [AGG-14]
