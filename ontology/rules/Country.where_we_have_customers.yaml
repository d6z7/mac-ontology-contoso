rule:
  id: Country.where_we_have_customers
  statement: 'A question asking for the countries where we have customers asks for countries: the countries
    at least one customer lives in, one answer row per country, never one row per customer. Country is
    the subject and Customer the restriction. The same reading holds for other existence phrasings — countries
    that have a customer, with any customer — and the question must be answered, not refused.'
  wording: proposed
  keywords:
  - countries
  - where we have customers
  - customer country
  - list countries
  - existence
  state: ruled
  said:
  - by: operator
    'on': '2026-10-19'
    words: 'this question must be answerable: where we have customers. it can be usnerstood by you and
      can be understood by 2nd generation of LLM. i dont accept bullshit that it cannot be answered. what
      i might accept is that it needs to be reformulated in a way to contain werbs aubject and predicated
      and make it stylistic more correct.'
    recorded_in: meaning-as-code#decisions/FINDINGS-2026-10-19_slots-versus-object-sets-operator-rulings.md
  formal: prose
  tested_by: [RC02]
