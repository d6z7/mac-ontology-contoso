metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: Q
  provenance: authored
rule:
  id: Currency.code_is_not_the_unit
  statement: 'Every amount on a sale is in US dollars. A sale''s currency is the currency the customer
    transacted in, not the unit of its amounts: filtering by that currency does not turn the amounts into
    it. Sales asked for in a named currency are converted through the exchange rate.'
  wording: proposed
  keywords:
  - currency
  - usd
  - dollars
  - euros
  - transaction currency
  - convert
  - amounts
  state: proposed
  formal: prose
  examples:
  - ask: revenue in euros
    reads: USD amounts converted to EUR, not the USD amounts of EUR sales
