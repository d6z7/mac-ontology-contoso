rule: Currency.code_is_not_the_unit
says: 'Every amount on a sale is in US dollars. A sale''s currency is the currency the customer transacted in, not the unit
  of its amounts: filtering by that currency does not turn the amounts into it. Sales asked for in a named currency are
  converted through the exchange rate.'
state: proposed
about:
  - concept:Currency
  - concept:Order
implemented: prose
said:
  - by: operator
    date: '2026-11-16'
    in: 'migration to grammar v3: owner assigned (Y-7)'
examples:
  - ask: revenue in euros
    says: USD amounts converted to EUR, not the USD amounts of EUR sales
