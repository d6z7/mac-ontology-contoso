rule: Location.closed
says: 'A site counts as closed when a store at it has closed, whether or not another store trades there now. A question
  may ask instead for the sites where no store trades now. The answer says which it counted.'
state: proposed
about:
  - concept:Location
  - dataset:dim_location.has_closed_store
  - dataset:dim_location.is_closed_now
choice:
  options:
    ever:
      column: dataset:dim_location.has_closed_store
    now:
      column: dataset:dim_location.is_closed_now
  default: ever
examples:
  - ask: how many different sites that had shops were closed
    reads: rule:Location.closed.ever
    says: the sites where at least one store has closed
