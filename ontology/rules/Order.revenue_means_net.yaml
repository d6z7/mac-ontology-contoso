  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: C
  provenance: authored
rule:
  id: Order.revenue_means_net
  concepts:
  - Order
  statement: '"Revenue" or "sales" without "net" or "gross" means the net amount — what the customer was
    charged after discount — and the answer says so. "Gross revenue" means the amount before discount.'
  wording: proposed
  keywords:
  - revenue
  - sales
  - net
  - gross
  - turnover
  - net revenue
  - gross revenue
  state: ruled
  formerly:
  - Order.net_amount.surfaces
  formal: symbolic
  tested_by: [ADV-22, MQ-12]
