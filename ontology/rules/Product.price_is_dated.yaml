rule:
  id: Product.price_is_dated
  statement: A product carries no standing price and no standing cost. A price changes over time, so every
    price and cost is the one on the sale, dated by the sale, and a product's price is reached through
    its sales. A product's current price is the regular unit price on its latest sale, stated with that
    sale's date where it matters. A question qualifying products by price — high-value products — selects
    products by that price and then counts all their sales, never qualifies individual sale lines.
  wording: proposed
  keywords:
  - product price
  - current price
  - list price
  - catalogue price
  - high-value products
  - cost
  state: ruled
  decided_in: meaning-as-code#decisions/HANDOVER-2026-10-26_retire-product-prices.md
  formal: prose
  tested_by: [ADV-12]
