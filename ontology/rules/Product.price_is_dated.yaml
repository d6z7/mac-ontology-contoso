rule: Product.price_is_dated
says: A product carries no standing price and no standing cost. A price changes over time, so every price and cost is the
  one on the sale, dated by the sale, and a product's price is reached through its sales. A product's current price is the
  regular unit price on its latest sale, stated with that sale's date where it matters. A question qualifying products by
  price — high-value products — selects products by that price and then counts all their sales, never qualifies individual
  sale lines.
