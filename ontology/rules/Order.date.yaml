  version: '1.1'
  schema_version: 0.3.1-develop
  confidence: Q
  provenance: authored
rule:
  id: Order.date
  concepts:
  - Order
  statement: An order's date is the day it was placed, not the day it was delivered. A question that says
    when, or names a period, without saying delivery is answered on the order date; a question that says
    delivered or shipped is answered on the delivery date.
  wording: proposed
  keywords:
  - order date
  - delivery date
  - when
  - placed
  - delivered
  - shipped
  - period
  state: proposed
  formerly:
  - order.default.period_is_order_date
  formal: symbolic
  tested_by: [RC10]
