rule: Order.date
says: An order's date is the day it was placed, not the day it was delivered. A question that says when, or names a period,
  without saying delivery is answered on the order date; a question that says delivered or shipped is answered on the delivery
  date.
state: proposed
about:
  - concept:Order
choice:
  options:
    ordered:
      column: dataset:v_contoso5_sales_line.order_date
    delivered:
      column: dataset:v_contoso5_sales_line.delivery_date
  default: ordered
formerly:
  - order.default.period_is_order_date
