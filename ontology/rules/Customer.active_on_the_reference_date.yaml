rule:
  id: Customer.active_on_the_reference_date
  statement: A customer is active on a reference date when that date falls inside the customer's
    validity window — on or after the day the record became valid and on or before the day it stopped
    being valid. The reference date is the date the question states, else the data's own "now", and
    the answer says which. "Customers" with no other word means the active customers; "registered"
    customers are every customer on the register, whether valid on that date or not. Active customers
    are not the same set as customers who have bought something — each can hold people the other does not.
  wording: proposed
  keywords:
  - customer
  - active
  - registered
  - valid
  - reference date
  - stichtag
  - as of
  - how many customers
  state: ruled
  said:
