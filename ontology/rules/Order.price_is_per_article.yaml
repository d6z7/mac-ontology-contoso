rule: Order.price_is_per_article
says: 'An unqualified price means what the customer paid per article: the net amount divided by the number of units, both
  summed over the lines asked about — never an average of line prices.'
state: proposed
about:
  - concept:Order
choice:
  options:
    price_per_article:
      ratio:
        numerator: dataset:v_contoso5_sales_line.net_amount
        denominator: dataset:v_contoso5_sales_line.quantity
  default: price_per_article
