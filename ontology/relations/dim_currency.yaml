# CONTOSO5 > the currency row, SEMANTICALLY — what a question may do with its one column.
#
# ONE CONCEPT READS THIS RELATION, so this file de-duplicates nothing. It is here because a
# TWO-FORM ESTATE IS THE LIABILITY: every one of the ten blind readers found on 2026-10-08 had a
# path that handled `source:` and returned nothing for `bindings:` without saying so, and
# `PASS over a shrunken population` is how that reads from outside. With one form, a reader that
# handles only the other sees NOTHING and fails loudly.
#
# THE CODE IS THE WHOLE ROW, and its MEANING is in its register — the same register both ends of
# every exchange rate resolve through, so one value set has one home for three readers.
#
# The data plane's view of the same relation is data/datasets/dim_currency.yaml.
