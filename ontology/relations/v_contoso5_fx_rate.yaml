# CONTOSO5 > the exchange-rate row, SEMANTICALLY — what a question may do with each column.
#
# ONE CONCEPT READS THIS RELATION, so this file de-duplicates nothing. It is here because a
# TWO-FORM ESTATE IS THE LIABILITY: every one of the ten blind readers found on 2026-10-08 had a
# path that handled `source:` and returned nothing for `bindings:` without saying so, and
# `PASS over a shrunken population` is how that reads from outside. With one form, a reader that
# handles only the other sees NOTHING and fails loudly.
#
# THE ONLY COMPOSITE KEY IN THE BUNDLE: `[date_day, from_currency, to_currency]`. A rate is not
# identified by any one of the three, and this is the relation that proves the relation-owned form
# carries a composite key as naturally as a single one — the concept's `serves` must name every
# part, because a key column a concept does not serve is a load error (Order failed exactly that
# way on `line_number`).
#
# BOTH CURRENCY ENDS RESOLVE THROUGH ONE REGISTER, the same one `dim_currency.currency_code` uses.
#
# The data plane's view of the same relation is data/datasets/v_contoso5_fx_rate.yaml.
metadata:
  source: CONTOSO5
  schema_version: '0.3.1-develop'
  confidence: C
  provenance: authored

relation:
  name: v_contoso5_fx_rate
  key: [date_day, from_currency, to_currency]

columns:
  date_day:
    description: >-
      the day the rate held, 4,018 days.
    surfaces: ['date', 'day', 'rate date']
    offers:
      axis: time
  from_currency:
    description: >-
      the currency being converted FROM. All five appear as a source, so the view is a full 5x5
      matrix of 100,450 rows and not a USD-only lookup.
    surfaces: ['from', 'source currency', 'convert from']
    offers:
      axis: categorical
  to_currency:
    description: >-
      the currency being converted TO.
    surfaces: ['to', 'target currency', 'convert into']
    offers:
      axis: categorical
  rate:
    description: >-
      what one unit of `from_currency` was worth in `to_currency` on `date_day`. Same-currency
      pairs are present and are exactly 1. THE AMOUNTS ON A SALES LINE ARE ALREADY USD, so
      converting them with this is how a figure silently becomes the wrong currency.
    surfaces: ['exchange rate', 'fx rate', 'conversion rate']
    offers:
      aggregate:
        type: intensive
        unit: to-currency per from-currency
      extremum: [min, max]
