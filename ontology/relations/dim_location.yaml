# CONTOSO5 > the location row, SEMANTICALLY — what a question may do with each of its columns.
#
# ONE CONCEPT READS THIS RELATION, so this file de-duplicates nothing. It is here because a
# TWO-FORM ESTATE IS THE LIABILITY: every one of the ten blind readers found on 2026-10-08 had a
# path that handled `source:` and returned nothing for `bindings:` without saying so, and
# `PASS over a shrunken population` is how that reads from outside. With one form, a reader that
# handles only the other sees NOTHING and fails loudly.
#
# THE GEOGRAPHY LADDER LIVES HERE, which is the fact worth having in one home: country and state are
# not independent axes but a hierarchy, and the `finer_than`/`scoped_by` rulings on these columns are
# what let a breakdown roll up without the composer guessing. Store reaches this relation through
# `location_code`, so the ladder is one join away from every sale.
#
# THE LADDER IS TWO RUNGS, NOT FOUR. This paragraph listed "continent, country, state and city" until
# 2026-10-24 and this relation holds neither end of that: there is no continent column and no city
# column, and `main.store` has none either — a store's finest place is its `state`, which in France
# means regions and overseas territories. The only `finer_than` ruling here is `state finer_than
# country_code`. A reader told the ladder has a city rung will go looking for one, which is how an
# answer comes back holding site codes where city names were asked for. City exists in this bundle
# only as `dim_customer.city` — where a customer LIVES, surfaced as `town`, and declared
# `offers.suppressed: DQ-IDENTIFYING-DIM_CUSTOMER-CITY`.
#
# The data plane's view of the same relation is data/datasets/dim_location.yaml.
metadata:
  source: CONTOSO5
  schema_version: '0.3.1-develop'
  confidence: C
  provenance: authored

relation:
  name: dim_location
  key: location_code

columns:
  location_code:
    description: >-
      THE SITE ITSELF — one row per site, which is what makes this relation the place a question
      about sites should be answered from. The value -1 is the online placeholder and not a place
      (rule Location.channel). SURFACES WIDENED 2026-10-24 BY THE OPERATOR, verbatim: "dont call it
      site code ... just site, location, city" (rule Location.site). `city` WAS ASKED FOR AND
      WITHDRAWN THE SAME DAY: this bundle has NO STORE CITY — the source store table carries a state
      or region and no city or town, and `GeoAreaKey` is another site identifier rather than a link
      to a geography. City exists only on the CUSTOMER (`dim_customer.city`), where it is declared
      personally identifying (`offers.suppressed: DQ-IDENTIFYING-DIM_CUSTOMER-CITY`) and says where
      a customer lives, not where a shop stands. Surfacing `city` here would bind "which cities" to
      an INTEGER site code and present codes as city names; unbound, the question fails to bind and
      the walk says so, which is the correct outcome for a fact this bundle does not hold.
    surfaces: ['site', 'location']
    offers: {}
  country_code:
    description: >-
      the country the site sits in.
    surfaces: ['site country code']
    offers:
      axis: categorical
  country_name:
    description: >-
      the name of the country the site sits in, carried here as well as on dim_country.
    surfaces: ['site country name']
    offers:
      axis: categorical
    rulings:
      label_of: country_code
      naming: long
  state:
    description: >-
      the state, province or region the site sits in.
    surfaces: ['province', 'region']
    offers:
      axis: categorical
    rulings:
      finer_than: country_code
  units_ever_here:
    description: >-
      how many store rows have ever stood at this site. A site re-tenanted has several store rows
      over time; each is one premises (rule Store.premises_not_place).
    surfaces: ['stores ever here', 'tenancies', 'how many stores here']
    offers:
      aggregate:
        type: precomputed
        unit: units
      extremum: [min, max]
