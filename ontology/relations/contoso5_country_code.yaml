# CONTOSO5 > the country register, SEMANTICALLY — what a question may do with each of its columns.
#
# A RELATION WHOSE ROWS LIVE IN A FILE (`table.type: file`), same as any other value set since
# the 2026-10-15 fold — the data plane's view, `data/datasets/contoso5_country_code.yaml`, says
# so. What that fold left undone is THIS file: a served relation has a MEANING as well as a
# CONTENT, and until now 0 of contoso5's 12 file relations carried the first.
#
# TWO COLUMNS, ONE FACT, MEASURED ON THE MEDIUM ITSELF (`data/lookups/contoso5_country_code.lookup.csv`):
# `code` is the ISO-style code (`IT`), `label` is its long name (`Italy`) — 9 rows, `code,label`,
# cut from `dim_country.country_code` (`derived_from.sources`). `label` is `label_of: code` with
# `naming: long`, EXACTLY the pattern `dim_country.yaml` already states for the warehouse relation
# this register was cut from (`country_name` is `label_of: country_code`) — the same fact, on the
# relation that is actually a code+label pair rather than a bare code. This is the one of
# contoso5's 12 file relations where the medium measures a label, so this is the one that earns it.
#
# `code` itself offers `{}`, not an axis — it is the key, and the categorical use is `label`'s,
# exactly as `dim_country.country_code` offers `{}` while `dim_country.country_name` carries the
# axis.
#
# The data plane's view of the same relation is data/datasets/contoso5_country_code.yaml.
metadata:
  source: CONTOSO5
  schema_version: '0.3.1-develop'
  confidence: C
  provenance: authored

relation:
  name: contoso5_country_code
  key: code

columns:
  code:
    description: >-
      THE MEMBER: a country code, '--' included, which is the online sentinel and not a country.
      This relation IS the declared value set for that column, so a value absent here is a value
      the warehouse does not hold.
    offers: {}
  label:
    description: >-
      the reader-facing name of the country code beside it.
    surfaces: ['country name']
    offers:
      axis: categorical
    rulings:
      label_of: code
      naming: long
