# CONTOSO5 > the country row, SEMANTICALLY — what a question may do with each of its columns.
#
# ONE CONCEPT READS THIS RELATION, so this file de-duplicates nothing. It is here because a
# TWO-FORM ESTATE IS THE LIABILITY: every one of the ten blind readers found on 2026-10-08 had a
# path that handled `source:` and returned nothing for `bindings:` without saying so, and
# `PASS over a shrunken population` is how that reads from outside. With one form, a reader that
# handles only the other sees NOTHING and fails loudly.
#
# TWO COLUMNS, ONE FACT: `country_name` is `label_of: country_code` with `naming: long`, which is
# what makes "by country" answer with names and not codes. The duplicate spelling — nine codes as
# stored, eight as meant — stays on the CONCEPT as its `note`, because it is a statement about
# Country's extension, not about either column.
#
# The data plane's view of the same relation is data/datasets/dim_country.yaml.
metadata:
  source: CONTOSO5
  schema_version: '0.3.1-develop'
  confidence: C
  provenance: authored

relation:
  name: dim_country
  key: country_code

columns:
  country_code:
    rules: [Country.rows]
    description: >-
      the country's code. The value `--` is a placeholder and not a country: it is where the source
      put the online store's country, and counting it would add a country Contoso does not sell in
      (rule Country.rows).
    surfaces: ['iso code']
    offers: {}
  country_name:
    description: >-
      the country's name as a reader would see it. 'Online' is the name the sentinel carries and
      is not a place.
    surfaces: ['country', 'nation', 'which country']
    offers:
      axis: categorical
    rulings:
      label_of: country_code
      naming: long
