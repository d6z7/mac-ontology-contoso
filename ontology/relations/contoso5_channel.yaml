# CONTOSO5 > the channel register, SEMANTICALLY — what a question may do with its one column.
#
# A RELATION WHOSE ROWS LIVE IN A FILE (`table.type: file`), same as any other value set since the
# 2026-10-15 fold; the data plane's view is data/datasets/contoso5_channel.yaml. `code` is cut from
# `v_contoso5_sales_line.channel` (`derived_from.sources`) — the distinct values of that column ARE
# this relation's rows, 2 of them.
#
# CLOSED BY CONSTRUCTION, NOT BY OBSERVATION, and that is the one way this register differs from
# its twelve siblings. The others are cut from a stored column and are closed only as far as
# today's rows go: a thirteenth colour could arrive tomorrow. `channel` is DERIVED on the fact by
# `CASE WHEN "StoreKey" = 999999 THEN 'online' ELSE 'physical' END`, so the expression itself
# admits exactly two values and no delivery can add a third without editing the transform.
#
# `offers: {}`, DELIBERATELY, and not `axis: categorical`. The categorical-axis fact about this
# same string is ALREADY DECLARED, once, on `v_contoso5_sales_line.channel` — the column a
# breakdown actually groups and reads. Restating it here on the register's key would be a SECOND
# HOME for one fact, which is the defect this estate retired registers to stop committing. This
# relation's own job is narrower: it is the closed DOMAIN that column draws from, addressable by a
# foreign key with `references: contoso5_channel.code`.
metadata:
  source: CONTOSO5
  schema_version: '0.3.0-develop'
  confidence: C
  provenance: authored

relation:
  name: contoso5_channel
  key: code

columns:
  code:
    description: >-
      THE MEMBER: which channel a sale was made through — `physical` for a shop a customer can
      walk into, `online` for the web shop. This relation IS the declared value set for
      `v_contoso5_sales_line.channel`, so a value absent here is a value the warehouse does not
      hold. The names are the ones
      `store.resolution.the_channel_is_the_location_sentinel` already declares for its two
      populations, so the axis has one vocabulary across the fact, the dimension and this domain.
    offers: {}
