# relation's rows, 11 of them.
#
# `offers: {}`, DELIBERATELY, and not `axis: categorical`. The categorical-axis fact about this
# same string is ALREADY DECLARED, once, on `dim_product.brand`
# (`ontology/relations/dim_product.yaml`) — the column a breakdown actually groups and reads.
# Restating it here on the register's key would be a SECOND HOME for one fact, which is the exact
# defect this estate retired registers to stop committing. This relation's own job is narrower:
# it is the closed DOMAIN `dim_product.brand` draws from, addressable by a foreign key with
# `references: contoso5_brand.code` — nothing this file's own medium measures beyond that.
#
# The data plane's view of the same relation is data/datasets/contoso5_brand.yaml.
