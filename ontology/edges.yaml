# ═════════════════════════════════════════════════════════════════════════════════════════════════
# BUSINESS EDGES — `level: business`. ELEVEN, closing seven of the eleven concepts no physical edge
# touched (see metadata.reachability for the four that must stay edge-less).
#
# WHAT MAKES THESE BUSINESS AND NOT PHYSICAL, once, here, instead of eleven times below. In every one
# of them the two concepts GROUND ON THE SAME SERVED RELATION — the relationship is carried by a
# column of one row, not by a key pointing at a second relation. There is no join, so there is no
# `join_rule`; writing one would be an invented self-join and check_edge_joins_measured would
# dutifully measure it and report a tautology as evidence.
#
# HOW EACH ONE IS REALISED, AND HOW THAT IS COUNTED. `realized_by` names the column (or the
# key -> value pair) that carries the relationship, in the vocabulary mac_measure_edges.py counts:
#   a bare `relation.column` with `cardinality: "1"`  -> COLUMN PRESENCE  (count of NULL/empty = 0)
#   a `relation.key -> relation.value` with `"0..1"`   -> VALUE UNIQUENESS (count of keys with 2 = 0)
# `resolved_by` names the TYPED CONCEPT RULE that says how to READ that column — which the schema
# requires of a business shared_attribute edge, and which is the thing an engine must obey. The two
# are different statements and both are needed: one says where the relationship lives, the other says
# what it means. Every number in the notes below was MEASURED against contoso_served on 2026-09-18
# through the connector connection.yaml declares; none is typed from expectation.
#
# THE TYPE IS `shared_attribute` AND NOT `identity` ON ALL ELEVEN. mac.schema.json admits exactly two
# business types. `identity` means the two concepts ARE the same thing (the reference bundle's single-country market
# IS one country). Nothing here is: a customer HAS a country, a line IS DENOMINATED IN a currency, a
# measure IS MEASURED ON a line. Claiming identity would license substituting one concept for the
# other, which none of these relationships permits.
# ═════════════════════════════════════════════════════════════════════════════════════════════════

  # ── Country, in its TWO ROLES ──────────────────────────────────────────────────────────────────
  # Two edges and not one, because `country.roles.customer_or_store_never_both` rules that the roles
  # do not agree and the answer must name which it means. An un-roled Country edge would be exactly
  # the silent substitution that rule forbids, wearing an edge's clothes.
  - edge_id: customer__resides_in__country
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: Customer, ref: "ontology/concepts/customer/customer.yaml#concept", role: residesIn, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Country,  ref: "ontology/concepts/geography/country.yaml#concept", cardinality: "1" }
    realized_by: "dim_contoso_customer.Country"
    resolved_by: "ontology/concepts/geography/country.yaml#contract.rules.country.roles.customer_or_store_never_both"
    verified_by: "evidence/edge_measurements.json#customer__resides_in__country"
    notes: >-
      THE BUSINESS RELATIONSHIP: this customer RESIDES IN this country — the country of the buyer, not
      of the sale. This is the DEFAULT country role in the bundle and the rule above requires the
      choice to be disclosed with the figure rather than defaulted in silence.
      MEASURED: 104 990 of 104 990 customer rows carry a non-empty Country, 0 nulls, so the `to` end
      is "1" and not "0..1"; 8 distinct values, 1:1 with CountryFull (measured at P7); 0 of 104 990
      customers carry more than one Country, which is trivially so at this grain and is recorded
      because it is the claim the measurement actually counts.
      WHY THIS IS NOT A ROLL-UP DECLINED AS CONCEPT STRUCTURE: Continent over Country IS a roll-up and
      IS declined (metadata.structure_not_edges item 1). Customer-resides-in-Country is not a
      whole-to-part membership — Country declares no `members:` over Customer — it is an attribute of
      the customer row whose value is another named concept, which cookbook C3(a) rules is an edge.
      NS-CUSTOMER-01 still governs: roll-up geography only, so this edge is traversed to a country and
      never to a coordinate, and DQ-CUSTOMER-02 still forbids grouping to ZipCode.
    confidence: I

