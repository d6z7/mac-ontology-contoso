# CONTOSO (demo) — Edges layer: relations BETWEEN concepts (a relation is an edge, never a property of an endpoint).

metadata:
  layer: edges
  source: CONTOSO
  schema_version: '0.1.9'
  status: draft
  date: 2026-07-19

edges:

  - edge_id: sales__of_product
    level: physical                       # a real FK join between tables
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: Sales,   ref: "ontology/concepts/sales/sales.yaml#concept",     role: ofProduct, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Product, ref: "ontology/concepts/catalog/product.yaml#concept",                  cardinality: "1" }
    join_rule: "sales.ProductKey = product.ProductKey"
    realized_by: "data/datasets/sales.yaml#foreign_keys (ProductKey -> product.ProductKey)"
    notes: "Every per-product / per-brand aggregation of sales goes through this join."
    confidence: C

  - edge_id: sales__at_store
    level: physical
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: Sales, ref: "ontology/concepts/sales/sales.yaml#concept",       role: atStore, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Store, ref: "ontology/concepts/geography/store.yaml#concept",                   cardinality: "1" }
    join_rule: "sales.StoreKey = store.StoreKey"
    realized_by: "data/datasets/sales.yaml#foreign_keys (StoreKey -> store.StoreKey)"
    notes: "The market/country slice of sales — and where the 'Online' pseudo-country surfaces."
    confidence: C

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
