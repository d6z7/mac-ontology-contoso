governance:
  owner: operator
  last_reviewed: 2026-09-22
  change_log:
    - date: 2026-09-18
      change: >-
        Created at P9 over the 17 concepts authored at P7 and the measures classified at P8. Six edges
        minted, every cardinality and participation cited from data/references_served/ rather than
        typed; two drawn references, three superseded references and four dangling references declined
        with reasons recorded in metadata.references_declined; four planned edges recorded with their
        preconditions.
      change_type: CREATION
      by: operator
      rationale: >-
        The operator's ruling that an ontology edge is a business relationship citing a measured
        physical reference rather than a copy of it, applied file-wide. The one narrow reading of that
        ruling — the fact's two calendar roles are minted while the FX grid's single date reference is
        declined — is argued in metadata.open_collision and reversible in one edit.

    - date: 2026-09-18
      change: >-
        CONCEPT REACHABILITY CLOSED. Measured that the 6 physical edges touched only 6 of the 17
        concepts and named the 11 they left unreachable (metadata.reachability). Minted 11
        `level: business` / `type: shared_attribute` edges closing 7 of them — Country x2 roles,
        GeoArea x2 roles, Currency x3 (line denomination + the quote's ordered pair), AgeBand,
        StoreStatus, GrossSalesAmount, NetSalesAmount — each carrying `realized_by` (the column or
        key -> value pair that CARRIES the relationship, in the vocabulary mac_measure_edges.py
        counts), `resolved_by` (the typed concept rule that says how to READ it, as the schema
        requires of a business shared_attribute edge) and `verified_by` (the measurement). Added the
        `verified_by` citation the 5 join-realised edges never carried, so check_edge_claims_proved
        stops reporting 0 of 6 proved while a measurement of 5 of them sat on disk unread. Corrected
        three declines in metadata.structure_not_edges that read the framework's containment rule
        too widely, keeping the original wording and the correction side by side. The remaining 4
        edge-less concepts (Brand, ProductCategory, ProductSubcategory, Continent) are declared
        edge-less BY RULING and the reason is recorded; they are reached through `members.over` on
        their parent concept.
      change_type: ADDITION
      by: operator
      rationale: >-
        A concept no edge touches cannot be reached from the fact by traversal, so it is answerable
        only in isolation — and nothing in this file said which concepts those were. The count
        argument for 6 edges was sound about not duplicating predicates and silent about coverage;
        both are now measured and stated. The four that stay edge-less do so on FRAMEWORK.md §7 and
        cookbook C3(b) rather than on judgment, and forcing an edge there to make a graph look
        connected would put containment in the one home the framework forbids.

    - date: 2026-09-18
      change: >-
        Corrected items (2), (3) and (5) of metadata.structure_not_edges, which declined the AgeBand,
        StoreStatus, Country, GeoArea and Currency relationships on a reading of the framework's
        containment rule that was too wide. FRAMEWORK.md §7 excludes only containment and is-a from
        the edge layer; cookbook C3(a) rules the opposite way for an attribute whose value is another
        named concept, and mac.schema.json's EdgeEndpoint requires two CONCEPTS, not two relations.
        The original wording is kept beside each correction rather than overwritten.
      change_type: CORRECTION
      by: operator
      rationale: >-
        A reader was told these were "not an edge" with a framework citation attached. Deleting that
        sentence would leave the next operator unable to see which half of it was wrong, and this
        step's measured failure mode is exactly two operators re-deriving the same decision and
        deciding differently.
