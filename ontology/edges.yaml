# CONTOSO — the EDGES layer. P9 · edges-and-rules.
#
# AN EDGE IS NOT A COPY OF A DATABASE RELATION, and this file is written to that ruling. A measured
# physical reference says two columns include into each other; an edge says two BUSINESS OBJECTS
# stand in a named relationship, and cites the measurement as its evidence rather than restating it.
# So every edge below carries (a) a role that names the relationship in business words, (b) a
# cardinality and participation taken from the file that MEASURED them, named in `realized_by` /
# `cross_references`, and (c) a note saying what the measurement does and does not establish.
#
# WHERE A MEASURED REFERENCE CARRIES NO BUSINESS RELATIONSHIP, NO EDGE IS MINTED, AND THE DECLINE IS
# RECORDED — `metadata.references_declined` below lists every one of the 11 measured served
# references and the 4 dangling ones with the reason it did or did not become an edge. That list is
# part of this deliverable. An absent edge and an un-thought-of edge look identical in a file that
# only holds what was minted.
#
# SEVENTEEN EDGES over 17 concepts — SIX physical and ELEVEN business. The count is a RESULT, not a
# target: the test the framework's own pattern index sets is that every measure reaches every
# dimension a question slices it by in one hop without a probe, and that no rollup and no degenerate
# dimension is wired as a join. See `metadata.count_argument` and `metadata.reachability`.
#
# THE SIX PHYSICAL EDGES LEFT ELEVEN OF THE SEVENTEEN CONCEPTS UNTOUCHED BY ANY EDGE, and a concept
# no edge touches cannot be reached from the fact by traversal — it is answerable only in isolation.
# `metadata.reachability` names all eleven, says which were closed and how, and names the four that
# are DELIBERATELY still edge-less because the framework forbids the edge (FRAMEWORK.md §7:
# containment and is-a are CONCEPT STRUCTURE). The eleven new edges are `level: business`, which is
# the layer the operator's ruling names: a business relationship between two concepts that CITES a
# measured column rather than restating a join, on concepts that co-ground on ONE relation and
# therefore have no join to write.

metadata:
  layer: edges
  source: CONTOSO
  schema_version: '0.1.14'
  status: draft
  date: 2026-09-18
  owner: operator
  provenance: authored
  confidence: I

  method: >-
    P9 of mac-integration-kit/ontology/METHOD.md, authored against the framework's
    own pattern index (reference_manual/patterns/) and MODELLERS_COOKBOOK.md A4/B5/C3 rather than a
    summary of them. The patterns that decided this file: `role_playing_dimension` (one calendar, two
    roles, two edges), `degenerate_dimension` (OrderKey is a property, never an edge), `scd_type_2`
    (the store dimension's version grain, and why joining it does NOT fan out).

  evidence_plane: >-
    data/references_served/ — the SERVED physical reference plane, measured through the declared
    connector by tools/mac_references.py/1 on 2026-09-18: 11 real references over 6 relations, 8 of
    them drawn, cardinality AND participation measured on BOTH sides, 4 dangling recorded with no
    target, 66 candidates rejected with their numbers kept. NO CARDINALITY IN THIS FILE IS
    HAND-TYPED: each is read out of that plane and the reference id is named on the edge.

  count_argument: >-
    6 PHYSICAL edges, not 21 and not 3. The three MEASURE concepts (GrossSalesAmount, NetSalesAmount,
    ExchangeRate) get NO physical edges of their own to the dimensions their axis_kinds name. Gross
    and Net ground on v_contoso_order_line — the same relation OrderLine grounds on — so the five
    physical edges below already sit on the measure's own grounded relation and reach every axis in
    one hop. Repeating them per measure would be 15 more copies of 5 joins, three homes for one
    predicate, and check_edge_joins_its_grounding would pass all 15 because they ground the same
    relation: the gate could not catch the duplication. Measured that the reach is real, not assumed —
    queries/p8_measure_semantics.sql#B5: the product and customer joins carry 223 974 of 223 974 fact
    rows with net identical to the cent (difference 0.00000) over 11 brands, 8 categories, 8
    countries and 3 continents, so no fan-out and no loss.
    WHAT THAT ARGUMENT DID NOT DO, and this is the gap it left: it made the measures reachable to a
    READER of this comment and to nothing else. Gross and Net were touched by no edge, so a traversal
    could not get from the measure to the axis it is sliced by without reading a paragraph. Each now
    carries exactly ONE business edge to OrderLine (`*__measured_on__order_line`) — 2 edges, not 15 —
    which states the co-grounding as a declaration. The measure then reaches every dimension in two
    hops through the fact's own five physical edges, and no predicate is duplicated anywhere.

  reachability: >-
    THE CONCEPT-COVERAGE MEASUREMENT THIS FILE PREVIOUSLY DID NOT MAKE. Counted over
    ontology/concepts/ on 2026-09-18: 17 concepts; the 6 physical edges touch 6 of them (OrderLine,
    Customer, Product, Store, CalendarDay, ExchangeRate) and left ELEVEN untouched — Brand,
    ProductCategory, ProductSubcategory (grouping over Product); Continent (grouping over Country);
    Country, GeoArea (reference, co-grounded on the customer and store rows); AgeBand, StoreStatus,
    Currency (enumeration); GrossSalesAmount, NetSalesAmount (measure).
    SEVEN OF THE ELEVEN ARE NOW CLOSED with 11 business edges (a concept may take more than one: a
    role-played concept takes one per role). Country takes 2 (customer role, store role), GeoArea 2
    (same two roles), Currency 3 (the line's denomination, and the quote's two ordered-pair ends),
    AgeBand 1, StoreStatus 1, GrossSalesAmount 1, NetSalesAmount 1.
    FOUR OF THE ELEVEN ARE STILL EDGE-LESS AND MUST STAY SO — Brand, ProductCategory,
    ProductSubcategory, Continent. All four declare `members.over`, which makes them WHOLE-TO-PART
    CONTAINMENT, and FRAMEWORK.md §7 rules that containment and is-a are concept structure and not
    edges; MODELLERS_COOKBOOK.md C3(b) names a membership sitting in edges.yaml as the anti-pattern
    and check_cookbook_smells enforces it. So these four are reached through their parent concept's
    `members:` block (Brand/ProductCategory/ProductSubcategory over Product, which the fact joins;
    Continent over Country, which the customer row carries) and NOT through this file. THE
    CONSEQUENCE, stated rather than left to be discovered: any renderer that draws only `edges:` will
    draw these four as ISOLATED NODES. That is a defect in the renderer's plane coverage, not a hole
    in this file — the relationship is declared, in the home the framework assigns it.
    WHY THE ELEVEN ARE `level: business` AND CARRY NO `join_rule`. In every one of them BOTH concepts
    ground on the SAME served relation, so there are not two relations to join: the relationship is
    carried by a COLUMN of one row. Each therefore declares `realized_by` (the column, or the
    key -> value pair, that carries it — which is what mac_measure_edges.py counts) and `resolved_by`
    (the typed concept rule that says how to READ that column, which the schema requires of a
    business shared_attribute edge). A `join_rule` here would be an invented self-join.

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # EVERY MEASURED REFERENCE, AND WHAT BECAME OF IT. 11 real + 4 dangling = 15 accounted for.
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  references_declined:

    - reference: v_contoso_order_line.CurrencyCode__v_contoso_fx_rate_day.FromCurrency
      measured: "real, drawn, many:many, both sides mandatory, inclusion 1.0 over 223 974 rows, 5 of 5 parent values used"
      minted_edge: false
      why: >-
        THE ONTOLOGY RULES ON A needs_ruling THE MEASUREMENT COULD NOT BREAK, and this is the half it
        rejects. The measurement records CurrencyCode as including perfectly into BOTH FromCurrency
        and ToCurrency on identical evidence at the same key role, and says so: "Value inclusion
        cannot separate them; BOTH are recorded and neither is silently chosen." Value inclusion
        cannot, but the measured FX DIRECTION can: the rate is USD -> the order's currency, so the
        line's CurrencyCode is the ToCurrency and FromCurrency is pinned to the literal 'USD'. The
        reverse orientation reproduces 113 627 of 223 974 lines — exactly the lines whose rate is 1.0
        (113 614 USD lines plus 13 EUR lines on the single par date 2022-08-31) — so a sample cannot
        tell the two apart and the wrong one inverts every non-USD figure silently.
        decisions/0001-order-line-fact-of-record.md §4 holds the per-currency table.
      adopted_instead: order_line__converts_at__exchange_rate

    - reference: v_contoso_order_line.CurrencyCode__v_contoso_fx_rate_day.ToCurrency
      measured: "real, drawn, many:many, both sides mandatory, inclusion 1.0 over 223 974 rows"
      minted_edge: false
      why: >-
        ADOPTED, but not as an edge of its own: it is one of the three columns the conversion edge
        binds, and a separate CurrencyCode edge would be a single-column part of a composite
        relationship, which is the shape the reference contract itself warns it records
        (`single_column_references_only: true`). A bare CurrencyCode join is also the
        half-specified filter ExchangeRate's own rule forbids.
      adopted_instead: order_line__converts_at__exchange_rate

    - reference: v_contoso_fx_rate_day.Date__dim_contoso_calendar_day.Date
      measured: "real, drawn, many:one, both sides mandatory, 4 018 of 4 018 parent days used, fanout 1"
      minted_edge: false
      why: >-
        A REFERENCE WITH NO BUSINESS RELATIONSHIP BEHIND IT — the operator's standard example, applied
        here rather than quoted. A quote is READ AT a date and never over a range (the ExchangeRate
        concept's `contract.axis_handling` fixes that), and nothing the calendar dimension adds —
        WorkingDay, YearMonth, fiscal labels — says anything about a currency quote. There is also no
        ROLE to distinguish: the FX grid carries exactly one date column, so the argument that makes
        the fact's two date edges necessary (below) has no counterpart here. Declining it costs
        nothing answerable: the quote's own Date column is served and a period question about rates
        reads it directly.

    - reference: v_contoso_order_line.OrderDate__v_contoso_fx_rate_day.Date
      measured: "real, NOT drawn — direction `superseded_by_identity`, superseded by dim_contoso_calendar_day.Date"
      minted_edge: false
      why: >-
        The measurement itself declined to draw it, and the ontology agrees for a second reason: this
        is one clause of the composite conversion relationship, not a relationship on its own. Bound
        inside order_line__converts_at__exchange_rate. MEASURED COST OF TREATING IT AS AN EDGE IN ITS
        OWN RIGHT: the single-equality predicate `v_contoso_order_line.OrderDate =
        v_contoso_fx_rate_day.Date` returns 25 quotes for every one of the 223 974 lines — a 25x
        fan-out — because the grid is complete over 5x5 ordered pairs.

    - reference: v_contoso_order_line.DeliveryDate__v_contoso_fx_rate_day.Date
      measured: "real, NOT drawn — direction `superseded_by_identity`"
      minted_edge: false
      why: >-
        Same shape as the OrderDate case, and additionally: no measure in this bundle converts on a
        DELIVERY basis. The FX direction is declared as of the ORDER date; a delivery-basis conversion
        is not a relationship this ontology claims. Recorded so the next operator does not read the
        absence as an oversight — open question NSA-Q2 on NetSalesAmount is where the date-basis
        question actually lives.

    - reference: dim_contoso_calendar_day.Date__v_contoso_fx_rate_day.Date
      measured: "real, NOT drawn — direction `superseded_by_reverse`"
      minted_edge: false
      why: >-
        The reverse of a reference already declined above; the measurement marks it superseded. A
        calendar day does not stand in a business relationship to a currency quote in either
        direction.

    - reference: dim_contoso_customer.GeoAreaKey__?
      measured: "DANGLING — no target relation. 104 990 child rows, 608 distinct values, 0 nulls, range 1..616; 2 candidate parents measured, 0 admitted"
      minted_edge: false
      why: >-
        THIS IS EXACTLY WHERE AN ER DIAGRAM AND AN ONTOLOGY PART COMPANY. The ER diagram must draw
        this column as a reference pointing nowhere (the measurement says so in its own note). The
        ontology cannot mint an edge, because an edge needs two relations and there is no served
        geography relation — NS-SERVING-01 fixes the warehouse at 8 base tables and 6 served views.
        The business meaning it would carry is already homed as CONCEPT STRUCTURE: GeoArea, Country
        and Continent are roll-ups ON the customer row (NS-CUSTOMER-01, roll-up geography only), and
        FRAMEWORK.md §7 is explicit that containment and is-a are concept structure and not edges.
        Carried as a planned edge below with its precondition.

    - reference: dim_contoso_store.GeoAreaKey__?
      measured: "DANGLING — no target relation. 74 child rows, 67 distinct, 0 nulls, range -1..616; 3 candidate parents measured, 0 admitted"
      minted_edge: false
      why: >-
        Same as the customer side, plus the measured sentinel: the range starts at -1, which is the
        'Online' store's non-region. GeoArea's own rule `geo_area.sentinel.online_has_no_region`
        holds that. Planned edge below.

    - reference: dim_contoso_product.CategoryKey__?
      measured: "DANGLING — no target relation. 2 517 child rows, 8 distinct, 0 nulls, range 1..8"
      minted_edge: false
      why: >-
        No served category relation exists, so there is no second relation to join. ProductCategory is
        a `grouping` concept whose `members.over` is Product — concept structure per cookbook A4, and
        wiring it into this file would be anti-pattern C3 (containment modelled as an edge), which
        check_cookbook_smells enforces. Planned edge below.

    - reference: dim_contoso_product.SubCategoryKey__?
      measured: "DANGLING — no target relation. 2 517 child rows, 32 distinct, 0 nulls, range 101..808"
      minted_edge: false
      why: >-
        As CategoryKey. ProductSubcategory is a grouping over Product. Planned edge below.

  structure_not_edges: >-
    WHAT A READER WILL LOOK FOR IN THIS FILE AND MUST NOT FIND — declined on the framework's own rule
    rather than on taste. Items (2), (3) and (5) READ THE RULE TOO WIDELY IN THE FIRST WRITING OF THIS
    FILE and are corrected here; the correction is recorded rather than overwritten, because a reader
    who was told "not an edge" needs to see which half of that was wrong.
    (1) STANDS. Brand, ProductCategory, ProductSubcategory over Product, and Continent over Country:
        ROLL-UPS declaring `members.over`. FRAMEWORK.md §7 and cookbook A4 — containment and is-a are
        concept structure, living in `members:` on the concept, which is where all four already are.
        Cookbook C3(b) names putting them here as an anti-pattern and check_cookbook_smells enforces
        it. These four are the reachability residue named in `metadata.reachability`.
    (2) CORRECTED. AgeBand over Customer and StoreStatus over Store are ENUMERATIONS, and the P9
        skill's "an attribute of a dimension is a column on that dimension, not an edge" was read as
        covering them. It does not: cookbook C3(a) rules the opposite way for exactly this shape — "a
        concept has a property whose value is ANOTHER CONCEPT → it's an edge" — and FW §7 excludes
        only containment and is-a from the edge layer, which an attribute domain is neither. An
        enumeration IS a named concept here (it has a file, a closed value set and a register), so
        Customer-has-AgeBand is a relation between two concepts. Now minted as two business edges.
    (3) CORRECTED. "Country and GeoArea ground on the SAME served relation as their parent, so there
        is no predicate to write — an edge needs two relations" confuses an EDGE with a JOIN. An edge
        needs two CONCEPTS (mac.schema.json EdgeEndpoint: "an edge endpoint is a CONCEPT, never a raw
        view/table"); it needs two relations only if its realisation is a join, and `level: business`
        exists precisely for a relationship realised by a shared column instead. Now minted as four
        business edges, two roles each, which is also what `country.roles.customer_or_store_never_both`
        requires: the roles are what must be named, and an un-roled Country edge would be the defect.
    (1b) THE ONE DECLINE A LIVE COMPILER WARNING ARGUES WITH, named here because the warning is real
        and a reader will hit it. mac_compile and check_rule_reference_basis both report MAC008
        warning against the Customer concept's rule `customer.geography.rollup_only` (the anchor is
        written without its file-and-hash form on purpose: check_references reads a `file.yaml#anchor`
        string in prose as a REFERENCE and its anchor regex runs on into the surrounding sentence, so
        a citation inside a paragraph becomes an unresolved-anchor error — measured here, once, by
        causing it). The finding: "names Continent — no edge, neither declares a unit, no shared
        surface term". Customer DOES carry a Continent
        column (measured: 104 990 of 104 990 rows, 0 nulls, 3 distinct) so a Customer -> Continent
        edge would validate and would measure clean. IT IS STILL DECLINED, on the P9 skill's explicit
        rule: "a rollup derivable from a column (country -> region) is concept structure, not an
        edge". Continent is FUNCTIONALLY DETERMINED by Country here — measured 0 of 8 countries carry
        more than one continent — so the relationship is already reachable as
        Customer -> Country (edge) then Country in Continent (`members.over`), and declaring it
        directly would add a second path to the same fact: a diamond in which a continent figure can
        be computed two ways that must agree and which nothing checks. THE TWO DISPOSITIONS, so the
        operator can rule rather than re-derive: (a) leave it — the warning is the framework asking a
        question the `members:` block answers, and `continent.side.customer_only` already records
        that the axis exists on one side only; (b) mint `customer__resides_in__continent` as a
        business shared_attribute edge on `dim_contoso_customer.Continent` — one edge, measurable
        today, at the cost of the derivable-rollup duplication above. Not taken unilaterally, because
        minting an edge to silence a warning is how containment gets into this file.
    (4) STANDS. OrderKey: a DEGENERATE DIMENSION (NS-ORDERS-02, framework pattern
        degenerate_dimension). The header is not served; the key is a property of the fact that
        defines the order grain. Wiring it as an edge would invent a table that does not exist.
    (5) CORRECTED IN PART. There is still NO currency dimension relation and none is invented — the
        code is a per-row unit marker and Currency's value set is delegated to
        data/lookups/contoso_currency.lookup.csv via mac.canon.enum_from_register. What was wrong is
        the inference drawn from that: the absence of a relation forbids a PHYSICAL edge, not a
        business one. Currency now takes three business edges — the line's denomination and the
        quote's two ordered-pair ends — and the ordered pair being TWO role-tagged edges is what keeps
        `exchange_rate.pair.never_half_a_pair` visible in this layer instead of only in prose.

  open_collision: >-
    THE ONE PLACE I READ THE OPERATOR'S RULING NARROWLY, SAID LOUDLY SO IT CAN BE REVERSED IN ONE
    EDIT. The ruling names "the calendar date FK" as the standard example of a physical reference
    carrying no business meaning. I have applied it to the FX grid's single date reference (declined
    above) but NOT to the fact's two date references, which are minted as
    order_line__ordered_on__calendar_day and order_line__delivered_on__calendar_day. The argument, and
    the measurement behind it: what carries no business meaning is the UN-ROLED join; the ROLE is the
    business fact, and here it is the most contested one in the bundle. The framework's
    `role_playing_dimension` pattern requires one reference concept and N role-tagged edges precisely
    so that a query must say which role it means, and calls the un-roled join "the classic" silent
    error. Measured, on this data: 130 424 of 223 974 lines (58.2 %) carry DeliveryDate = OrderDate,
    so a wrong date role is INVISIBLE on more than half the fact; the two references resolve different
    day sets (3 450 vs 3 498 distinct days, 568 vs 520 calendar days unreferenced). NetSalesAmount's
    open question NSA-Q2 is exactly this question, unresolved. If the operator rules the other way,
    delete the two edges and the date axis then resolves from the fact's own OrderDate/DeliveryDate
    columns without the calendar dimension — nothing else in this file depends on them.

edges:

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  - edge_id: order__comprises__order_line
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: Order, ref: "ontology/concepts/order/order.yaml#concept", role: comprises, cardinality: "1" }
      to:   { source: CONTOSO, concept: OrderLine, ref: "ontology/concepts/order/order_line.yaml#concept", cardinality: "0..N" }
    realized_by: "v_contoso_order_line.OrderKey"
    resolved_by: "ontology/concepts/order/order.yaml#contract.rules.order.grain.not_the_line"
    notes: >-
      THE TWO GRAINS OVER ONE RELATION. An order comprises its lines; the two concepts are served
      from the same rows and the OrderKey is what separates them. MEASURED 2026-09-24: 93 470
      orders over 223 974 lines, minimum 1 line, mean 2.4, maximum 7, 0 nulls — so the `to` end is
      "0..N" as a shape and never 0 in fact.

      NO join_rule, DELIBERATELY. Both ends are the same relation; there is nothing to join. The
      edge exists so the graph KNOWS the two grains are the same rows, and so a reader asking what
      an Order connects to is told about its lines rather than being left to infer it from a
      shared column name.
    confidence: I

  - edge_id: order__placed_by__customer
    level: physical
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: Order, ref: "ontology/concepts/order/order.yaml#concept", role: placedBy, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Customer, ref: "ontology/concepts/customer/customer.yaml#concept", cardinality: "1" }
    join_rule: "v_contoso_order_line.CustomerKey = dim_contoso_customer.CustomerKey"
    realized_by: "v_contoso_order_line.CustomerKey"
    resolved_by: "ontology/concepts/order/order.yaml#contract.rules.order.atomicity.one_value_per_order"
    notes: >-
      THE BUSINESS RELATIONSHIP: this order was placed BY this customer. The join is the LINE's
      column, which is sound here only because the order is ATOMIC on it — measured 0 of 93 470
      orders carrying more than one CustomerKey. That measurement is the edge's whole licence, and
      it is why `resolved_by` points at the atomicity rule rather than at a resolution rule: what
      needs saying is not how a customer is named but why one line's customer is the order's.
      Mean 1.79 orders per customer, maximum 9.
    confidence: I

  - edge_id: order__placed_at__store
    level: physical
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: Order, ref: "ontology/concepts/order/order.yaml#concept", role: placedAt, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Store, ref: "ontology/concepts/store/store.yaml#concept", cardinality: "1" }
    join_rule: "v_contoso_order_line.StoreKey = dim_contoso_store.StoreKey"
    realized_by: "v_contoso_order_line.StoreKey"
    resolved_by: "ontology/concepts/order/order.yaml#contract.rules.order.atomicity.one_value_per_order"
    notes: >-
      THE BUSINESS RELATIONSHIP: this order was placed AT this store, the 'Online' sentinel
      included. Same licence as the customer edge: measured 0 of 93 470 orders carrying more than
      one StoreKey, so the line's column IS the order's store. The store dimension is SCD-2 and
      the join lands on the version the line points at, exactly as it does for the line — a
      question that COUNTS stores must still collapse, and that hazard is held on Store, not here.
    confidence: I

  - edge_id: order_line__placed_by__customer
    level: physical
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: OrderLine, ref: "ontology/concepts/order/order_line.yaml#concept", role: placedBy, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Customer,  ref: "ontology/concepts/customer/customer.yaml#concept", cardinality: "1" }
    join_rule: "v_contoso_order_line.CustomerKey = dim_contoso_customer.CustomerKey"
    realized_by: "data/references_served/v_contoso_order_line.yaml#references.v_contoso_order_line.CustomerKey__dim_contoso_customer.CustomerKey"
    verified_by: "evidence/edge_measurements.json#order_line__placed_by__customer"
    notes: >-
      THE BUSINESS RELATIONSHIP: this line was placed BY this customer. MEASURED, cited not retyped
      (reference id in realized_by): cardinality child many : parent one; participation child
      MANDATORY, parent OPTIONAL; inclusion 1.0 over 223 974 non-null child rows with 0 orphan rows;
      max_parent_rows_per_value 1, which is why the `to` end is "1" and not "0..1". The `from` end is
      "0..N" and not "1..N" BECAUSE THE PARTICIPATION WAS MEASURED: parent_coverage 0.497085 — 52 189
      of 104 990 customers appear on a line and 52 801 DO NOT. A customer who never bought is a real
      customer, so "customers with no orders" is an answerable question across this edge and a naive
      inner join answers a different one. DQ-CUSTOMER-02 still governs the far end: the served
      customer row is an untreated quasi-identifier, so this edge may be traversed to AGGREGATE and
      must not be used to group by ZipCode.
    confidence: I

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  - edge_id: order_line__sells__product
    level: physical
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: OrderLine, ref: "ontology/concepts/order/order_line.yaml#concept", role: sells, cardinality: "1..N" }
      to:   { source: CONTOSO, concept: Product,   ref: "ontology/concepts/catalog/product.yaml#concept", cardinality: "1" }
    join_rule: "v_contoso_order_line.ProductKey = dim_contoso_product.ProductKey"
    realized_by: "data/references_served/v_contoso_order_line.yaml#references.v_contoso_order_line.ProductKey__dim_contoso_product.ProductKey"
    verified_by: "evidence/edge_measurements.json#order_line__sells__product"
    notes: >-
      THE BUSINESS RELATIONSHIP: this line sells this product, in the quantity and at the prices the
      line carries. MEASURED: child many : parent one; participation MANDATORY ON BOTH SIDES —
      parent_unreferenced 0, parent_coverage 1.0, all 2 517 catalogue products appear on at least one
      line — which is why this is the only edge in the file whose `from` end is "1..N". inclusion 1.0
      over 223 974 rows, 0 orphans, max_parent_rows_per_value 1.
      THE TRAP THIS EDGE DOES NOT SOLVE, stated so it is not read as solved: the product dimension
      carries its OWN Price and Cost, and they are NOT the line's. Measured over the join, 122 953 of
      223 974 lines disagree with the catalogue price (delta -799.99750 to +3748.50000) and the same
      122 953 disagree on cost. The sale's money is the fact's; the catalogue's is the product's.
      Product's rule `product.price.catalogue_is_not_the_sale` holds it.
    confidence: I

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  - edge_id: order_line__placed_at__store
    level: physical
    type: foreign_key
    endpoints:
      from: { source: CONTOSO, concept: OrderLine, ref: "ontology/concepts/order/order_line.yaml#concept", role: placedAt, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Store,     ref: "ontology/concepts/store/store.yaml#concept", cardinality: "1" }
