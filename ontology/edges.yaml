# WHAT IS STILL PLANNED HERE, NARROWED. Two of the four — the GeoArea pair — have had their BUSINESS
# relationship minted above (`customer__resides_in__geo_area`, `store__sited_in__geo_area`), because
# the area is served as a column of the customer and store rows and is answerable today by GROUP BY.
# What remains planned for those two is ONLY the physical realisation: a join to a geography relation
# that does not exist. The other two — the category pair — have no business edge and must not get one:
# ProductCategory and ProductSubcategory declare `members.over: Product`, which is containment and
# lives on the concept (FRAMEWORK.md §7, cookbook C3(b)). Two different absences, kept distinct.
planned_edges:

  - edge_id: customer__located_in__geo_area
    status: planned
    business_relation_minted_as: "customer__resides_in__geo_area"   # the relationship IS declared; only the JOIN is missing
    blocked_by: "no served geography relation — NS-SERVING-01 fixes the warehouse at 8 base tables + 6 served views"
    measured_reference: "data/references_served/dim_contoso_customer.yaml"
    reference_id: "dim_contoso_customer.GeoAreaKey__?"   # the anchor is NOT written as `data/references_served/dim_contoso_customer.yaml#references_dangling.dim_contoso_customer.GeoAreaKey__?` because the
    # measurement's own id for a reference with no target ENDS IN `?`, and check_references'
