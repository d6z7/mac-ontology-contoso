- edge: order__converts_at__exchange_rate
  means: 'THE PREDICATE IS DECLARED, AND THE `1` IS MEASURED — operator-approved 2026-10-08. A rate is picked by the order''s
    day, the sale''s currency as the target, and the currency the amounts are in as the source: that triple returns exactly
    one rate per sales line, which is what `cardinality: ''1''` asserts; on the currency alone the join fans out to one
    rate per quoted day. The source side is the column `unit_currency` (USD on every line, made by the transform), not a
    constant written into this join, because an edge joins on columns (grammar v3); the join picks the same rate for every
    line as the constant did (evidence/v3-migration/). The source currency is the amounts'' declared unit (`net_amount.offers.aggregate.unit`),
    confirmed in acceptance/verification/manual_value_check_2026-10-08.md — the sale''s `currency_code` is the currency
    transacted in, not the unit of the figure. This edge converts USD amounts OUT to a local currency on request; it is
    never the way to "get USD". The business rule is Order.rate_on_order_date.'
  from: Order
  to: ExchangeRate
  columns:
    order_date: date_day
    currency_code: to_currency
    unit_currency: from_currency
- edge: customer__based_in__country
  means: 'Every customer carries a real country code and none carries the placeholder `--`, which marks the online channel.
    PARENT OPTIONAL, hence `0..N` and not `1..N`: a country with no customer exists, and check_edge_claims_proved refused
    the stronger claim (2026-09-30).'
  from: Customer
  to: Country
  columns:
    country_code: country_code
- edge: store__trades_in__country
  means: Every store row carries a country code and every code has a store, mandatory both ways — the store table is where
    the country set comes from, the online row's `--` included.
  from: Store
  to: Country
  columns:
    country_code: country_code
- edge: location__in__country
  means: Every location carries a country code and every code has a location, mandatory both ways. Location keeps its own
    `country_name` column, which is the SAME fact one hop closer; the name's home is Country.
  from: Location
  to: Country
  columns:
    country_code: country_code
- edge: order__attributed_to__country
  from: Order
  to: Country
  columns:
    sale_country_code: country_code
- edge: store__sited_in__location
  means: Every location has at least one store row and every store row stands at a location, mandatory both ways.
  from: Store
  to: Location
  columns:
    store_code: location_code
- edge: exchange_rate__quotes_from__currency
  from: ExchangeRate
  to: Currency
  columns:
    from_currency: currency_code
- edge: exchange_rate__quotes_to__currency
  means: Two edges to Currency because the pair is ORDERED and inverting it is wrong by the rate squared.
  from: ExchangeRate
  to: Currency
  columns:
    to_currency: currency_code
- edge: order__placed_by__customer
  from: Order
  to: Customer
  columns:
    customer_key: customer_key
- edge: order__placed_at__store
  from: Order
  to: Store
  columns:
    store_key: store_key
- edge: order__paid_in__currency
  from: Order
  to: Currency
  columns:
    currency_code: currency_code
- edge: order__of__product
  from: Order
  to: Product
  columns:
    product_key: product_key
