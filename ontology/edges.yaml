      THE BUSINESS RELATIONSHIP: this quote is FROM this currency — the base end of an ordered pair.
      MEASURED: 100 450 of 100 450 quote rows carry a FromCurrency, 0 nulls, 5 distinct codes, so the
      `to` end is "1".
      WHY THIS IS ONE OF TWO AND NEVER ONE OF ONE: the quote's identity is the composite
      (Date, FromCurrency, ToCurrency) — 100 450 rows / 100 450 distinct keys / 0 duplicates — and the
      cited rule holds that a quote is read with ALL THREE clauses or none. Measured cost of half a
      pair: constraining Date alone returns 25 quotes per line (5x5 complete grid), min 25 max 25 over
      all 223 974 lines, so a half-specified filter silently averages five currencies instead of
      failing. Two role-tagged edges make the pair structural in this layer instead of only in prose.
      THIS EDGE DOES NOT SAY WHICH END THE LINE'S CURRENCY IS. That is the unresolved-by-measurement
      half recorded in metadata.references_declined and RULED by
      `exchange_rate.direction.usd_base_as_of_order_date` plus decisions/0001-order-line-fact-of-record.md:
      FromCurrency is pinned to the literal 'USD'. Nothing here infers a direction from inclusion.
    confidence: I

  - edge_id: exchange_rate__quotes_to__currency
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: ExchangeRate, ref: "ontology/concepts/finance/exchange_rate.yaml#concept", role: quotesTo, cardinality: "0..N" }
      to:   { source: CONTOSO, concept: Currency,     ref: "ontology/concepts/finance/currency.yaml#concept", cardinality: "1" }
    realized_by: "v_contoso_fx_rate_day.ToCurrency"
    resolved_by: "ontology/concepts/finance/exchange_rate.yaml#contract.rules.exchange_rate.pair.never_half_a_pair"
    verified_by: "evidence/edge_measurements.json#exchange_rate__quotes_to__currency"
    notes: >-
      THE BUSINESS RELATIONSHIP: this quote is TO this currency — the quoted end of the ordered pair.
      MEASURED: 100 450 of 100 450 quote rows carry a ToCurrency, 0 nulls, 5 distinct codes, so the
      `to` end is "1". 20 090 of 100 450 rows are self-pairs (FromCurrency = ToCurrency) and are
      exactly 1.0, so this end and the previous one coincide on a fifth of the grid — one more reason
      a sample cannot tell the two apart and the direction must be cited rather than observed.
      THE ROLE IS THE WHOLE POINT, and it is the same shape as the calendar's two roles: one concept,
      two role-tagged edges, so a query must say which end it means. An un-roled ExchangeRate-Currency
      edge would be the classic silent error the framework's role_playing_dimension pattern names.
    confidence: I

  # ── The two DERIVED MEASURES, to the fact they are measured on ─────────────────────────────────
  # ONE edge each, not five each. See metadata.count_argument: the measure co-grounds on
  # v_contoso_order_line, so declaring this single relationship lets a traversal reach every dimension
  # through the fact's own physical edges, while repeating those five joins per measure would put one
  # predicate in three homes and no gate could catch the duplication.
  - edge_id: gross_sales_amount__measured_on__order_line
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: GrossSalesAmount, ref: "ontology/concepts/finance/gross_sales_amount.yaml#concept", role: measuredOn, cardinality: "1" }
      to:   { source: CONTOSO, concept: OrderLine,        ref: "ontology/concepts/order/order_line.yaml#concept", cardinality: "1" }
    realized_by: "v_contoso_order_line.UnitPrice; v_contoso_order_line.Quantity"
    resolved_by: "ontology/concepts/finance/gross_sales_amount.yaml#contract.rules.gross_sales_amount.derivation.quantity_times_unit_price"
    verified_by: "evidence/edge_measurements.json#gross_sales_amount__measured_on__order_line"
    notes: >-
      THE BUSINESS RELATIONSHIP: gross sales is MEASURED ON the order line and nowhere else. It is
      1:1 both ways — one gross amount per line, one line per amount — because the measure is computed
      per row at the declared grain (OrderKey, RowNumber) and only then folded.
      MEASURED: both inputs are present on every row — 223 974 of 223 974 lines carry a non-null
      UnitPrice and 223 974 of 223 974 carry a non-null Quantity, 0 nulls either side — so the measure
      is defined on the whole fact and no line is silently skipped. The realisation declares BOTH
      clauses; mac_measure_edges counts the first and records the second as declared-but-not-measured
      rather than implying it counted both.
      WHY THIS IS AN EDGE AND NOT A RESTATEMENT OF THE GROUNDING. The grounding says which relation
      the measure binds. This says the measure stands in a relationship to the FACT CONCEPT, which is
      what a traversal follows: GrossSalesAmount -> OrderLine -> {Customer, Product, Store,
      CalendarDay, ExchangeRate}, two hops to every declared axis, no probe. Before it, the measures
      were reachable only by reading metadata.count_argument.
      THE FORMULA IS NOT HERE. It has one home — ontology/rules.yaml#rules.gross_sales_amount — and
      the cited concept rule holds the PROHIBITION (never SUM(price) x SUM(qty)). This edge cites both
      and restates neither.
    confidence: I

  - edge_id: net_sales_amount__measured_on__order_line
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: NetSalesAmount, ref: "ontology/concepts/finance/net_sales_amount.yaml#concept", role: measuredOn, cardinality: "1" }
      to:   { source: CONTOSO, concept: OrderLine,      ref: "ontology/concepts/order/order_line.yaml#concept", cardinality: "1" }
    realized_by: "v_contoso_order_line.NetPrice; v_contoso_order_line.Quantity"
    resolved_by: "ontology/concepts/finance/net_sales_amount.yaml#contract.rules.net_sales_amount.derivation.quantity_times_net_price"
    verified_by: "evidence/edge_measurements.json#net_sales_amount__measured_on__order_line"
    notes: >-
      THE BUSINESS RELATIONSHIP: net sales is MEASURED ON the order line, 1:1 both ways, for the same
      reason as gross.
      MEASURED: 223 974 of 223 974 lines carry a non-null NetPrice and 223 974 of 223 974 a non-null
      Quantity, 0 nulls either side.
      THIS IS THE DEFAULT MEASURE OF THE BUNDLE, so this is the edge a bare "total sales" traverses.
      The disclosure that makes that safe is held once, on the concept
      (`net_sales_amount.ambiguity.gross_or_net`): net and gross differ on 136 913 of 223 974 lines, a
      13 787 071.00 gap, so the reading is stated with the figure rather than assumed. Not restated
      here, and this edge carries no preference of its own.
    confidence: I

  # ── ADR-006 Phase 2: edges for new concepts (2026-09-22) ──────────────────────────────

  - edge_id: product__has__color
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: Product, ref: "ontology/concepts/catalog/product.yaml#concept", role: hasColor, cardinality: "1" }
      to:   { source: CONTOSO, concept: Color, ref: "ontology/concepts/catalog/color.yaml#concept", cardinality: "0..N" }
    realized_by: "dim_contoso_product.Color"
    resolved_by: "ontology/concepts/catalog/color.yaml#contract.rules.color.resolution.by_register"
    notes: >-
      Same table (dim_contoso_product). Color is a dimension column on every product row.
      16 cleansed values. No join_rule — the planner uses the same-table shortcut.
    confidence: I

  - edge_id: product__has__brand
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: Product, ref: "ontology/concepts/catalog/product.yaml#concept", role: hasBrand, cardinality: "1" }
      to:   { source: CONTOSO, concept: Brand, ref: "ontology/concepts/catalog/brand.yaml#concept", cardinality: "0..N" }
    realized_by: "dim_contoso_product.Brand"
    resolved_by: "ontology/concepts/catalog/brand.yaml#contract.rules.brand.resolution.by_register"
    notes: >-
      Same table (dim_contoso_product). Brand is a dimension column on every product row —
      11 measured values, 0 nulls over 2 517 rows, so the partition is total and every product
      belongs to exactly one brand. No join_rule — the planner uses the same-table shortcut,
      exactly as for Color.

      THIS EDGE IS WHAT MAKES A BRAND FIGURE REACHABLE. The brand concept already said it, in
      prose: "THE BRAND REACHES THE FACT THROUGH THE PRODUCT AND ONLY THROUGH IT. The order
      line carries no brand column, so a brand figure is the product join followed by a group."
      Said only in prose, no planner could walk it: a graph search for NetSalesAmount -> Brand
      found no path and refused, and with it every "by brand" question the bundle was chosen
      for. Declaring the hop machine-readably is the whole of the fix; nothing about the
      grouping's own declaration changes.
    confidence: I

  - edge_id: quantity_sold__measured_on__order_line
    level: business
    type: shared_attribute
    endpoints:
      from: { source: CONTOSO, concept: QuantitySold, ref: "ontology/concepts/finance/quantity_sold.yaml#concept", role: measuredOn, cardinality: "1" }
      to:   { source: CONTOSO, concept: OrderLine, ref: "ontology/concepts/order/order_line.yaml#concept", cardinality: "1" }
    realized_by: "v_contoso_order_line.Quantity"
    resolved_by: "ontology/rules.yaml#rules.quantity_sold"
    notes: >-
      QuantitySold = SUM(Quantity) over the order lines in scope. Derived via the
      quantity_sold rule, which declares over: [OrderLine].
    confidence: I

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# PLANNED — the four DANGLING measured references. Each is a real relationship the warehouse implies
# and this ontology cannot wire AS A JOIN, because the parent relation is not served. Recorded with
# its PRECONDITION so the next operator neither re-derives it nor invents the missing relation. These
# are NOT edges and nothing may traverse them.
