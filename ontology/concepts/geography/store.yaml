# CONTOSO (demo) > geography > Store
# The market/where axis. NOTE the data-quality quirk: 'Online' appears as a CountryName next to real
# countries — it is a channel, not a market.

metadata:
  concept: Store
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Store
  label: Store
  class: reference                # a dimension entity sales point at
  identity:
    kind: fk_name
    canonical_key: StoreKey
  definition: >
    A point of sale, identified by StoreKey, located in a CountryName. NOTE: 'Online' appears as a
    CountryName alongside real countries (Germany, France, ...) — it is a sales CHANNEL, not a market.
    Treat it as such and disclose when it is included in a by-country breakdown.
  semantics:
    purpose: "The axis that says WHERE a sale happened — the market/country slice."

properties:
  - { name: StoreKey,    type: integer, required: true,  doc: "identity key" }
  - { name: CountryName, type: string,  required: false, doc: "country ('Online' = a channel, not a market)" }
  - { name: State,       type: string,  required: false, doc: "state/region within the country" }

grounding:
  sources:
    - relation: store
      key: StoreKey
      columns: [CountryName, State]
  grain: "one row per store"

contract:
  rules:
    - id: store.online_is_not_a_market
      kind: mac.rule_kind.exclusion
      when: "producing a sales-by-country / by-market breakdown"
      then: "treat CountryName='Online' as a CHANNEL, not a country: separate it out and disclose, or exclude with a note"
      never: "silently listing 'Online' as a country peer of Germany, France, etc."
      why: "'Online' is a sales channel that appears in the country column — a known data-quality quirk"
      binds: [CountryName]

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
