open_questions:
  - id: GA-Q1
    topic: register coverage
    question: >-
      Should data/lookups/contoso_geo_area.lookup.csv be re-cut as the UNION of the customer and
      store region sets, so the three store-only regions resolve through the register like every
      other? That is a P6 change, not a concept change, and it would retire the declared-gap rule
      above.
    status: OPEN
    owner_for_resolution: operator
  - id: GA-Q2
    topic: what a region is
    question: >-
      The 608 keys mix states, provinces, territories and counties across 8 countries. Is "region"
      one axis, or does a comparison across countries need a level that does not exist here?
    status: OPEN
    owner_for_resolution: operator
