# CONTOSO (demo) > catalog > Product
# The dimension that says WHAT was sold. Order lines reference products; products carry a Brand and
# roll up Category -> SubCategory.

metadata:
  concept: Product
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Product
  label: Product
  class: reference                # a dimension entity, identified by a key, that sales point at
  identity:
    kind: fk_name
    canonical_key: ProductKey
  definition: >
    A sellable item in the Contoso catalogue, identified by ProductKey (ProductCode is the business
    code). Every product belongs to exactly one Brand and one Category -> SubCategory. Order lines
    reference products so sales can be sliced by product, brand, or category.
  semantics:
    purpose: >
      The join from an order line to a name, brand, price and category — the axis that lets revenue be
      sliced by product or rolled up by brand/category.

properties:
  - { name: ProductKey,      type: integer, required: true,  doc: "identity key" }
  - { name: ProductCode,     type: string,  required: false, doc: "business product code" }
  - { name: ProductName,     type: string,  required: true,  doc: "display name" }
  - { name: Brand,           type: string,  required: true,  doc: "brand — see the Brand enumeration" }
  - { name: CategoryName,    type: string,  required: false, doc: "category" }
  - { name: SubCategoryName, type: string,  required: false, doc: "subcategory" }
  - { name: Price,           type: number,  required: false, doc: "list price per unit" }

grounding:
  sources:
    - relation: product
      key: ProductKey
      columns: [ProductCode, ProductName, Brand, CategoryName, SubCategoryName, Price]
  grain: "one row per product"

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
