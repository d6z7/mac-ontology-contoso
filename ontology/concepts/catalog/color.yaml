# CONTOSO > catalog > Color — the product colour enumeration.

metadata:
  concept: Color
  source: CONTOSO
  version: '1.0'
  schema_version: 0.1.14
  status: draft
  owner: operator
  confidence: I
  provenance: authored

concept:
  name: Color
  label: Color
  class: enumeration
  identity:
    kind: fk_name
    canonical_key: Color
    note: >-
      16 cleansed values over 2,517 products. fk_name (not code) because Color is not a
      discriminator on a tall table — it's a simple attribute on each product row.
  definition: >-
    The product colour, cleansed by the transform from 17 landing spellings to 16 served
    values (Blue collapsed from two spellings). A closed enumeration: every product carries
    exactly one colour.
  semantics:
    purpose: >-
      A categorical axis for product analysis — revenue by colour, product count by colour.

grounding:
  kind: sql_table
  grain: "one row = one product — ProductKey; Color is one attribute of the product"
  sources:
    - relation: dim_contoso_product
      key: ProductKey
      columns: [ProductKey, Color]
  field_roles:
    ProductKey: contoso.field_role.key
    Color: contoso.field_role.dimension

values:
  closure: closed
  closure_why: >-
    ENUMERATED FROM THE SERVED COLUMN, AND THE MEMBER LIST IS DELEGATED RATHER THAN COPIED.
    Measured over dim_contoso_product: 16 distinct cleansed values of `Color`, one per product
    row, 0 nulls — so every product carries exactly one colour and the 16 members are the whole
    served set.

    `items:` IS DELIBERATELY ABSENT, for the reason StoreStatus gives: the value domain is the
    register data/lookups/contoso_color.lookup.csv, cut from the served plane and bound below
    through mac.canon.enum_from_register, so the 16 codes, their labels and their search keys
    have ONE home and move together when the register is re-cut. Re-listing them here would be
    a second home for a fact the register holds.
  realized_by:
    udf: mac.canon.enum_from_register
    params:
      register: contoso_color.lookup.csv
      key_column: Color

contract:
  default_reading: >-
    A question naming a colour resolves through data/lookups/contoso_color.lookup.csv
    on search_key to the cleansed spelling.
  rules:
    - id: color.resolution.by_register
      kind: mac.rule_kind.resolution
      subject: Resolve a colour word through the offline register
      when: "a question names a colour"
      then: >-
        resolve through data/lookups/contoso_color.lookup.csv on search_key to the Color value
      never: >-
        guessing a colour spelling — the register has all 16
      binds: [Color]
      confidence: P
      realized_by:
        udf: mac.canon.resolve_by_register
        params:
          thing: color
          code: Color
          register: data/lookups/contoso_color.lookup.csv
          search: search_key
          display_label: label

governance:
  owner: operator
  last_reviewed: 2026-09-22
  change_log:
