# CONTOSO (demo) > catalog > Brand
# The multi-brand axis — a closed vocabulary of the 11 Contoso house brands a product can belong to.

metadata:
  concept: Brand
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Brand
  label: Brand
  class: enumeration              # the controlled vocabulary of house brands
  identity:
    kind: code
  definition: >
    The set of 11 Contoso house brands a product belongs to (product.Brand). A closed set — a twelfth
    would be a portfolio change, not an undocumented value.
  semantics:
    purpose: >
      Gives the brands stable codes so "sales by brand" uses one agreed vocabulary rather than ad-hoc
      string matching.

values:
  closure: closed
  closure_why: >
    Contoso ships exactly these 11 brands — the domain of the product catalogue's Brand column.
    The register data/lookups/brands.lookup.csv is the single source of truth (no inline copy to drift against).
  realized_by:
    udf: mac.canon.enum_from_register
    applied_as: value_domain
    params:
      register: brands.lookup        # -> data/lookups/brands.lookup.csv  (code,label)
      key_column: code

grounding:
  sources:
    - relation: product
      key: ProductKey
      columns: [Brand]
  grain: "the Brand column of product (11 brands)"

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
