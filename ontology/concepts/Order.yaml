concept: Order
means: One customer's purchase on one date, counted by distinct `order_key` over the line relation. It is also THE FACT
  NODE of the sales line, one row per order line - every money and quantity measure (net, gross, cost, discount, margin,
  units, and the per-unit prices) is a column it serves, and every edge from the sale to a dimension starts here. The account
  is pages/knowledge/order.md.
table: v_contoso5_sales_line
serves:
  - order_key
  - line_number
  - order_date
  - delivery_date
  - customer_key
  - store_key
  - is_web_sale
  - product_key
  - currency_code
  - quantity
  - net_amount
  - gross_amount
  - cost_amount
  - discount_amount
  - margin_amount
  - unit_price
  - net_price
  - unit_cost
counts:
  - order_key
