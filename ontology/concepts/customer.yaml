metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Customer
  class: entity
  definition: >-
    A person on Contoso's customer register, each with a name, a birth date and a place — continent,
    country, state, city. The register is not the buyer list: many registered customers have never
    ordered (rule Customer.register_not_buyers). The account is knowledge/customer.md.
grounding:
  # The column facts live on the relation (v0.1.20): ontology/relations/dim_customer.yaml.
  bindings:
    - relation: dim_customer
      serves: [customer_key, customer_name, continent, country_code, state, city, gender,
               birth_date, valid_from, valid_to]
# 0.3.1 (RULED-2026-10-29): this concept's ruled choices, one reading set each. Each set's `rule`
# names the rule file in ontology/rules/ that states it in words and carries its history.
readings:
  population:
    rule: Customer.active_on_the_reference_date
    takes: [as_of]
    confidence: C
    default: active
    active:
      where: [valid_from <= @as_of, valid_to >= @as_of]
      surfaces: [active, current, valid, active customers, current customers]
    registered:
      where: all
      surfaces: [registered, on the register, registered customers, all customers, ever registered]
governance:
  owner: operator
  last_reviewed: '2026-10-29'
