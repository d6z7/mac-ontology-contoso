metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Customer
  class: entity
  definition: 'A person on Contoso''s customer register: 104,990 of them, each with a name, a birth date
    and a place — continent, country, state, city. HALF HAVE NEVER ORDERED: 52,189 of the 104,990 appear
    on a sale, so the register is not the buyer list. The account is knowledge/customer.md.'
grounding:
  # The column facts live on the relation (v0.1.20): ontology/relations/dim_customer.yaml.
  bindings:
    - relation: dim_customer
      serves: [customer_key, customer_name, continent, country_code, state, city, gender,
               birth_date, valid_from, valid_to]
governance:
  owner: operator
  last_reviewed: '2026-09-29'
