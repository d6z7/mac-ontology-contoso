metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Store
  class: entity
  definition: >-
    THE PREMISES Contoso sells from — a shop that stood on one place for one trading period, with its
    own name, floor area, opening date and closing date. It is what every sale is recorded against.

    A PLACE MAY HOLD A SUCCESSION OF PREMISES, so a store is NOT its place: see the Location concept
    for the place, and `dim_store.store_key#rulings.finer_than` for the declaration that one rolls up
    into the other. The account is knowledge/store.md.

    THIS DEFINITION CARRIES NO COUNTS, by the operator's ruling of 2026-10-24: "you are disclosing
    values that variy through the time as constnts?!?!?! this is no go ... you can decribe things
    without constants too". It used to say how many stores there were and how many were trading,
    which was a measurement of one day frozen into a sentence — and it disagreed with this concept's
    own `counts:` key, which is how one word came to name two grains. Counts belong where they can
    be re-measured: data/profiles/dim_store.yaml.
grounding:
  # THE COLUMN FACTS LIVE ON THE RELATION (v0.1.20): ontology/relations/dim_store.yaml. What stays
  # here is what is Store's rather than dim_store's — which columns it exposes and in what order a
  # reader should meet them, and what ONE STORE IS.
  bindings:
    - relation: dim_store
      # THE ORDER A READER MEETS THEM, which is the one thing `serves` carries that the relation
      # file cannot: identity first, then the join, then the name, then where it is, then when it
      # traded, then how big it is. `store_key` is served because the relation's key names it — a
      # key column the concept does not serve is a load error, and Order failed exactly that way
      # on `line_number` when the sales line migrated.
      serves: [store_key, store_code, store_name, country_code, state,
               open_date, close_date, status_annotation, square_metres]
      # A STORE IS THE PREMISES, SO IT IS COUNTED BY `store_key` — ruled by the operator 2026-10-24:
      # "a Store is a PLACE on one location you can shop at ... store is part of location".
      #
      # THIS SAID THE OPPOSITE UNTIL TODAY. It read "ONE STORE IS A LOCATION, NOT A ROW" and counted
      # `location_code`, which made Store and Location the same cardinality — two concepts, one
      # grain, and no way to ask about either without the other's answer being possible. The data
      # plane never agreed with it: `dim_store.sql` says "A UNIT IS NOT A SITE", the sales line says
      # `store_key -- FK -> dim_store (the UNIT, never the site)`, and every revenue figure in the
      # bundle hangs off the premises. The ontology was the only plane claiming otherwise.
      #
      # WHAT THE TWO GRAINS NOW ARE, each with a home: the PREMISES is `store_key` here, and the
      # PLACE is the Location concept over `dim_location`. `dim_store.store_key` declares
      # `finer_than: location_code`, whose vocabulary definition carries the clause that was missing
      # from every store answer — "an answer must DISCLOSE which level it used".
      #
      # WHAT THIS MOVES, named so neither reads as a regression: "How many stores are closed?"
      # (RC08) becomes the count of closed PREMISES, not of places that have ever had one — the
      # walk answered it that way and was graded wrong twice. And "How many store versions are
      # currently active?" (STORE-15) loses its subject: a row IS a store now, so "version" names
      # nothing and that question is "How many stores do we have?" asked twice.
      counts: store_key
  snapshot_rule: 'Nothing is collapsed: once the `active` population has selected the trading rows there
    is one row per store already — 57 rows over 57 location codes, because a location has at most one
    store with no close date. Why, and the collapse this replaced, is in knowledge/store.md.'
# 0.3.1 (RULED-2026-10-29): this concept's ruled choices, one reading set each. Each set's `rule`
# names the rule file in ontology/rules/ that states it in words and carries its history.
readings:
  channel:
    rule: Store.channel
    selects: rows
    confidence: P
    applies: subject
    default: physical
    physical:
      where: [store_code != -1]
    online:
      where: [store_code = -1]
  trading:
    rule: Store.trading
    selects: rows
    confidence: C
    applies: subject
    default: active
    closed:
      where: [close_date is not null]
      surfaces: [ceased, no longer trading, not active, inactive]
    active:
      not: closed
      surfaces: [open, still open, trading, not closed, operating]
    shut:
      of: closed
      where: [status_annotation = Closed]
      surfaces: [shut down, shut for good, closed permanently, closed and not replaced]
    restructured:
      of: closed
      where: [status_annotation = Restructured]
      surfaces: [rebuilt, replaced, closed and reopened]
governance:
  owner: operator
  last_reviewed: '2026-09-30'
