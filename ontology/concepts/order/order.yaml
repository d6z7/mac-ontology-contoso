# CONTOSO (demo) > order > Order
# The order header — present so the double-count trap is explicit: `sales` == orders x orderrows.

metadata:
  concept: Order
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Order
  label: Order
  class: entity                   # a business object identified by a key
  identity:
    kind: code
    canonical_key: OrderKey
  definition: >
    An order header (one row per OrderKey in `orders`), whose detail lines live in `orderrows`. The
    denormalized `sales` table is `orders` joined to `orderrows` — the SAME facts in two shapes, which
    is why sales must be summed from one form or the other, never both (see Sales >
    sales.no_double_count_header_detail).
  semantics:
    purpose: "The header that anchors the header/detail vs denormalized double-count caution."

grounding:
  sources:
    - relation: orders
      key: OrderKey
      columns: [CustomerKey, StoreKey, DT, DeliveryDate, CurrencyCode]
  grain: "one row per order header"

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
