concept:
  name: Color
  label: Colour
  class: enumeration
  definition: >-
    The colour a product comes in — the one attribute that on its own makes a new SKU: "E400 Green"
    and "E400 Orange" are different products. The account is knowledge/color.md.
grounding:
  bindings:
    - relation: dim_product
      serves: [color, product_key]
      # 16 colours over 2517 product rows. See brand.yaml for why this is `counts` and not
      # a second `key` on a relation that already has one.
      counts: color
governance:
  owner: operator
  last_reviewed: '2026-09-30'
