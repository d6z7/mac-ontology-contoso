metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: ProductCategory
  label: Product Category
  class: enumeration
  definition: >-
    How Contoso groups what it sells: categories, each over several sub-categories, both carried as
    names on the product row (rule ProductCategory.level). The account is
    knowledge/product_category.md.
grounding:
  bindings:
    - relation: dim_product
      serves: [category_name, sub_category_name, product_key]
      # 8 categories over 2517 product rows. The 32 sub-categories roll up into them
      # cleanly, which the relation declares on `sub_category_name` as `finer_than`.
      counts: category_name
# 0.3.1 (RULED-2026-10-29): this concept's ruled choices, one reading set each. Each set's `rule`
# names the rule file in ontology/rules/ that states it in words and carries its history.
readings:
  level:
    rule: ProductCategory.level
    selects: column
    confidence: P
    default: category
    category:
      column: category_name
      surfaces: [category, categories, product category, product categories]
    sub_category:
      column: sub_category_name
      surfaces: [sub category, sub-category, subcategories, sub-categories]
governance:
  owner: operator
  last_reviewed: '2026-09-29'
