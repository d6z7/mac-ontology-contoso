metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: ProductCategory
  label: Product Category
  class: enumeration
  definition: 'How Contoso groups what it sells: eight categories, each over several of thirty-two sub-categories,
    both carried as names on the product row. The account is knowledge/product_category.md.'
grounding:
  bindings:
    - relation: dim_product
      serves: [category_name, sub_category_name, product_key]
      # 8 categories over 2517 product rows. The 32 sub-categories roll up into them
      # cleanly, which the relation declares on `sub_category_name` as `finer_than`.
      counts: category_name
# 0.3.1 (RULED-2026-10-29): this concept's ruled choices, one reading set each. The words, the
# rulings and the history are in ontology/rules/<Concept>.<set>.yaml — the same id.
readings:
  level:
    selects: column
    confidence: P
    default: category
    category:
      column: category_name
      surfaces: [category, categories, product category, product categories]
    sub_category:
      column: sub_category_name
      surfaces: [sub category, sub-category, subcategories, sub-categories]
governance:
  owner: operator
  last_reviewed: '2026-09-29'
