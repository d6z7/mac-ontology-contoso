metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Brand
  class: enumeration
  definition: 'Whose name a product is sold under: eleven names, carried as a column on the product row
    with no table and no key of their own. The account is knowledge/brand.md.'
grounding:
  bindings:
    - relation: dim_product
      serves: [brand, product_key]
      # `counts`, where a KEY was declared. Brand said `key: brand` on a relation grained
      # one row per PRODUCT, which is not Brand's grain and never was. The relation states
      # its own key once; this says what ONE BRAND is -- one distinct `brand` value, 11 of
      # them over 2517 product rows, which is what COUNT(DISTINCT) has to count.
      counts: brand
# The rules ABOUT this concept, by id (ontology/rules/<id>.yaml) — the one home of the link
# (2026-10-29); a rule names no concepts. Its own first, then rules owned elsewhere.
rules:
  - Brand.not_manufacturer
governance:
  owner: operator
  last_reviewed: '2026-09-29'
