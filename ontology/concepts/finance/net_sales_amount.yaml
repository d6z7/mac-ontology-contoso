open_questions:
  - id: NSA-Q1
    topic: margin
    question: >-
      Should a margin measure be declared over the served UnitCost? Cost is on the row and nothing
      reads it, so "profit" currently gets no answer and no refusal.
    status: OPEN
    owner_for_resolution: operator
  - id: NSA-Q2
    topic: date role
    question: >-
      Is OrderDate the right default period axis for a sales figure, or should a delivered-basis
      reading exist alongside it? Both roles are served and 130 424 of 223 974 lines carry the same
      date, so the choice is invisible on more than half the fact.
    status: OPEN
    owner_for_resolution: operator
