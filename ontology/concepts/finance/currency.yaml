# CONTOSO (demo) > finance > Currency
# The currency axis — the reason "total sales" is contested. A line's CurrencyCode is the store's local
# currency; totals across currencies must be converted to one base before summing.

metadata:
  concept: Currency
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Currency
  label: Currency
  class: enumeration              # the closed set of transaction currencies
  identity:
    kind: code
  definition: >
    The transaction/reporting currencies present in the sales facts. A sales line's CurrencyCode is the
    store's local currency. Sales summed across currencies are meaningless unless first converted to a
    single base currency (via the line's ExchangeRate). See Sales > sales.single_currency_basis.
  semantics:
    purpose: >
      Names the currency dimension so a "total" is never computed by adding incompatible units.

values:
  closure: closed
  closure_why: >
    Contoso stores transact in exactly these five currencies — the domain of sales.CurrencyCode.
    The register data/lookups/currencies.lookup.csv is the single source of truth.
  realized_by:
    udf: mac.canon.enum_from_register
    applied_as: value_domain
    params:
      register: currencies.lookup    # -> data/lookups/currencies.lookup.csv  (code,label)
      key_column: code

grounding:
  sources:
    - relation: sales
      key: CurrencyCode
      columns: [CurrencyCode]
  grain: "the CurrencyCode column of sales (5 currencies)"

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
