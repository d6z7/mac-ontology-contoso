        measure, so the renderable template now exists once, in ontology/rules.yaml, where a template
        can be executed, diffed and linted. Executed as written on 2026-09-18: 232 601 542.66,
        reproducing queries/p8_measure_semantics.sql#B3 to the cent.
      change_type: REFACTOR
      by: operator

open_questions:
  - id: GSA-Q1
    topic: reporting currency
    question: >-
      Is there a reporting currency this bundle should convert to by default, or must every
      multi-currency figure name its own? No default is declared, so today a cross-currency total
      has to state its conversion.
    status: OPEN
    owner_for_resolution: operator
