        data/lookups/contoso_measure.lookup.csv was already projected from; no additivity written.
      change_type: CREATION
      by: operator
    - date: 2026-09-18
      change: >-
        P9: `derived_by_rule: gross_sales_amount` added and the derivation rule's `then` rewritten to
