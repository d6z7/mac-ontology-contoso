metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Currency
  class: enumeration
  definition: 'The money a sale is denominated in: five ISO codes, pointed at by every sale and by both
    ends of every exchange rate. The account is knowledge/currency.md.'
grounding:
# The column facts live on the relation (v0.1.20): ontology/relations/dim_currency.yaml.
  bindings:
    - relation: dim_currency
      serves: [currency_code]
# THIS CONCEPT STATES NO RULE, and the `contract:` block is therefore absent rather than empty.
# A `rules:` key with nothing under it parses as null, which the schema refuses, correctly: an
# empty list is not a declaration of nothing, it is a declaration that failed to be written.
#
# RETIRED 2026-10-25, AS A MEASURED RESTATEMENT, and the fact it stated is not lost.
#
# IT SAID: the amounts are USD, so filtering `currency_code` does not re-denominate them; a
# question asked in a named currency is converted through ExchangeRate at each sale's own order
# date. TWO DECLARATIONS ALREADY CARRY THAT, and both are the column's own:
#   v_contoso5_sales_line.net_amount    `offers.aggregate.unit: USD` — the unit, full stop,
#                                       which no filter on another column can change
#   v_contoso5_sales_line.currency_code `offers.axis: categorical` — a legitimate axis to group
#                                       and filter by, and nothing more
# The conversion itself is ExchangeRate's, where `exchange_rate.aggregation.convert_per_day_never
# _average` and `order.resolution.rate_on_order_date` are bound to canons and enforced.
#
# WHY RETIRED RATHER THAN BOUND: no canon in the registry says "filtering this axis does not
# change that measure's unit", and writing one would state a third time what `unit: USD` says
# once. A rule restating a column declaration is the second home this estate exists to refuse.
governance:
  owner: operator
  last_reviewed: '2026-09-29'
