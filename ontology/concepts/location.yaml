metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.0-develop'
  confidence: I
  provenance: authored
concept:
  name: Location
  class: entity
  definition: >-
    THE PLACE a store stands on — a country and a state, and nothing that belongs to the shop itself.
    Floor area, opening and closing dates are properties of PREMISES and live on Store; what a place
    owns is where it is.

    ONE PLACE MAY HOLD A SUCCESSION OF PREMISES over time, which is the fact this concept exists to
    keep separate from Store: `dim_store.store_key` declares `finer_than: location_code`, so premises
    roll UP into a place and a place never divides down into one. Summing a per-premises measure over
    a place that has been re-let counts it once per tenancy.

    A PLACE IS NOT A CITY IN THIS BUNDLE. Its finest geography is `state`, which in France means
    regions and overseas territories; `main.store` carries no city or town column. City exists only
    on the customer, as where a customer lives, and is declared personally identifying.

    No counts here, by the ruling of 2026-10-24 — they belong in data/profiles/dim_location.yaml
    where they can be re-measured. The account is knowledge/location.md.
grounding:
  # The column facts live on the relation (v0.1.20): ontology/relations/dim_location.yaml.
  bindings:
    - relation: dim_location
      serves: [location_code, country_code, country_name, state, units_ever_here]
contract:
  rules:
  - id: location.exclusion.the_online_row_is_not_a_place
    kind: mac.concept.rule.exclusion
    confidence: P
    scope: CONTOSO5
    binds:
    - location_code
    realized_by:
    - udf: mac.canon.population_select
      params:
        default: physical
        populations:
          physical:
            all:
            - column: location_code
              op: ne
              value: -1
          online:
            all:
            - column: location_code
              op: eq
              value: -1
governance:
  owner: operator
  last_reviewed: '2026-09-29'
