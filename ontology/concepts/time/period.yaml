# CONTOSO (demo) > time > Period
# The WHEN axis. Added in v2 to CLOSE the question-grammar gap: the order date was always a column on
# the `sales` fact (OrderDate), but the ontology never named it as an axis — so "slice by period" was
# promised by the decision policy (period.window) yet absent from the generated grammar. The gap was
# missing MEANING, not missing data. This concept declares the axis.

metadata:
  concept: Period
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Period
  label: Period
  class: reference                # a dimension the total is grouped by — here, time
  identity:
    kind: code
  definition: >
    The WHEN axis of a sale: the order date carried on each `sales` line (OrderDate), with DeliveryDate
    as a secondary date. Because the date is a native column on the fact, sales can be sliced or grouped
    by day and rolled up to month, quarter or year without a separate calendar table. "Period" with no
    stated window means the full available range, disclosed (see measure.period_resolution).
  semantics:
    purpose: >
      The axis that says WHEN a sale happened — the time slice the decision policy's period.window gate
      governs. Default reading uses OrderDate (the booking date), not DeliveryDate.

grounding:
  sources:
    - relation: sales
      key: OrderDate
      columns: [OrderDate, DeliveryDate]
  grain: "one day — rolls up to month / quarter / year"
  note: "OrderDate = order/booking date; DeliveryDate = fulfilment date. A period slice defaults to OrderDate."

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Added the Period axis — closes the question-grammar gap (period was policy-declared but unmodelled).", change_type: CREATION, by: demo-team }
