metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.0-develop'
  confidence: I
  provenance: authored
concept:
  name: ExchangeRate
  label: Exchange Rate
  class: measure
  definition: 'What one currency was worth in another on one day: 100,450 quoted rates over a date and
    an ordered pair of currencies. The account is knowledge/exchange_rate.md.'
grounding:
  # The column facts live on the relation (v0.1.20): ontology/relations/v_contoso5_fx_rate.yaml.
  bindings:
    - relation: v_contoso5_fx_rate
      serves: [date_day, from_currency, to_currency, rate]
contract:
  rules:
  - id: exchange_rate.aggregation.convert_per_day_never_average
    kind: mac.concept.rule.aggregation
    confidence: P
    scope: CONTOSO5
    binds:
    - rate
    realized_by:
    - udf: mac.canon.additivity_guard
      params:
        measure_column: rate
        axis_effects:
          time: mac.concept.aggregation_effect.average
          categorical: mac.concept.aggregation_effect.none
  - id: exchange_rate.exclusion.direction_is_part_of_the_key
    kind: mac.concept.rule.exclusion
    confidence: P
    scope: CONTOSO5
    binds:
    - from_currency
    - to_currency
    realized_by:
    - udf: mac.canon.composite_key_guard
      params:
        code_column: to_currency
        scope_columns:
        - from_currency
governance:
  owner: operator
  last_reviewed: '2026-09-29'
