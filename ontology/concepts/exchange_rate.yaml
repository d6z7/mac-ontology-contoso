metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: ExchangeRate
  label: Exchange Rate
  class: measure
  definition: >-
    What one currency was worth in another on one day: a quoted rate over a date and an ordered pair
    of currencies. The account is knowledge/exchange_rate.md.
grounding:
  # The column facts live on the relation (v0.1.20): ontology/relations/v_contoso5_fx_rate.yaml.
  bindings:
    - relation: v_contoso5_fx_rate
      serves: [date_day, from_currency, to_currency, rate]
# The rules ABOUT this concept, by id (ontology/rules/<id>.yaml) — the one home of the link
# (2026-10-29); a rule names no concepts. Its own first, then rules owned elsewhere.
rules:
  - ExchangeRate.convert_per_day
  - ExchangeRate.direction_is_part_of_the_key
  - Order.rate_on_order_date
governance:
  owner: operator
  last_reviewed: '2026-09-29'
