concept: Customer
means: 'A person on Contoso''s customer register, each with a name, a birth date and a place — continent, country, state,
  city. The register is not the buyer list: many registered customers have never ordered (rule Customer.register_not_buyers).
  The account is pages/knowledge/customer.md.'
table: dim_customer
serves:
  - customer_key
  - customer_name
  - continent
  - country_code
  - state
  - city
  - gender
  - birth_date
  - valid_from
  - valid_to
  - valid_end
