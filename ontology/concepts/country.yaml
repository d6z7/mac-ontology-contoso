metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Country
  class: enumeration
  definition: >-
    A country Contoso sells in. The placeholder code `--` is not a country: it marks rows with no
    real country, such as the online store (rule Country.rows). The account is knowledge/country.md.
grounding:
  # The column facts live on the relation (v0.1.20): ontology/relations/dim_country.yaml.
  bindings:
    - relation: dim_country
      serves: [country_code, country_name]
  note: >-
    one code per country as meant; a source spelling that duplicates another country is folded in
    the transform, and the placeholder `--` is not a country
# 0.3.1 (RULED-2026-10-29): this concept's ruled choices, one reading set each. Each set's `rule`
# names the rule file in ontology/rules/ that states it in words and carries its history.
readings:
  rows:
    rule: Country.rows
    selects: rows
    confidence: P
    default: real
    real:
      where: ["country_code != '--'"]
    sentinel:
      where: ["country_code = '--'"]
  whose:
    rule: Country.whose
    selects: path
    confidence: C
    default: territory
    territory:
      via: order__attributed_to__country
      surfaces: [country of the sale, where the sale was made, trade in, business in, market]
    store:
      via: store__trades_in__country
      surfaces: [store country, where we trade, trading country]
    customer:
      via: customer__based_in__country
      surfaces: [customer country, where our customers are, customer countries]
    location:
      via: location__in__country
      surfaces: [site country, location country]
governance:
  owner: operator
  last_reviewed: '2026-09-30'
