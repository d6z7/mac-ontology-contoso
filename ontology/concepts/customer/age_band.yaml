# CONTOSO > customer > AgeBand — the ONLY form in which age reaches the served plane, and a
# deliberate loss of precision.
#
# DQ-CUSTOMER-01 (accepted, ruled_by operator): age is served ONLY as `age_band_5y`, as of a
# declared date, NEVER as a year. Single-year age is deliberately unanswerable from the served
# plane. The delivery's own `Age` column is refused (as-of 2020/2021 on 104 990 of 104 990 rows) and
# `Birthday` is consumed to derive this band without ever being served.

metadata:
  concept: AgeBand
  source: CONTOSO
  version: '1.0'
  schema_version: 0.1.14
  status: draft
  owner: operator
  confidence: I
  provenance: authored

concept:
  name: AgeBand
  label: Age Band
  class: enumeration
  identity:
    kind: code
    canonical_key: age_band_5y
    note: >-
      The code IS the band's LOWER BOUND as an integer, so it sorts and compares as an age: 40 means
      "40 to 44 inclusive". Not a label string, deliberately — a reader who sorts the axis gets age
      order for free.
  definition: >-
    A customer's age in whole years, floored to a 5-year band and named by the band's lower bound,
    computed from the unserved `Birthday` AS OF 2025-12-31. Fifteen bands, 20 through 90.

    IT IS NOT AN AGE. The integer 40 is a band of five years, not a 40-year-old, and a mean of
    these codes is not a mean age. Single-year age is not answerable from the served plane at all —
    that is the ruling, not a gap.

    IT IS NOT THE DELIVERY'S `Age` COLUMN EITHER. That column is stale by five years on every row
    and is not served; this band is derived instead.

    AND IT IS AS-OF A DATE, NOT AS-OF NOW. The band is fixed at 2025-12-31 — the newest order date
    in the delivery. It does not age with the calendar, and when the fact horizon moves past that
    date the band must be re-derived. Nothing enforces that today.
  semantics:
    purpose: >-
      A groupable demographic axis that generalises rather than identifies: the one form of age the
      operator ruled servable, with the identifier it replaces (date of birth) left behind.
    null_semantics: >-
      No absence: measured 0 nulls over 104 990 rows, because `Birthday` is non-null on every row,
      so every customer falls in exactly one band and no 'unknown age' member exists or is needed.

values:
  closure: open
  closure_why: >-
    ENUMERATED FROM THE SERVED COLUMN, AND THE `closed` CLAIM IS DELIBERATELY WITHHELD. Measured
    2026-09-18 over dim_contoso_customer: exactly 15 distinct values of `age_band_5y`, 20 through 90
    in steps of 5, 0 nulls over 104 990 rows, smallest cell 1 396 and no customer alone in a band.
    The set is arguably closed BY CONSTRUCTION too — floor(age/5)*5 over a bounded age range.

    SO WHY `open`. `check_enumeration_closure` refuses a `closed` set any of whose members is not
    confidence `C`, and machine-authored content is capped at `I`: only a human may raise a member to
    `C`. Those two rules together make `closed` unauthorable by this step, and the gate's own remedy
    list is "confirm the member and mark it C, or set closure to 'open'". Declared `open` rather than
    stamped `C` by a machine — an honest open set costs nothing, a false closed set makes a real
    value unanswerable. The out-of-set check that a closed set would have bought is kept as a
    constraint below, so nothing is lost but the claim. AB-Q3 is the ruling that closes it.
  items:
    - { code: 20, label: "20-24", meaning: "aged 20 to 24 as of 2025-12-31", confidence: I, from: Birthday, note: "1 725 of 104 990 customers — the youngest band, and a PARTIAL one: the derivation's floor puts the 19-year-olds of the raw column into no served band at all, so this band is not five full years of intake." }
    - { code: 25, label: "25-29", meaning: "aged 25 to 29 as of 2025-12-31", confidence: I, from: Birthday, note: "7 943 of 104 990" }
    - { code: 30, label: "30-34", meaning: "aged 30 to 34 as of 2025-12-31", confidence: I, from: Birthday, note: "7 983 of 104 990 — the largest band" }
    - { code: 35, label: "35-39", meaning: "aged 35 to 39 as of 2025-12-31", confidence: I, from: Birthday, note: "7 887 of 104 990" }
    - { code: 40, label: "40-44", meaning: "aged 40 to 44 as of 2025-12-31", confidence: I, from: Birthday, note: "7 740 of 104 990" }
    - { code: 45, label: "45-49", meaning: "aged 45 to 49 as of 2025-12-31", confidence: I, from: Birthday, note: "7 885 of 104 990" }
    - { code: 50, label: "50-54", meaning: "aged 50 to 54 as of 2025-12-31", confidence: I, from: Birthday, note: "7 854 of 104 990" }
    - { code: 55, label: "55-59", meaning: "aged 55 to 59 as of 2025-12-31", confidence: I, from: Birthday, note: "7 792 of 104 990" }
    - { code: 60, label: "60-64", meaning: "aged 60 to 64 as of 2025-12-31", confidence: I, from: Birthday, note: "7 814 of 104 990" }
    - { code: 65, label: "65-69", meaning: "aged 65 to 69 as of 2025-12-31", confidence: I, from: Birthday, note: "7 756 of 104 990" }
    - { code: 70, label: "70-74", meaning: "aged 70 to 74 as of 2025-12-31", confidence: I, from: Birthday, note: "7 873 of 104 990" }
    - { code: 75, label: "75-79", meaning: "aged 75 to 79 as of 2025-12-31", confidence: I, from: Birthday, note: "7 747 of 104 990" }
    - { code: 80, label: "80-84", meaning: "aged 80 to 84 as of 2025-12-31", confidence: I, from: Birthday, note: "7 755 of 104 990" }
    - { code: 85, label: "85-89", meaning: "aged 85 to 89 as of 2025-12-31", confidence: I, from: Birthday, note: "7 840 of 104 990" }
    - { code: 90, label: "90+", meaning: "aged 90 or over as of 2025-12-31", confidence: I, from: Birthday, note: "1 396 of 104 990 — the SMALLEST cell in the whole value set, and an OPEN-TOPPED band: the raw age range reaches 85 as delivered, so what lands here depends on the as-of date rather than on a declared ceiling." }
  canonicalization: >-
    Not a conformance of raw spellings — a DERIVATION. Rule `derive-age-band-as-of` in
    data/transforms/dim_contoso_customer.yaml computes whole years from `Birthday` to 2025-12-31
    (birthday-aware), floors to a multiple of 5, and serves the result as an integer. The companion
    rule `exclude-stale-derived-age` refuses the delivery's own `Age` column; its fix is an absence,
    visible as the projection list in data/transforms/dim_contoso_customer.sql.

grounding:
  kind: sql_table
  sources:
    - relation: dim_contoso_customer
      key: CustomerKey
      columns: [CustomerKey, age_band_5y]
  serves_from: data/transforms/dim_contoso_customer.sql
  discriminator: age_band_5y
  field_roles:
    age_band_5y: contoso.field_role.dimension
    CustomerKey: contoso.field_role.key
  note: >-
    A NOTION WITH NO TABLE OF ITS OWN, grounded on the relation that carries its discriminating
    column. There is no age dimension in this delivery and none should be built: the band is one
    column of the customer row, and this concept exists to say what that column MEANS and what it
    refuses.

    NO LOOKUP REGISTER IS CUT FOR IT, deliberately: the value set is closed by construction and
    enumerated in this file, so `values.items` is the register. A CSV twin would be a second home
    for 15 values that a derivation already determines.

contract:
  default_reading: >-
    "Age" means this band, as of 2025-12-31, and the as-of date is disclosed with the figure. A
    band is named by its lower bound; a question about "people in their forties" resolves to the 40
    and 45 bands, both of them.
  no_probe_guarantee: >-
    The 15 members, their meanings and their populations are declared in this file; the column is
    `age_band_5y` on dim_contoso_customer; the as-of date is stated in every member's meaning. A
    question about single-year age, a birth date, or an age as-of today is refused from these
    declarations rather than from an empty query — there is nothing to probe for, because the
    columns that would answer it are not served.
  resolution: >-
    Resolve an age word to one or more band codes from `values.items` in this file. There is no
    lookup CSV and no `source_view` to probe: the set is closed by construction.
  rules:
    - id: age_band.precision.single_year_refused
      kind: mac.rule_kind.exclusion
      subject: Single-year age is not served — the answer is a refusal naming the ruling
      when: "a question needs age to the year — average age, everyone aged 42, a birth date, age today"
      then: >-
        REFUSE and say which precision IS available: `{age_band_5y}` in 5-year bands as of
        2025-12-31, naming DQ-CUSTOMER-01 as the ruling that set it
      never: >-
        treating the band code as a single-year age — averaging `{age_band_5y}` to report a mean
        age, or reading 40 as a 40-year-old — and never reaching for the delivery's `Age` column,
        which is stale on 104 990 of 104 990 rows and is not served
      why: >-
        the precision loss is deliberate (the operator's ruling), so the refusal has a reason and a
        named alternative; a band silently used as an age is a wrong number with no symptom
      binds: [age_band_5y]
      confidence: P
    - id: age_band.as_of.date_travels_with_the_figure
      kind: mac.rule_kind.default
      subject: The band is as-of 2025-12-31 and says so in the answer
      when: "reporting or grouping by `{age_band_5y}`"
      then: >-
        state the as-of date 2025-12-31 with the figure, and read the band as the customer's age ON
        THAT DATE rather than now
      never: >-
        presenting the band as a current age, or comparing bands across two loads without checking
        that both were derived as of the same date
      why: >-
        the as-of date is a hand-typed constant in the transform that nothing compares to the fact
        horizon; when the horizon moves the band goes stale exactly as the delivery's own `Age`
        column did, and disclosure is the only thing standing in front of that today
      binds: [age_band_5y]
      confidence: P

constraints:
  - assert: "Every customer falls in exactly one of the 15 bands — no nulls, no out-of-set values"
    severity: ERROR
    machine_executable: true
    sql_assertion: >-
      SELECT count(*) FROM contoso_served.dim_contoso_customer
      WHERE age_band_5y IS NULL OR age_band_5y % 5 <> 0 OR age_band_5y < 20 OR age_band_5y > 90
    notes: >-
      Measured 0 of 104 990 rows on 2026-09-18. This is the closed set's out-of-set query; a value
      outside it means the derivation or the underlying age range moved.
  - assert: "No band singles out a customer — the generalisation actually generalises"
    severity: WARNING
    machine_executable: true
    sql_assertion: >-
      SELECT count(*) FROM (SELECT age_band_5y FROM contoso_served.dim_contoso_customer
      GROUP BY 1 HAVING count(*) = 1)
    notes: >-
      Measured 0 on 2026-09-18; smallest cell 1 396 (band 90). Recorded because DQ-CUSTOMER-02
      measured the band to be a sound generalisation ALONE and an amplifier in combination — it
      takes ZipCode + Gender from 35 894 uniquely identifiable rows to 74 617 — which is why
      ZipCode is not a group axis on the Customer concept.

governance:
  owner: operator
  last_reviewed: 2026-09-18
  change_log:
    - date: 2026-09-18
      change: >-
        Created at P7 as a separate enumeration rather than a note on Customer, so that the refusal
        of single-year age and the as-of date have a home a question can be answered from.
      change_type: CREATION
      by: operator
      rationale: >-
        DQ-CUSTOMER-01, accepted by the operator: "age is served as age and rouded to 5 years
        precision. so 40,45,50,55, etc."

open_questions:
  - id: AB-Q1
    topic: the as-of date
    question: >-
      Is 2025-12-31 the as-of date this delivery wants pinned, and who re-derives the band when the
      fact horizon moves past it? The date is a constant in three places that must agree — the
      transform rule, the .sql literal, and the descriptor note — and nothing compares it to
      max(order date).
    status: NEEDS_SME_CONFIRMATION
    owner_for_resolution: operator
    cross_references: data/quality/DQ-CUSTOMER-01.md
  - id: AB-Q3
    topic: closure
    question: >-
      Can a human confirm the 15 bands as the whole value set, raising the members to confidence C
      and the closure to `closed`? The set is measured complete and is closed by construction; only
      the confirmation is missing, because a machine may not stamp C. Until then the set is declared
      `open` and a sixteenth band would be accepted silently rather than flagged.
    status: NEEDS_SME_CONFIRMATION
    owner_for_resolution: operator
  - id: AB-Q2
    topic: band edges
    question: >-
      Are the partial bottom band (20-24, which the floor leaves short of five full years of
      intake) and the open-topped 90+ band the intended shape, or should the range be declared with
      explicit edges?
    status: OPEN
    owner_for_resolution: operator
