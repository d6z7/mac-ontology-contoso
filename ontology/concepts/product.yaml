metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: I
  provenance: authored
concept:
  name: Product
  class: entity
  definition: 'A thing Contoso sells, at the level the shelf knows it: a SKU. The account is knowledge/product.md.'
grounding:
  bindings:
    - relation: dim_product
      serves: [product_key, product_code, product_name, manufacturer, brand, color, category_name, sub_category_name]
# The rules ABOUT this concept, by id (ontology/rules/<id>.yaml) — the one home of the link
# (2026-10-29); a rule names no concepts. Its own first, then rules owned elsewhere.
rules:
  - Product.price_is_dated
  - Brand.not_manufacturer
governance:
  owner: operator
  last_reviewed: '2026-09-29'
