# CONTOSO (demo) > sales > Sales
# Public MIT demo (SQLBI Contoso V2, in local DuckDB). The headline measure — and deliberately CONTESTED:
# "total sales" has several defensible readings (currency basis, gross vs net, and a header/detail
# double-count trap). This concept fixes ONE reading and forces the choice to be disclosed.
#
# THE TEST: an AI must answer "what were our total sales?" from THIS FILE ALONE — picking a single
# currency basis, netting discount, and never double-counting `sales` against orders × orderrows.

metadata:
  concept: Sales
  source: CONTOSO
  version: '0.1'
  schema_version: '0.1.9'
  status: draft
  owner: demo-team
  confidence: C

concept:
  name: Sales
  label: Sales (net revenue)
  class: measure                  # a quantity you aggregate; has additivity, a unit, and a derivation
  identity:
    kind: code
  definition: >
    The monetary value of sales order lines. Each line carries a list price (UnitPrice) and a
    post-discount price (NetPrice) in the store's local CurrencyCode, plus an ExchangeRate to the
    reporting base currency. "Sales" without qualification means NET revenue (Quantity x NetPrice)
    converted to the base currency; GROSS (Quantity x UnitPrice) is reported only when asked. The grain
    is one order line; the denormalized `sales` table is the same facts as orders x orderrows.
  semantics:
    purpose: >
      The headline figure the business reports: what Contoso earned, net of discount, in one comparable
      currency. Sliced by brand, product, store/country, currency, and period.
    unit: currency (reporting base currency)
    measure_type: mac.MeasureType.Flow
    additivity: { time: additive, store: additive, product: additive }   # schema-required floor
    axis_kinds:
      time: mac.axis_kind.time
      store: mac.axis_kind.categorical
      product: mac.axis_kind.categorical
    null_semantics: >
      Every line has a NetPrice and an ExchangeRate — there is no missing-measure case.

derived_by_rule: net_sales_base_currency        # → rules.yaml (the correct, disclosed total)

contract:
  no_probe_guarantee: >
    Everything needed to answer "total sales" is here. Use NET sales (Quantity x NetPrice) converted to
    the base currency via ExchangeRate (rule net_sales_base_currency). Never SUM(NetPrice) across mixed
    currencies, never sum `sales` and orderrows together, and disclose the currency basis and gross/net
    choice. Wanting to probe the warehouse to settle these means this concept is incomplete — fix it here.
  default_reading: "Unqualified 'sales' means NET revenue, converted to one disclosed base currency, across all channels."
  resolution: "The base-currency net total is produced by rules.yaml > net_sales_base_currency — reference it; do not re-derive."
  rules:
    - id: sales.net_of_discount
      kind: mac.rule_kind.aggregation
      when: "computing sales value from order lines"
      then: "use NET revenue = SUM(Quantity x NetPrice); report GROSS = SUM(Quantity x UnitPrice) only when explicitly asked, and disclose which"
      never: "reporting gross as 'sales' without saying so — it overstates by the discount volume"
      why: "UnitPrice is the list price before discount; NetPrice is what the customer actually paid"
      binds: [NetPrice, UnitPrice, Quantity]
    - id: sales.single_currency_basis
      kind: mac.rule_kind.aggregation
      when: "aggregating sales across rows that may span more than one CurrencyCode"
      then: "convert each line to the reporting base currency (Quantity x NetPrice x ExchangeRate) BEFORE summing, and disclose the base currency"
      never: "summing NetPrice across mixed currencies as if AUD, CAD, EUR, GBP and USD were one unit — that total is meaningless"
      why: "the fact table holds five currencies; a raw cross-currency sum adds incompatible units"
      binds: [NetPrice, ExchangeRate, CurrencyCode]
    - id: sales.ask_currency_when_ambiguous
      kind: mac.rule_kind.ambiguity
      when: "a question implies a single-currency total but names no reporting currency and the rows span several"
      then: "either ASK which reporting currency, or COMMIT to the disclosed base currency as the default"
      never: "silently picking one currency's rows and calling it the total"
      why: "the currency basis changes the number materially and is the user's choice"
    - id: sales.no_double_count_header_detail
      kind: mac.rule_kind.exclusion
      when: "choosing a table to sum sales from"
      then: "sum EITHER the denormalized `sales` table OR orders x orderrows — never both; they are the same order lines in two shapes"
      never: "adding `sales` and orderrows totals together (doubles revenue)"
      why: "`sales` is the pre-joined form of the orders/orderrows header-detail pair"
      binds: [OrderKey]

grounding:
  sources:
    - relation: sales
      key: [OrderKey, LineNumber]
      columns: [Quantity, UnitPrice, NetPrice, UnitCost, CurrencyCode, ExchangeRate, StoreKey, ProductKey]
  grain: "one sales order line"
  note: "Net from NetPrice, gross from UnitPrice, both x Quantity; CurrencyCode + ExchangeRate carry the currency basis."

constraints:
  - assert: "Sales defaults to NET revenue in a single disclosed base currency, never a raw cross-currency sum"
    severity: ERROR
    machine_executable: false
    notes: "A raw SUM(NetPrice) over mixed currencies is meaningless. See rules.yaml net_sales_base_currency."

governance:
  owner: demo-team
  last_reviewed: 2026-07-19
  change_log:
    - { date: 2026-07-19, change: "Created for the public MAC/Contoso demo.", change_type: CREATION, by: demo-team }
