metadata:
  source: CONTOSO5
  version: '1.1'
  schema_version: '0.3.1-develop'
  confidence: C
  provenance: authored
concept:
  name: Order
  class: event
  definition: One customer's purchase on one date, counted by distinct `order_key` over the line relation.
    It is also THE FACT NODE of the sales line, one row per order line - every money and quantity
    measure (net, gross, cost, discount, margin, units, and the per-unit prices) is a column it serves,
    and every edge from the sale to a dimension starts here. The account is knowledge/order.md.
grounding:
  bindings:
    - relation: v_contoso5_sales_line
      # `line_number` IS SERVED even though no question asks about it, because the relation's
      # key is [order_key, line_number] and that key becomes `cell_key` and reaches the SQL.
      # A concept may serve a SUBSET of a relation -- but never a subset that omits part of
      # the grain it is being read at. Caught by check_delivery_consistency's KEY-BACKED the
      # hour this concept moved to a binding: before the move it declared `key: order_key`
      # alone, which was consistent with serving one column and WRONG about the grain.
      #
      # THE MEASURES ARE SERVED HERE, since 2026-10-26 (operator ruling, ontology 1.1). They were
      # six concepts of their own — NetRevenue, GrossRevenue, SalesCost, Margin, Discount,
      # UnitsSold — each serving one column of this same relation at this same grain and each
      # declaring its own copy of every edge to a dimension. One fact node per grain replaces them:
      # the meaning of each figure is its column's description, its names are its column's
      # surfaces, and its additivity is its column's `offers.aggregate`.
      serves: [order_key, line_number, order_date, delivery_date, customer_key, store_key,
               product_key, currency_code, quantity, net_amount, gross_amount, cost_amount,
               discount_amount, margin_amount, unit_price, net_price, unit_cost]
      # `counts`, NOT a narrower `key`. Order declared `key: order_key` on a LINE-grained
      # relation, so its cell_key -- which reaches the SQL -- said one row per order over a
      # table of 223,974 lines. The relation is line-grained and says so once; ONE ORDER is one
      # distinct order_key over those lines, which is exactly what `counts` states.
      counts: order_key
  note: reached by counting distinct order_key over the line relation — NOT collapsed, so each row it
    reads carries exactly one product
contract:
  default_reading: >-
    A QUESTION THAT NAMES NO PERIOD COVERS ALL TIME — operator ruling, 2026-09-30 (rule
    Order.period). No implied "this year" and no implied latest month. State the window the answer
    actually covered — its first and last `order_date` — because an unscoped total and a year-to-
    date total are indistinguishable from the figure alone.
# 0.3.1 (RULED-2026-10-29): this concept's ruled choices, one reading set each. The words, the
# rulings and the history are in ontology/rules/<Concept>.<set>.yaml — the same id.
readings:
  date:
    selects: column
    confidence: P
    default: ordered
    ordered:
      column: order_date
      surfaces: [ordered, order date, placed, when it was ordered]
    delivered:
      column: delivery_date
      surfaces: [delivered, delivery date, shipped, when it arrived]
  period:
    selects: window
    confidence: C
    default: all_time
    all_time:
      unbounded: true
governance:
  owner: operator
  last_reviewed: '2026-09-30'
